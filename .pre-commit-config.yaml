# Formatting and hygiene on every commit. Run locally with: uvx pre-commit run --all-files
# pre-commit.ci runs the same hooks on pull requests.
# Every rev is a tag resolved with `git ls-remote --tags` on 2026-10-04.

# Never rewritten by a hook: the licence texts, which stay verbatim (LEGAL.md), Coney's and the vendored assets'.
exclude: ^(LICENSE|docs/LICENSE|assets/sandbox/License\.txt)$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--unsafe"]              # syntax only: mkdocs.yml uses !!python/name tags a safe load rejects
      - id: check-toml
      - id: check-merge-conflict
      # A large file is usually game data by mistake (LEGAL.md#no-game-data). --enforce-all checks every file
      # given, not only newly staged ones, so `run --all-files` and CI see files that are already committed.
      - id: check-added-large-files
        args: ["--maxkb=512", "--enforce-all"]
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.5                        # matches the local Build Tools' clang-format 19.1.5
    hooks:
      - id: clang-format
        types_or: [c++, c]
  # Ruff covers the coney_tools package and the Claude Code hook scripts (check_cli.RUFF_PATHS, which CI's python
  # job repeats), under python/pyproject.toml's settings (the hooks reach them through .claude/hooks/ruff.toml). The
  # maintainers' local tooling is maintained upstream, and ruff 0.16 would otherwise also format Python blocks in
  # Markdown.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10                       # matches the ruff that python/uv.lock pins
    hooks:
      - id: ruff-check                  # the hook `ruff` is now a legacy alias of this id
        args: ["--fix"]
        files: ^(python|\.claude/hooks)/
        types_or: [python, pyi]
      - id: ruff-format
        files: ^(python|\.claude/hooks)/
        types_or: [python, pyi]
  # The same rules as CI's markdownlint job (.markdownlint.yaml, with the files skipped in .markdownlint-cli2.yaml),
  # so a long line is refused before the commit. The hook installs markdownlint-cli2 through Node.js (language: node);
  # the version matches the one CI's action runs.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
  # Only the frame pacer reads the real clock or sleeps: everything else runs on the fixed step's FrameTime, so the
  # game behaves the same at any frame rate and in test mode (docs/guides/conventions.md#update-and-render). The clip
  # recorder also sleeps, only while FFmpeg's input pipe is full: an I/O wait that no game time depends on.
  - repo: local
    hooks:
      # Game data and local records never enter the repository, whatever their size (LEGAL.md#no-game-data): disc
      # images and executables, console data, PCSX2 save states, input recordings and memory cards, recorded traces and
      # memory dumps, Ghidra projects, and the records a track keeps beside the repository (HANDOFF.md, STATUS.md,
      # PR.md, REVIEW.*, coney.local.toml, .coney-busy: docs/guides/how-we-work.md#shared-machine). `language: fail`
      # refuses every file the pattern matches; `repo audit` (files.game-files) holds the pattern to
      # workspace.game_capture_suffixes, the busy marker and GAME_FILE_SAMPLES (python/src/coney_tools/audit_files.py),
      # and refuses an exclude, types, stages or a wider top-level exclude. A name refused here is refused at any depth.
      - id: no-game-files
        name: no game data or local records
        language: fail
        entry: "game data (a disc image, executable, save state, memory card, trace, dump, Ghidra project) or a local record (HANDOFF, STATUS, PR or REVIEW notes, coney.local.toml, .coney-busy): keep it outside the repository (LEGAL.md#no-game-data)"
        files: '(?i)(\.(iso|elf|irx|bin|xbe|xiso|wad|dir|qcow2|p2s|p2m2|ps2|mcd|mc2|trace|dump|raw|gpr)$|\.rep/|(^|/)SLUS_[^/]*$)|(?-i:(^|/)((HANDOFF|STATUS|PR(-\d+)?|REVIEW)\.md|REVIEW\.json|coney\.local\.toml|\.coney-busy)$)'
      - id: no-real-clock
        name: only the frame pacer reads the real clock
        language: pygrep
        entry: '\b(SDL_GetTicks(NS)?|SDL_GetPerformance(Counter|Frequency)|SDL_Delay(NS|Precise)?|steady_clock|system_clock|high_resolution_clock|QueryPerformanceCounter|clock_gettime|timeGetTime|GetTickCount(64)?|sleep_for|sleep_until)\b'
        files: ^(src|tests)/.*\.(h|cpp)$
        exclude: ^src/platform/(frame_pacer|clip_recorder)\.cpp$
