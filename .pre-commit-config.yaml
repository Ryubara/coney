# Formatting and hygiene on every commit. Run locally with: uvx pre-commit run --all-files
# pre-commit.ci runs the same hooks on pull requests.
# Every rev is a tag resolved with `git ls-remote --tags` on 2026-10-04.

# Never rewritten by a hook: the licence texts, which stay verbatim (LEGAL.md), Coney's and the vendored assets'.
exclude: ^(LICENSE|docs/LICENSE|assets/sandbox/License\.txt)$

# `pre-commit install` sets up both: the checks above on commit, and the commit message check below at the commit-msg
# stage (a hook with `stages: [commit-msg]` needs its own git hook).
default_install_hook_types: [pre-commit, commit-msg]

# The markdownlint hook's Node, pinned (an LTS release, "Krypton") because an unpinned one is whatever nodeenv finds
# at the head of Node's index: a pre-release there (v27.0.0-alpha.0.0.0, 2026-10-29) crashed nodeenv's version parser
# on Windows, where pre-commit never uses an installed Node (#1162). `repo audit` (files.markdown-hook) holds the pin.
default_language_version:
  node: 24.22.2

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--unsafe"]              # syntax only: mkdocs.yml uses !!python/name tags a safe load rejects
      - id: check-toml
      - id: check-merge-conflict
      # A large file is usually game data by mistake (LEGAL.md#no-game-data). --enforce-all checks every file
      # given, not only newly staged ones, so `run --all-files` and CI see files that are already committed.
      - id: check-added-large-files
        args: ["--maxkb=512", "--enforce-all"]
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.5                        # matches the local Build Tools' clang-format 19.1.5
    hooks:
      - id: clang-format
        types_or: [c++, c]
  # Ruff covers the coney_tools package and the Claude Code hook scripts (check_cli.RUFF_PATHS, which CI's python
  # job repeats), under python/pyproject.toml's settings (the hooks reach them through .claude/hooks/ruff.toml). The
  # maintainers' local tooling is maintained upstream, and ruff 0.16 would otherwise also format Python blocks in
  # Markdown.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10                       # matches the ruff that python/uv.lock pins
    hooks:
      - id: ruff-check                  # the hook `ruff` is now a legacy alias of this id
        args: ["--fix"]
        files: ^(python|\.claude/hooks)/
        types_or: [python, pyi]
      - id: ruff-format
        files: ^(python|\.claude/hooks)/
        types_or: [python, pyi]
  # The same rules as CI's markdownlint job (.markdownlint.yaml, with the files skipped in .markdownlint-cli2.yaml),
  # so a long line is refused before the commit. The hook installs markdownlint-cli2 through Node.js (language: node);
  # the version matches the one CI's action runs.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
  # Only the frame pacer reads the real clock or sleeps: everything else runs on the fixed step's FrameTime, so the
  # game behaves the same at any frame rate and in test mode (docs/guides/conventions.md#update-and-render). The clip
  # recorder also sleeps, only while FFmpeg's input pipe is full: an I/O wait that no game time depends on. The
  # profiler's clock (perf_probes) only measures what it shows (docs/guides/performance.md), never a step.
  - repo: local
    hooks:
      # Game data and local records never enter the repository, whatever their size (LEGAL.md#no-game-data): disc
      # images and executables, console data, PCSX2 save states, input recordings and memory cards, recorded traces and
      # memory dumps, Ghidra projects, and the records a track keeps beside the repository (HANDOFF.md, STATUS.md,
      # PR.md, REVIEW.*, coney.local.toml, .coney-busy: docs/guides/how-we-work.md#shared-machine). `language: fail`
      # refuses every file the pattern matches; `repo audit` (files.game-files) holds the pattern to
      # workspace.game_capture_suffixes, the busy marker and GAME_FILE_SAMPLES (python/src/coney_tools/audit_files.py),
      # and refuses an exclude, types, stages or a wider top-level exclude. A name refused here is refused at any depth.
      - id: no-game-files
        name: no game data or local records
        language: fail
        entry: "game data (a disc image, executable, save state, memory card, trace, dump, Ghidra project) or a local record (HANDOFF, STATUS, PR or REVIEW notes, coney.local.toml, .coney-busy): keep it outside the repository (LEGAL.md#no-game-data)"
        files: '(?i)(\.(iso|elf|irx|bin|xbe|xiso|wad|dir|qcow2|p2s|p2m2|ps2|mcd|mc2|trace|dump|raw|gpr)$|\.rep/|(^|/)SLUS_[^/]*$)|(?-i:(^|/)((HANDOFF|STATUS|PR(-\d+)?|REVIEW)\.md|REVIEW\.json|coney\.local\.toml|\.coney-busy)$)'
      # Decompiled game scripts stay in the shared folder outside the repository (LEGAL.md#no-game-data): a file that
      # holds the marker line `coney-tools lua decompile` writes, or three consecutive lines that match the fingerprints
      # `lua decompile --all` wrote there, is refused (.claude/hooks/lua_guard.py; docs/guides/coney-tools-fidelity.md#lua). The
      # same script runs as a Claude Code hook before every file write. Standard library only, so no dependencies.
      - id: no-decompiled-lua
        name: no decompiled game Lua
        language: python
        entry: python .claude/hooks/lua_guard.py
        types: [text]
      - id: no-real-clock
        name: only the frame pacer reads the real clock
        language: pygrep
        entry: '\b(SDL_GetTicks(NS)?|SDL_GetPerformance(Counter|Frequency)|SDL_Delay(NS|Precise)?|steady_clock|system_clock|high_resolution_clock|QueryPerformanceCounter|clock_gettime|timeGetTime|GetTickCount(64)?|sleep_for|sleep_until)\b'
        files: ^(src|tests)/.*\.(h|cpp)$
        # The network checks' driver waits on the output of the coney processes it runs, outside any game.
        exclude: ^(src/platform/(frame_pacer|clip_recorder|perf_probes)|tests/support/net_pair_check)\.cpp$
      # The engine throws nothing and catches only at the standard library's edge (docs/guides/conventions.md#errors):
      # a code line (no `/` or `"` before the word, so comments and the game's throws pass) with a `throw`, or a `catch`
      # of anything but `std::system_error` (a `try` compiles only with its catch, so the catch decides). The counting
      # operator new must throw std::bad_alloc.
      - id: no-exceptions
        name: the engine throws nothing and catches only at the standard library's edge
        language: pygrep
        entry: '^[^/"]*\b(throw\s*;|throw\s+[\w:]+\s*[({]|catch\s*\((?!const std::system_error&\)))'
        files: ^src/.*\.(h|cpp)$
        exclude: ^src/platform/perf_probes\.cpp$
      # Only the GL3 renderer calls librw's drawing: a render state, an `rw::gl3::` type or function, or an Im2D or Im3D
      # draw, through the draw layer (`draw::`, platform/draw_calls.h) or librw itself, so a second renderer (the SDL3
      # GPU renderer) has one place to match and the frame description (docs/engine/renderer.md#frame-description) is the
      # one way the game says what a frame draws. A code line (no `/` or `"` before the call, so comments and strings
      # pass). The first group of the exclusion is the GL3 renderer and what it is made of: the draw layer, the draw of
      # a lit atomic, the GL3 skinning and texture-level pipelines, the raster conversion and the engine that hosts the
      # renderer. The second is what still sets render states beside the description, each to leave when its code moves
      # onto it: the states the world, objects, cars and humans set for their described draws (items 7 to 9, which kept
      # the states in librw for the draw-stream hashes: #1622, from `parked_cars` on) and the debug tools' own viewers
      # (#1623, from `character_viewer_mode` to `studio_level_renderer`). Nothing is meant to join that group: a new draw
      # is an effect draw or a scene draw of the description. python/tests/test_librw_drawing_check.py fails an entry
      # whose file no longer calls, and pins both groups' names, so a file joins only by a change to that test, which
      # review sees.
      - id: no-librw-drawing-outside-gl3
        name: only the GL3 renderer calls librw's drawing
        language: pygrep
        entry: '^[^/"]*\b(rw::gl3::|draw::(setRenderState|setRenderStatePtr|getRenderState|im2d\w*|im3d\w*)\(|rw::(Set|Get)RenderState\w*\(|rw::im[23]d::)'
        files: ^src/.*\.(h|cpp)$
        exclude: >-
          (?x)^src/platform/(
          character_skin\.cpp|draw_calls\.cpp|gl3_renderer\.cpp|gl3_screen_passes\.cpp|lit_atomic\.cpp|render_engine\.cpp|
          texture_dictionary\.cpp|texture_lod\.cpp|
          character_viewer_mode\.cpp|mesh_views\.cpp|reference_renderer\.cpp|sandbox_renderer\.cpp|
          studio_level_renderer\.cpp|
          parked_cars\.cpp|placed_objects\.cpp|play_level_mode\.cpp|play_lighting\.cpp|world_renderer\.cpp
          )$
      # The commit message's trailers (`commits.trailers` in .github/conventions.yml): the only trailer is the AI
      # co-author line, no other e-mail address, and when an agent commits through Claude Code (whose hooks write an
      # identity file, coney_tools.identity) the line names that agent's model. Checked before the commit exists, for
      # everyone; the Claude Code hook `trailer_guard.py` stays beside it until this one has run for real. pre-commit
      # passes the message file to a commit-msg hook.
      - id: commit-message
        name: commit message trailers
        language: system
        entry: uv run --project python coney-tools pr check-commit
        stages: [commit-msg]
