site_name: Coney
site_description: An open-source reimplementation of The Warriors (PS2, 2005) for Windows, Linux and macOS.
docs_dir: docs
strict: true
# repo_url and site_url are set at build time by mkdocs_hooks.py, from the build.
hooks:
  - mkdocs_hooks.py
# A page left out of the nav is a warning, which --strict turns into a failure: every page must be reachable.
validation:
  nav:
    omitted_files: warn
# The per-level pages of a split reference list are reached from its overview page, not the navigation.
not_in_nav: |
  /references/flags/
  /references/lights/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle: { icon: material/brightness-4, name: Light mode }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle: { icon: material/brightness-7, name: Dark mode }

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

