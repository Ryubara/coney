site_name: Coney
site_description: An open-source reimplementation of The Warriors for Windows, Linux and macOS, built mainly on reverse engineering the PS2 version, with the Xbox port as a second source.
docs_dir: docs
strict: true
# repo_url and site_url are set at build time by mkdocs_hooks.py, from the build.
hooks:
  - mkdocs_hooks.py
# A page left out of the nav is a warning, which --strict turns into a failure: every page must be reachable.
validation:
  nav:
    omitted_files: warn
# The per-level pages of a split reference list are reached from its overview page, not the navigation; so are the
# function lists the build makes from research/functions/ (they are linked from their system's page).
not_in_nav: |
  /research/*/functions.md
  /references/flags/
  /references/lights/
  /references/wad-names/

extra_css:
  - stylesheets/extra.css
  - stylesheets/home.css
  # The progress pictures: docs/guides/coney-tools-references.md, "progress".
  - stylesheets/progress-grid.css
extra_javascript:
  # The home page's scroll effect: docs/guides/writing-docs.md, "The home page".
  - javascripts/home.js
  # Mermaid diagrams drawn with the ELK layout: docs/guides/writing-docs.md, "Diagrams".
  - javascripts/mermaid-elk.js
  # The progress picture's tooltips: docs/guides/coney-tools-references.md, "progress".
  - javascripts/progress-grid.js

theme:
  name: material
  # overrides/home.html is the home page's template (docs/index.md names it in its front matter).
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  # Dark is the default whatever the system's setting; the toggle switches to light and the choice is kept.
  palette:
    - scheme: slate
      primary: custom
      accent: amber
      toggle: { icon: material/brightness-4, name: Light mode }
    - scheme: default
      primary: custom
      accent: amber
      toggle: { icon: material/brightness-7, name: Dark mode }

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

