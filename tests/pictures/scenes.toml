# The synthetic scenes of the picture comparison (docs/guides/coney-tools-picture.md#picture): each is a `coney` command
# line that draws a world of Coney's own (the sandbox layouts and their CC0 textures; no game data) and saves its
# last frame. `coney-tools picture scenes` draws them and compares each with tests/pictures/reference/NAME.png;
# CI's `software-pictures` job does so through Mesa's llvmpipe in a pinned container (docs/guides/testing.md#software-pictures).
# Paths in `args` are relative to the repository root, where the command runs.

# The tolerance: a pixel is over when a channel differs by more than channel_tolerance (of 255), and a picture passes
# when at most max_share_percent of its pixels are over. Stand-ins (docs/engine/renderer.md#comparing) until the
# measured values are recorded there.
channel_tolerance = 2
max_share_percent = 0.1

# The tolerance across renderers, for the scenes drawn by GL3 and by the GPU renderer and compared with each other
# (`renderers` below): the Across renderers row of docs/engine/renderer.md#comparing, where the first comparisons'
# counts are recorded (a real GPU: 0 pixels over, largest difference 0); twice the room of one renderer's, for the
# software drivers' first run.
cross_channel_tolerance = 4
cross_max_share_percent = 0.2

# What every scene draws with unless it says otherwise: three frames at half the original's frame size.
frames = 3
render_size = "320x224"

[[scene]]
name = "sandbox-default-start"
args = ["--sandbox", "default"]

# The same layout from its second viewpoint: a script taps the free camera's next-view button on its first frame.
[[scene]]
name = "sandbox-default-overview"
args = ["--sandbox", "default", "--input-script", "tests/pictures/next_view.txt"]
frames = 4

[[scene]]
name = "sandbox-combat-start"
args = ["--sandbox", "combat"]

[[scene]]
name = "sandbox-parkour-start"
args = ["--sandbox", "parkour"]

# Coney's 2D test cards (`--test-card`, src/platform/test_card_mode.h), drawn by both renderers, GL3 (llvmpipe in CI)
# and the GPU renderer (lavapipe), and the GPU renderer's picture compared with GL3's by the cross-renderer tolerance.
# They have no reference picture: GL3's draw is the GPU renderer's reference until the switch, and GL3's own 2D drawing
# is held by the draw-stream hashes (docs/engine/renderer.md#comparing).
[[scene]]
name = "test-card-shapes"
args = ["--test-card", "shapes"]
renderers = ["gl3", "gpu"]

[[scene]]
name = "test-card-textures"
args = ["--test-card", "textures"]
renderers = ["gl3", "gpu"]

[[scene]]
name = "test-card-triangles"
args = ["--test-card", "triangles"]
renderers = ["gl3", "gpu"]

# The 3D test card: Coney's own meshes and textures through the frame description's scene pass (lights, fog, the GS
# alpha test, a tint, a dual layer, back-face culling), drawn by both renderers and compared the same way.
[[scene]]
name = "test-card-scene"
args = ["--test-card", "scene"]
renderers = ["gl3", "gpu"]
