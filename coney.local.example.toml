# Copy to coney.local.toml (untracked) and adjust. Paths are relative to the repository root
# or absolute. The defaults below assume the workspace layout in docs/guides/workspace.md; in a plain clone
# (not in a workspace's repos/ folder) a key left out defaults to <clone>-workspace beside the clone instead.
game_dir        = "../../game"                          # your disc image and files extracted from it
ghidra_install  = "../../tools/ghidra_12.1.4_PUBLIC"    # Ghidra 12.1.4 with the Emotion Engine extension
ghidra_projects = "../../ghidra"                        # local Ghidra projects (rebuildable)
pcsx2_dir       = "../../emulators/pcsx2"               # portable PCSX2 with PINE enabled
scratch_dir     = "../../scratch"                       # captures and tool output, never committed
pcsx2_root       = "../../emulators"                    # folder with the pcsx2, pcsx2-b, ... copies (`pcsx2 setup-copies` makes them)
pcsx2_copies     = 5                                    # how many copies `pcsx2 setup-copies` makes: pcsx2, pcsx2-b, ...
pcsx2_pine_base  = 28011                                # PINE port of copy pcsx2; copy i uses this + i
pcsx2_debug_base = 21512                                # debug server port of copy pcsx2; copy i uses this + i
pcsx2_claims_dir = ""                                   # where `pcsx2 claim` keeps its claims; default: pcsx2-claims in the main checkout's ../../scratch (not scratch_dir)
pcsx2_states_dir = ""                                   # the shared PCSX2 save-state library (`pcsx2 states`); default: state-library in the main checkout's ../../emulators; game memory, never in the repo
xemu_install     = ""                                   # your own xemu install (the folder with xemu.exe); `xemu setup-copies` copies its program, never your console's files, into the copies
xemu_config      = ""                                   # that install's xemu.toml; default: xemu.toml beside xemu.exe, else %APPDATA%/xemu/xemu/xemu.toml
xemu_root        = ""                                   # folder with the xemu, xemu-b, ... copies; default: the main checkout's ../../emulators
xemu_claims_dir  = ""                                   # where `xemu claim` keeps its claims; default: xemu-claims in the main checkout's ../../scratch
xemu_dvd         = ""                                   # the Xbox game disc image xemu boots (an XISO of your own disc); `xemu launch --dvd` overrides it
xemu_copies      = 2                                    # how many copies `xemu setup-copies` makes: xemu, xemu-b, ...
xemu_gdb_base    = 1234                                 # GDB stub port of copy xemu; copy i uses this + i
xemu_monitor_base = 4444                                # QEMU monitor port of copy xemu; copy i uses this + i
build_claims_dir = ""                                   # where `build` keeps its slots and queue; default: build-claims in the main checkout's ../../scratch (not scratch_dir)
build_root       = ""                                   # optional, this machine only: keep every checkout's builds in <build_root>/<id>/ (another drive) instead of its build/; "" keeps them in build/
build_slots      = 2                                    # how many `coney-tools build` runs may compile and test at once on this machine
check_slots      = 0                                    # how many full suites (all of pytest, all of ctest) may run at once; 0: one per four cores, at least 1; targeted runs need no slot
build_worktree_cap = 7                                 # at most this many worktrees may hold a build/ folder; `build` refuses to configure a new folder beyond it (`workspace clean --apply` makes room); 0 turns the cap off
build_fast_lane_steps = 50                              # a build of fewer ninja steps than this uses the fast lane; 0 turns it off
build_fast_lane_tests = 20                              # a ctest -R run selecting at most this many tests uses the fast lane; 0 turns it off
build_fast_lane_test_seconds = 300                      # ... unless their recorded times add up to more seconds than this; 0 turns that off
test_jobs        = 0                                    # tests `build --test` runs in parallel (ctest -j); 0: half the cores, or a slot's share if more; `build -j N` beats it
ccache_dir       = ""                                   # the compiler cache every checkout's `build` shares; default: ../../cache/ccache beside the main checkout
ccache_program   = ""                                   # the ccache executable; default: the one `workspace init --fetch ccache` put in ../../tools, else PATH
ccache_size_gb   = 25                                   # the compiler cache's size cap in GB; 0 turns the cache off
deps_dir         = ""                                   # the fetched dependency sources every checkout's `build` shares; default: ../../cache/deps beside the main checkout
jdk_home        = ""                                    # JDK 21 home; required for Ghidra
ghidra_mcp_repo = ""                                    # a built ghidra-mcp checkout (target/GhidraMCPHeadless.jar); read-only
pcsx2_mcp_dir   = ""                                    # a PCSX2-MCP fork build (release/PCSX2-MCP-coney-v2.9.129.N-win64, N 9 or newer): the copies' PCSX2 and the MCP server
luac_program    = ""                                    # a stock Lua 4.0 luac for `lua decompile --roundtrip`; default: the one `workspace init --fetch lua` builds in ../../tools/lua-4.0.1/bin
lua_dir         = ""                                    # the shared folder of decompiled game scripts (`lua decompile --all`); default: ../../scratch/lua beside the main checkout; never in the repo
ffmpeg_dir      = ""                                    # folder with ffmpeg and ffprobe, for in-game clips (coney-tools clips); default: PATH
