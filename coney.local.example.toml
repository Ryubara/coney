# Copy to coney.local.toml (untracked) and adjust. Paths are relative to the repository root
# or absolute. The defaults below assume the workspace layout in docs/guides/workspace.md.
game_dir        = "../../game"                          # your disc image and files extracted from it
ghidra_install  = "../../tools/ghidra_12.1.4_PUBLIC"    # Ghidra 12.1.4 with the Emotion Engine extension
ghidra_projects = "../../ghidra"                        # local Ghidra projects (rebuildable)
pcsx2_dir       = "../../emulators/pcsx2"               # portable PCSX2 with PINE enabled
scratch_dir     = "../../scratch"                       # captures and tool output, never committed
pcsx2_root       = "../../emulators"                    # folder with the pcsx2, pcsx2-b, ... copies (`pcsx2 setup-copies` makes them)
pcsx2_copies     = 5                                    # how many copies `pcsx2 setup-copies` makes: pcsx2, pcsx2-b, ...
pcsx2_pine_base  = 28011                                # PINE port of copy pcsx2; copy i uses this + i
pcsx2_debug_base = 21512                                # debug server port of copy pcsx2; copy i uses this + i
pcsx2_claims_dir = ""                                   # where `pcsx2 claim` keeps its claims; default: pcsx2-claims in the main checkout's ../../scratch (not scratch_dir)
build_claims_dir = ""                                   # where `build` keeps its slots and queue; default: build-claims in the main checkout's ../../scratch (not scratch_dir)
build_slots      = 2                                    # how many `coney-tools build` runs may compile and test at once on this machine
build_fast_lane_steps = 50                              # a build of fewer ninja steps than this uses the fast lane; 0 turns it off
build_fast_lane_tests = 20                              # a ctest -R run selecting at most this many tests uses the fast lane; 0 turns it off
jdk_home        = ""                                    # JDK 21 home; required for Ghidra
ghidra_mcp_repo = ""                                    # a built ghidra-mcp checkout (target/GhidraMCPHeadless.jar); read-only
pcsx2_mcp_dir   = ""                                    # a PCSX2-MCP fork build (release/PCSX2-MCP-coney-v2.9.129.N-win64): the copies' PCSX2 and the MCP server
ffmpeg_dir      = ""                                    # folder with ffmpeg and ffprobe, for in-game clips (coney-tools clips); default: PATH
