# The denominators of the progress tracker (docs/progress/index.md), taken by hand from the source map,
# docs/research/source-map.md. Update this file in the same commit as a source-map change that moves a range or a
# coverage figure, then run `uv run --project python coney-tools progress update`.
#
# Everything here is about SLUS_212.15 (NTSC-U). Addresses are virtual addresses; a range is [start, end): `end` is
# the first byte after it. Evidence: the ranges and the per-subsystem totals derived from them are inferred, like the
# source map's directory and middleware ranges they come from.

# `.text`, from the ELF section header (source-map.md#layout-of-text).
[text]
start = 0x00100000
end = 0x004f6578

# The source map's coverage table (source-map.md#coverage): every byte of `.text` counted once, in the first
# category that applies. `kind` decides how the tracker uses a category:
#   researched  game code tied to at least a source file or a directory: the "Researched" bar
#   game        game code the map does not tie to a file or directory (still Coney's to reimplement)
#   middleware  libraries Coney replaces rather than reimplements; left out of every denominator
# The sum of the non-middleware categories is the game's own code, the denominator of "Reimplemented".
[[coverage]]
key = "anchored-file"
label = "File confirmed (code): anchors"
kind = "researched"
bytes = 208296

[[coverage]]
key = "inferred-file"
label = "File inferred"
kind = "researched"
bytes = 420792

[[coverage]]
key = "directory"
label = "Directory inferred"
kind = "researched"
bytes = 1062208

[[coverage]]
key = "link-once"
label = "Game link-once code (templates, inlines)"
kind = "game"
bytes = 115808

[[coverage]]
key = "unknown"
label = "Unknown"
kind = "game"
bytes = 1535304

[[coverage]]
key = "lua-tolua"
label = "Middleware: Lua 4.0.1 and tolua"
kind = "middleware"
bytes = 94808

[[coverage]]
key = "middleware"
label = "Middleware: C/C++ runtimes, SCE, RenderWare, Bink, crt0"
kind = "middleware"
bytes = 717520

# The game's top-level source directories in `.text` order, each with the range from its first to its last
# attributed function (source-map.md, the directory table; Physics and RayCast split at their own files). A
# directory with no attributed function has no ranges yet. `link-once` is the game's template and inline code linked
# after the libraries. Game code inside no range (the unknown stretches between directories) counts as
# "unattributed", which the tracker computes as the rest of the game's code. A reimplemented function's `subsystem`
# in functions.toml is the entry here whose range holds its address, or "unattributed".
