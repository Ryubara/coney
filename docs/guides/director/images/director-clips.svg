<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t">
  <title id="t">Mock-up: Coney Director's Clips screen (Coney's own drawing)</title>
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e9edf2; }
    .small { font-size: 13px; fill: #aab3bf; }
    .label { font-size: 14px; }
    .head { font-size: 15px; font-weight: 600; }
    .title { font-size: 20px; font-weight: 700; letter-spacing: 2px; }
    .tab { font-size: 15px; font-weight: 600; letter-spacing: 1px; fill: #8d97a3; }
    .tabOn { fill: #ffffff; }
    .panel { fill: #0b0d11; fill-opacity: 0.86; }
    .chip { fill: #1c2129; }
    .accent { fill: #f2b33d; }
    .glyph { font-size: 12px; font-weight: 700; fill: #0b0d11; }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182338"/>
      <stop offset="0.62" stop-color="#3a3350"/>
      <stop offset="1" stop-color="#b9673a"/>
    </linearGradient>
    <linearGradient id="dim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0.9"/>
    </linearGradient>
    <!-- An abstract street at night, 160 x 90: a sky, buildings, the road and three figures. -->
    <symbol id="scene" viewBox="0 0 160 90">
      <rect width="160" height="90" fill="url(#sky)"/>
      <path d="M0 52 h22 v-30 h18 v18 h14 v-26 h20 v38 h16 v-22 h22 v22 h48 v38 H0 Z" fill="#141821"/>
      <path d="M0 64 L160 58 V90 H0 Z" fill="#23252b"/>
      <path d="M58 90 L78 60 L86 60 L112 90 Z" fill="#2c2f36"/>
      <g fill="#0b0c10">
        <circle cx="64" cy="55" r="3"/><rect x="61" y="58" width="6" height="12" rx="2"/>
        <circle cx="90" cy="53" r="3"/><rect x="87" y="56" width="6" height="12" rx="2"/>
        <circle cx="104" cy="57" r="3.4"/><rect x="100.6" y="60.4" width="6.8" height="13" rx="2"/>
      </g>
      <circle cx="30" cy="30" r="1.4" fill="#ffd27a"/><circle cx="118" cy="44" r="1.2" fill="#ffd27a"/>
    </symbol>
  </defs>

  <!-- The backdrop: the last clip, blurred and darkened. -->
  <use href="#scene" xlink:href="#scene" x="0" y="0" width="1280" height="720" opacity="0.5"/>
  <rect width="1280" height="720" fill="url(#dim)"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1280" height="56" class="panel"/>
  <text x="28" y="36" class="title">CONEY DIRECTOR</text>
  <text x="300" y="35" class="tab tabOn">CLIPS</text>
  <rect x="300" y="44" width="50" height="3" class="accent"/>
  <text x="384" y="35" class="tab">PROJECTS</text>
  <text x="494" y="35" class="tab">VIDEOS</text>
  <text x="1252" y="35" class="small" text-anchor="end">Recordings: 2.1 GB of 20 GB</text>

  <!-- Filters -->
  <rect x="28" y="72" width="150" height="30" rx="4" class="chip"/>
  <text x="40" y="92" class="label">All levels  ▾</text>
  <rect x="188" y="72" width="170" height="30" rx="4" class="chip"/>
  <text x="200" y="92" class="label">Sort: newest  ▾</text>
  <rect x="368" y="72" width="130" height="30" rx="4" class="chip"/>
  <text x="380" y="92" class="label">★ Favourites</text>

  <!-- Recording 1 -->
  <text x="28" y="134" class="head">Oct 29 2026, 21:04 · Coney Island · 3 clips · 2:42</text>
  <g>
    <use href="#scene" xlink:href="#scene" x="28" y="146" width="240" height="135"/>
    <rect x="24" y="142" width="248" height="143" rx="5" fill="none" stroke="#f2b33d" stroke-width="4"/>
    <rect x="28" y="255" width="240" height="26" fill="#000" fill-opacity="0.6"/>
    <text x="38" y="273" class="label">Clip 1</text><text x="258" y="273" class="small" text-anchor="end">1:00</text>
    <circle cx="148" cy="204" r="20" fill="#000" fill-opacity="0.55"/><path d="M142 193 L159 204 L142 215 Z" fill="#fff"/>
    <text x="40" y="168" class="label" style="fill:#f2b33d">★</text>
  </g>
  <g>
    <use href="#scene" xlink:href="#scene" x="288" y="146" width="240" height="135"/>
    <rect x="288" y="255" width="240" height="26" fill="#000" fill-opacity="0.6"/>
    <text x="298" y="273" class="label">Clip 2</text><text x="518" y="273" class="small" text-anchor="end">1:00</text>
    <rect x="430" y="154" width="90" height="20" rx="3" fill="#3d8bd9"/><text x="475" y="168" class="small" style="fill:#fff" text-anchor="middle">in 1 project</text>
  </g>
  <g>
    <use href="#scene" xlink:href="#scene" x="548" y="146" width="240" height="135"/>
    <rect x="548" y="255" width="240" height="26" fill="#000" fill-opacity="0.6"/>
    <text x="558" y="273" class="label">Clip 3</text><text x="778" y="273" class="small" text-anchor="end">0:42</text>
  </g>

  <!-- Recording 2 -->
  <text x="28" y="318" class="head">Oct 28 2026, 18:30 · The hub · 2 clips · 1:31</text>
  <rect x="440" y="304" width="62" height="20" rx="3" fill="#7a5bd1"/><text x="471" y="318" class="small" style="fill:#fff" text-anchor="middle">modded</text>
  <g>
    <use href="#scene" xlink:href="#scene" x="28" y="330" width="240" height="135"/>
    <rect x="28" y="439" width="240" height="26" fill="#000" fill-opacity="0.6"/>
    <text x="38" y="457" class="label">Clip 1</text><text x="258" y="457" class="small" text-anchor="end">1:00</text>
  </g>
  <g>
    <use href="#scene" xlink:href="#scene" x="288" y="330" width="240" height="135"/>
    <rect x="288" y="439" width="240" height="26" fill="#000" fill-opacity="0.6"/>
    <text x="298" y="457" class="label">Clip 2</text><text x="518" y="457" class="small" text-anchor="end">0:31</text>
  </g>

  <!-- Recording 3, cut off by the list's edge -->
  <text x="28" y="502" class="head">Oct 27 2026, 22:12 · Riverside Park · 1 clip · 0:58</text>
  <g>
    <use href="#scene" xlink:href="#scene" x="28" y="514" width="240" height="135"/>
    <rect x="28" y="623" width="240" height="26" fill="#000" fill-opacity="0.6"/>
    <text x="38" y="641" class="label">Clip 1</text><text x="258" y="641" class="small" text-anchor="end">0:58</text>
    <rect x="36" y="522" width="122" height="20" rx="3" fill="#b8473c"/><text x="97" y="536" class="small" style="fill:#fff" text-anchor="middle">older format</text>
  </g>

  <!-- Details of the focused clip -->
  <rect x="820" y="118" width="436" height="532" rx="6" class="panel"/>
  <use href="#scene" xlink:href="#scene" x="838" y="136" width="400" height="225"/>
  <rect x="838" y="349" width="400" height="12" fill="#000" fill-opacity="0.5"/>
  <rect x="838" y="353" width="150" height="4" class="accent"/>
  <text x="838" y="392" class="head" style="font-size:18px">Oct 29 2026, clip 1</text>
  <text x="838" y="418" class="small">Coney Island · checkpoint 2 · 1:00 (1,800 steps)</text>
  <text x="838" y="440" class="small">Recorded by Coney 0.9 · no mods · 0.4 MB</text>
  <text x="838" y="462" class="small">Used in: Rumble at the Yard</text>
  <rect x="838" y="486" width="190" height="38" rx="5" class="accent"/>
  <text x="933" y="510" class="label" style="fill:#0b0d11;font-weight:700" text-anchor="middle">Preview</text>
  <rect x="1048" y="486" width="190" height="38" rx="5" class="chip"/>
  <text x="1143" y="510" class="label" text-anchor="middle">Add to project</text>
  <rect x="838" y="536" width="190" height="38" rx="5" class="chip"/>
  <text x="933" y="560" class="label" text-anchor="middle">Rename recording</text>
  <rect x="1048" y="536" width="190" height="38" rx="5" class="chip"/>
  <text x="1143" y="560" class="label" text-anchor="middle">Delete</text>
  <text x="838" y="606" class="small">Preview plays muted here as the focus rests on a clip.</text>
  <text x="838" y="626" class="small">Delete asks first; a clip a project uses says which.</text>

  <!-- Usage line: pad glyphs first, then mouse and keys -->
  <rect x="0" y="672" width="1280" height="48" class="panel"/>
  <circle cx="40" cy="696" r="11" fill="#e9edf2"/><text x="40" y="700" class="glyph" text-anchor="middle">X</text>
  <text x="58" y="701" class="label">Preview</text>
  <circle cx="142" cy="696" r="11" fill="#e9edf2"/><text x="142" y="700" class="glyph" text-anchor="middle">□</text>
  <text x="160" y="701" class="label">Add to project</text>
  <circle cx="290" cy="696" r="11" fill="#e9edf2"/><text x="290" y="700" class="glyph" text-anchor="middle">△</text>
  <text x="308" y="701" class="label">Favourite</text>
  <circle cx="404" cy="696" r="11" fill="#e9edf2"/><text x="404" y="700" class="glyph" text-anchor="middle">O</text>
  <text x="422" y="701" class="label">Back</text>
  <rect x="482" y="685" width="56" height="22" rx="4" fill="#e9edf2"/><text x="510" y="700" class="glyph" text-anchor="middle">L1 R1</text>
  <text x="546" y="701" class="label">Tab</text>
  <text x="1252" y="701" class="small" text-anchor="end">Mouse: click to select, double-click to preview · Keys: arrows, Enter, Delete, Esc</text>
</svg>
