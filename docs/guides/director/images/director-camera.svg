<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t">
  <title id="t">Mock-up: Coney Director's camera mode, flying a marker's camera with the pad (Coney's own drawing)</title>
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e9edf2; }
    .small { font-size: 12px; fill: #aab3bf; }
    .label { font-size: 14px; }
    .glyph { font-size: 11px; font-weight: 700; fill: #0b0d11; }
    .panel { fill: #0b0d11; fill-opacity: 0.8; }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182338"/>
      <stop offset="0.62" stop-color="#3a3350"/>
      <stop offset="1" stop-color="#b9673a"/>
    </linearGradient>
    <symbol id="scene" viewBox="0 0 160 90">
      <rect width="160" height="90" fill="url(#sky)"/>
      <path d="M0 52 h22 v-30 h18 v18 h14 v-26 h20 v38 h16 v-22 h22 v22 h48 v38 H0 Z" fill="#141821"/>
      <path d="M0 64 L160 58 V90 H0 Z" fill="#23252b"/>
      <path d="M58 90 L78 60 L86 60 L112 90 Z" fill="#2c2f36"/>
      <g fill="#0b0c10">
        <circle cx="64" cy="55" r="3"/><rect x="61" y="58" width="6" height="12" rx="2"/>
        <circle cx="90" cy="53" r="3"/><rect x="87" y="56" width="6" height="12" rx="2"/>
        <circle cx="104" cy="57" r="3.4"/><rect x="100.6" y="60.4" width="6.8" height="13" rx="2"/>
      </g>
      <circle cx="30" cy="30" r="1.4" fill="#ffd27a"/><circle cx="118" cy="44" r="1.2" fill="#ffd27a"/>
    </symbol>
  </defs>

  <!-- The whole window is the shot: the camera mode hides the panels -->
  <use href="#scene" xlink:href="#scene" x="0" y="0" width="1280" height="720"/>

  <!-- Thirds and the centre -->
  <g stroke="#ffffff" stroke-opacity="0.18">
    <path d="M427 0 v720 M853 0 v720 M0 240 h1280 M0 480 h1280"/>
  </g>
  <path d="M632 360 h16 M640 352 v16" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>

  <!-- The target and the next one -->
  <ellipse cx="832" cy="588" rx="52" ry="13" fill="none" stroke="#f2b33d" stroke-width="3"/>
  <rect x="772" y="388" width="120" height="26" rx="4" fill="#000" fill-opacity="0.65"/>
  <text x="832" y="406" class="label" text-anchor="middle" style="fill:#f2b33d">◎ Player 1</text>
  <ellipse cx="720" cy="545" rx="42" ry="11" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="720" y="390" class="small" text-anchor="middle" style="fill:#ffffff">□ next</text>

  <!-- Top: what is being edited -->
  <rect x="20" y="18" width="470" height="34" rx="5" class="panel"/>
  <text x="36" y="40" class="label">CAMERA MODE · Marker 3 · Look at Player 1 · paused</text>
  <rect x="1012" y="18" width="248" height="34" rx="5" class="panel"/>
  <text x="1028" y="40" class="label">FOV 42° · roll 0° · speed jog</text>

  <!-- Bottom: the controls, pad first -->
  <rect x="20" y="636" width="1240" height="66" rx="6" class="panel"/>
  <g>
    <rect x="34" y="648" width="22" height="18" rx="9" fill="#e9edf2"/><text x="45" y="661" class="glyph" text-anchor="middle">L</text>
    <text x="62" y="662" class="label">Move</text>
    <rect x="112" y="648" width="22" height="18" rx="9" fill="#e9edf2"/><text x="123" y="661" class="glyph" text-anchor="middle">R</text>
    <text x="140" y="662" class="label">Look</text>
    <rect x="188" y="648" width="46" height="18" rx="4" fill="#e9edf2"/><text x="211" y="661" class="glyph" text-anchor="middle">L2 R2</text>
    <text x="240" y="662" class="label">Down, up</text>
    <rect x="316" y="648" width="46" height="18" rx="4" fill="#e9edf2"/><text x="339" y="661" class="glyph" text-anchor="middle">L1 R1</text>
    <text x="368" y="662" class="label">Zoom</text>
    <rect x="420" y="648" width="30" height="18" rx="4" fill="#e9edf2"/><text x="435" y="661" class="glyph" text-anchor="middle">◀▶</text>
    <text x="456" y="662" class="label">Roll</text>
    <rect x="500" y="648" width="30" height="18" rx="4" fill="#e9edf2"/><text x="515" y="661" class="glyph" text-anchor="middle">▲▼</text>
    <text x="536" y="662" class="label">Speed</text>
    <circle cx="600" cy="657" r="10" fill="#e9edf2"/><text x="600" y="661" class="glyph" text-anchor="middle">□</text>
    <text x="616" y="662" class="label">Next target</text>
    <circle cx="712" cy="657" r="10" fill="#e9edf2"/><text x="712" y="661" class="glyph" text-anchor="middle">△</text>
    <text x="728" y="662" class="label">Camera kind</text>
    <rect x="826" y="648" width="44" height="18" rx="4" fill="#e9edf2"/><text x="848" y="661" class="glyph" text-anchor="middle">START</text>
    <text x="876" y="662" class="label">Play</text>
    <circle cx="930" cy="657" r="10" fill="#e9edf2"/><text x="930" y="661" class="glyph" text-anchor="middle">X</text>
    <text x="946" y="662" class="label">Keep</text>
    <circle cx="998" cy="657" r="10" fill="#e9edf2"/><text x="998" y="661" class="glyph" text-anchor="middle">O</text>
    <text x="1014" y="662" class="label">Cancel</text>
  </g>
  <text x="34" y="688" class="small">Mouse and keys: right button held to look, W A S D to move, Q and E down and up, wheel to zoom, Shift faster, Alt slower, Tab next target, C camera kind, Enter keep, Esc cancel</text>
</svg>
