# Settings of the Claude Code hooks (dispatch.py reads this file on every call; docs/guides/enforcement.md#hooks).
# Hand-written and committed. The hooks run under `uv run --no-project`, which has no YAML reader, so these live here
# and not in .github/conventions.yml. python/tests/test_agent_definitions.py checks that every role named below has an
# agent file. A file that cannot be read turns no guard off: dispatch.py runs them without it (and says so at the
# start of a session).

# A session with no known role (not started with `coney-agent` or `claude --agent <role>`) may use only `readonly_tools` and is told
# to restart. OFF in the committed file: the coordinator session that exists today was not started with
# `--agent coordinator` and would be locked out. To switch it on, change this line to `true` in a one-line pull
# request, made by a tooling agent (the coordinator may not commit in a unit's worktree), once the maintainer has
# restarted through `coney-agent`.
require_role = false
readonly_tools = ["Read", "Grep", "Glob"]

# Agent types that are no Coney role and are allowed anyway: the read-only helpers and the fork of the caller.
helpers = ["Explore", "Plan", "fork", "claude-code-guide"]

[identity]
# Put the caller's identity token in front of every `coney-tools` and `git commit` command.
enabled = true
# How long an identity file lives (seconds). A command that ends removes its own; a call that issues a token removes
# the expired ones.
ttl_seconds = 600
# The PowerShell tool refuses a command that sets environment variables in every permission mode but this one, so
# there it is injected only under these modes (docs/guides/agents.md#identity).
powershell_modes = ["bypassPermissions"]

[pr_guard]
# Refuse `gh pr create` (and a pull request opened through `gh api`) in every session: only `coney-tools pr open`
# may open a pull request. OFF until `pr open` exists; then flip it here.
refuse_pr_create = false

# What no session may touch (~/.coney, private keys, stamp logs) is built into protect.py: a settings file that
# cannot be read must not take it away, and no setting may weaken it.

# Rules by agent type. Keys: deny_tool_prefixes (tool names), deny_coney_tools (`coney-tools <words>` commands),
# deny_commands (regular expressions over the shell command), deny_write_dirs (folders of a checkout that Edit and
# Write may not change), write_only (the only file names Edit and Write may change), deny_commit_under (a git commit
# whose directory lies under one of these is refused), no_github_writes (push_guard's rules, also for a session with
# no agent id), hint (what to do instead). Commands and tools that do not exist yet are listed ahead of their phase.

[roles.coordinator]
deny_tool_prefixes = ["mcp__ghidra-mcp__", "mcp__pcsx2__"]
# `original` is the group the stamp unit shipped; the renaming pass moves study and compare to `orig`.
deny_coney_tools = [
  "original study", "original compare", "original fails-first",
  "orig study", "orig compare", "task start", "task check", "task review",
]
deny_write_dirs = ["src", "tests", "python", "docs/research", "research"]
deny_commit_under = ["/worktrees/coney/"]
hint = "Give the work to an engineer (or the tooling agent), which commits in its own worktree."

[roles.engineer]
deny_coney_tools = ["pr open"]
no_github_writes = true
hint = "Push, pull requests and GitHub are the coordinator's. Ask it with a note in your report."

[roles.tooling]
deny_coney_tools = ["pr open"]
no_github_writes = true
hint = "Push, pull requests and GitHub are the coordinator's. Ask it with a note in your report."

[roles.reviewer]
# The four review types of today are one `reviewer` in the new workflow; they follow its rules meanwhile.
aliases = ["research-reviewer", "orig-reviewer", "pr-reviewer"]
write_only = [
  "REVIEW.json", "REVIEW.md", "ORIG-REVIEW.json", "ORIG-REVIEW.md", "VERDICT.json", "VERDICT.md",
  "FINDINGS.tsv", "PROGRESS.md", "HANDOVER.md", "SUMMARY.md",
]
deny_coney_tools = ["pr open"]
# Every git verb that changes the index, the tree or the worktrees. The options before the verb follow git's grammar
# (`-C dir` and `-c k=v` take a value, `-P`, `--no-pager` and `--git-dir=x` do not), as hooklib.GIT_COMMIT reads them.
deny_commands = ['\bgit(?:\.exe)?(?:\s+(?:(?:-C|-c|--git-dir|--work-tree|--namespace|--exec-path)\s+\S+|-\S+))*\s+(?:commit|add|rm|mv|reset|restore|merge|rebase|cherry-pick|checkout|switch|apply|am|clean|revert|worktree\s+remove)\b']
no_github_writes = true
hint = "A reviewer reports; it writes only its verdict file and changes nothing else."
