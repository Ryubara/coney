# A `clips pair` scenario (docs/guides/coney-tools-clips.md#clips-pair): level5 checkpoint 4, the boss fight. The input
# script skips the opening scene, walks the player toward the fight and holds L1 on Diego, a boss at full health: a
# boss's ring (class byte 100) is the one that fills the whole circle. For a change to the health rings' shape, colours
# or draw, above all a full ring's.
description = "level5 checkpoint 4: L1 held on Diego, whose ring is full"
level = "level5"
input = "tools/clips/level5-boss-rings.txt"
checkpoint = 4
start_frame = 320
seconds = 6
