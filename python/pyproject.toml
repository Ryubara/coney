[project]
name = "coney-tools"
version = "0.1.0"
description = "Coney's own automation: local configuration and repository checks, later the WAD and emulator tools"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
# PyYAML reads the research database (research/*.yaml) for `coney-tools natives` and `coney-tools refs`; Pillow
# writes PNGs; NumPy decodes textures, geometry and audio in bulk for `coney-tools extract`.
dependencies = ["pyyaml>=6", "pillow>=13", "numpy>=2"]

[project.scripts]
coney-tools = "coney_tools.cli:main"
# The session launcher: starts Claude Code as one of Coney's roles (docs/guides/coney-tools.md#coney-agent).
coney-agent = "coney_tools.session_launcher:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Two packages: coney_tools, and lua4, the self-contained Lua 4.0 decompiler (docs/research/formats/lua-bytecode.md),
# which imports nothing from coney_tools so it can move to a repository of its own.
[tool.hatch.build.targets.wheel]
packages = ["src/coney_tools", "src/lua4"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PTH", "SIM", "RUF"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-m ghidra` runs the tests that need a running ghidra-mcp (docs/guides/stamps.md#study); they are left out otherwise.
markers = ["ghidra: needs a running ghidra-mcp server (run with -m ghidra)"]
addopts = "-m 'not ghidra'"
