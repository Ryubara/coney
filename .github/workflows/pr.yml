# Checks that only make sense on a pull request: its title must follow the commit title rules (commits.title of
# .github/conventions.yml, which AGENTS.md and CONTRIBUTING.md show), because a pull request is squash-merged and its
# title becomes the title of the one commit on main (commits on the branch are dropped by the squash, so they are not
# checked), and its description must follow the template (.github/pull_request_template.md). Actions are pinned to a
# full commit SHA; the tag is in the comment beside it.
#
# It runs on `pull_request_target`, not `pull_request`, so that a pull request from a fork reaches its author the first
# time: GitHub holds the `pull_request` workflows of a first-time contributor until a maintainer approves them, which
# left outside pull requests with an unchecked title and an unfilled description until a person looked
# (docs/guides/repo-conventions.md#workflows, "pull_request_target"). That is safe here only because of four rules,
# which hygiene.yml and claim.yml follow too:
#   1. Every job checks out the base branch only (no `ref`, no `repository`: a `pull_request_target` checkout is the
#      base branch), so what runs is the repository's own `coney-tools`, never the pull request's code.
#   2. Nothing from the pull request is run or built. The checks read the title and the description from the event and
#      the list of changed files from the API (`gh api .../pulls/N/files`), never from a checkout of the branch.
#   3. The title and the description are attacker-controlled: they reach a script only through an environment variable
#      (and, for the description, a file written from it), never expanded into the script's text.
#   4. The token is read-only (`contents: read`, `pull-requests: read`) and no secret is used.
# The workflow that runs is the one on the base branch, so a pull request that edits this file is checked by the
# version already merged; the edit takes effect when it merges.
name: pr

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

# Editing the title or description reruns this workflow. Edits get their own group, so an edit never cancels the run of
# a push that is still going (its jobs that skip edits would otherwise end up skipped, not checked). The group names
# the pull request: on `pull_request_target` `github.ref` is the base branch, the same for every pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.action == 'edited' }}
  cancel-in-progress: true

jobs:
  title:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # A title is attacker-controlled, so it reaches the checker only through an environment variable and stdin,
      # never expanded into the script's text. check-title exits 0 (pass), 1 (refused) or 2
      # (.github/conventions.yml unusable); both failures fail the job.
      - name: Check the title against the commit conventions
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | uv run --project python coney-tools pr check-title -

  # A pull request that changes the engine (src/) or the tools (python/src/) must change the docs too (docs/ or
  # research/), or say `Docs: none` on a line of its description: the living docs are updated in the same pull request,
  # never later (AGENTS.md, Documentation). Editing the description re-runs the check.
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # The description is attacker-controlled: it reaches the checker only through a file written from an
      # environment variable, never expanded into the script's text. The changed files come from the API, not from a
      # checkout of the branch (this workflow never fetches the pull request's code): the same names `git diff
      # --name-only` gives for what the pull request changes since it branched off. The API lists at most 3000 files;
      # a pull request that big is refused rather than half-checked.
      - name: Check that the docs change with the code
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          [[ "$NUMBER" =~ ^[0-9]+$ ]] || { echo "unexpected pull request number" >&2; exit 1; }
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          gh api --paginate "repos/$GH_REPO/pulls/$NUMBER/files" --jq '.[].filename' > "$RUNNER_TEMP/changed.txt"
          if [ "$(wc -l < "$RUNNER_TEMP/changed.txt")" -ge 3000 ]; then
            echo "the pull request changes 3000 files or more, which the API does not list in full: split it" >&2
            exit 1
          fi
          uv run --project python coney-tools pr check-docs --body "$RUNNER_TEMP/pr-body.md" < "$RUNNER_TEMP/changed.txt"

  # The description must follow the template (.github/pull_request_template.md): its sections, a Summary and a
  # Testing section with text, who wrote the commits (one of the template's choices) and, when an AI took part, the
  # model, and for a title area a player sees (gameplay, graphics, audio) the Testing section's `Runtime:` line, which
  # needs the title too. The rules are pull_requests in .github/conventions.yml. Editing the title or the description
  # re-runs the check.
  body:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # The description is attacker-controlled: it reaches the checker only through a file written from an
      # environment variable, never expanded into the script's text (the title likewise, as one quoted argument).
      # check-body exits 0 (pass), 1 (refused) or 2 (rules file unusable); both failures fail the job.
      - name: Check the description against the template
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          uv run --project python coney-tools pr check-body --body "$RUNNER_TEMP/pr-body.md" --title "$PR_TITLE"

  # Work starts with a claim (docs/guides/issues.md#claiming): every issue the description closes (`Fixes #N`) must be
  # held by a claim of the pull request's author, or the author is a maintainer. Until the cutover
  # (`claims.require_on_pr` false) a problem is a warning annotation and the job passes. A claim made after the pull
  # request opened is seen when the description is edited or a commit is pushed. The token only reads: the claim cards
  # (issue comments) and the author's permission.
  claim:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # The description reaches the checker only inside the event file, never expanded into the script's text.
      - name: Check that the issues it closes are claimed by its author
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: uv run --project python coney-tools claim check-pr --payload "$GITHUB_EVENT_PATH"
# Re-registered after the repository was restored.
