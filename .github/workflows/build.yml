# Build and test the engine on every supported OS and compiler and under the sanitizers, and check the formatting;
# clang-tidy runs nightly and by hand only (see the clang-tidy job). A draft pull request, or one that changes no
# engine file (only documentation or the tools), skips all but the formatting (see the changes job). Actions are
# pinned to a full commit SHA; the tag is in the comment beside it.
name: build

on:
  push:
    branches: [main, "release/**"]
  # ready_for_review: a draft runs only the cheap checks (see the changes job), so marking it ready runs the rest.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Run it by hand on a branch that is already on GitHub, without opening a pull request: the Actions tab, this
  # workflow, "Run workflow", or `gh workflow run build.yml --ref <branch>`. clang-tidy then checks every file.
  workflow_dispatch:
  # Every night on main: the one run besides a manual one where clang-tidy checks (see the clang-tidy job).
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: read

# A new push to a pull request, to main or to a release branch cancels that ref's older run, queued or running: on
# main a burst of merges otherwise queues one full build each, and those starve the macOS runners every pull request
# needs. The newest run covers the merges before it, and the nightly run checks main again. Nightly and hand-started
# runs get a group of their own (the run id), so a push never cancels them and they never cancel each other.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{
    (github.event_name == 'pull_request' || github.event_name == 'push') && 'latest' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

# Linux Clang is 19, not Ubuntu 24.04's default 18: libstdc++ declares std::expected only when __cpp_concepts is at
# least 202002L, which Clang first reports in version 19, so Clang 18 cannot compile Coney's use of std::expected.
# clang-tools-19 brings clang-scan-deps-19, which CMake needs to scan C++23 sources for modules when using Clang.
jobs:
  # What this run needs (.github/scripts/ci-scope.sh): everything, except on a draft pull request or one whose every
  # changed file is in paths.docs_only or paths.tools_only of .github/conventions.yml (documentation, python/,
  # .claude/, ...: files the engine's build and tests never read), where build, sanitizers and clang-tidy are skipped
  # without taking a runner. An engine file (paths.engine: src/, tests/, this workflow, ...) or a file no class names
  # runs them. docs/guides/building.md#what-a-pull-request-runs has the table.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      # Depth 2: a pull request's checkout is a merge commit whose first parent (HEAD^1) is the branch it merges into.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft || false }}
        run: bash .github/scripts/ci-scope.sh

  build:
    name: build (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc
            os: windows-2022
          - name: linux-gcc-13
            os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
            compiler-packages: gcc-13 g++-13
          - name: linux-clang-19
            os: ubuntu-24.04
            cc: clang-19
            cxx: clang++-19
            compiler-packages: clang-19 clang-tools-19
          - name: macos-appleclang
            os: macos-15          # Xcode 16 is the image's default
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up the MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Install Ninja, the compiler and SDL3's build packages
        if: runner.os == 'Linux'
        env:
          COMPILER_PACKAGES: ${{ matrix.compiler-packages }}
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # the package list is meant to split into words
          sudo apt-get install -y ninja-build $COMPILER_PACKAGES libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev \
            libegl1-mesa-dev libgl1-mesa-dev libdbus-1-dev libudev-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev
      - name: Install Ninja
        if: runner.os == 'macOS'
        run: brew install ninja
      # The compiler and dependency caches: restored on every run, saved only outside pull requests
      # (.github/actions/ccache; docs/guides/building.md#ci-caches).
      - uses: ./.github/actions/ccache
        with:
          key: ci-${{ matrix.name }}
      - uses: ./.github/actions/deps
      - run: cmake --preset ci
      - uses: ./.github/actions/deps-save
      # -k 0: keep compiling after a failure, so one run lists every error.
      - run: cmake --build --preset ci -- -k 0
      - run: ctest --preset ci
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/ccache-save

  sanitizers:
    name: sanitizers (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-clang-19
            os: ubuntu-24.04
            cc: clang-19
            cxx: clang++-19
          - name: macos-appleclang
            os: macos-15
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ninja, clang-19, clang-scan-deps, llvm-symbolizer and SDL3's build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-19 clang-tools-19 llvm-19 libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libwayland-dev \
            libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libdbus-1-dev libudev-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev
          # Clang's sanitizer runtime needs llvm-symbolizer to name the frames in a leak report; without names the
          # suppressions in tests/lsan.supp cannot match, and librw's known leak would fail the tests.
          echo "ASAN_SYMBOLIZER_PATH=/usr/lib/llvm-19/bin/llvm-symbolizer" >> "$GITHUB_ENV"
      - name: Install Ninja
        if: runner.os == 'macOS'
        run: brew install ninja
      - uses: ./.github/actions/ccache
        with:
          key: asan-${{ matrix.name }}
      - uses: ./.github/actions/deps
      - run: cmake --preset asan
      - uses: ./.github/actions/deps-save
      - run: cmake --build --preset asan -- -k 0
      - run: ctest --preset asan
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/ccache-save

  # A full pass takes an hour or more, so it runs only nightly and by hand, and nothing waits on it: build-ok does not
  # need it. Pull requests are tidied before they are pushed, by `coney-tools check changed` on the files they change
  # (maintainer decision, 2026-10-21; docs/guides/building.md#clang-tidy). The pull-request branch below picks those
  # files by .github/scripts/tidy-files.sh, ready if pull requests run it again.
  clang-tidy:
    needs: changes
    if: >-
      needs.changes.outputs.build == 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    env:
      CC: clang-19
      CXX: clang++-19
    steps:
      # Depth 2: a pull request's checkout is a merge commit, and its first parent (HEAD^1) is the branch it merges
      # into, so `git diff HEAD^1 HEAD` is exactly the pull request's change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Choose the files to check
        id: files
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            bash .github/scripts/tidy-files.sh HEAD^1 > "$RUNNER_TEMP/tidy-files.txt"
          else
            echo ALL > "$RUNNER_TEMP/tidy-files.txt"
          fi
          if [ ! -s "$RUNNER_TEMP/tidy-files.txt" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nothing for clang-tidy to check."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "clang-tidy will check:"
            cat "$RUNNER_TEMP/tidy-files.txt"
          fi
      - name: Install Ninja, clang-19, clang-scan-deps, clang-tidy-19 and SDL3's build packages
        if: steps.files.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-19 clang-tools-19 clang-tidy-19 libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libwayland-dev \
            libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libdbus-1-dev libudev-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev
      # The same compiler (clang-19 on ubuntu-24.04), preset (ci) and therefore flags as build (linux-clang-19), so it
      # reads that job's cache, and leaves saving it to that job (save: false below).
      - if: steps.files.outputs.run == 'true'
        uses: ./.github/actions/ccache
        with:
          key: ci-linux-clang-19
      - if: steps.files.outputs.run == 'true'
        uses: ./.github/actions/deps
      - if: steps.files.outputs.run == 'true'
        run: cmake --preset ci
      - if: steps.files.outputs.run == 'true'
        uses: ./.github/actions/deps-save
      # The build job reports compile errors; build what compiles so clang-tidy still checks every file. The build
      # is also what generates the headers clang-tidy needs.
      - if: steps.files.outputs.run == 'true'
        run: cmake --build --preset ci -- -k 0 || true
      # CMake may write the ccache launcher into the compile database, and clang-tidy would take "ccache" for the
      # compiler; strip it (a no-op when it is not there).
      - name: Remove ccache from the compile database
        if: steps.files.outputs.run == 'true'
        run: |
          sed -i 's|"command": "ccache |"command": "|' build/ci/compile_commands.json
      # Coney's own sources only (src/ and tests/), never the fetched dependencies under _deps/. A pull request
      # passes its files as regular expressions anchored at both ends: /src/ai/brain\.cpp$
      - name: Run clang-tidy
        if: steps.files.outputs.run == 'true'
        run: |
          if [ "$(cat "$RUNNER_TEMP/tidy-files.txt")" = ALL ]; then
            run-clang-tidy-19 -p build/ci -quiet '^(?!.*_deps).*/(src|tests)/'
          else
            mapfile -t patterns < <(sed -e 's/\./\\./g' -e 's|^|/|' -e 's/$/$/' "$RUNNER_TEMP/tidy-files.txt")
            run-clang-tidy-19 -p build/ci -quiet "${patterns[@]}"
          fi
      - if: ${{ !cancelled() && steps.files.outputs.run == 'true' }}
        uses: ./.github/actions/ccache-save
        with:
          save: "false"

  # Keeps one ccache entry per job and one dependency entry per OS on this ref: deletes the older ones once this run
  # has saved its own, so main's entries stay within the repository's 10 GB (docs/guides/building.md#ci-caches). A
  # key's family is the key without its last part (a run id, a commit SHA or a deps.cmake hash). Pull requests save
  # nothing, so they skip it. The only job with write access to the Actions API, which deleting a cache needs. Two
  # runs on main can overlap (push, nightly, manual), so an entry the other run already deleted is not an error.
  cache-prune:
    needs: [build, sanitizers, clang-tidy]
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Delete all but the newest entry of each ccache and deps family
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          gh cache list --ref "$REF" --limit 1000 --json id,key,createdAt > "$RUNNER_TEMP/caches.json"
          jq -r '[.[] | select(.key | test("^(ccache|deps)-"))
                  | .family = (.key | sub("-([0-9a-f]{40,64}|[0-9]+)$"; ""))]
                 | group_by(.family) | map(sort_by(.createdAt) | .[:-1][]) | .[] | "\(.id) \(.key)"' \
            "$RUNNER_TEMP/caches.json" > "$RUNNER_TEMP/stale.txt"
          while read -r id key; do
            echo "Deleting $key"
            gh cache delete "$id" || echo "Already gone: $key"
          done < "$RUNNER_TEMP/stale.txt"

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  # The one required check for build and sanitizers (clang-tidy runs nightly, outside it). A skipped matrix job reports
  # its name unexpanded ("build (${{ matrix.name }})"), so "build (windows-msvc)" could never be a required check that
  # a docs-only pull request satisfies; this job always runs, passes when every needed job passed or was skipped on
  # purpose, and fails when one failed or was cancelled (including the changes job, which would skip the rest).
  build-ok:
    if: always()
    needs: [changes, build, sanitizers]
    runs-on: ubuntu-24.04
    steps:
      - name: Check the results of the needed jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
