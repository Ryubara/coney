# Lint, type-check and test the coney_tools package and run the local gate on all three OSes, and the repository checks,
# which do not depend on the OS, once on Linux. A pull request that does not change the tools runs on Linux only, and a
# draft not at all (see the changes job).
# Actions are pinned to a full commit SHA; the tag is in the comment beside it.
name: python

on:
  push:
    branches: [main, "release/**"]
  # ready_for_review: a draft skips python (see the changes job), so marking it ready runs it.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What this run needs (.github/scripts/ci-scope.sh): every OS when the tools changed (paths.tools_only of
  # .github/conventions.yml: python/, .claude/, this workflow, ...) or a file no class names, and on a push; Linux only
  # for any other ready pull request (the repository checks below read docs/, research/ and the C++ files, the same on
  # every OS); nothing for a draft. docs/guides/building.md#what-a-pull-request-runs has the table.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      python: ${{ steps.scope.outputs.python }}
      python-os: ${{ steps.scope.outputs.python-os }}
    steps:
      # Depth 2: a pull request's checkout is a merge commit whose first parent (HEAD^1) is the branch it merges into.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft || false }}
        run: bash .github/scripts/ci-scope.sh

  python:
    name: python (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.python-os) }}
    steps:
      # Depth 2 so that HEAD^1, the branch a pull request's merge commit joins, exists for the local gate below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --project python
      # The same ruff commands as `check changed` (check_cli.RUFF_COMMANDS): the package and the hook scripts.
      - run: uv run --project python ruff check python .claude/hooks
      - run: uv run --project python ruff format --check python .claude/hooks
      - run: uv run --project python mypy --config-file python/pyproject.toml python/src python/tests
      - run: uv run --project python pytest python/tests
      # The local gate (docs/guides/testing.md#local-gate) is run by hand on one machine at a time, so this runs it on
      # every OS the job tests: the steps that depend on the OS (pre-commit in command-line-sized groups, the program
      # lookup) fail here the way they would for a contributor. Its repo step is `repo audit --files`, which holds
      # `repo check`, `repo render --check` and `docs render --check` too, so those still run on every OS. clang-tidy
      # and the docs build have their own jobs; pre-commit over every file is the format job (build.yml).
      - run: uv run --project python coney-tools check changed --base HEAD^1 --only repo --only pre-commit
        shell: bash
      # The repository checks below compare the checkout's own files and do not depend on the OS (each comparison turns
      # CRLF into LF or reads text with universal newlines), so they run once, on Linux, which every run includes.
      - if: runner.os == 'Linux'
        run: uv run --project python coney-tools repo check
      # The generated blocks of AGENTS.md, CONTRIBUTING.md and the guides must match .github/conventions.yml.
      - if: runner.os == 'Linux'
        run: uv run --project python coney-tools repo render --check
      # The copies of a convention that GitHub reads from their own files (the issue forms, the pull request template,
      # the CI scope script, pre-commit's size limit) must still agree with .github/conventions.yml.
      - if: runner.os == 'Linux'
        run: uv run --project python coney-tools repo audit --files
      # The progress inputs (docs/progress/, the @orig tags, the roadmap) must agree. The tables and the README's badge
      # data are not committed: the docs build writes them (mkdocs_hooks.py). The name rule compares the tags with
      # HEAD^1, as `orig check` does below, and --require-base fails when that commit cannot be read.
      - if: runner.os == 'Linux'
        run: uv run --project python coney-tools progress check --base HEAD^1 --require-base
      # A function a pull request adds to a gameplay folder carries @orig or @coney-only, and every folder of src/ is
      # listed as gameplay or Coney-only (docs/guides/conventions.md#coney-only). HEAD^1 is the branch the pull
      # request's merge commit joins, so only what the pull request adds is checked.
      - if: runner.os == 'Linux'
        run: uv run --project python coney-tools orig check --base HEAD^1
      # No line the pull request adds to a C++ file of src/ carries a decompiler fingerprint (Ghidra's names, its
      # undefined types, a raw read at a byte offset, goto): docs/guides/conventions.md#porting.
      - if: runner.os == 'Linux'
        run: uv run --project python coney-tools orig copy-check --base HEAD^1
      # The script-binding pages (docs/references/bindings/) must match research/bindings/, which must be valid.
      - if: runner.os == 'Linux'
        run: uv run --project python coney-tools natives render --check
      # Their Coney status must match Coney's binding table (src/scripting/script_bindings.cpp).
      - if: runner.os == 'Linux'
        run: uv run --project python coney-tools natives coney --check
      # The debug menus' C++ signature table (src/debug/native_signatures.cpp) must match research/bindings/.
      - if: runner.os == 'Linux'
        run: uv run --project python coney-tools natives cpp --check
      # The game reference pages must match their lists (research/references/).
      - if: runner.os == 'Linux'
        run: uv run --project python coney-tools refs render --check
      # The mission status pages (docs/missions/) must match research/missions.yaml.
      - if: runner.os == 'Linux'
        run: uv run --project python coney-tools missions render --check
      # The research data must be valid: the function database (research/functions/: its pages, sections, Ghidra names
      # and ports exist) and the source files (research/source-files.toml: well formed, agreeing with totals.toml).
      - if: runner.os == 'Linux'
        run: uv run --project python coney-tools research render --check
      # The PCSX2 recipes pages (docs/guides/pcsx2-recipes.md and its folder) must match research/pcsx2-recipes.toml, which must be valid.
      - if: runner.os == 'Linux'
        run: uv run --project python coney-tools pcsx2 recipe render --check

  # The one required check for python: the matrix's OSes vary by change and a skipped matrix job reports its name
  # unexpanded, so "python (macos-15)" cannot be required. Passes when python passed or was skipped on purpose, fails
  # when it (or the changes job) failed or was cancelled.
  python-ok:
    if: always()
    needs: [changes, python]
    runs-on: ubuntu-24.04
    steps:
      - name: Check the results of the needed jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
# Re-registered after the repository was restored.
