# Build the documentation site strictly, lint the Markdown, and lint these workflows. A push to main also publishes
# the site to GitHub Pages, so the published docs always match main.
# Actions are pinned to a full commit SHA; the tag is in the comment beside it.
name: docs

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mkdocs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      # Only main publishes. Pages reports the site's address, which mkdocs_hooks.py makes the site_url, so no file
      # names it.
      - id: pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: mkdocs build --strict
        env:
          CONEY_SITE_URL: ${{ steps.pages.outputs.base_url }}
      # The built site, kept for the deploy job.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    # Publishes the site built by the mkdocs job. Only this job may write to Pages.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: mkdocs
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  markdownlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The rules are in .markdownlint.yaml; the files skipped, with the reasons, in .markdownlint-cli2.yaml.
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            #.venv
            #site
            #python/.venv
            #build

  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The download script comes from the same commit as the release it fetches (v1.7.12).
      - name: Download actionlint 1.7.12
        run: >-
          bash <(curl -sSfL
          https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash)
          1.7.12
      - run: ./actionlint -color .github/workflows/*.yml
