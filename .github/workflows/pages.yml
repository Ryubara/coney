# The documentation site, deployed to GitHub Pages from main. The `site` job builds it exactly as ci.yml's `site` job
# checks it (`coney-tools ci --job site`, --strict, from the hash-locked requirements-docs.txt), only into a folder
# the upload step reads; the `deploy` job publishes that artifact and runs nothing else.
#
# Inactive until the repository variable PAGES_ENABLED is `true` (docs/ci.md, "Going public"): before that every
# job is skipped, so a push to main shows no failed run. The workflow gets no permission by default; the build reads
# the repository, and only the deploy job may write to Pages (`coney-tools ci --job workflow` refuses a write on any
# other job).
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  UV_PYTHON_PREFERENCE: only-managed

# One deploy at a time; a newer push waits for the running deploy instead of cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SITE_DIR: build/pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: python3 -I python/coney-tools.py ci --versions | tee -a "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ steps.v.outputs.uv }}
          enable-cache: true
          cache-dependency-glob: requirements-docs.txt
      - run: uv run --no-project --python "$PY" python -I python/coney-tools.py ci --job site --site-dir "$SITE_DIR"
        env:
          PY: ${{ steps.v.outputs.python }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    if: vars.PAGES_ENABLED == 'true'
    needs: site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
