# The rules for running the repository: commits, pull requests, issues, labels, merging and hygiene. This file is the
# one source of truth for every rule a program can check. coney-tools (repo check-conventions, pr check-title,
# check-docs and check-body, repo sync-labels, ci run) reads it through coney_tools/conventions.py, which refuses an
# unknown key, a wrong type and a duplicate key, so a typo or a bad merge fails loudly instead of being ignored. The
# issue forms, the pull request template and the GitHub ruleset are not read from here: they stay in their own files
# and a test checks them against this one. Prose (the why, the judgement) lives in the guides:
# docs/guides/repo-conventions.md says what each key means and where its reasons are.
#
# Change a rule here, run `coney-tools repo render` (it rewrites the blocks that show the lists in AGENTS.md,
# CONTRIBUTING.md and the guides) and commit the result in the same commit as the guide that explains the rule. YAML
# traps: quote a colour made only of digits ("000000") and any text that YAML could read as a number or a boolean.
version: 1

repo:
  default_branch: main
  # How an issue, a pull request or a guide names a person. `person`: the user, whoever tested, was affected by a
  # problem or created the issue or pull request. `decider`: the maintainers, whoever decides. `avoid`: words that
  # never name a person (the project's owner is a maintainer; say maintainers).
  wording: {person: user, decider: maintainer, avoid: [owner]}
  # Decisions only a maintainer makes: an agent stops and reports instead of acting (AGENTS.md, "Rules").
  maintainer_decisions:
    - make the repository public
    - tag a release
    - force-push main or someone else's branch
    - legal or licence questions
    - change the installer or launcher
    - change these conventions
  # Tool configuration that stays in its own format. Listed so a check knows each file exists and the docs can link it;
  # its values are never copied here.
  tools:
    format_cpp: .clang-format
    tidy: .clang-tidy
    hooks: .pre-commit-config.yaml
    markdown: .markdownlint.yaml
    editor: .editorconfig
    docs_site: mkdocs.yml
    presets: CMakePresets.json
    agent_permissions: .claude/settings.json

paths:
  # A change here needs a change under `docs` (the living doc moves with the code) or a `Docs: none` line.
  code: ["src/", "python/src/"]
  docs: ["docs/", "research/"]
  # The three CI scope classes below decide what a pull request runs (.github/scripts/ci-scope.sh; the table is in
  # docs/guides/building.md#what-a-pull-request-runs). A changed file takes the first class it matches, in the order
  # docs_only, tools_only, engine; a file in none of them runs everything. A trailing slash means a folder; `*` matches
  # within one folder level, so "*.md" is the Markdown files at the top level only. ci-scope.sh reads these lists
  # itself with awk, so keep one quoted pattern per line, made of letters, digits, . _ / - and *;
  # `coney-tools repo audit` (files.ci-scope) checks that the script can still read them.
  #
  # Read by neither the engine build nor the python package on any one OS in particular: the engine jobs are skipped
  # and python runs on Linux only (its repository checks compare these files). A change to them is also what
  # `coney-tools ci run` builds the docs for. The workflows here run on every pull request themselves (docs,
  # pr) or only on Linux (hygiene, issue-status), and actionlint checks them all.
  docs_only:
    - "docs/"
    - "research/"
    - "overrides/"
    - "assets/art/"
    - "*.md"
    - ".github/*.md"
    - ".github/conventions.yml"
    - ".github/workflows/docs.yml"
    - ".github/workflows/pr.yml"
    - ".github/workflows/hygiene.yml"
    - ".github/workflows/claim.yml"
    - ".github/workflows/issue-status.yml"
    - "mkdocs.yml"
    - "mkdocs_hooks.py"
    - "requirements-docs.txt"
    - ".markdownlint*"
  # The tools: never read by the engine's build or tests (CMake reads only src/, tests/, assets/ and cmake/), so the
  # engine jobs are skipped, but the python package, its tests or its OS-dependent local gate read them, so python
  # runs on every OS. The docs build imports python/src/coney_tools, but the docs workflow runs on every change anyway.
  tools_only:
    - "python/"
    - ".claude/"
    - "tools/"
    - "bootstrap.ps1"
    - "bootstrap.sh"
    - "coney.local.example.toml"
    - ".mcp.json"
    - ".codex/"
    - ".gemini/"
    - ".agents/"
    - ".cursor/"
    - ".grok/"
    - ".github/hooks/"
    - ".pre-commit-config.yaml"
    - ".github/ISSUE_TEMPLATE/"
    - ".github/workflows/python.yml"
  # The engine: what the build, sanitizers and clang-tidy jobs read. They run; python runs on Linux only, because its
  # checks that read C++ files (progress, natives) do not depend on the OS. Not here, so they run everything: the
  # scripts in .github/scripts/, which the clang-tidy job or every job runs and python's tests run under bash on
  # every OS.
  engine:
    - "src/"
    - "tests/"
    - "assets/"
    - "cmake/"
    - "CMakeLists.txt"
    - "CMakePresets.json"
    - ".clang-format"
    - ".clang-tidy"
    - ".github/actions/"
    - ".github/workflows/build.yml"
  # Written by a generator, never by hand; on a merge conflict take either side and rerun it.
  generated:
    - {path: "docs/references/bindings/", by: "coney-tools bindings render"}
    - {path: "docs/references/", by: "coney-tools refs render", except: ["docs/references/entities.md"]}
    - {path: "docs/missions/", by: "coney-tools missions render"}
    - {path: "docs/guides/pcsx2-recipes.md", by: "coney-tools pcsx2 recipes render"}
    - {path: "docs/guides/pcsx2-recipes/", by: "coney-tools pcsx2 recipes render"}
  # The agent entry files hold one line that imports AGENTS.md and nothing of their own, so the rules cannot drift.
  pointer_files: {files: ["CLAUDE.md", "GEMINI.md"], line: "@AGENTS.md", max_bytes: 400}
  # Only these files may hold the repository's or the docs site's address.
  address_allowed_in: ["README.md"]
  # Mirrors pre-commit's check-added-large-files (a large file is usually game data); never exclude a file from it.
  large_file_kb: 512
  # The folders of src/ whose every function says where it comes from: `@orig` for a reimplementation of the
  # original function at that address, or `@coney-only <reason>` (docs/guides/conventions.md#coney-only). Every folder
  # of src/ is in exactly one of the two lists; `coney-tools orig check-tags` refuses a new folder in neither and a new
  # gameplay function that says neither.
  gameplay:
    - "src/ai/"
    - "src/animation/"
    - "src/audio/"
    - "src/camera/"
    - "src/characters/"
    - "src/combat/"
    - "src/effects/"
    - "src/gamemodes/"
    - "src/graphics/"
    - "src/gui/"
    - "src/hud/"
    - "src/human/"
    - "src/movies/"
    - "src/physics/"
    - "src/raycast/"
    - "src/scenes/"
    - "src/scripting/"
    - "src/warriors/"
    - "src/world/"
    - "src/world_objects/"
  # Coney's own by nature: the operating system, SDL3 and librw (platform), the engine's plumbing (core, fileio),
  # the debug tools, network play and the sandbox. Their functions need no marker.
  coney_only: ["src/platform/", "src/core/", "src/fileio/", "src/debug/", "src/net/", "src/sandbox/", "src/install/", "src/launcher/", "src/studio/"]

commits:
  title:
    form: "area: Verb the rest"
    max_length: 72
    trailing_period: false
    breaking_suffix: "(BREAKING)"
    areas:
      build: "CMake, presets, dependency pins and toolchain setup"
      ci: "GitHub Actions workflows and pre-commit configuration"
      core: "engine level only: main loop and timing, memory, chunks, the task engine's plumbing, shared utilities (src/core)"
      gameplay: "the game's rules a player meets: combat, AI and crew behaviour, movement and physics responses, missions and scripts, objects and pickups, HUD and hint logic, camera behaviour"
      fileio: "disc and WAD access, file systems and streaming (src/fileio)"
      graphics: "rendering through librw: models, textures, effects, drawing the HUD (src/graphics)"
      audio: "sound, music and speech playback; the rules that trigger a sound stay in their gameplay area (src/audio)"
      platform: "SDL3 and OS glue: windowing, input, timing (src/platform)"
      tools: "C++ asset tools and the coney_tools Python package"
      research: "the research pages under docs/research and the research database"
      agents: "AGENTS.md, the CLAUDE.md and GEMINI.md pointers and other agent instructions"
      tests: "test-only changes"
      legal: "LICENSE, LEGAL.md and other licensing or provenance files"
      docs: "project-wide documentation: README, guides and the docs site"
    verbs: [Add, Fix, Update, Remove, Rebuild, Rework, Improve, Document]
  body:
    wrap: 72
  trailers:
    ai_co_author:
      key: "Co-Authored-By"
      value: "<model name> <noreply address>"
      noreply: ["noreply@anthropic.com", "noreply@google.com", "noreply@openai.com"]
    only_ai_co_author: true                      # no other trailer
    other_emails: false                          # no other e-mail address anywhere in the message

pull_requests:
  template: .github/pull_request_template.md
  # `##` headings of the description, in the template's order; the squash commit takes the pull request's title.
  sections: [Summary, Issues affected, Checklist, Testing, Screenshots, AI use]
  filled: [Summary, Testing]                     # must hold text of their own, not just a comment or a placeholder
  placeholders: ["...", "<reason>"]              # template text that counts as empty when left unchanged
  local_paths: false                             # no scratch/, ../../ or C:\ in the text (images are the exception)
  docs_none: {line: "Docs: none", when_changed: code, unless_changed: docs}   # names of the `paths` classes
  closing: {keyword: "Fixes", form: "Fixes #N", one_per_line: true, section: Summary}
  # Every task a pull request lists is finished: an unticked `- [ ]` item in the section is refused, and work the pull
  # request does not finish is not listed (it lives in its own issue). A pull request merged before `since` kept the
  # older `legacy_label` list, whose unchecked items each had to cite an issue as `#N`; the audit still holds those.
  # `since` is the moment the rule's pull request (#391) merged, to the second (UTC), not a day: pull requests merged
  # earlier on that day were written before the rule.
  checklist: {section: Checklist, unchecked: refused, since: "2026-10-12T10:39:13Z", legacy_label: "Remaining:"}
  # Every pull request lists the open issues it changes (maintainer decision, 2026-10-23: an audit found 175 of 311 open
  # issues out of date because a pull request named only the issue it fixes). The section holds one item per issue,
  # `- #N: how it is affected`, or a `none` line with a reason in parentheses. `coney-tools issue impact` suggests the
  # list; after the merge the coordinator edits each issue, and the audit (pr.affected-unedited) reports a pull request
  # merged since `since` whose listed issues were not edited after the merge. `since` is the second (UTC) the rule
  # started: a pull request merged before it was written before the rule and is not held to it.
  issues_affected:
    section: Issues affected
    none: "None"
    reason: required
    example: "None (one-line fix)"                # what a hand-made pull request writes; shown by template and errors
    since: "2026-10-25T08:33:51Z"
  screenshots: {section: Screenshots, none: "Screenshots: none", reason: required, uploaded_only: true}
  # Gameplay work is checked against the original running, not only against our reading of its code (maintainer
  # decision, 2026-10-20). A pull request whose title area is one of `areas` (the areas a player sees; each must be a
  # key of commits.title.areas) holds, inside `section`, a line starting `line` that gives the evidence (a trace diff,
  # an event diff, or named PCSX2 captures or reads compared with Coney's, with numbers) or the `none` line with a
  # reason in parentheses. The check is `coney-tools pr check-body --title ...`, the same locally and in CI.
  runtime:
    areas: [gameplay, graphics, audio]
    section: Testing
    line: "Runtime:"
    none: "Runtime: none"
    reason: required
  ai_use:
    section: "AI use"
    written_by:
      label: "Commits written by:"
      choices: ["a person", "an AI", "an AI, edited by a person", "a person, with AI help"]
      no_ai: "a person"
    # The Model line must also name each model that a `Co-Authored-By` trailer (commits.trailers) of the branch's
    # commits names, matched case-insensitively anywhere on the line; checked where the branch is at hand
    # (docs/guides/coney-tools-pr.md, pr check-body).
    model: {label: "Model:", none: "n/a", names_trailer_models: true}
  # The release gate on the reviewer agent's description verdict (`coney-tools legacy pr-review`, `legacy check-pr-review`). The agent
  # (.claude/agents/<agent>.md) writes both files next to the description file. The verdict binds to what it
  # reviewed: the branch tip, the description's hash and each local image's hash, so a new commit, an edit or a
  # replaced picture makes it stale and the review runs again. `sha256-lf`: SHA-256 of the description file's UTF-8
  # text with a leading BOM dropped and CRLF or CR turned into LF. Two byte-identical images are refused outright.
  review:
    agent: reviewer
    verdict_file: REVIEW.json
    report_file: REVIEW.md
    body_hash: sha256-lf
    identical_images: refused
  # The release gate on the reviewer agent's @orig verdict (`coney-tools orig check-review`, which the release step
  # runs): a branch that adds or changes a function carrying `@orig` needs a passing verdict that covers those
  # functions' bodies, next to the description file. The rubric is docs/guides/review/orig.md. The
  # ledger records every review (pull request and sweep) under the workspace's scratch folder, never committed;
  # `orig legacy-queue` orders the functions it has not seen at their current body.
  orig_review:
    agent: reviewer
    verdict_file: ORIG-REVIEW.json
    report_file: ORIG-REVIEW.md
    ledger: orig-review/ledger.jsonl
    rubric_version: 1                            # docs/guides/review/orig.md; raise it when the rubric changes
  stacked:
    depends_line: "Depends on #N"                # required when the base is not the default branch
    merge_into_base: false                       # never merged into a non-default base: retarget to main first
    auto_merge_on_non_default_base: false
    after_base_merges: "git rebase --onto origin/main <old base> <branch>"
  # The generated description (`coney-tools pr text`, docs/guides/pr.md). Its pictures: GitHub's limits, and what a picture
  # is (a clip goes up with `clips publish`). Its two blocks the engineer's paragraph and the facts are written between
  # `<!-- name -->` and `<!-- /name -->`, so a later edit finds them again.
  images: {max_bytes: 10485760, max_count: 20, extensions: [png, jpg, jpeg, gif]}
  markers: {summary: "coney:summary", facts: "coney:facts"}
  # Whether only `coney-tools pr open` may open, update, auto-merge or push a pull request of this repository. What the
  # PR guard hook (.claude/hooks/pr_guard.py) then refuses is listed in docs/guides/enforcement.md#pr-guard, and the
  # command for each release need in docs/guides/pr.md#after-the-switch. On since 2026-10-27, a maintainer's decision.
  # The hook runs without packages and reads this key with a small reader of its own, so keep it a plain
  # `open_only: true|false` line, two spaces in, under `pull_requests:`.
  open_only: true

merge:
  # Mirrors the GitHub ruleset "Main" and the repository settings, which only a maintainer changes; the audit (a later
  # change) compares them and reports drift.
  methods: [squash]
  squash_title: PR_TITLE
  squash_message: PR_BODY                        # the pull request description, so its Co-Authored-By trailers stay
  auto_merge: true
  delete_branch_on_merge: true
  linear_history: true
  up_to_date_required: false                     # no merge queue yet (how-we-work#merging)
  required_checks: [title, docs, body, build-ok, python-ok, format, mkdocs, markdownlint, actionlint, dependencies, clang-tidy]
  who: [maintainer, coordinator]                 # never the agent that wrote the work
  # A change to one of these paths (a file, or a folder ending in /) is the maintainer's to merge: `pr open`
  # leaves auto-merge off for it and says why.
  # The hook files of the other agent tools run the same dispatcher (docs/guides/enforcement.md#harnesses).
  manual_paths: [.github/conventions.yml, AGENTS.md, .claude/settings.json, .claude/hooks/, .codex/, .gemini/settings.json,
                 .agents/hooks.json, .cursor/hooks.json, .github/hooks/, .grok/hooks/]

issues:
  blank_issues: false
  # A section that holds only one of these (any case, a trailing full stop ignored) is not filled in. The form's own
  # "_No response_" and an empty section count as empty too.
  placeholders: ["x", "xx", "xxx", "tbd", "todo", "fixme", "wip", "...", "…", "n/a", "na", "?"]
  # Every form's structure, checked against .github/ISSUE_TEMPLATE/*.yml by a test (the forms keep their guidance
  # text). A section is `id: [heading, required]`, in the form's order.
  forms:
    bug:
      file: .github/ISSUE_TEMPLATE/bug.yml
      labels: [bug, S-needs-triage]
      sections:
        version: ["Coney version or commit", true]
        os: ["Operating system", false]
        gpu: ["Graphics card and driver", false]
        controller: ["Controller", false]
        started: ["How did you start the game?", true]
        mission: ["Mission and checkpoint", false]
        steps: ["Steps to reproduce", true]
        position: ["Position and heading", false]
        actual: ["What happens", true]
        original: ["What the original game does", false]
        frequency: ["How often does it happen?", true]
        screenshots: ["Screenshots", true]
        log: ["Log", false]
        no-game-files: ["No game files", true]
    task:
      file: .github/ISSUE_TEMPLATE/task.yml
      labels: [task, S-needs-triage]
      sections:
        summary: ["Summary", true]
        area: ["Area", true]                     # its options are the `A-` labels
        research: ["Research page", false]
        done: ["What \"done\" means", true]
        steps: ["Fix list or steps", false]
        blocked-by: ["Blocked by", false]
        screenshots: ["Screenshots", true]
  # An issue filed from the command line uses this form's headings, at the form's level (`###`).
  cli_uses_form: task
  # An issue title is a pull request title: `area: Verb the rest` (commits.title decides everything about it, so there
  # is one definition). `coney-tools issue titles` proposes the area of an old title from the issue's labels with this
  # table; every value is a key of commits.title.areas and the first label of the issue found here wins.
  title_area_by_label:
    docs: docs
    A-combat: gameplay
    A-ai: gameplay
    A-missions: gameplay
    A-hud: gameplay
    A-physics: gameplay
    A-camera: gameplay
    A-graphics: graphics
    A-audio: audio
    A-platform: platform
    A-core: core
    A-tools: tools
  screenshots_none: "Screenshots: none"
  provenance: {line: "From:", required_for: leftovers}
  sub_issues: {leftover_parent: source_pr_fixes}  # a leftover is a sub-issue of the issue its source pull request fixes
  links:
    docs_paths: linked                           # docs/... and research/... appear as Markdown links, not bare text
    link_form: "../blob/main/<path>"
    must_exist_on: main                          # the path and its {#anchor}; a branch-only page is named as such
  status_text: truthful                          # a cited pull request called "open" must be open, "merged" merged
  # `coney-tools issue impact` (docs/guides/coney-tools-issues.md#issue-impact): the open issues are read once and kept
  # `cache_minutes`; a name, address or path that more than `common_max_issues` open issues cite is too common to say
  # which of them a change affects and is skipped; the text output lists `max_reasons` reasons per issue.
  impact: {cache_minutes: 30, common_max_issues: 6, max_reasons: 3}
  # How many of each label family an open issue carries.
  labels:
    type: exactly-one
    area: at-least-one
    priority: exactly-one-after-triage
    status: exactly-one
    closed_keeps_status: false

claims:
  # Claiming an issue (docs/guides/issues.md#claiming): a `/claim` comment is handled by .github/workflows/claim.yml
  # (coney-tools claim run), which assigns, labels, keeps one claim card per claim and deletes the command comment.
  # `coney-tools task create` posts the same comment for the coordinator. Everything the Action and the tools check is here.
  bot_login: "github-actions[bot]"               # only comments by this login are cards or replies
  card_marker: coney-claim                        # a card starts with <!-- coney-claim -->
  reply_marker: coney-claim-reply                 # a refusal starts with <!-- coney-claim-reply:ID --> (ID: the command's comment)
  # A comment is a command only when its whole body matches one of these (Python regular expressions). The user-level
  # no-comment hook allows exactly these shapes on Coney issues, read from here. `scope` is folders, files and addresses
  # separated by commas; `task` is the task id, so issues of one task count as one claim.
  commands:
    claim: '^/claim(?: scope: (?P<scope>[A-Za-z0-9_./*+, -]+?))?(?: task: (?P<task>[a-z0-9][a-z0-9-]{0,59}))?$'
    renew: '^/claim renew$'
    unclaim: '^/unclaim$'
    progress: '^/progress (?P<stage>[a-z][a-z-]{0,30})$'
  stages: [assigned, claimed, studied, fails-first, compared, checked, reviewed, pr-opened, fix, finished]
  # A commenter is a maintainer when the repository says they have one of these permissions (write or above), asked of
  # GitHub by login. Only when GitHub will not say (the token may not read it) does the comment's own author_association
  # decide, and then only the repository's OWNER counts: COLLABORATOR also covers read access.
  maintainer_permissions: [admin, write]
  maintainer_associations: [OWNER]
  # Open claims per account: a maintainer 3, a contributor 2. Issues of one task count once, but a task holds at most
  # `issues_per_task` issues, so a task id is no way round the limit. A fix task reuses its claim.
  limits: {maintainer: 3, contributor: 2, issues_per_task: 3}
  # The claim of an issue that carries this label neither counts toward the open-claims limit nor is refused by it
  # (maintainer decision 2026-10-27): the units that build the new workflow for the cutover, which the engineer slots
  # do not count either. Only someone who may label issues (triage access or more) can set it; the cap of a task
  # still holds.
  exempt_label: workflow
  # The claim of an issue that carries this label is outside the open-claims limit too, and for good (maintainer
  # decision 2026-10-28): Coney Studio work, which has its own track in `tasks.start.slots.tracks` with no cap but the
  # machine's. The coordinator sets it on Studio issues (#1054's sub-issues and Studio build issues).
  studio_label: studio
  # The claim of an issue that carries this label is outside the open-claims limit as well (maintainer decision
  # 2026-10-29): networking work (the co-op plan, docs/guides/multiplayer.md#plan), which has its own track in
  # `tasks.start.slots.tracks` so that one engineer is always on it. The coordinator sets it on networking issues.
  networking_label: networking
  # A claim stops counting toward the limit when a maintainer records one of these stages (the tools post them; a
  # contributor's comment frees nothing, being free to write), or while a pull request of its claimant that closes the
  # issue is open and not a draft (one such pull request frees one task's slot: the oldest it closes and the issues of
  # that task it names, however many issues it names): the limit stands for the claimant's units in work (Studio
  # claims are outside it), and a claim frees when its unit passes review and takes the next task while CI runs
  # (docs/guides/issues.md#slots). A stage frees it for good; a pull request closed unmerged gives the count back, and the newest claims then over the
  # limit are warned and, once `release` is on (or the trial label is), released after the notice (deadline_hours less
  # warn_hours), never a maintainer's. The claim itself stays held either way.
  limit_ends_at: [reviewed, pr-opened, fix, finished]
  scope_max_characters: 400                       # the text after `scope:` in /claim
  closing_per_event: 10                           # `Fixes #N` lines of one pull request event that are acted on
  # A claimed issue with one of these status labels keeps it (the claim stays) and its release clock waits.
  paused_labels: [S-blocked, S-needs-info, S-on-hold]
  # Paused labels that also take the place of the claim's own label: while one is on, the claimed issue loses
  # working_label (or review_label); when it comes off and the claim still stands, that label comes back.
  hold_labels: [S-on-hold]
  # Both false until the cutover (docs/guides/issues.md#claiming): adopt = the sweep gives a card to an issue assigned
  # by hand; release = the 48 h warning and the 72 h release are enforced (the card says so until then), and so is
  # the warning and release of a claim that is over the limit after its pull request was closed unmerged (until then
  # a sweep only logs what it would do).
  adopt: false
  release: false
  # Until then both can be tried on one issue: an issue that carries `trial.label` is treated as if adopt and release
  # were on, with these idle hours instead (the live test of docs/guides/issues.md#claiming uses a throwaway issue).
  trial: {label: claim-trial, warn_hours: 1, deadline_hours: 2}
  # The `claim` check of .github/workflows/pr.yml: every issue a pull request closes (`Fixes #N`) must be held by a
  # claim of the pull request's author (a maintainer's pull request: by any claim). false until the cutover: the check
  # only warns.
  require_on_pr: false
  critical_label: P-critical                      # while one has no claim, only a P-critical issue can be claimed
  claimable_status: S-ready-to-start              # the only status an issue can be claimed in, for everyone
  working_label: S-in-progress                    # on a claimed issue
  review_label: S-pending-review                  # on a claimed issue whose pull request is open
  released_label: S-ready-to-start                # on an issue after /unclaim, an idle release or a lost claim
  deadline_hours: 72                              # idle time (no /progress, push to the pull request or renew) before release
  warn_hours: 48                                  # idle time at which the claimant is mentioned once
  # A passing stage stamp (studied, fails-first, compared, checked, reviewed) posts `/progress <stage>` on the unit's
  # issues: at once for a new stage, and for the same stage again only after this many hours, so a day of compares
  # keeps the claim alive without a comment for each. Less than warn_hours, or a long stage would be warned first.
  progress_refresh_hours: 12
  progress_post_seconds: 30                       # the longest one of those posts may take before it is a warning
  reply_keep_hours: 24                            # the sweep deletes a refusal reply this long after its command is gone
  command_lookback_hours: 24                      # the sweep looks for unhandled command comments this far back
  catch_up_minutes: 30                            # every run also handles other issues' commands this recent
  poll_interval_seconds: 10                       # task create: how often it looks for the card
  create_wait_seconds: 300                        # task create: the longest wait for the card or a refusal
  settle_seconds: 60                              # task create: the card must stay true for this long before the task file
  # Must equal the cron of .github/workflows/claim.yml (a test checks it).
  sweep: "7 * * * *"

tasks:
  # Task files (docs/guides/issues.md#task-files) and the leads search (`task create --terms`, `task leads`).
  kinds: [feature, fix, docs, tooling, ci-fix]
  file: TASK.md
  # `task start` (docs/guides/issues.md#starting): the unit record it writes beside the task file, and the engineer
  # tracks (the rule: docs/guides/agents.md#slots). A unit holds a place from `task start` (or from the moment the
  # coordinator's Agent call for it was let through, `reserve_minutes`) until a passing Review. `task start` and the
  # Agent guard (.claude/hooks/slot_guard.py, which runs `coney-tools task slots --admit`) refuse a start over the limit
  # while `enforce` is true (maintainer, 2026-10-27). Only units with a unit record are counted. `agent_types` are the
  # subagent types the coordinator may start only for a task with a held claim (`Task id:` in the brief), and that
  # hold a place.
  start:
    unit_file: unit.json                          # the unit record, in the task's scratch folder
    slots:
      # The tracks (maintainer decision 2026-10-28, replacing 3 task and 1 fix slots): a `kind: fix` task is in `fix`,
      # a task whose issue carries `claims.networking_label` in `networking`, one that carries `claims.studio_label` in
      # `studio` (the networking label first when an issue has both), every other in `reimplementation`. A track's
      # `min` places are kept from the other tracks while it runs fewer; `min_kinds`, when given, names the task kinds
      # that fill the `min` (a tooling or docs unit shares the reimplementation track but is not the game work it keeps
      # going, and cannot take its place); `max`, when given, caps the track; `models` are the Agent call's model and
      # effort pairs a unit of the track must start on (any when absent).
      tracks:
        reimplementation: {min: 1, min_kinds: [feature]}   # outside Studio and networking: only game work fills the minimum
        fix: {min: 1, max: 1}                    # a pull request's problems (a failed check, a conflict), oldest first
        studio:
          min: 0                                 # Coney Studio research and development: as many as the machine holds
          # Research on Opus at high effort; development on Opus at medium effort when it needs reasoning, or Sonnet at
          # high effort for simple implementation. The coordinator decides per task; the guard refuses any other pair.
          models:
            - {model: opus, effort: high, use: research}
            - {model: opus, effort: medium, use: development}
            - {model: sonnet, effort: high, use: simple development}
        # Networking work (the co-op plan): one engineer always on it (maintainer decision 2026-10-29), on any model like
        # the reimplementation track (no `models`), and beyond the open-claims limit (`claims.networking_label`).
        networking: {min: 1, max: 1}
      # The machine limit, every track together: `build_slots` (coney.local.toml, the build slots `coney-tools build`
      # keeps) times this. Measured 2026-10-28 (docs/guides/agents.md#slots): a feature unit holds a build slot for
      # about a tenth of its life and a tooling unit for a fiftieth, so two units per build slot keep the builds' own
      # load near a fifth of the slots; above that the bottleneck is the unslotted checks (pytest in `task check` took
      # 80 minutes instead of 48 with about 8 checks at once), not the build queue.
      per_build_slot: 2
      enforce: true
      # A task whose issue carries `claims.exempt_label` now (the units that build the new workflow; read from its held
      # claim card) holds no slot. The cutover sets this false in the change that turns claims.adopt/release on (a
      # test fails otherwise), and they count like any other unit.
      exempt_workflow: true
      agent_types: [engineer, tooling]
      reserve_minutes: 45                         # an agent let start keeps its slot this long before its `task start`
    # Keeping the places full (maintainer, 2026-10-27; docs/guides/slot-fill.md): `coney-tools task slots --fill-check`
    # fails while a place is free, work can be started for it and nothing excuses the gap; the coordinator's Stop hook
    # (.claude/hooks/slot_fill_guard.py) blocks the end of a turn on it. The places are the machine's (`slots` above):
    # the ones a track keeps (`min`) while it runs fewer, and the rest. What excuses a gap, the tool works out itself:
    # no eligible issue, the claim limit reached, or free disk under `workspace.disk_min_free_gb`. Anything else needs
    # a logged, expiring waiver (`task slots --waive`).
    fill:
      # A start gate for the ready issues: with `enabled`, only issues with one of `labels`, the listed `issues` and
      # `claims.critical_label` issues are eligible. It was "workflow first" (the workflow label and #1030, #1031) until
      # the engineer tracks (2026-10-28) kept a place for game work and gave Coney Studio the rest, which that gate
      # would hold back: off now, kept for the next time the maintainer wants a narrower start.
      gate:
        enabled: false
        labels: [workflow]
        issues: []
      priority_order: [P-critical, P-high, P-medium, P-low]   # the order eligible issues are listed and started in
      top: 5                                      # eligible issues the report lists
      github_seconds: 12                          # the longest one `gh` call may take
      budget_seconds: 30                          # the longest all the check's GitHub reads may take together
      cache_seconds: 60                           # GitHub's answers are reused this long (and dropped when a task file changes)
      # The Stop hook blocks the end of a turn at most `max_in_a_row` times for one session, then lets it end; the count
      # starts again after `reset_minutes` without a block. A start or a waiver ends the blocks at once.
      block: {max_in_a_row: 3, reset_minutes: 30}
      waivers:
        max_hours: 24                             # no waiver runs longer (a code below may cap it lower)
        note_min_characters: 12                   # --note says why, in words
        codes:
          maintainer-pause: {max_hours: 24, needs_issues: false, meaning: "the maintainer asked for the work to pause"}
          maintainer-decision: {max_hours: 24, needs_issues: true, meaning: "the work waits on a maintainer decision; --issues names the blocked issues"}
          machine-load: {max_hours: 3, needs_issues: false, meaning: "the machine is too loaded to start more builds now"}
  leads:
    rare_max_entries: 12                          # a name part in at most this many index entries is rare: ranked first
    common_min_entries: 200                       # in at least this many it is common: not a match on its own
    max_per_source: 8                             # ranked matches listed per source (matches named in the issue are extra)
    index_max_age_hours: 24                       # the cached index is rebuilt when older
    merged_prs: 400                               # merged pull requests read for the index
  # `task review` (docs/guides/review/task.md): the reviewer agent (.claude/agents/<agent>.md) and the files of a
  # review, all inside <scratch>/<task>/<folder>/. The tool writes the packet (what to judge and the hashes the verdict
  # must quote); the reviewer writes the verdict and its report; `task review --record` binds the verdict to the change
  # and appends the `reviewed` stamp.
  review:
    agent: reviewer
    folder: review
    packet_file: PACKET.json
    verdict_file: REVIEW.json
    report_file: REVIEW.md
    # Which checklists a change needs (docs/guides/review/index.md): a change under these paths is research work (only
    # a documentation file there, docs_suffixes, is a research page the review grades), other Markdown is documentation,
    # anything else is code; a changed `@orig` function adds the orig review, and the
    # description and the commits are always reviewed.
    research_paths: [docs/research/, research/]
    docs_suffixes: [.md]
    pages_min_addresses: 2                        # addresses of each touched research page the reviewer checks in Ghidra
    # Reverse-engineering review runs on Opus (AGENTS.md): a verified reviewer whose model name has none of these
    # words is refused for a review of these kinds.
    reverse_engineering_kinds: [research, orig]
    reverse_engineering_models: [opus]

labels:
  description_max: 100                           # GitHub's limit
  # A label belongs to the family named by its prefix; `type` has no prefix and lists its names. The rest are GitHub's
  # own labels (and `workflow`, `studio` and `networking`, the claims exemptions), kept so the sync leaves them as we want them.
  families:
    type: {prefix: "", names: [bug, parity, task, docs, enhancement]}
    area: {prefix: "A-"}
    priority: {prefix: "P-"}
    status: {prefix: "S-"}
  list:
    - {name: bug, color: d73a4a, description: "Something in Coney is broken"}
    - {name: parity, color: b60205, description: "Coney differs from the original game"}
    - {name: task, color: 0e8a16, description: "A piece of work for a maintainer or an agent"}
    - {name: docs, color: 0075ca, description: "Documentation or research pages"}
    - {name: enhancement, color: a2eeef, description: "Beyond the original: graphics and performance options now; gameplay waits for the whole game"}
    - {name: A-combat, color: c5def5, description: "Area: fighting, grabs, weapons, damage"}
    - {name: A-ai, color: c5def5, description: "Area: AI humans, pathing, goals, cars driven by AI"}
    - {name: A-missions, color: c5def5, description: "Area: mission scripts, checkpoints, objectives"}
    - {name: A-hud, color: c5def5, description: "Area: HUD, menus, text, prompts"}
    - {name: A-graphics, color: c5def5, description: "Area: rendering, models, textures, animation, effects, lighting"}
    - {name: A-audio, color: c5def5, description: "Area: sound, music, speech"}
    - {name: A-physics, color: c5def5, description: "Area: collision, movement, cars, doors, world objects"}
    - {name: A-camera, color: c5def5, description: "Area: cameras and cutscenes"}
    - {name: A-platform, color: c5def5, description: "Area: window, input, gamepad, rumble, saves, loading, disc files"}
    - {name: A-core, color: c5def5, description: "Area: engine core: memory, chunks, tasks, scripting runtime"}
    - {name: A-tools, color: c5def5, description: "Area: coney-tools, build, CI, the sandbox"}
    - {name: P-critical, color: b60205, description: "Priority: main or a nightly run is broken; before everything else"}
    - {name: P-high, color: e11d21, description: "Priority: blocks play or other work"}
    - {name: P-medium, color: fbca04, description: "Priority: next in line"}
    - {name: P-low, color: 0e8a16, description: "Priority: when there is room"}
    - {name: S-needs-triage, color: ededed, description: "Status: not yet looked at"}
    - {name: S-ready-to-start, color: 0e8a16, description: "Status: triaged and accepted; waiting for someone to pick it up"}
    - {name: S-needs-info, color: d4c5f9, description: "Status: waiting for the reporter"}
    - {name: S-needs-research, color: d4c5f9, description: "Status: the original must be studied first"}
    - {name: S-in-progress, color: 5319e7, description: "Status: an agent or person is working on it"}
    - {name: S-pending-review, color: 1d76db, description: "Status: a pull request is open"}
    - {name: S-blocked, color: "000000", description: "Status: waiting for another issue or a decision"}
    - {name: S-on-hold, color: bfd4f2, description: "Status: paused by decision; a branch may exist; not in progress"}
    - {name: S-conflict, color: e99695, description: "Status: a pull request conflicts with main (set by CI)"}
    - {name: S-failing, color: b60205, description: "Status: a pull request fails a required check (set by CI)"}
    - {name: good first issue, color: 7057ff, description: "Good for newcomers"}
    - {name: help wanted, color: "008672", description: "Extra attention is needed"}
    - {name: duplicate, color: cfd3d7, description: "This issue already exists"}
    - {name: wontfix, color: ffffff, description: "This will not be worked on"}
    - {name: workflow, color: d4c5f9, description: "Builds the new workflow; its claim is outside the open-claims limit"}
    - {name: studio, color: 5319e7, description: "Coney Studio work: its own track, outside the open-claims limit"}
    - {name: networking, color: 1d76db, description: "Networking work: its own track, outside the open-claims limit"}
    - {name: claim-trial, color: fef2c0, description: "A throwaway issue for testing the claim Action; never real work"}

hygiene:
  # The one issue the weekly sweep reports on: one comment on it, edited in place; the workflow creates the issue if it
  # is missing (docs/guides/repo-conventions.md, "Workflows").
  report_issue:
    title: "tools: Update the repo hygiene report"
    labels: [task, A-tools, P-low, S-in-progress]
  sweep: "0 6 * * 1"                             # weekly, Monday 06:00 UTC
  # What `coney-tools repo post-findings` and .github/workflows/hygiene.yml do (docs/guides/repo-conventions.md, "Workflows").
  # The workflow keeps ONE comment per item that has findings, edited in place (never deleted; "all fixed" when the
  # findings are gone), and one comment on the report issue for the sweep. It starts at warn level: on_sweep false means
  # the weekly sweep only updates the report and item comments come from events alone.
  comments:
    marker: coney-repo-hygiene                   # the comment starts with <!-- marker -->; the report's has :report
    author: "github-actions[bot]"                # only comments from this login are the workflow's own
    on_events: true
    on_sweep: false
    max_per_sweep: 25                            # with on_sweep true, item comments created or edited per sweep
    report_only: [issue.triage-age, issue.info-age, issue.progress-idle, issue.claim-orphan, pr.idle]   # idleness: a comment would hide it
  thresholds:
    needs_triage_days: 7
    needs_info_days: 21
    in_progress_idle_days: 30
    pull_request_idle_days: 30
    pr_pending_hours: 3                          # a required check queued or running this long: stuck in CI
  # `coney-tools pr list-stuck` calls a failing required check "lint" when it is one of these (the author fixes the
  # text) and "code" otherwise (build-ok, python-ok and the jobs under them).
  # `pr list-stuck --labels` (run by hygiene.yml on every push to main) keeps these labels on the open pull requests:
  # the label of each cause a pull request has, and none of the others. Only these labels are ever added or removed.
  # GitHub computes whether a pull request conflicts only on request, so a read right after a push often says UNKNOWN:
  # the command rereads up to unknown_retries times, unknown_wait_seconds apart, before it leaves those pull requests
  # as they are.
  pr_health:
    lint_checks: [title, docs, body, format, mkdocs, markdownlint, actionlint, dependencies]
    labels: {conflict: S-conflict, checks-failed: S-failing}
    unknown_retries: 4
    unknown_wait_seconds: 15
    # `coney-tools pr list-stuck --rerun` restarts a failed required check only when the failure is stale, never when
    # the code is at fault: (1) title_check / body_check failed but the pull request's current title / description passes
    # `pr check-title` / `check-body` (it was fixed after the run); (2) the check's conclusion is one of `conclusions`,
    # or its log matches one of `log_patterns`, so the runner or GitHub failed, not the code.
    rerun:
      max_per_sha: 2                             # reruns on one head commit, per workflow; a flaky job cannot loop
      title_check: title
      body_check: body
      conclusions: [CANCELLED, STARTUP_FAILURE, TIMED_OUT]
      log_patterns:                              # regular expressions, case-insensitive, searched in the job's log
        - 'The runner has received a shutdown signal'
        - 'lost communication with the server'
        - 'Received request to deprovision'
        - 'The job was not acquired by Runner'
        - 'Failed to download action'
        - 'RPC failed; HTTP 5\d\d'
        - 'Could not resolve host'
        - 'Connection reset by peer'
        - 'TLS handshake timeout'
  # The logs and text files attached to an issue, which the workflow downloads and scans on every issue event (and the
  # sweep for every open issue): docs/guides/issues.md#attachments. Only links starting with `link` and ending with one
  # of `extensions` are fetched, at most `download_kb` each, held in memory and never stored or run. A finding names the
  # file and line numbers only, never the text it matched. The patterns are Python regular expressions (single-quoted,
  # so a backslash is literal); a line is matched in its first 2000 characters.
  attachments:
    link: "https://github.com/user-attachments/files/"
    extensions: [".txt", ".log"]
    max_files: 5                                 # per issue
    max_per_run: 50                              # downloads in one run (the sweep)
    download_kb: 2048                            # the rest of a bigger file is never downloaded
    timeout_seconds: 20                          # per download
    large_kb: 512                                # a bigger log is reported as possible game data (as paths.large_file_kb)
    control_percent: 1                           # more control characters than this (or any NUL): not text
    line_threshold: 5                            # this many script or game-text lines make a finding
    patterns:
      # Personal information: a user's home folder (a path written from ~ is fine) and email addresses.
      user_folder:
        - '(?i)\b[a-z]:[\\/]+(?:users|documents and settings)[\\/]+(?!(?:public|default|default user|all users)(?:[\\/]|$))[^\\/\s:*?"<>|]+'
        - '(?<![\w.~])/home/[^/\s:*?"<>|]+'
        - '(?<![\w.~])/Users/(?!Shared(?:/|$))[^/\s:*?"<>|]+'
      # Also the commit-msg check's (`coney-tools pr check-commit`). A package pin (`markdownlint-cli2@0.18.1`) has no
      # letters-only last part, and an asset's scale suffix (`icon@2x.png`, `logo@1.5x.svg`) is skipped by the
      # lookahead, which names an image extension and ends the name (no word character, hyphen or further label after
      # it), so that `jane@2x.com` and `jane@2x.png.example.com` are still addresses.
      email:
        - '(?i)\b[a-z0-9._%+-]+@(?!\d+(?:\.\d+)?x\.(?:png|jpe?g|gif|webp|svg|avif)(?![\w-]|\.[a-z0-9]))[a-z0-9-]+(?:\.[a-z0-9-]+)*\.[a-z]{2,}\b'
      # Possible game data: lines of Lua script source (docs/research/scripting.md) ...
      script_source:
        - '^\s*(?:local\s+)?function\s+[\w.:]+\s*\('
        - '^\s*local\s+[A-Za-z_]\w*(?:\s*,\s*[A-Za-z_]\w*)*\s*='
        - '^\s*(?:if|elseif|while)\s.*\s(?:then|do)\s*$'
        - '^\s*end\s*[,)]?\s*$'
      # ... and lines of the game's data files: a placed-objects line, a position then a rotation
      # (docs/research/objects.md#objs-file).
      game_text:
        - '\{\s*-?[\d.]+\s*,\s*-?[\d.]+\s*,\s*-?[\d.]+\s*\}\s*,\s*\{\s*-?[\d.]+\s*,\s*-?[\d.]+\s*,\s*-?[\d.]+\s*,\s*-?[\d.]+\s*\}'
  # The audit's checks (`coney-tools repo audit`; docs/guides/repo-conventions.md#audit-checks). scope: where it runs
  # (files = the checkout, github = issues, pull requests, labels and settings, local = the workspace). severity: error
  # fails the audit (exit code 1), warn is only reported. fix: auto = a coney-tools command fixes it, skill = the
  # /repo-hygiene skill or the author fixes it with judgement, maintainer = a maintainer decides. keys: the keys of this file
  # the check enforces (each must exist). A check listed here without code in coney_tools/audit_*.py, or code without
  # an entry here, fails a test.
  checks:
    files.pointer:
      scope: files
      severity: error
      fix: skill
      keys: [paths.pointer_files]
      summary: "an agent entry file (CLAUDE.md, GEMINI.md) is missing, too big, or lacks the import line"
    files.exist:
      scope: files
      severity: error
      fix: skill
      keys: [repo.tools, paths.generated, paths.code, paths.docs, pull_requests.template, issues.forms]
      summary: "a file or folder the conventions name does not exist"
    files.address:
      scope: files
      severity: error
      fix: skill
      keys: [paths.address_allowed_in]
      summary: "the repository's or the docs site's address appears in a file other than the README"
    files.forms:
      scope: files
      severity: error
      fix: skill
      keys: [issues.forms, issues.blank_issues, issues.screenshots_none, labels]
      summary: "an issue form differs from the conventions: title, labels, field ids, headings, required flags, areas"
    files.template:
      scope: files
      severity: error
      fix: skill
      keys: [pull_requests.template, pull_requests.sections, pull_requests.ai_use, pull_requests.docs_none, pull_requests.closing, pull_requests.checklist, pull_requests.issues_affected]
      summary: "the pull request template differs from the conventions: headings, AI use lines, the Docs: none and Fixes lines"
    files.generated-blocks:
      scope: files
      severity: error
      fix: auto
      keys: [commits, labels, merge, paths, pull_requests]
      summary: "a generated block in AGENTS.md, CONTRIBUTING.md or a guide is out of date (coney-tools repo render)"
    files.command-reference:
      scope: files
      severity: error
      fix: auto
      keys: [paths.docs]
      summary: "a coney-tools command or parameter is missing from the guides, or a generated parameter block there is out of date (coney-tools docs render)"
    files.ci-scope:
      scope: files
      severity: error
      fix: skill
      keys: [paths.docs_only, paths.tools_only, paths.engine]
      summary: ".github/scripts/ci-scope.sh does not read the CI scope paths (docs_only, tools_only, engine) from the conventions file"
    files.ci-places:
      scope: files
      severity: error
      fix: skill
      keys: [ci.places, merge.required_checks]
      summary: "a job of the workflows is in no place of ci.places, or a place names a job no workflow has"
    files.large-file-limit:
      scope: files
      severity: error
      fix: skill
      keys: [paths.large_file_kb]
      summary: "pre-commit's check-added-large-files limit differs from the conventions, or the hook or the config skips a file (no --enforce-all, an exclude, types, stages, a wider top-level exclude)"
    files.game-files:
      scope: files
      severity: error
      fix: skill
      keys: [workspace.game_capture_suffixes, workspace.busy_marker]
      summary: "pre-commit's no-game-files hook is missing, not language fail, narrowed (an exclude, types, stages, a wider top-level exclude) or lets through a game capture type, the busy marker or a local record"
    files.markdown-hook:
      scope: files
      severity: error
      fix: skill
      keys: [repo.tools]
      summary: "pre-commit has no markdownlint-cli2 hook, so a long Markdown line is first caught by CI, or its Node is not pinned (default_language_version)"
    issue.sections:
      scope: github
      severity: error
      fix: skill
      keys: [issues.forms, issues.cli_uses_form]
      summary: "an open issue lacks a required section of its form (or was filed with other headings)"
    issue.form:
      scope: github
      severity: warn
      fix: skill
      keys: [issues.forms, issues.cli_uses_form, issues.links]
      summary: "an open issue is not in its form's exact shape: ### headings, names, order, no extra sections, dropdown values (coney-tools issue check)"
    issue.placeholder:
      scope: github
      severity: error
      fix: skill
      keys: [issues.placeholders]
      summary: "a section of an open issue is empty or holds only a placeholder such as x"
    issue.screenshots:
      scope: github
      severity: error
      fix: skill
      keys: [issues.screenshots_none]
      summary: "an open issue has no uploaded image and no Screenshots: none (reason) line"
    issue.labels:
      scope: github
      severity: error
      fix: skill
      keys: [issues.labels, labels]
      summary: "an issue lacks a type, area, priority (after triage) or status label, has two of one, or has an unknown label"
    issue.closed-status:
      scope: github
      severity: error
      fix: skill
      keys: [issues.labels.closed_keeps_status, labels.families]
      summary: "a closed issue still carries an S- status label (the issue-status workflow removes it; this is the backstop)"
    issue.person-word:
      scope: github
      severity: error
      fix: skill
      keys: [repo.wording]
      summary: "an open issue says 'owner' for a person (say 'user' for who tested or filed it, 'maintainer' for who decides)"
    issue.closed-unchecked:
      scope: github
      severity: error
      fix: skill
      keys: [pull_requests.checklist]
      summary: "a closed issue keeps an unchecked item that names no follow-up issue (names the closing pull request when its Checklist is all ticked)"
    issue.stale-status:
      scope: github
      severity: warn
      fix: skill
      keys: [issues.status_text]
      summary: "an issue calls a pull request open, merged or closed when it is not"
    issue.links:
      scope: github
      severity: warn
      fix: skill
      keys: [issues.links]
      summary: "an issue names a docs or research file as plain text, or links a file or anchor that is not on main"
    issue.provenance:
      scope: github
      severity: warn
      fix: skill
      keys: [issues.provenance]
      summary: "an issue that an older pull request's Remaining list points at has no From: line"
    issue.attachment-data:
      scope: github
      severity: warn
      fix: skill
      keys: [hygiene.attachments]
      summary: "a log attached to an open issue may hold game data: not text, too large, or lines of script source or game text"
    issue.attachment-personal:
      scope: github
      severity: warn
      fix: skill
      keys: [hygiene.attachments.patterns]
      summary: "a log attached to an open issue shows personal information: a user folder path or an email address"
    issue.triage-age:
      scope: github
      severity: warn
      fix: skill
      keys: [hygiene.thresholds.needs_triage_days]
      summary: "an issue has waited in S-needs-triage longer than the limit"
    issue.info-age:
      scope: github
      severity: warn
      fix: skill
      keys: [hygiene.thresholds.needs_info_days]
      summary: "an issue has waited in S-needs-info with no activity longer than the limit"
    issue.progress-idle:
      scope: github
      severity: warn
      fix: skill
      keys: [hygiene.thresholds.in_progress_idle_days]
      summary: "an S-in-progress issue has had no activity for longer than the limit"
    issue.claim-orphan:
      scope: github
      severity: warn
      fix: skill
      keys: [claims.working_label, claims.review_label]
      summary: "an open issue is labelled in progress or in review but nobody is assigned: claim it or set it back to ready"
    issue.review-without-pr:
      scope: github
      severity: warn
      fix: skill
      keys: [issues.labels.status]
      summary: "an S-pending-review issue that no open pull request mentions"
    pr.title:
      scope: github
      severity: error
      fix: skill
      keys: [commits.title]
      summary: "an open pull request's title breaks the commit title rules"
    pr.body:
      scope: github
      severity: error
      fix: skill
      keys: [pull_requests]
      summary: "an open pull request's description breaks the template rules (sections, local file paths, images not uploaded)"
    pr.person-word:
      scope: github
      severity: error
      fix: skill
      keys: [repo.wording]
      summary: "an open pull request says 'owner' for a person (say 'user' for who tested or filed it, 'maintainer' for who decides)"
    pr.unfinished-items:
      scope: github
      severity: error
      fix: skill
      keys: [pull_requests.checklist]
      summary: "a pull request merged since the Checklist rule began has an unticked Checklist item (an open one is pr.body)"
    pr.remaining-uncited:
      scope: github
      severity: error
      fix: skill
      keys: [pull_requests.checklist]
      summary: "a pull request merged before the Checklist rule left an unchecked Remaining item that names no issue"
    pr.affected-unedited:
      scope: github
      severity: warn
      fix: skill
      keys: [pull_requests.issues_affected]
      summary: "a pull request merged since the Issues affected rule lists open issues with no body edit or person-made label change after the merge"
    pr.idle:
      scope: github
      severity: warn
      fix: skill
      keys: [hygiene.thresholds.pull_request_idle_days]
      summary: "an open pull request has had no activity for longer than the limit"
    pr.stacked-depends:
      scope: github
      severity: error
      fix: skill
      keys: [pull_requests.stacked.depends_line]
      summary: "an open pull request on a branch other than main has no Depends on #N line"
    pr.stacked-automerge:
      scope: github
      severity: error
      fix: skill
      keys: [pull_requests.stacked.auto_merge_on_non_default_base]
      summary: "auto-merge is enabled on a pull request whose base is not main"
    pr.base-merged:
      scope: github
      severity: warn
      fix: skill
      keys: [pull_requests.stacked.after_base_merges]
      summary: "an open pull request's base branch was merged: rebase it onto main and retarget it"
    pr.merged-into-base:
      scope: github
      severity: error
      fix: skill
      keys: [pull_requests.stacked.merge_into_base]
      summary: "a pull request was merged into a branch other than main, so the issues it fixes stay open"
    gh.labels:
      scope: github
      severity: error
      fix: auto
      keys: [labels.list]
      summary: "the labels on GitHub differ from the conventions (coney-tools repo sync-labels --apply)"
    gh.ruleset:
      scope: github
      severity: error
      fix: maintainer
      keys: [merge]
      summary: "the GitHub ruleset or repository settings differ from the merge section"
    ws.disk:
      scope: local
      severity: error
      fix: auto
      keys: [workspace.disk_min_free_gb]
      summary: "the workspace drive has less free space than the minimum (coney-tools workspace clean)"
    ws.worktrees:
      scope: local
      severity: warn
      fix: auto
      keys: [workspace.worktrees, workspace.remove_worktree_when_merged, workspace.busy_marker]
      summary: "a worktree of merged work is still there, or a stray file sits among the worktrees"
    ws.scratch:
      scope: local
      severity: warn
      fix: skill
      keys: [workspace.scratch, workspace.game_capture_suffixes, workspace.scratch_skip_folders, workspace.shared_scratch]
      summary: "a scratch folder of merged or abandoned work still holds files taken from the original (traces, dumps, save states)"

# Local only (`workspace clean|disk`); the hosted checks ignore it.
workspace:
  worktrees: "../../worktrees/coney/<branch>/"
  scratch: "../../scratch/<branch>/"
  disk_min_free_gb: 30                           # under it, `workspace clean` deletes idle build/ folders
  disk_margin_gb: 10                             # ... until free space reaches disk_min_free_gb + this
  build_idle_hours: 24                           # a build/ folder unused this long is deleted (cheap to rebuild)
  busy_marker: ".coney-busy"                     # a worktree holding it is never cleaned; an empty one older than build_idle_hours does not count
  remove_worktree_when_merged: true
  # File types taken from the original (PCSX2 save states, traces, memory dumps): `repo audit --local` finds them in the
  # scratch folder of a branch that is merged or gone, where they have no use left. Screenshots are not on this list.
  game_capture_suffixes: [".p2s", ".trace", ".dump", ".ps2", ".raw", ".bin"]
  # `.bin` is deliberately generic: raw RAM dumps, WAD entries and extracted models are all `.bin` and live in any
  # folder, so a `.bin` anywhere counts, and the finding lists its first paths so a person looks before deleting
  # (CMake, Gradle and terminal recorders write some too). `.iso` is NOT listed: the scratch ISOs are hard links to
  # the user's disc for PCSX2 and cost no disk space.
  # Tool trees the scratch check never walks into, at any depth (case-insensitive): build outputs, dependency caches,
  # virtual environments and git data hold hundreds of thousands of files and none came from the original.
  scratch_skip_folders: [CMakeFiles, _deps, .gradle, build, venv, .venv, site-packages, .git, node_modules]
  # Scratch folders that are the workspace's own, not a branch's (the emulator's files, the saved states, the PCSX2
  # claims, the downloads, the preview builds, the decompiled scripts `lua decompile --all` shares): the scratch check
  # never reports them.
  shared_scratch: [pcsx2, pcsx2-states, pcsx2-claims, downloads, preview, public-preview, presentation, orig-review, orig-sweep, lua]
  # In-game video clips for issues and pull requests (`coney-tools clips`; docs/guides/testing.md#clips): they live
  # only in scratch/<task>/<folder>/, are at most max_seconds long, warn past warn_mb and are deleted once uploaded
  # or after keep_hours. Coney's own cap, kMaxClipSeconds in src/core/clip_recording.h, must equal max_seconds (a
  # test checks it).
  clips:
    folder: "clips"
    max_seconds: 10
    warn_mb: 10
    keep_hours: 24

stamps:
  # The proof log of a unit of work (docs/guides/stamps.md): one append-only chain of stamps per task, written only by
  # the stage commands and kept in the task's scratch folder. Stamps are not signed; the steps that vouch for a whole
  # change are bound to a hash of it, not to a commit (stamps.md#change).
  segment_bytes: 262144                          # a log file is closed before it passes this (the file check is 512 KB)
  steps: [assigned, claimed, studied, fails-first, compared, checked, reviewed, pr-opened, finished]
  results: [pass, fail, none]
  pairs:                                         # mapping/<addr>.toml (docs/guides/stamps.md#pairs)
    kinds: [branch, loop, call, field, constant, return]
    relations: [same, stand-in, not-ported]
    stand_in_markers: [stand-in, "Coney's choice"]   # a comment at the code carries one (testing.md#stand-ins)
  # `pr verify` requires every stamp it relies on to say `who.source: hook` (the dispatcher vouched for the agent). Off
  # until the hooks write the identity for every stage command, so a log made without them still verifies.
  require_hook_source: false

proof:
  # What a change must pass on this machine before it is opened as a pull request (`coney-tools task check`;
  # docs/guides/coney-tools-repo.md#task-check): the profile a change needs is the first one below, in the order of this list, whose
  # `classes` hold the CI scope class (`paths.docs_only`, `tools_only`, `engine`, else `unknown`) of every changed
  # path. `checks` are the names `task check` runs, in this order, and the `checked` stamp records. A task may ask
  # for a bigger profile.
  profiles:
    - name: docs
      classes: [docs_only]
      checks: [docs-check, mkdocs, pre-commit, actionlint]
    - name: tooling
      classes: [docs_only, tools_only]
      checks: [docs-check, mkdocs, pre-commit, ruff, mypy, pytest, actionlint]
    - name: full
      classes: [docs_only, tools_only, engine, unknown]
      checks: [docs-check, mkdocs, pre-commit, ruff, mypy, pytest, actionlint, msvc-ci-build, ctest-full-disc]
  # A check that applies only when a changed path starts with one of these prefixes (a check not listed always applies
  # in a profile that names it).
  only_when:
    actionlint: [".github/workflows/", ".github/actions/"]
  # The CMake preset of the build and the test run behind the two checks of `checks` (MSVC with /WX), the first
  # answering whether it built and the second whether the suite ran whole with the disc, from the build record a
  # run of `coney-tools build` leaves (docs/guides/stamps.md#build-record).
  build:
    preset: ci
    checks: [msvc-ci-build, ctest-full-disc]

research:
  # The research pages of docs/research/ (docs/guides/writing-docs.md#research-pages): the kinds a page can be, the
  # sections each keeps and the limits `coney-tools docs check` holds a page to. Pages that do not meet the standard
  # yet are listed in the legacy file (writing-docs.md#legacy-pages).
  files:
    ghidra_functions: docs/progress/ghidra-functions.tsv   # every function of the executable: an address must resolve here ...
    elf_sections: research/elf-sections.toml               # ... or in a data section listed here
    runs: research/runs                                    # one <id>.toml per run record a runtime claim cites
    legacy: research/legacy.toml                           # pages that do not meet the standard yet
    functions: research/functions                          # the function database, one <system>.toml each
    source_files: research/source-files.toml               # the original's source files and their addresses (the source map's file tables)
    glossary: research/glossary.yaml                       # the player's words, each linked to its page and functions
  front_matter: [kind, system, owns]                       # the keys a page's YAML front matter may hold
  owns_keys: [files, ranges, functions]                    # the keys of its `owns`
  # A research page moved with git (a rename the base diff detects at or above this score, in percent; git's own
  # similarity) keeps its legacy entry's grading exemption and nothing else (writing-docs.md#legacy-pages). 50 is
  # git's default; lower is refused.
  moved_similarity: 50
  verified_max_chars: 200                                  # the "Verified against" line: one line, at most this long
  copy_min_chars: 200                                      # a paragraph this long on two pages is a copy
  # Old section names every kind accepts as the new ones, until a page is renamed.
  aliases:
    Purpose: Summary
    Original structure: Map
    "Coney's implementation": In Coney
    Runtime checks: How this was checked
    Disc counts: How this was checked
  ungraded_sections: [Summary, In Coney, Open questions, How this was checked]  # an address there needs no level
  dated_sections: [In Coney, How this was checked]         # the only sections that may hold a date or an issue number
  map_section: Map                                         # a table there with no level column grades nothing (the function database does)
  # A page with no front matter (all of them before the mechanical pass) is read as this kind.
  inferred_kind:
    default: system
    folders: {"docs/research/formats/": format}
  kinds:
    system:
      sections: [Summary, Map, Data, Behaviour, In Coney, Open questions, How this was checked]
      optional: [How this was checked]
      max_lines: 1500
      system: required
      owns: required
    topic:
      sections: [Summary, Map, Data, Behaviour, In Coney, Open questions, How this was checked]
      optional: [How this was checked]
      max_lines: 1500
      system: required
      owns: required
    format:
      sections: [Summary, Map, Layout, Behaviour, In Coney, Open questions, How this was checked]
      optional: [Behaviour, How this was checked]
      aliases: {Data: Layout}
      max_lines: 1000
      system: none
      owns: optional
    mission:
      sections: [Summary, Flow, Cast and objects, Scripted events, Open questions, How this was checked]
      optional: [How this was checked]
      max_lines: 1000
      system: none
      owns: none
    feature:
      sections: [Summary, Rules, Map, Behaviour, In Coney, Open questions, How this was checked]
      optional: [How this was checked]
      max_lines: 1000
      system: none
      owns: optional
    survey:
      sections: [Summary, Method, Findings, Open questions, How this was checked]
      optional: [How this was checked]
      max_lines: 1000
      system: none
      owns: optional

runs:
  # Run records (docs/guides/research-evidence.md#run-records): what a research page's `confirmed (runtime)` claim cites.
  # A record is written only by the tools that drive PCSX2 (`pcsx2 recipes run --record`, `trace original --run-record`,
  # `pcsx2 record-run`) or xemu (`xemu record-run`) into research.files.runs and holds names, numbers and addresses, never memory or game text (LEGAL.md). The limits cap
  # how much a record holds; they cannot tell game text from ours, so the reviewer reads the method, args and names.
  id_pattern: '^r-[0-9]{8}-[a-z0-9][a-z0-9-]{0,47}$'   # r-<date>-<name>; the file is <id>.toml
  max_bytes: 8192                                # the writer checks it too; the repository's file check is 512 KB
  max_values: 64                                 # values, addresses and run args together
  max_text: 600                                  # characters of the method, and of any other text field
  kinds: [recipe, trace, method]    # recipe: pcsx2 recipes run; trace: trace original; method: pcsx2 record-run, xemu record-run
  # An xemu run observed the Xbox build, so it backs only a claim about the Xbox: one whose block, grading line or page
  # name has one of these words (case as written, whole words; a page named xbox-*.md counts). `research claims` refuses
  # an xemu run on any other claim: what the Xbox does is no evidence for the PS2 (docs/guides/research-evidence.md#run-records).
  xbox_words: [Xbox, XBE, xemu]

conclave:
  # Conclave, the Claude Code mod in tools/claude-mod (docs/guides/conclave.md). The mod only draws what
  # `coney-tools conclave snapshot` prints; these are the numbers that command sends along. The mod holds only the
  # few it needs before the first snapshot exists (the first retry, the read time limits), named in src/snapshot.ts.
  # Tether keeps the session's health (context window, prompt cache, /clear, HANDOFF); nothing here touches that.
  claude_code: "2.1.309"                         # the Claude Code version the mod is tested on
  hooks_file: .claude/hooks/hooks.toml           # the roles and helpers the mod's agent list is made from
  local_seconds: 15                              # between reads of the local snapshot (a `uv` start costs 1-2 s)
  github_seconds: 60                             # between reads with --github while the pane is open
  github_idle_seconds: 300                       # ... and while it is closed
  pane_min_columns: 30                           # under it the pane is one clipped summary line; from it the narrow layout
  pane_compact_columns: 60                       # from it the compact layout (a row's key fields, then its title below)
  pane_wide_columns: 110                         # from it the pane draws its full layout (a row on one line)
  band_narrow_columns: 100                       # under it the band takes two short lines
  stale_after_reads: 3                           # the band is dimmed once the last read is older than this many local intervals
  merged_visible_minutes: 10                     # a merged unit stays on the pane this long
  unit_days: 3                                   # a unit with no worktree stays on the pane this long after its last change
  claim_red_hours: 6                             # a claim's countdown is red in its last hours (amber from claims.warn_hours)
  # The watchers (docs/guides/conclave.md#watchers): Coney's own events told to the coordinator once. Never an idle wake,
  # which stays Tether's.
  watch:
    roles: [coordinator]                         # the sessions that are woken, toasted and held to the stop guard
    preamble: "Coordinator: new work. Handle it or say why it can wait:"   # the first line of a wake
    github_seconds: 120                          # between GitHub reads in a session that watches, pane open or not (idle: 300)
    wake_gap_seconds: 60                         # at least this long between two wakes; events in between join the next
    defer_typing_minutes: 10                     # a wake waits this long for a draft in the prompt box, then goes anyway
    resend_minutes: 2                            # a wake the engine refused is tried again after this long
    merged_minutes: 30                           # a merged pull request is news for this long after the merge
    stop_max_blocks: 3                           # the stop guard blocks at most this many turn ends in a row for one reason
    stop_reset_minutes: 30                       # ... and counts again from one after this long without a block
    stop_preamble: "Open pull requests are in trouble and nobody holds the fix. Deal with each, or record who does:"
    holds_dir: pr-holds                          # a hold on a pull request's problems: one file each, in the scratch directory
    hold_default_hours: 4                        # `pr hold` lasts this long unless it is told another time
    hold_max_hours: 24                           # and never longer, so a stalled fix cannot hide for ever
    question_prefix: QUESTION                    # QUESTION.md or QUESTION-<n>.md in a unit's scratch folder is a question ...
    answer_prefix: ANSWER                        # ... until ANSWER.md (ANSWER-<n>.md) is newer than it
    unit_hold_file: HOLD.md                      # a file of this name in a unit's scratch folder holds its unit-ready wake back
    # A conflict becomes work (docs/guides/conclave.md#conflicts): a trial rebase, then unit-ready or a conflict-fix wake.
    conflicts_dir: pr-conflicts                  # one file per conflicting pull request in the scratch directory: first seen, last trial
    conflict_retell_hours: 24                    # a waived conflict older than this is told again every this many hours
    # A waiver (`pr hold` with no --who) covers a conflict only when its note matches: it names the maintainer and the
    # issue that holds the open question, so no conflict is parked without a decision behind it.
    conflict_waiver: '(?i)maintainer.*#\d+|#\d+.*maintainer'

standards:
  # What a file is held to when a change touches it, and the files that do not meet it yet
  # (docs/guides/coney-tools-standards.md#standards; `coney-tools standards`). Research pages have their own legacy file
  # (research.files.legacy) and a ported function its `status` in the function database; this file lists the code and
  # test files below standard, each under the rules it fails with the number of findings at the last scan. The file only
  # shrinks: a file leaves it once it passes, and nothing new is added after the first scan.
  legacy_file: research/legacy-files.toml
  # true (since the cutover): every report of `standards check` (a touched file or @orig function below standard, a
  # mark out of step) is an error. false would make each a warning and nothing would fail.
  enforce: true
  # The day the workflow went live ("YYYY-MM-DD"), empty before it. From then on a branch may not mark a function legacy.
  cutover: "2026-10-25"
  code:
    # The rules: `comment` (a doc comment on every public function a header declares, and a comment above every other
    # one whose name does not say everything: not a non-public definition of one statement, a special member with no
    # statement or an override), `type-doc` (a comment above every public type a header declares) and `tag` (`@orig` or `@coney-only` on
    # every function of a gameplay folder, `paths.gameplay`). The whole-file clang-tidy pass is CI's.
    folders: ["src/"]
    suffixes: [".h", ".hpp", ".cpp", ".cc", ".inl"]
  tests:
    # The rule `citation`: every test case carries a line `// Expected: <page>#<anchor>, <level>` (the section of
    # docs/research that gives the expected value) or `// Expected: unverified, #<issue>`.
    folders: ["tests/"]
    suffixes: [".cpp", ".h"]
    macros: [TEST_CASE, TEST_CASE_METHOD, TEMPLATE_TEST_CASE, SCENARIO]
    citation:
      marker: "Expected:"
      unverified: "unverified, #"
      reference: '[A-Za-z0-9_./-]+\.md#[A-Za-z0-9_-]+'

ci:
  # What runs where, and the three CI jobs that read this section's settings (docs/guides/building.md#what-ci-runs).
  # `dependencies`: a pull request whose description says `Depends on #N` (pull_requests.stacked.depends_line) waits
  # until every such pull request is merged; the workflow reruns a waiting pull request's check when one merges.
  dependencies:
    workflow: dependencies.yml                   # `coney-tools ci rerun-dependencies` finds the runs of this workflow
    rerun_limit: 50                              # the most runs one rerun pass restarts
  # The changed-lines clang-tidy job (`coney-tools ci tidy-plan`, `ci tidy-run`) of a pull request or a push: only the
  # lines the change touches are reported, so a finding that was already there never fails it; the nightly run checks
  # every file.
  tidy:
    folders: ["src/", "tests/"]                  # Coney's own sources; never the fetched dependencies under _deps/
    sources: [".cpp"]                            # a changed source is checked itself
    headers: [".h", ".hpp"]                      # a changed header is checked through one source that includes it
    sarif_category: clang-tidy                   # code scanning's name for the annotations on the pull request
    findings_listed: 40                          # the findings the job's summary lists (the SARIF file holds all)
    # The build setup: a setting here reaches every file, so a pull request or push changing one of these (a folder
    # ending in /, or a file at that path) runs the whole-codebase pass of the nightly job instead of its changed lines.
    whole_when: [CMakeLists.txt, cmake/, CMakePresets.json, .clang-tidy]
  # A failed run on the default branch (the nightly build, a push, a manual run) opens a P-critical issue, or comments
  # on the one that is still open for the same workflow (`coney-tools ci report-failure`, workflow ci-failure.yml).
  failure:
    workflows: [build, python, docs]             # the `name:` of the workflows watched
    events: [schedule, push, workflow_dispatch]  # the events that count; a pull request's run never does
    labels: [task, P-critical, A-tools, S-ready-to-start]   # the type, priority, area and status of the issue
    area: A-tools                                # the form's Area answer
    marker: coney-ci-failure                     # <!-- coney-ci-failure:<workflow> --> in the body finds the open issue again
    files_listed: 8                              # the files named in the issue, each with its last commits
    commits_per_file: 3
    log_lines: 40                                # the lines of the failed steps' log quoted in the issue
  # One place per check: where each check of the project runs. `local` is `task check` (which writes the `checked`
  # stamp, running the checks of `proof.profiles`), a stamp command (`orig study`, `compare`, `fails-first`) or a
  # git hook; the CI words are `ci` (every pull request), `main` (a push to main), `release` (a push to a `release/`
  # branch), `nightly` (the scheduled run on main), `manual` (a run started by hand; the failure issue follows one on
  # main) and `issues` (issue and pull request events, and the sweeps that follow them up). A place that runs in CI
  # names its jobs as <workflow file>/<job id>; `coney-tools repo audit --files` (files.ci-places) fails when a job is
  # missing from the workflows, a job is in no place or a required check (merge.required_checks) is in none.
  places:
    - {id: full-suite, check: "Full suite with the disc", where: [local]}
    - {id: msvc-ci-build, check: "MSVC `ci` build (/WX, C4062)", where: [local]}
    - {id: study, check: "Study, pairs, copy check, fails-first", where: [local]}
    - {id: format, check: "Formatting", where: [local, ci, main, release, nightly, manual], jobs: ["build/format"], note: "applied by a git pre-commit hook, verified by CI"}
    - {id: compilers, check: "GCC 13, Clang 19 and AppleClang builds with the unit and smoke tests; MSVC and GCC release builds", where: [ci, main, release, nightly, manual], jobs: ["build/build"]}
    - {id: sanitizers, check: "Linux and macOS sanitizers", where: [ci, main, release, nightly, manual], jobs: ["build/sanitizers"]}
    - {id: clang-tidy, check: "clang-tidy: the lines a change touches; the whole codebase nightly, in a manual run and for a build-setup change", where: [ci, main, release, nightly, manual], jobs: ["build/clang-tidy"]}
    - {id: python, check: "Python: ruff, mypy, pytest, the repository, render and progress checks", where: [local, ci, main, release], jobs: ["python/python", "python/python-ok"]}
    - {id: docs, check: "Docs: mkdocs strictly, markdownlint, actionlint, the page standards", where: [local, ci, main, release], jobs: ["docs/mkdocs", "docs/markdownlint", "docs/actionlint"]}
    - {id: pull-request, check: "The pull request's title, description, docs and claimed issues", where: [ci], jobs: ["pr/title", "pr/docs", "pr/body", "pr/claim"]}
    - {id: dependencies, check: "`Depends on #N` pull requests are merged", where: [ci, main], jobs: ["dependencies/dependencies", "dependencies/rerun"]}
    - {id: gates, check: "The gate that stands for the build jobs", where: [ci, main, release, nightly, manual], jobs: ["build/build-ok"]}
    - {id: scope, check: "Which jobs a change needs", where: [ci, main, release, nightly, manual], jobs: ["build/changes", "python/changes"]}
    - {id: caches, check: "Cache upkeep and the docs site", where: [main, release, nightly, manual], jobs: ["build/cache-prune", "docs/deploy"], note: "the docs site deploys on a push to main only"}
    - {id: issue-automation, check: "Issue checks, claims, status labels and the weekly report", where: [issues], jobs: ["claim/claim", "hygiene/hygiene", "issue-check/check", "issue-status/status-label"]}
    - {id: failure-issue, check: "A failure on main opens a P-critical issue", where: [main, nightly, manual], jobs: ["ci-failure/report"]}
