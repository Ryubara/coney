name: Task
description: A piece of work for a maintainer or an agent (a fix, a feature, a research question)
title: "Task: "
labels: ["task", "S-needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        A task is written so that someone with no other context can do it. An agent may be given only "issue #N".
        Start with the problem, link pages with relative links, and say whether the pull request it came from is
        merged or open (see "Writing an issue a newcomer can read" in docs/guides/issues.md).
        Never put game data in an issue: no assets, extracted files, saves, dumps, executables, BIOS or game text.
        Call the person who play-tests "the user" (for example "From: user playtest, 2026-10-11"), never "the owner".
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: |
        Start with the problem or goal in plain words: what is wrong or missing, for the player or the developer, and why it matters. Then say where the work stands now (what exists, what a pull request did). Name the pull request or issue it came from only as the source, and say whether it is merged, open or closed.
      placeholder: "for example: The pause menu's Options screen is a stand-in. ..."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: The subsystem; the coordinator sets the matching label.
      options:
        - A-combat
        - A-ai
        - A-missions
        - A-hud
        - A-graphics
        - A-audio
        - A-physics
        - A-camera
        - A-platform
        - A-core
        - A-tools
    validations:
      required: true
  - type: input
    id: research
    attributes:
      label: Research page
      description: The page under docs/research that covers this, with the section, as a relative link that works from an issue page, or "none yet" when an analyst must study the original first. A page that exists only on an unreleased branch is named in plain text and marked as such.
      placeholder: "for example [docs/research/physics.md#human-contacts](../blob/main/docs/research/physics.md#human-contacts)"
  - type: textarea
    id: done
    attributes:
      label: What "done" means
      description: The acceptance test, as docs/guides/testing.md defines it for this kind of work (for a bug fix, a test that fails before the fix and passes after it).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Fix list or steps
      description: What to check or change, in order, as a checklist. Each item is a concrete step someone can verify, not a label.
      placeholder: |
        - [ ] Document or automate PCSX2's 7z extraction on Windows 10, whose tar cannot unpack it
        - [ ] ...
  - type: input
    id: blocked-by
    attributes:
      label: Blocked by
      description: Issue numbers that must be finished first, such as #12, or leave empty.
      placeholder: "#12"
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: |
        Drag and drop screenshots or a short video of Coney, and of the original from the same place when there is one. Never game files, saves or dumps.
        When there is nothing to show, write one line: `Screenshots: none (<reason>)`, for example `Screenshots: none (research only)`.
    validations:
      required: true
