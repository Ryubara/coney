# Keep the dependencies' sources (SDL3, librw, Catch2, Dear ImGui, ENet, FFmpeg) between runs: one cache entry per OS
# and version of cmake/deps.cmake, shared by every job and preset on that OS. CONEY_DEPS_SOURCES tells
# cmake/deps.cmake to fetch into build/_deps-sources/<version>/<name> and to use a complete copy found there without
# downloading.
#
# Only the sources: build/<preset>/_deps also holds the dependencies' build trees, compiled by one job's compiler and
# flags, which a fresh job rebuilds anyway (Ninja has no log of them), and that made eight ~400 MB entries of one
# preset and compiler each. The sources are the same for every job on an OS (Windows checks them out with its own
# line endings, so it keeps its own). The folder's name holds "_deps", which keeps it out of clang-tidy's file list.
# Call it before the configure step and ./.github/actions/deps-save right after it. Rules: building.md#ci-caches.
name: deps
description: Restore the fetched dependency sources of this OS and deps.cmake, and point cmake/deps.cmake at them.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        DEPS_HASH: ${{ hashFiles('cmake/deps.cmake') }}
      run: |
        {
          echo "CONEY_DEPS_SOURCES=$GITHUB_WORKSPACE/build/_deps-sources"
          echo "CONEY_DEPS_KEY=deps-src-$RUNNER_OS-$DEPS_HASH"
        } >> "$GITHUB_ENV"
    # No restore-keys: an older version's sources would not match the new deps.cmake's stamp and would be fetched
    # again anyway.
    - id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: build/_deps-sources
        key: ${{ env.CONEY_DEPS_KEY }}
    - shell: bash
      env:
        HIT: ${{ steps.restore.outputs.cache-hit }}
      run: echo "CONEY_DEPS_RESTORED=${HIT:-false}" >> "$GITHUB_ENV"
