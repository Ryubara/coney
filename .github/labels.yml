# The labels of the issue tracker: the single source of truth. `coney-tools repo labels` prints the `gh` commands
# that create them and `coney-tools repo labels --apply` syncs them (the coordinator runs it; see
# docs/guides/issues.md). Edit this file, never the labels on GitHub. A description is at most 100 characters.
labels:
  # Type: what kind of issue it is (one per issue).
  - name: bug
    color: d73a4a
    description: Something in Coney is broken
  - name: parity
    color: b60205
    description: Coney differs from the original game
  - name: task
    color: 0e8a16
    description: A piece of work for a maintainer or an agent
  - name: docs
    color: 0075ca
    description: Documentation or research pages
  - name: enhancement
    color: a2eeef
    description: Beyond the original; waits until the game is complete

  # Area: the subsystem (one or more per issue). Mirrors the area list of the task form.
  - name: A-combat
    color: c5def5
    description: "Area: fighting, grabs, weapons, damage"
  - name: A-ai
    color: c5def5
    description: "Area: AI humans, pathing, goals, cars driven by AI"
  - name: A-missions
    color: c5def5
    description: "Area: mission scripts, checkpoints, objectives"
  - name: A-hud
    color: c5def5
    description: "Area: HUD, menus, text, prompts"
  - name: A-graphics
    color: c5def5
    description: "Area: rendering, models, textures, effects, lighting"
  - name: A-audio
    color: c5def5
    description: "Area: sound, music, speech"
  - name: A-physics
    color: c5def5
    description: "Area: collision, movement, cars, doors, world objects"
  - name: A-camera
    color: c5def5
    description: "Area: cameras and cutscenes"
  - name: A-tools
    color: c5def5
    description: "Area: coney-tools, build, CI, the sandbox"

  # Priority: how soon (set by the coordinator).
  - name: P-high
    color: e11d21
    description: "Priority: blocks play or other work"
  - name: P-medium
    color: fbca04
    description: "Priority: next in line"
  - name: P-low
    color: 0e8a16
    description: "Priority: when there is room"

  # Status: where the issue is in its life (one at a time; the coordinator moves it).
  - name: S-needs-triage
    color: ededed
    description: "Status: not yet looked at"
  - name: S-needs-info
    color: d4c5f9
    description: "Status: waiting for the reporter"
  - name: S-needs-research
    color: d4c5f9
    description: "Status: an analyst must study the original first"
  - name: S-in-progress
    color: 5319e7
    description: "Status: an agent or person is working on it"
  - name: S-pending-review
    color: 1d76db
    description: "Status: a pull request is open"
  - name: S-blocked
    color: 000000
    description: "Status: waiting for another issue or a decision"

  # GitHub's own labels, kept so the sync leaves them as we want them.
  - name: good first issue
    color: 7057ff
    description: Good for newcomers
  - name: help wanted
    color: 008672
    description: Extra attention is needed
  - name: duplicate
    color: cfd3d7
    description: This issue already exists
  - name: wontfix
    color: ffffff
    description: This will not be worked on
