# The sections of SLUS_212.15 (NTSC-U) that are loaded into memory, from the ELF section headers: name and the
# addresses each covers, `start` up to but not including `end`. Reference data only (names and numbers, no bytes):
# `docs check` holds an address a research page cites to it and to docs/progress/ghidra-functions.tsv. An address in
# the section marked `code` must lie inside a function of that listing; an address in any other section resolves.
# The sections that load no memory (.reginfo, .DVP.*, .shstrtab) are left out.

[[section]]
name = ".text"
start = 0x00100000
end = 0x004f6578
code = true

