- name: EnableGameOverCheck
  wrapper: 0x0036c710
  calls:
    - {addr: 0x0041d890, name: GameState_EnableGameOverCheck}
  args:
    - {name: "on", lua: boolean, desc: "true to let the game end the mission when the players are beaten or arrested, false to suspend that check (for scripted defeats). Missing counts as false."}
  description: >-
    Switches the per-frame game-over check (`W_GameState + 0x155`, on after the level reset 0x00418c68). While it is
    on and no level end is pending, GameState_CheckGameOver (0x004197a8, every frame from 0x0041a370) fails the
    mission when every player is out or cuffed: a cuffed player holding a handcuff key
    ([item 6](../../references/inventory.md#item-6)) is spared, and while a crew mate can still come to help the
    failure waits for four checks. The failure shows a reason message (busted when cuffed, `+0x118` = 1) through the
    HUD (0x001d1fb8) and sets the level end (`+0x14c` = 1).
  evidence: confirmed-code
  depth: thorough
  notes: >-
    0x00223b70 tests state flag `0x20000`, cuffed (0x002843f8 spends a handcuff key to clear it); the meanings of
    0x00227dd8 (`0x40000`, or no state record) and 0x00227eb0 (`0x100000000`) are inferred as out of the fight. Any
    player in the `0x100000000` state fails the mission at once.
  usage: {chunks: 3, calls: 6, boot: false, mission1: false, result_used: false, levels: [51, 84]}

- name: PrecacheWorld
  wrapper: 0x0036c7a0
  calls:
    - {addr: 0x0040c948, name: World_Precache}
    - {addr: 0x0040e2d8, name: WorldManager_Preload}
  args:
    - {name: budgetMs, lua: number, ctype: float, desc: "Time budget of the streaming loop in milliseconds, truncated to an integer; every call passes 10000."}
    - {name: radius, lua: number, ctype: float, desc: "Distance in metres within which missing world sectors are waited for (the scripts pass 50 or 500); replaced by player 1's camera draw distance whenever that camera exists."}
    - {name: pack, lua: string, desc: "Name of a pack to load first, without extension: `<pack>.pak` is loaded when it exists (a level section or a Rumble pack name); nil for none."}
  description: >-
    Blocks the game while the world around the camera is streamed in, before a script moves the player somewhere
    new: the game clock is paused, `<pack>.pak` is loaded if present, the world streamer runs until the sectors within
    the radius are in or the budget runs out, then every pack queued by QueueFileToPrecache is loaded. The preload
    indicator shows meanwhile unless a loading screen already does.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    Steps: [Level loading: preload](../../research/level-loading.md#preload). Does nothing when no level is loaded
    (world manager +0x40 null), and then leaves the game clock paused if it was running (the resume sits inside the
    same test). A second call while a preload runs is refused. With a camera the radius argument is ignored (the
    callee's value argument is 0), so the scripts' 50 and 500 differ only with no camera.
  usage: {chunks: 36, calls: 136, boot: false, mission1: false, result_used: false, levels: [95, 11]}
  coney: implemented

- name: QueueFileToPrecache
  wrapper: 0x0036c838
  calls:
    - {addr: 0x0040cc40, name: World_QueuePackToPrecache}
    - {addr: 0x0040e1a0, name: WorldManager_QueuePack}
  args:
    - {name: file, lua: string, desc: "A file name with its extension, such as a character `.pak` pack; copied."}
  description: >-
    Appends a file to the world manager's precache queue (+0x0c, an unbounded list). The next preload (PrecacheWorld,
    or the level load's own) loads every queued file that exists with the resource manager, in order, after its
    streaming, and empties the queue.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    A name that does not exist is dropped silently at load time; nothing checks it when queued. The Rumble set-up
    queues the gangs' character packs this way ([Front end](../../research/frontend.md)).
  usage: {chunks: 34, calls: 167, boot: false, mission1: false, result_used: false, levels: [95]}
  coney: implemented

- name: ResetStore
  wrapper: 0x0036da10
  calls:
    - {addr: 0x0041ddd8, name: Store_Reset}
  args:
    - {name: store, lua: number, ctype: unsigned, desc: "Handle of the store's front flag (a world flag of activity 14); any other handle does nothing."}
  description: >-
    Undoes a break-in on a store: the store front's robbed bit (bit 16 of its group word +0xd8) is cleared, and the
    nearest `strobe` object within 7 m of the store front is sent message 0x13 (inferred: the alarm light off), the
    counterpart of the 0x12 a break-in sends.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    The 7 m test is the strobe's distance from the store flag, not the player's (squared distance under 49 from
    0x0039c7d8); crimes.md#stores says the player must be within 7 m, which is wrong. It also sets bits 8-15 of the
    group word to 0xff and the gang bits 18-22 to 31 (no gang). The browsers and buyers a break-in switched off are not
    switched back on here.
  usage: {chunks: 1, calls: 1, boot: false, mission1: false, result_used: false, levels: [95]}

