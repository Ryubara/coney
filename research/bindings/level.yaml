  description: >-
    Brings the player characters in line with the game's two-player setting (W_GameState +0x56ec, or +0x56f4 in the
    Armies of the Night levels): when two players are set but only player 1 exists, a Warrior of player 1's gang
    (the lowest rank byte +0x1b1, else any Warrior) becomes player 2 with split screen; when one player is set but a
    second exists, player 2 goes back to the AI. The multiplayer callback (SetMultiplayerCallback) is called with the
    human and true or false. The hub calls it after its menus.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    Only while joining is allowed (CfgMultiplayerJoin, +0x56e8) and the game mode +0x158 is 0 or 3; otherwise, with two
    players present, it only refreshes their viewports. Each player-2 change rebuilds the split screen (0x00122ed0) and
    the war chief is reassigned at the end. Does nothing with no game state or no player. The same function runs with
    -1 after every level load.
  usage: {chunks: 1, calls: 1, boot: false, mission1: false, result_used: false, levels: [95]}

- name: SetLoadPriority
  wrapper: 0x0036e630
  calls:
    - {addr: 0x0040c938, name: WorldManager_SetLoadPriority}
  args:
    - {name: priority, lua: number, ctype: float, desc: "Weight on the distance of the nearest model still to load; the level default is 0.001 and the only call passes 0.01."}
  description: >-
    Sets how the world streamer weighs models against world sectors when choosing what to load next (global
    `0x005147cc`). The streamer's update (0x0040f8a0) multiplies the distance of the nearest model the resource manager
    still needs by this value and loads a world sector first only when the sector is nearer than that product, so a
    larger value lets sectors go ahead of models. The full level load (0x0040dbb8) resets it to 0.001; the Rumble menu
    mode raises it to 10 while open ([Front end](../../research/frontend.md)).
  evidence: confirmed-code
  depth: thorough
  notes: >-
    The weighing is read from 0x0040f8a0's comparisons; how much it changes load order in play is inferred. The same
