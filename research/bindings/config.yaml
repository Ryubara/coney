- name: CfgGearData
  wrapper: 0x00359d58
  calls:
    - {addr: 0x002361e8, name: Cfg_SetGearData}
  args:
    - {name: pos1, lua: table, elem: number, count: 3, written_back: true, desc: "Ignored: overwritten with a built-in offset {x, y, z} (metres) and written back into the table."}
    - {name: rot1, lua: table, elem: number, count: 4, written_back: true, desc: "Ignored: overwritten with a built-in rotation quaternion {i, j, k, r} and written back."}
    - {name: pos2, lua: table, elem: number, count: 3, written_back: true, desc: "Ignored: overwritten with a built-in offset and written back."}
    - {name: rot2, lua: table, elem: number, count: 4, written_back: true, desc: "Ignored: overwritten with a built-in quaternion and written back."}
    - {name: pos3, lua: table, elem: number, count: 3, written_back: true, desc: "Third attachment offset {x, y, z} in metres, relative to the attach bone."}
    - {name: rot3, lua: table, elem: number, count: 4, written_back: true, desc: "Third attachment rotation as a quaternion {i, j, k, r}."}
    - {name: pos4, lua: table, elem: number, count: 3, written_back: true, desc: "Fourth attachment offset {x, y, z} in metres."}
    - {name: rot4, lua: table, elem: number, count: 4, written_back: true, desc: "Fourth attachment rotation as a quaternion {i, j, k, r}."}
  description: >-
    Stores four attachment transforms (offset and rotation pairs) for carried gear in a global table at 0x00715480
    (0x20 bytes each), read by one character routine (0x0024cef0). The first two pairs are replaced by constants
    compiled into the game before being stored, so only the last two pairs take effect.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    The constants overwrite the caller's tables in place (the wrapper writes all eight tables back), so a script
    reading pos1..rot2 afterwards sees the built-in values. What the four 'gear' slots attach (hands, back) is not
    traced.
  usage: {chunks: 1, calls: 1, boot: true, mission1: false, result_used: false}

