- name: PadSetHandler
  wrapper: 0x0036d878
  calls:
    - {addr: 0x00145698}
  args:
    - {name: player, lua: number, ctype: unsigned, desc: "0 for player 1; any other value for player 2 (mapped to the controller port that player uses)."}
    - {name: button, lua: number, ctype: unsigned, desc: "A button mask; the handler is stored under its highest set bit (16 slots per pad). The scripts pass single bits 1, 2, 4 ... 32768."}
    - {name: callback, lua: string, desc: "Name of the Lua function to call when the button is pressed, or nil to remove."}
  description: >-
    Sets a Lua handler for a pad button (the table at `0x005dda90`: 8 pads × 16 buttons), used by menus and pop-ups
    made in Lua.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    Which bit is which PS2 button is not traced here (the pad layer's button order).
  usage: {chunks: 16, calls: 135, boot: true, mission1: true, result_used: false}

