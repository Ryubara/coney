    - {addr: 0x00169a20, name: Gang_ClearWanted}
  args:
    - {name: callback, lua: string, desc: "Lua function name (copied, at most 31 characters, to `W_GameState + 0x2bc`), or nil to clear it."}
  description: >-
    Sets the function called, with no arguments, when player 1's gang is in the clear: when its police wanted timer
    (gang `+0x5e8`) runs out with no crime in progress and the police turn neutral again (0x00169a20, which also tells
    the HUD and sets the last crime type to 0xe), or when its second timer (gang `+0x5f0`, set by GangRespond and
    GoalCallGang) runs out.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    Setting a name also clears game state byte `+0x2db` (the byte before the name). The callback is only called if the
    name is a Lua function. Other readers of `+0x2bc` (0x0016cc60, Crime_UpdateLevel 0x0041c128) are not traced.
    Wanted timers: [Crimes](../../research/crimes.md#wanted).
  usage: {chunks: 2, calls: 3, boot: false, mission1: false, result_used: false, levels: [20]}

