# The Warriors' script bindings, category `script`: one entry per Lua global the game registers.
# Schema: docs/guides/research-workflow.md#bindings. docs/references/bindings/ is generated from these
# files by `coney-tools natives render`; edit them here, then render.

- name: SetMsgHandler
  wrapper: 0x0036d1c8
  calls:
    - {addr: 0x00386298}
  args:
    - {name: object, lua: number, ctype: unsigned, desc: "Handle of the object or human whose messages to watch."}
    - {name: message, lua: number, ctype: int, desc: "Message number, 0-25 (for example 3 when a human enters a volume box or trigger sphere, 4 when it leaves, 8 when an AI arrives at a flag, 18 for a death); 0 also clears the object's interaction prompt first (see SetMsgHandlerEx)."}
    - {name: callback, lua: string, desc: "Name of the Lua function to call (dotted names allowed), or nil to remove the handler."}
  description: >-
    Registers a Lua callback for a message an object receives: the interned name goes in slot `message` of the
    object's message-handler component (`0x003860b8`, made on demand). When the message arrives the callback gets
    arguments that depend on the number, usually the object itself and the other object involved (the table is in
    scripting.md#message-handlers). The most used binding in the scripts.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    Messages reach Lua only while the level-end state (`W_GameState + 0x14c`) is 0, so no callback runs once a
    mission is won, failed or left (0x00384c38). The arguments per number are confirmed (code) at 0x00384ce0; the
    senders of 3, 4, 5 (volume boxes, trigger spheres) and 8 (flags) are confirmed, the meaning of the others is
    inferred from the scripts' handler names (references/script-events.md).
  usage: {chunks: 195, calls: 3040, boot: true, mission1: true, result_used: false, levels: [80, 87, 95, 34, 2, 3, 5, 81, 86, 93, 31, 14, 9, 51, 52, 54, 55, 84, 82, 92, 83, 20, 11, 60, 61, 62, 63, 64]}
  coney: implemented

- name: SetObjZoneMsgHandler
  wrapper: 0x0036d258
  calls:
    - {addr: 0x00386308}
    - {addr: 0x0039a7e0, name: ObjZone_SetMsgHandler}
    - {addr: 0x003982a0, name: ObjZone_DispatchMessage}
    - {addr: 0x00392520}
  args:
    - {name: zone, lua: number, ctype: unsigned, desc: "Object zone number 0-254 ([Object zones](../../references/zones.md)); not range-checked."}
    - {name: message, lua: number, ctype: int, desc: "Message number 0-25, as for SetMsgHandler ([Script events](../../references/script-events.md)); scripts use 1 (damaged) and 2 (broken). Not range-checked."}
    - {name: callback, lua: string, desc: "Lua function name, interned; nil clears the slot."}
  description: >-
    Registers one Lua callback for a message on every world object of an object zone, in the object manager's table
    (255 zones of 26 slots, object manager `+0x50 + zone * 0x68 + message * 4`). Whenever a world object gets a message
    (0x00392520), the manager finds its spawn record, and when that record's zone has a callback for the message it is
    called like an object's own handler (same arguments, [Scripts: message handlers](../../research/scripting.md#message-handlers));
    the object's own handlers run after it.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    Only objects spawned from the level's spawn table belong to a zone. The table is cleared when the spawn table is
    reset (0x00398130). Out-of-range zone or message numbers write past the table.
  usage: {chunks: 5, calls: 34, boot: false, mission1: false, result_used: false, levels: [93, 51, 92, 83]}

- name: SetGeneralCarMsgHandler
  wrapper: 0x0036d2e8
  calls:
    - {addr: 0x00386340, name: Script_SetGeneralCarMsgHandler}
    - {addr: 0x0038e538, name: CarManager_SetMsgHandler}
  args:
    - {name: message, lua: number, ctype: int, desc: "Message number; every call passes 25 (0x19), the message a car sends itself when it explodes."}
    - {name: callback, lua: string, desc: "Name of the Lua function to call, or nil to remove it."}
  description: >-
    Registers one Lua callback for a message from any car: the car manager (`0x00512c7c + 0x844`) keeps the
    function's reference in its slot for that number (`+0x18 + 4 × message`). Scripts use it to hear every car
    explosion (Car_DoExplode sends message 0x19, with the car as self) without a SetMsgHandler on each car.
  evidence: inferred
  depth: thorough
  notes: >-
    The store is confirmed (code) at 0x0038e538; the reference comes from the script system's slot `+0xcc`. The
    code that reads the manager's slots when a car gets a message, and the callback's arguments, are not traced
    (message 0x19 marshals as `(self, other, n, flag)`, [Scripts](../../research/scripting.md#message-handlers)).
  usage: {chunks: 10, calls: 20, boot: false, mission1: false, result_used: false, levels: [34, 2, 3, 5, 93, 14, 82, 92]}

