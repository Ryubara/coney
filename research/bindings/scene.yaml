  description: >-
    Stops a scene without forcing it, exactly `SceneStop(scene, false)` (`Scene_Stop` 0x00353a10): a starting scene
    ends at once, a playing one with roles has its clips ended (waiting while a role is in a paired move), and a
    looping one only stops looping and ends after its current pass. Once ended the scene's humans are released and
    its slot unloaded.
