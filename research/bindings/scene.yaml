- name: ScenePlayCinematic
  wrapper: 0x00367580
  calls:
    - {addr: 0x00353c68, name: Scene_PlayCinematic}
  args:
    - {name: scene, lua: number, ctype: unsigned, desc: "Scene id from ScenePreload."}
    - {name: delay, lua: number, ctype: unsigned, desc: "The longest the start waits for the bound humans to walk to their marks: delay × 60 scene updates (30 a second). 0 (global.lua's default) does not wait."}
    - {name: onEnd, lua: string, desc: "Name of the Lua function called with the scene id when the scene ends, or nil."}
    - {name: bars, lua: boolean, desc: "true makes it a full cinematic: letterbox in and out over 1.5 s, the world preloaded around the scene camera, the player handed back at the end. false plays the tracks only."}
    - {name: skippable, lua: boolean, desc: "true lets cross or START skip it after 2 s (global.lua passes `not NoSkip`); also sets the flag 0x00510174."}
    - {name: looping, lua: boolean, desc: "true loops the scene (from a loop-point event when it has one)."}
    - {name: freeze, lua: boolean, default: true, desc: "true suspends every brain while it plays and resumes them all after. Defaults to true only when omitted; an explicit nil is false, which is what global.lua passes."}
    - {name: blendCam, lua: number, ctype: float, desc: "Seconds of camera blend when the scene camera hands back (0 or below is a cut); after a skip, also the fade-in time when above 0."}
    - {name: final, lua: boolean, desc: "true skips preloading `<scene>_end.pak` around the camera at the end (global.lua passes the scene table's Final)."}
    - {name: chain, lua: boolean, desc: "true letterboxes in at once and keeps a START skip going into this scene; false clears it (global.lua passes the scene table's Chain)."}
  results:
    - {lua: boolean, desc: "true (1) when the scene started, nil when it could not."}
  description: >-
    Plays a loaded scene as a cinematic at its authored position, taking over the camera and optionally the player's
    control until it ends or is skipped.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    Plays at the world origin with no rotation, so the record's coordinates are world coordinates. Task flags +0xed
    bars, +0xe5 skippable, +0xeb looping, +0xef freeze, +0xe7 final, +0xe8 chain, BlendCam at +0x94 (0x003a13d0,
    0x00353818). Research: docs/research/scenes.md#playing.
  usage: {chunks: 9, calls: 14, boot: true, mission1: true, result_used: false, levels: [80, 87, 95, 34, 2, 3, 5, 81, 86, 93, 31, 14, 9, 51, 52, 54, 55, 84, 82, 92, 83, 20, 11, 60, 61, 63]}
  coney: implemented

