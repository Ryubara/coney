- name: PlayMovie
  wrapper: 0x0036c258
  calls:
    - {addr: 0x0042a938, name: Movie_Play}
  args:
    - {name: name, lua: string, desc: "Movie name, the file `PSS/<name>.BIK` (level100 passes `TRAILER` or `L1_IN`; the 16 movies are on [Movies](../../research/movies.md#the-movies))."}
    - {name: skippable, lua: boolean, default: true, desc: "Whether any pad button ends the movie early ([Movies](../../research/movies.md#skipping)); default true."}
  description: >-
    Plays a full-screen Bink movie and returns when it ends or is skipped. Around it the music and sounds are stopped
    and the screen blacked; when the loaded level's Subtitles chunk has captions for `<name>_sub`, the scene
    `<name>_sub.scn` times them and they show if the subtitle option is on. The front end uses it for the trailer
    (EXTRAS) and the attract movie.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    The wrapper reads the flag as a number, default 1, and passes flag != 0. The movie player (0x0042a938) stops
    the music and sounds first; it looks for `<name>_sub.scn` only when a level's Subtitles chunk is loaded (the
    global 0x0050ea74; the subtitle option is read when drawing). On return it sets both screen-effects managers fully
    black, so the screen stays black until a fade in ([Front end](../../research/frontend.md#movies)). The C++ code
    calls Movie_Play itself for the boot movies (LOGO cannot be skipped) and the levels' intro and outro movies.
    Nothing else in the game runs while a movie plays.
  usage: {chunks: 1, calls: 1, boot: true, mission1: false, result_used: false}
  coney: partial
