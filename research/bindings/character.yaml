- name: HuTagPattern
  wrapper: 0x0035cdc8
  calls:
    - {addr: 0x00239188, name: Tag_SetPattern}
  args:
    - {name: count, lua: number, ctype: unsigned, desc: "Number of points in the pattern."}
    - {name: points, lua: table, elem: number, count: 256, written_back: true, desc: "The pattern's points as a flat list of numbers (x1, y1, x2, y2, ...); the wrapper reads 256 entries and writes them back, but only the first 128 (64 points) are copied."}
  description: >-
    Loads the stick pattern for the next spray tag: `count` goes to 0x00510914 and 64 (x, y) pairs to 0x006cd978.
    `global.lua`'s tag helper calls it before HuTag. The player follows the pattern with the analog stick (inferred).
  evidence: confirmed-code
