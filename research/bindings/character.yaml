    - {name: listener, lua: number, ctype: unsigned, default: 4294967295, desc: "Optional handle of a human to look at while speaking. Default NilHandle."}
  description: >-
    Like HuSpeak, but it cuts a line started by HuSpeak (stopping it, whose callback is then lost) and its own line
    cannot be cut: while a HuSpeakNI line plays, another HuSpeakNI or HuSpeak on that human is dropped and its
    callback runs at once, and HuShutUp without force does not stop it. The callback runs on the human's first update
    after the line's sound has finished (the stream's handle no longer resolves), so at the end of the sample, and also
    after a forced HuShutUp. A missing human or line, speech off for the human or muted by a scene runs the callback
    at once, inside the call. The most used speech binding in the scripts.
