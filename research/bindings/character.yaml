- name: WCLockCommands
  wrapper: 0x00374970
  calls:
    - {addr: 0x0041dcf0, name: GameState_LockWarriorCommands}
  args:
    - {name: player, lua: number, ctype: unsigned, desc: "Handle of a player's human (the war chief)."}
    - {name: locked, lua: boolean, desc: "true sets the byte (the crew no longer turns on its chief); false clears it."}
  description: >-
    Writes the byte at game state `+0x418` + the player's index. Its only reader is the Warrior brain's reaction to
    being hit by its chief (0x00306190): while the byte is clear, a Warrior hit by the chief four times within 10 s
    turns on him for 20 s, his current command is forced back to follow and his command menu is locked (`+0x42e`).
    Setting the byte switches that reaction off; it does not itself lock the command menu.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    The name suggests a menu lock, but no code reads the byte for the menu. Cleared at a level reset (0x00418c68).
    The 20 s retaliation is 0x002aeda0 (inferred: a fight goal against the chief). A non-player handle writes
    outside the two bytes. The second hit is enough when the chief's brain byte `+0x2e4` is set; a Warrior already
    fighting ignores the hits.
  usage: {chunks: 10, calls: 16, boot: false, mission1: false, result_used: false, levels: [80, 93, 55]}
  coney: implemented

