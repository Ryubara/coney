- name: HuIsAimingAt
  wrapper: 0x00358f50
  calls:
    - {addr: 0x0023a468, name: Human_IsAimingAt}
  args:
    - {name: human, lua: number, ctype: unsigned, desc: "Handle of a player's human."}
    - {name: target, lua: number, ctype: unsigned, desc: "Handle of the object (or human) to test."}
  results:
    - {lua: boolean, desc: "true when the human is a player and the target is the object its throw aim last landed on (human `+0x634`); nil otherwise."}
  description: >-
    Tells whether a player aiming a throw would hit the given object. While a player is in the throw control
    (0x00244770) the aim trace 0x0018fee0 follows the throw's arc and stores the first object it meets at human
    `+0x634`; this compares that with `target`. Level scripts use it to react when the player lines up a throw at a
    particular object.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    Always false for a non-player (`+0x1b0` = -1) or an invalid target. `+0x634` is written only by the aim trace
    (and cleared by `Human_Init`), so it keeps the last aimed object after the aim ends.
  usage: {chunks: 1, calls: 2, boot: false, mission1: false, result_used: true, levels: [80]}
  coney: implemented

