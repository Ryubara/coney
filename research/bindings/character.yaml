    The copy is confirmed (code) at 0x00274188. TagGame_Init (0x002741d8) samples the points along a uniform
    Catmull-Rom curve (0x00273ff0, end points clamped), ⌊300 / count⌋ samples a segment at t = k · count / 300, and
    keeps a sample whose squared distance from the last kept is over 6. Each value is truncated and its low byte
    kept, so x and y are cells of the 256 × 256 grid (0-255), unscaled (crimes.md#tagging). That the player traces
