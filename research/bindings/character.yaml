- name: HuSetWheelchairControl
  wrapper: 0x003588d0
  calls:
    - {addr: 0x00234188, name: Human_SetWheelchairControl}
  args:
    - {name: human, lua: number, ctype: unsigned, desc: "Handle of the player human."}
    - {name: "on", lua: boolean, desc: "true switches the player to wheelchair control; false switches back."}
  description: >-
    Switches a player between normal and wheelchair control. On: state flag 0x80000000000, the current control
    saved and replaced by `wheelchairControl` (0x002427e8), every other player command off and commands 46 (L1) and
    47 (R1) added; the look-behind switch 11 goes to 0. Off undoes it. In the chair L1 and R1 together push forward
    (+0.5 an update up to the sprint speed), one alone turns (L1 left, R1 right, 0.08 rad an update at a standstill
    down to 0.03 at top speed) while the speed decays by 0.04, cross brakes (−0.5), and the sticks do nothing
    ([Characters: wheelchair control](../../research/characters.md#wheelchair)).
  evidence: confirmed-code
  depth: thorough
  notes: >-
    A human that is not pad-driven (per-player record `+0x1b` 0, inferred) runs its normal control even with the
    flag, so the Rumble CPU follows its path as usual.
  usage: {chunks: 1, calls: 3, boot: false, mission1: false, result_used: false}
  coney: implemented

- name: HuSetButtonTapControl
  wrapper: 0x00358930
  calls:
    - {addr: 0x00234318, name: Human_SetButtonTapControl}
    - {addr: 0x00242ce0, name: Human_ButtonTapMove}
  args:
    - {name: human, lua: number, ctype: unsigned, desc: "Handle of a player's human; a bad handle does nothing."}
    - {name: enable, lua: boolean, desc: "true starts the tap control, false ends it and gives the commands back."}
    - {name: points, lua: table, elem: number, count: 16, written_back: true, desc: "Up to 16 handles (flags or objects) the human is driven through in order, ended by NilHandle (missing entries read as NilHandle); written back unchanged."}
    - {name: target, lua: number, ctype: unsigned, desc: "Handle of the object being pushed (the bus in the scripts), kept at human `+0x6bc`."}
  description: >-
    Puts a player's human under button-tap control, as when the Warriors push a bus: its other commands are disabled,
    command 45 (0x2d) is added, state bit 0x100000000000 is set and its movement handler becomes 0x00242ce0. Each update
    the human turns toward the current point (at its turn rate) and moves at its top speed scaled by how fast the
    button is tapped: full when presses come at most 2 frames apart, falling by 1/8 per extra frame to nothing at 10.
    Within 1 m of a point it moves to the next; when the points run out or the human is down, the control ends and the
    commands come back. `enable` false ends it at once, keeping command 45 only for the other player in two-player play.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    Which pad button command 45 is bound to (inferred: cross) and what reads `+0x6bc` are not traced. Calling it with
    true while the control is already on does nothing.
  usage: {chunks: 3, calls: 19, boot: false, mission1: false, result_used: false, levels: [81, 51, 84]}

