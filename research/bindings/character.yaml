- name: HuCreate
  wrapper: 0x00358428
  calls:
    - {addr: 0x00233d60, name: Human_Create}
  args:
    - {name: name, lua: string, desc: "The human's name (15 characters kept); HuFind and scripts use it."}
    - {name: type, lua: number, ctype: int, desc: "Character type id, the CfgChar record (32 Rembrandt, 40 Ash); remapped to a behaviour class at creation."}
    - {name: pos, lua: table, elem: number, count: 3, written_back: true, desc: "Position {x, y, z} in metres, game axes with z up; written back with the ground-snapped position."}
    - {name: heading, lua: number, ctype: float, desc: "Facing in degrees, a rotation about the vertical axis."}
    - {name: unused, lua: string, desc: "A string the scripts pass (\"warr_sw\", \"warr_cl\", nil); not read by Human_Create."}
    - {name: player, lua: number, ctype: int, desc: "Player index: 0 for an AI human, 1 for player 1 (takes pad 1, the HUD and the camera), 2 for player 2."}
    - {name: gang, lua: number, ctype: int, desc: "Gang id (as returned by GangCreate) the human belongs to."}
    - {name: flag, lua: boolean, desc: "Stored at +0x19d of the human; the Rumble scripts pass true. Meaning not traced."}
  results:
    - {lua: number, desc: "The new human's handle, or NilHandle when no slot is free (60 humans at most)."}
  description: >-
    Creates a human (character) in the world, snaps it to the ground and, for a player index of 1, makes it player 1's
    character. This is how every level script puts the Warriors, enemies and civilians into the world.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    Steps and offsets: Characters, creation. The model loads later if its files are not yet resident.
  usage: {chunks: 100, calls: 3411, boot: false, mission1: true, result_used: true}
  coney: implemented

- name: HuDelete
  wrapper: 0x00358608
  calls:
    - {addr: 0x00233ef0, name: Human_Delete}
  args:
    - {name: human, lua: number, ctype: unsigned, desc: "Handle of the human to remove."}
  description: >-
    Takes a human out at once: sets its record's dead flag (`0x200000000`), clears its record `+0xcc` handle and has
    its world object run its per-slot method for all 26 slots (0x003858b8), with no death animation or event of its
    own.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    What the object's slot method (vtable +0x0c, called with 0-25) does is not traced; that the dead flag makes the
    human update remove it is inferred. Contrast `HuKill`, which kills through the damage path. Record flags:
    [Characters](../../research/characters.md#the-record).
  usage: {chunks: 80, calls: 213, boot: false, mission1: false, result_used: true}

- name: HuKill
  wrapper: 0x00358640
  calls:
    - {addr: 0x00237e70, name: Human_Kill}
  args:
    - {name: human, lua: number, ctype: unsigned, desc: "Handle of the human; not checked, so pass a live handle."}
  description: >-
    Kills a human through the damage path: unless it is already dead or flagged `0x80000000`, it drops what it holds
    (0x00258330), its health is set to 1 and 100 damage is left pending (record `+0x118`, human `+0x5d2`), so the
    next damage update finishes it with the usual death.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    The handle is not checked for being a human. That the pending damage is applied on the next update is from the
    damage page ([Combat](../../research/combat.md#damage)); the outcome (knock-out or death) follows the usual rules
    (inferred).
  usage: {chunks: 29, calls: 46, boot: false, mission1: false, result_used: false}

