  args:
    - {name: human, lua: number, ctype: unsigned, desc: "Handle of the human."}
    - {name: block, lua: boolean, desc: "true stops the human turning its head toward things; false lets it again."}
  description: >-
    Sets or clears flag `0x1000` of the human's flag word (`+0xe0`). Each update the head-look (0x00248428) turns
    the head toward the current look-at target (up to 55° sideways, 90° for some requests, and 45° up or down) only
    when 0x002482e0 allows it, and that refuses while `0x1000` is set, so the head is left as it is. Scripts set it
    on characters posed for a scene or a conversation.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    `HuForceLook` (`0x10000`) overrides it: the check is skipped. A dead human and two other states (0x00228070,
    0x00228090) never turn the head either way.
  usage: {chunks: 46, calls: 127, boot: false, mission1: false, result_used: false, levels: [80, 87, 95, 86, 93, 82, 92]}
  coney: implemented

