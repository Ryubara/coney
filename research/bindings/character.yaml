    Human_PlaySpeechCutting (0x0021e698) refuses when the current line (+0x178) is alive and the cut-able byte +0x194
    is 0, else stops it (Human_StopSpeech(h, 0), which acts only when +0x194 is set), stores the callback (+0x188)
    and its argument (+0x190) and clears +0x194. HuSpeak (0x0021e400) plays only when no line is alive and +0x194 is
    set, and leaves +0x194 set. Human_UpdateSpeech (0x0021e940) runs the callback once when the handle dies and sets
    +0x194 again one update later, so a HuSpeak called from inside a HuSpeakNI callback is dropped (its callback runs
    at once) while a HuSpeakNI there plays. 'NI' read as 'no interrupt' (speculative).
