- name: random
  wrapper: 0x0036dfc8
  calls:
    - {addr: 0x00386488}
  args:
    - {name: low, lua: number, ctype: int, desc: "Lowest value."}
    - {name: high, lua: number, ctype: int, desc: "Highest value."}
  results:
    - {lua: number, desc: "A whole number in [low, high], both included: low + (the next entry of a 1,024-entry table at `0x005117e0`) mod (high - low + 1), unsigned."}
  description: >-
    Returns a random whole number in a range; replaces the math library's `random`.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    The generator's state is only the table index at `0x006eb880` (advanced by 1, masked to 10 bits, per draw),
    zeroed at start-up and never seeded; C++ code draws from the same index. A test mode should seed Coney's own
    generator.
  usage: {chunks: 111, calls: 343, boot: true, mission1: true, result_used: true, levels: [80, 87, 95, 34, 2, 3, 5, 81, 86, 93, 31, 14, 9, 51, 52, 54, 55, 84, 82, 92, 83, 20, 11]}
  coney: implemented
