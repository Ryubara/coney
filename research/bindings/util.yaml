- name: GetPosition
  wrapper: 0x0036ca18
  calls:
    - {addr: 0x00385a50}
  args:
    - {name: object, lua: number, ctype: unsigned, desc: "Handle of a human or any other object."}
  results:
    - {lua: usertype, desc: "An `M_Vector4` (x, y, z, w) with the position in world units; the origin vector when the handle is bad."}
  description: >-
    Returns an object's position. For a human it is the character's position, for other objects their vtable position.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    The vector is one static buffer (`0x006ebd20`): every call overwrites it, so copy x, y, z before calling again.
  usage: {chunks: 71, calls: 193, boot: true, mission1: false, result_used: true, levels: [80, 87, 95, 34, 2, 3, 5, 81, 86, 93, 31, 14, 9, 51, 52, 54, 55, 84, 82, 92, 83, 20, 11]}
  coney: implemented

- name: TestDistance
  wrapper: 0x0036ce58
  calls:
    - {addr: 0x00385ea8}
  args:
    - {name: a, lua: number, ctype: unsigned, desc: "First object handle."}
    - {name: b, lua: number, ctype: unsigned, desc: "Second object handle."}
    - {name: distance, lua: number, ctype: float, desc: "Distance in world units (metres)."}
  results:
    - {lua: boolean, desc: "true if the objects are closer than `distance`; false otherwise or when a handle is bad."}
  description: >-
    Tests whether two objects are closer than a distance: both handles are resolved (a bad one gives false), their
    positions read, and the squared distance compared with the squared limit, so exactly at the limit counts as not
    closer.
  evidence: confirmed-code
  depth: thorough
  usage: {chunks: 16, calls: 38, boot: true, mission1: false, result_used: true, levels: [80, 87, 95, 34, 2, 3, 5, 86, 93, 31, 14, 9, 51, 52, 54, 55, 82, 92, 83, 20, 11]}
  coney: implemented

