# The Warriors' script bindings, category `util`: one entry per Lua global the game registers.
# Schema: docs/guides/research-workflow.md#bindings. docs/references/bindings/ is generated from these
# files by `coney-tools natives render`; edit them here, then render.

- name: GetRTTI
  wrapper: 0x0036c888
  calls:
    - {addr: 0x00385950, name: Object_GetTypeBits}
  args:
    - {name: object, lua: number, ctype: unsigned, desc: "Any object handle."}
  results:
    - {lua: number, desc: "The object's type bits with bit 0x2 cleared, as an unsigned number; 0 for a bad handle. 0x40 marks a human, 0x80 a flag, 0x10 a tag, 0x08 a dynamic (prop) object."}
  description: >-
    Returns an object's run-time type bits, the word its vtable slot `+0x24` gives, which the game's own casts test
    (a human 0x40 at 0x00229868, a flag 0x80 at 0x00417a60, a prop 0x08 at 0x00395f38, a tag 0x10 in ProcessTag). A
    script tests one bit to learn what kind of object a handle names.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    An object can carry several bits (a class's bits include its base classes', inferred). Why bit 0x2 is masked
    off is not traced.
  usage: {chunks: 2, calls: 3, boot: false, mission1: false, result_used: true, levels: [34, 81]}

