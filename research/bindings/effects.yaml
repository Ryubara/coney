- name: EnableHeat
  wrapper: 0x00368278
  calls:
    - {addr: 0x0018dcc0, name: ScreenFx_EnableHeat}
    - {addr: 0x0018b7d0}
    - {addr: 0x0018b950}
  args:
    - {name: enable, lua: boolean, desc: "True switches both views to look 7 (heat); false ends it and returns to the base look."}
  description: >-
    Switches the heat look (screen-effects look 7, [Screen effects](../../references/screen-effects.md#fx-look-7)) on
    or off on both screen-effects managers. On, each view makes look 7 current and blends its tint and motion-blur
    strength to look 7's over look 7's in time (default 1 s); off, it goes back to the base look (the level colour,
    look 9, or the store look) over look 7's out time (default 5 s).
  evidence: confirmed-code
  depth: thorough
  notes: >-
    What the player sees is whatever look 7 holds: its defaults (no tint, blur 1) can be changed by CfgScrFx before.
    No distortion pass of its own was found; the "heat" is the tint and blur blend (inferred from 0x0018b7d0).
  usage: {chunks: 1, calls: 3, boot: false, mission1: false, result_used: false, levels: [93]}

- name: ScreenQueueEffect
