- name: StartRain
  wrapper: 0x00368670
  calls:
    - {addr: 0x0018dda0, name: ScreenFx_StartRain}
    - {addr: 0x0018bae0}
    - {addr: 0x00199ba8}
    - {addr: 0x00199e50}
    - {addr: 0x0019a8e0}
  args:
    - {name: texture1, lua: number, ctype: unsigned, desc: "Sprite word of the near rain layer's texture: sheet in the top 16 bits, rectangle in the low ([Particles: sprite words](../../research/particles.md#sprite-words))."}
    - {name: tilesV1, lua: number, ctype: unsigned, desc: "How many times the texture repeats down the screen (byte; scripts use 1 or 2)."}
    - {name: tilesU1, lua: number, ctype: unsigned, desc: "How many times it repeats across the screen (byte; scripts use 6 or 7)."}
    - {name: driftU1, lua: number, ctype: float, desc: "Sideways scroll per frame in texture widths (0.01-0.015 in the scripts: a slant)."}
    - {name: fallV1, lua: number, ctype: float, desc: "Downward scroll per frame in texture heights (0.07-0.3: the fall speed)."}
    - {name: colour1, lua: table, elem: number, count: 4, written_back: true, desc: "Layer 1 colour `{r, g, b, a}`, 0-255 (the alpha sets how heavy it looks)."}
    - {name: texture2, lua: number, ctype: unsigned, desc: "Sprite word of the second (far) layer's texture."}
    - {name: tilesV2, lua: number, ctype: unsigned, desc: "Vertical repeats of layer 2."}
    - {name: tilesU2, lua: number, ctype: unsigned, desc: "Horizontal repeats of layer 2."}
    - {name: driftU2, lua: number, ctype: float, desc: "Sideways scroll per frame of layer 2."}
    - {name: fallV2, lua: number, ctype: float, desc: "Downward scroll per frame of layer 2."}
    - {name: colour2, lua: table, elem: number, count: 4, written_back: true, desc: "Layer 2 colour `{r, g, b, a}`, 0-255."}
  description: >-
    Starts the rain effect (screen-effects layer 0, `OE_Rain`) on both views, or changes its settings when it is
    already running. Each layer is a textured sheet drawn over the view (and on every rain plane from
    SpawnRainPlane) whose texture coordinates span `tilesU × tilesV` repeats and scroll each frame by
    `(driftU, fallV)`, wrapping at 1, so the streaks fall and slant. It also switches on the ground splashes that
    CfgRaindrops configures.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    Scrolling is per rendered frame, not per second. The sheet's size follows a fixed field-of-view scale (1.7, 2.0
    in one display mode, times 1.15 in one game state, 0x0019a8e0). EndRain stops it. The colour tables are written
    back as read.
  usage: {chunks: 10, calls: 22, boot: false, mission1: false, result_used: false, levels: [93, 51, 82, 61, 64]}

