- name: Start3DFog
  wrapper: 0x00369140
  calls:
    - {addr: 0x0018e148, name: Fog3D_Start}
    - {addr: 0x003cadd8}
  args:
    - {name: texture, lua: number, ctype: unsigned, desc: "Sprite word of the fog wisp image: sheet-table record in the top 16 bits, rectangle in the low 16. 15 of the 17 calls pass 34734080 (0x2120000): record 530, the sheet `part_fog_00`; the other two 34799616 (0x2130000): record 531, `part_fog_01`; each one 64 × 64 texture, rectangle 0."}
    - {name: colour, lua: table, elem: number, count: 4, written_back: true, desc: "Wisp colour `{r, g, b, a}`, 0-255; alpha is the opacity a wisp fades in to. Written back unchanged."}
    - {name: drift, lua: number, ctype: float, desc: "Speed each wisp drifts at, metres per second (× 1.75-2.25 at random), toward the player's camera with a sideways spread of up to ±2 m along the camera's x axis; scripts use 0.4-4.6."}
    - {name: fadeSpeed, lua: number, ctype: float, desc: "Sets the fade-in length: 9 / fadeSpeed steps (at least 1); scripts use 0.3-1."}
    - {name: fadeRate, lua: number, ctype: float, desc: "Whole-number multiplier on the opacity added per fade step; scripts use 1-7."}
  description: >-
    Starts drifting ground fog for each player's view: for both screen-effects managers it kills any fog emitter
    (message 0x15) and creates a `part_fog` emitter (template 0x00552fb8). Every 5 frames the emitter tops its
    viewport up to 20 live wisps (`sub_fog`, up to 10 at a time), placed at random within 20 m of the camera's target
    and 0.5-2 m above it, each drifting toward the camera and fading in to the colour's alpha. Details:
    [Particles, Drifting fog](../../research/particles.md#fog).
  evidence: confirmed-code
  depth: thorough
  notes: >-
    Wisps are dropped when their viewer is more than 20 m away or a near test fails, and hidden within 4 m.
    MaxFogParticles changes the 20. The three numbers' visible effect is read from `sub_fog`'s init (0x003ca658) and
    update (0x003ca9d8); units are not runtime-checked. Arguments renamed from size, speed, height.
  usage: {chunks: 17, calls: 17, boot: false, mission1: false, result_used: false, levels: [87, 34, 81, 93, 9, 51]}
  coney: implemented

