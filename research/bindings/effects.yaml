- name: SpawnRainPlane
  wrapper: 0x00368990
  calls:
    - {addr: 0x0018dd38, name: ScreenFx_SpawnRainPlane}
    - {addr: 0x0018be58}
    - {addr: 0x0019a780}
    - {addr: 0x0019a8e0}
  args:
    - {name: corner, lua: table, elem: number, count: 3, written_back: true, desc: "First corner `{x, y, z}` of the rain sheet in world metres."}
    - {name: cornerU, lua: table, elem: number, count: 3, written_back: true, desc: "The corner along the sheet's width."}
    - {name: cornerV, lua: table, elem: number, count: 3, written_back: true, desc: "The corner along the sheet's height; the three corners also give the side it is seen from."}
    - {name: uv0, lua: table, elem: number, count: 2, written_back: true, desc: "Read and written back but not used: the sheet takes its texture coordinates from the rain layer (scripts pass `{0, 0}`)."}
    - {name: uv1, lua: table, elem: number, count: 2, written_back: true, desc: "Read and written back but not used (scripts pass `{1, 1}`)."}
  description: >-
    Adds a world-space sheet of falling rain (for doorways, windows and awnings) to a list of at most 25 kept at
    0x005fdec0; further calls do nothing. While StartRain is running and the overlay is switched to world sheets
    (rain object `+0x90`), each sheet whose front faces the camera (normal `(cornerU - corner) × (cornerV - corner)`)
    is drawn with both rain layers' textures, scrolling with them.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    The record is 0x28 bytes and only its three corners are written; the draw also reads `+0x24` (compared with 12 to
    halve the repeats), left unset here. What sets rain object `+0x90` (inferred: the camera under cover) is not
    traced. The rain copies the list when it is created (0x00199ba8), so sheets added while it runs are drawn only after EndRain and a new StartRain.
  usage: {chunks: 3, calls: 27, boot: false, mission1: false, result_used: false, levels: [93, 51, 82]}

