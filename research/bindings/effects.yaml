- name: ScreenQueueEffect
  wrapper: 0x003682a8
  calls:
    - {addr: 0x0018b168, name: ScreenFx_Queue}
  args:
    - {name: effect, lua: number, ctype: int, desc: "Effect type 0-5 ([Screen effects](../screen-effects.md#queue)): 0 fades in from black, 1 fades out to black, 2 and 3 bring the letterbox in and out, 4 and 5 start and end the blur pulse. Values 6 and above do nothing."}
    - {name: seconds, lua: number, ctype: float, desc: "Duration in seconds (0 makes the change immediate)."}
  description: >-
    Queues a full-screen effect, usually a fade, on both screen-effects managers. A running fade blocks some menu
    input and is what the front end waits on ([Front end](../../research/frontend.md#profile-manager)).
  evidence: confirmed-code
  depth: thorough
  notes: >-
    Dispatch is a six-entry jump table at 0x00552f70 (0x0018d450); each type is described on
    [Graphics](../../research/graphics.md#screen-effects). A fade out of more than 0.2 s runs over seconds - 0.2; a fade
    in starts at full black; the level is clamped to 0-1 ([Front end](../../research/frontend.md#fades)).
  usage: {chunks: 169, calls: 660, boot: true, mission1: true, result_used: false, levels: [80, 87, 95, 34, 2, 3, 5, 81, 86, 93, 31, 14, 9, 51, 52, 54, 55, 84, 82, 92, 83, 20, 11, 60, 61, 62, 63, 64]}
  coney: implemented

