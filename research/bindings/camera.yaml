- name: CamSetFollowHeading
  wrapper: 0x00365b80
  calls:
    - {addr: 0x0011c2f0, name: Camera_SetFollowHeading}
  args:
    - {name: degrees, lua: number, ctype: float, desc: "Heading of the camera in degrees about the followed character, measured from the character's facing (as `CameraReset` uses 180 to put the camera behind)."}
  description: >-
    Snaps every player's follow camera round its target to the given heading with no blend: player 1's camera is
    snapped (its previous look-at points set to the current one) and each follow camera is then placed at that
    heading at a distance chosen from the zoom band, the same placement as `CameraReset` (0x00124f38). Level scripts
    use it to set the opening view.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    Does nothing when player 1 has no follow camera yet (0x0011f9e0(0, 0)). Players 2 and up (count `W_GameState+0x224`)
    are placed without the snap. With no target the heading is measured from the world's forward axis. The
    "from the character's facing" reading is inferred from 0x001250a8; distance rule and pitch reset:
    [Camera](../../research/camera.md#setting-up).
  usage: {chunks: 68, calls: 85, boot: false, mission1: false, result_used: false, levels: [80, 87, 5, 81, 93, 51, 52, 55, 82, 92, 83, 20, 11]}

