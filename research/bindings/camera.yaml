- name: CamSetupPoizo
  wrapper: 0x00366c80
  calls:
    - {addr: 0x0011c9e0, name: Camera_SetupPoizo}
    - {addr: 0x00142368}
  args:
    - {name: camera, lua: number, ctype: unsigned, desc: "The camera the path starts from: its position and orientation become point 0, and its lens is the default."}
    - {name: seconds, lua: number, ctype: float, desc: "Time in seconds to travel from that start view to the first point added with CamAddPoizoPoint."}
    - {name: onEnd, lua: string, desc: "Name of the Lua function called (with no arguments) when the path reaches its last point, or nil."}
    - {name: fov, lua: number, ctype: float, desc: "Field of view in degrees for the path; 0 takes the start camera's."}
    - {name: far, lua: number, ctype: float, desc: "Far clip distance in metres, capped at 150; 0 takes the start camera's."}
    - {name: human, lua: number, ctype: unsigned, default: 4294967295, desc: "Optional player human: if `camera` is a follow, rail or hood camera of the other player, that kind of camera of this human's player is used as the start instead."}
  results:
    - {lua: number, desc: "Handle of the path camera (type 3, one shared instance), or NilHandle if it could not be made."}
  description: >-
    Starts a scripted camera path (the `Poizo` camera, type 3) from an existing camera's view, clearing any earlier
    points. Add up to seven more points with CamAddPoizoPoint / CamAddPoizoPointCam, then make the returned camera
    active (CameraMakeActive): the camera flies through the points along a Catmull-Rom curve, turning by slerp between
    their orientations, and calls `onEnd` at the last one.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    Update `PoizoCam_Update` (0x001426c0) runs only while the camera is player 0's current camera and was activated
    (`+0x33c`); it does not return to another camera by itself (only a reversed path, CamReversePoizo, blends back to
    the start camera). At most 8 points (`PoizoCam_AddPoint` 0x00142a58); further points overwrite the last.
  usage: {chunks: 7, calls: 7, boot: false, mission1: false, result_used: true, levels: [87, 3, 14, 9, 55, 83]}

