- name: CameraCreateThird
  wrapper: 0x00365f28
  calls:
    - {addr: 0x0011be18, name: Camera_CreateThird}
    - {addr: 0x001207b0, name: Cam3rdPerson_SetAngle}
    - {addr: 0x001205e8, name: Cam3rdPerson_Update}
  args:
    - {name: name, lua: string, desc: "Camera name (passed to the camera factory)."}
    - {name: target, lua: number, ctype: unsigned, desc: "Handle of the human (or object) to follow, kept at camera `+0x1e0`; a bad handle makes nothing."}
    - {name: fov, lua: number, ctype: float, desc: "Field of view in degrees (vtable slot `+0x194`)."}
    - {name: distance, lua: number, ctype: float, desc: "Metres behind the target's facing (`+0x210`; default 5.1)."}
    - {name: height, lua: number, ctype: float, desc: "Metres above the look-at point (`+0x214`; default 1.8)."}
    - {name: angle, lua: number, ctype: float, desc: "Degrees the camera is swung about the vertical through the look-at point (a quaternion at `+0x1f0`); 0 is straight behind."}
    - {name: offset, lua: table, elem: number, count: 3, written_back: true, desc: "Look-at offset {x, y, z} in metres, in the target's frame (`+0x220`; default (0, 0, 1.5)); written back unchanged."}
    - {name: near, lua: number, ctype: float, desc: "Near clip distance in metres (slot `+0x1a4`)."}
    - {name: far, lua: number, ctype: float, desc: "Far clip distance in metres, capped at 150 (slot `+0x1ac`)."}
  results:
    - {lua: number, desc: "The new camera's handle, or NilHandle when the target is bad or no camera could be made."}
  description: >-
    Creates a third-person camera (type 16, `Cam_3rdPerson`) on a target: each update its look-at point is the
    target's position plus `offset`, its orientation eases 10% toward the target's, and it sits `distance` behind
    that orientation and `height` above, swung by `angle` round the look-at point. Used for the chase and the
    Chatterbox shots; it is not made current here.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    The camera is not added to the shared target list, and CamDelete does not delete type 16. Created by the factory
    0x0011e1b0 with player 0; shake is applied (0x00121298) with no position offset.
  usage: {chunks: 2, calls: 3, boot: false, mission1: false, result_used: true, levels: [3, 81]}

- name: CameraCreateFixed
  wrapper: 0x00366140
  calls:
    - {addr: 0x0011c6b8, name: Camera_CreateFixed}
    - {addr: 0x001222b0, name: CameraTargets_Add}
    - {addr: 0x00124690, name: CamFixed_Update}
    - {addr: 0x00124000, name: CamFixed_ComputeLookAt}
  args:
    - {name: name, lua: string, desc: "Camera name (passed to the camera factory)."}
    - {name: target, lua: number, ctype: unsigned, desc: "Handle of a human added to the shared camera target list (as CamTarget mode 0) if it is not there and the list has room (4); a bad handle makes nothing."}
    - {name: pos, lua: table, elem: number, count: 3, written_back: true, desc: "Camera position {x, y, z} in metres (placed through slot `+0x1bc`); written back unchanged."}
    - {name: fov, lua: number, ctype: float, desc: "Field of view in degrees (slot `+0x194`)."}
    - {name: offset, lua: table, elem: number, count: 3, written_back: true, desc: "Offset {x, y, z} in metres added to the look-at point (`+0x1e0`); written back unchanged."}
    - {name: near, lua: number, ctype: float, desc: "Near clip distance in metres (slot `+0x1a4`)."}
    - {name: far, lua: number, ctype: float, desc: "Far clip distance in metres, capped at 150 (slot `+0x1ac`)."}
  results:
    - {lua: number, desc: "The new camera's handle, or NilHandle when the target is bad or no camera could be made."}
  description: >-
    Creates a fixed camera (type 0, `Cam_Fixed`) at `pos` that turns each update to look at the shared camera target
    list: the average position of the listed humans that still count, plus `offset`. The target is put on that list
    rather than stored in the camera, so the camera also frames every other listed human (normally the players). It
    is not made current here.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    With an empty list the camera keeps its last view; when two list counters are equal (0x0050b198 == 0x0050b19c)
    it looks at one chosen entry instead of the average. The target stays on the list after the camera is gone.
  usage: {chunks: 9, calls: 12, boot: false, mission1: false, result_used: true, levels: [3, 81, 51, 52, 54, 55, 84]}

