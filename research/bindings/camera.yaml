  args:
    - {name: name, lua: string, desc: "Camera name."}
    - {name: target, lua: number, ctype: unsigned, desc: "Handle of the human to follow; a bad handle makes nothing and returns NilHandle."}
    - {name: fov, lua: number, ctype: float, desc: "Field of view in degrees."}
    - {name: offset, lua: table, elem: number, count: 3, written_back: true, desc: "Look-at offset {x, y, z} in metres from the target (`+0x320`); its z is also the starting value of CamModifyRail setting 9. Written back unchanged."}
