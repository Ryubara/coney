- name: CameraSetClipping
  wrapper: 0x00365600
  calls:
    - {addr: 0x0011bb98, name: Camera_SetClipping}
  args:
    - {name: camera, lua: number, ctype: unsigned, desc: "Camera handle (from `CamSetupFollow`, `CameraCreate...` or `CameraGet...`)."}
    - {name: near, lua: number, ctype: float, desc: "Near clip distance in metres; ignored for a follow camera (type 2), which keeps its 0.1."}
    - {name: far, lua: number, ctype: float, desc: "The camera's own far clip in metres, capped at 150 (the player camera's default is 115)."}
  description: >-
    Sets a camera's near clip (`+0x50`) and its own far clip (`+0x54`). The far clip is the ceiling of the draw
    distance, which the world renderer moves each frame between `60 - 10 × views` and it as the scenery streams in,
    so levels use it to set how far the player can see; fog starts at a fraction of the draw distance
    (`SetFogDistance`).
  evidence: confirmed-code
  depth: thorough
  notes: >-
    Setters are camera slots `+0x1a4` (near) and `+0x1ac` (far). The camera's type (slot `+0x1ec`) is read before
    the handle is checked, so an invalid handle crashes. Draw distance: [The streamed
    world](../../research/world.md#a-frame).
  usage: {chunks: 19, calls: 23, boot: false, mission1: false, result_used: false, levels: [80, 87, 95, 2, 81, 86, 93, 14, 9, 51, 52]}

- name: CameraMakeActive
  wrapper: 0x003656a0
  calls:
    - {addr: 0x0011b770, name: Camera_MakeActiveByHandle}
  args:
    - {name: camera, lua: number, ctype: unsigned, desc: "Handle of the camera to make current."}
    - {name: seconds, lua: number, ctype: float, desc: "Blend time from the current camera in seconds; 0 switches at once."}
    - {name: name, lua: string, desc: "Optional string given to the camera (scripts pass nil); its use is not traced."}
    - {name: forHuman, lua: number, ctype: unsigned, default: 4294967295, desc: "Optional human whose player gets the camera (default NilHandle: the camera's own player)."}
    - {name: fromHuman, lua: number, ctype: unsigned, default: 4294967295, desc: "Optional human whose player's previous camera is the blend source (default: the same player)."}
  description: >-
    Makes a camera the current camera of a player, blending from the previous one over the given time: a linear blend
    of position and look-at point and a slerp of the orientation from the previous view to the new camera's live view,
    which becomes current directly when the time is up. While a scene camera is current it replaces the camera the
    scene returns to instead. See [Camera](../../research/camera.md#blends).
  evidence: confirmed-code
  depth: thorough
  usage: {chunks: 193, calls: 629, boot: true, mission1: true, result_used: false, levels: [80, 87, 95, 34, 2, 3, 5, 81, 86, 93, 31, 14, 9, 51, 52, 54, 55, 84, 82, 92, 83, 20, 11, 60, 61, 62, 63, 64]}
  coney: implemented

