- name: CamDelete
  wrapper: 0x00365818
  calls:
    - {addr: 0x0011b888, name: Camera_DeleteScripted}
    - {addr: 0x0011e440, name: Camera_Release}
  args:
    - {name: camera, lua: number, ctype: unsigned, desc: "Handle of a fixed (type 0, CameraCreateFixed) or locked (type 1, CameraCreateLocked) camera; any other camera or handle is ignored."}
  description: >-
    Deletes a camera made by CameraCreateFixed or CameraCreateLocked; the shared kinds (follow, path, blend, rail and
    the others) are kept. If it is a player's current camera, that player is left with no current camera until a
    script makes another active; if a blend refers to it, the reference is cleared.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    `Camera_Release` (with 0) refuses a camera that is a player's previous camera (`0x005d9148[i]`), so deleting the
    camera just switched away from does nothing; type 16 (CameraCreateThird) is not deletable this way.
  usage: {chunks: 57, calls: 90, boot: false, mission1: false, result_used: true, levels: [87, 95, 2, 3, 5, 81, 93, 9, 51, 54, 84, 92, 11]}

