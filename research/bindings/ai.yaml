- name: SetInterrogateParam
  wrapper: 0x0035d808
  calls:
    - {addr: 0x002854b0, name: Brain_SetInterrogateOverride}
  args:
    - {name: valueA, lua: number, ctype: unsigned, desc: "First byte-sized tuning value (0-255). The game's own defaults put 160 here; the mission-1 tutorial passes 160. Its role in the shake-down is not traced (inferred: a threshold or chance)."}
    - {name: valueB, lua: number, ctype: unsigned, desc: "Second byte-sized tuning value (0-255); default 75 in the game's own table."}
    - {name: valueC, lua: number, ctype: unsigned, desc: "Third byte-sized tuning value (0-255); default 255 in the game's own table."}
    - {name: timeA, lua: number, ctype: unsigned, desc: "A time in milliseconds (the tutorial passes 5000). Doubles as the switch: when it is 0 the override is off and the game computes its own values from the victim's character class."}
    - {name: timeB, lua: number, ctype: unsigned, desc: "A time in milliseconds (the tutorial passes 2500)."}
    - {name: timeC, lua: number, ctype: unsigned, desc: "A time in milliseconds (the tutorial passes 20000; the game's own tables use 50000 here)."}
    - {name: angleA, lua: number, ctype: float, desc: "An angle in degrees (converted to radians; the tutorial passes 40)."}
    - {name: angleB, lua: number, ctype: float, desc: "An angle in degrees (converted to radians; the tutorial passes 60)."}
    - {name: timeD, lua: number, ctype: unsigned, desc: "A time in milliseconds (the tutorial passes 20000; the game's defaults range from 4500 to 13000 depending on the victim's class)."}
    - {name: flag, lua: number, ctype: unsigned, desc: "A byte flag stored with the set (the tutorial passes 0)."}
    - {name: set, lua: number, ctype: unsigned, desc: "Which override set to write: 0-2 the first set (used by the routine at 0x00284ca0), 3-5 the second (0x002853a8); 6 or more is ignored."}
  description: >-
    Overrides the tuning the game uses when a player interrogates (shakes down) a held human: three byte values, four
    times in milliseconds, two angles in degrees and a flag, stored in one of two global override sets (0x00510a18,
    0x00510a38). While a set's `timeA` is non-zero the interrogation code uses it instead of the per-class defaults it
    otherwise computes; calling again with all zeros restores the defaults, which is what the mission-1 tutorial
    (`level99_lesson1`) does after its interrogation lesson.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    Storage and the default/override switch are confirmed (code) at 0x002854b0, 0x00284ca0 and 0x002853a8; what each
    value controls in the interrogation is inferred from the defaults and is an open question.
  usage: {chunks: 1, calls: 2, boot: false, mission1: true, result_used: false}

