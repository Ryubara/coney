- name: BrSetType
  wrapper: 0x0035ec38
  calls:
    - {addr: 0x00292410, name: Brain_SetType}
    - {addr: 0x0028ceb8, name: Brain_StoreType}
    - {addr: 0x0028c1a8, name: Brain_InstallHandlers}
  args:
    - {name: human, lua: number, ctype: unsigned, desc: "Handle of the human; a bad handle does nothing."}
    - {name: brainType, lua: number, ctype: int, desc: "Brain type 0-6 (AI types: 0 player, 1 cop, 2 gang soldier, 3 Warrior, 4 civilian or bum, 5 dealer, 6 the civl_co_di kind); scripts use 2 and 4. Not range-checked."}
  description: >-
    Changes the kind of brain a human has (brain `+0x04`) and reinstalls its update, think and event handlers from
    that type's tables (`0x00715530`, `0x00715568`, `0x007155a0`), so the human behaves like a cop, gang soldier,
    Warrior, civilian and so on from its next update. Type 0 also hands the human's player record the pad (record
    `+0x1b` = 1) and resets its player-side bookkeeping.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    A brain made dead with BrDead keeps the script-only handlers (the type is stored but only used when BrDead is
    lifted); a value above 6 indexes past the tables; type 0 is only meaningful for a human that has a player slot;
    the goals already on the stack are kept.
  usage: {chunks: 8, calls: 17, boot: false, mission1: false, result_used: false, levels: [95, 3, 82, 83]}
  coney: implemented

- name: BrSetPedType
  wrapper: 0x0035ecb0
  calls:
