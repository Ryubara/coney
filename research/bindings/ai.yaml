- name: BrProcessGoal
  wrapper: 0x0035ef10
  calls:
    - {addr: 0x002926a8, name: Brain_ProcessTopGoal}
    - {addr: 0x0029eed8, name: Goal_Process}
  args:
    - {name: human, lua: number, ctype: unsigned, desc: "Handle of the human; a handle that is not a human does nothing."}
  description: >-
    Runs one update of the goal on top of the human's goal stack (brain `+0x40` + top index `+0x2c` × 4) at once
    instead of waiting for the next brain update, so a goal just given takes effect in the same frame: Goal_Process
    starts or resumes it if needed and then calls its Process, unless its time limit has passed or the human has no
    model ([AI: goal stack](../../research/ai.md)).
  evidence: confirmed-code
  depth: thorough
  notes: >-
    The result is discarded: a goal that reports done (2) stays on the stack until the brain's own update pops it.
    With an empty stack a null goal is passed and not checked (crash).
  usage: {chunks: 4, calls: 13, boot: false, mission1: false, result_used: false, levels: [54]}

- name: BrSetThreatResponse
  wrapper: 0x0035ef48
  calls:
    - {addr: 0x00292708, name: Brain_SetThreatResponse}
  args:
    - {name: human, lua: number, ctype: unsigned, desc: "Handle of the human; a handle that is not a human does nothing."}
    - {name: response, lua: number, ctype: int, desc: "Threat response (brain `+0x21c`, truncated to 16 bits and sign-extended): 0 means the human never fights back; any other value lets it fight. Scripts use 0, 2 and 3; no reader seen tells the non-zero values apart."}
  description: >-
    Sets whether a human answers threats (brain `+0x21c`). With 0 it never starts a fight: `Brain_Fight` refuses,
    the brains' threat handler (0x00291960) ignores attackers, and a melee goal gives up once its target is gone, as
    for shopkeepers and scripted extras. With a non-zero value an attacked human fights back, and a gang soldier with
    enemies on its list and no fight goal starts one (`GangBrain_Think` 0x003046e8).
  evidence: confirmed-code
  depth: thorough
  notes: >-
    Civilian, dealer and type-6 civilian brains (0x002fef40, `DealerBrain_Think` 0x00302cf0, 0x00303f28) reset it to 0
    as soon as they have no fight goal (types 8 or 0x3f, `Brain_HasFightGoal` 0x00290348), so on them it lasts one
    fight; the readers checked test only zero / non-zero (values 2 and 3 may matter to an untraced reader among the
    ~40 that load `+0x21c`). Gang-wide: `GangSetThreatResponse`.
  usage: {chunks: 43, calls: 116, boot: false, mission1: false, result_used: false, levels: [87, 95, 34, 2, 5, 81, 86, 93, 31, 9, 51, 52, 54, 92, 83, 20, 11]}
  coney: implemented

