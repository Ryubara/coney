    Constructor 0x002da8f8 (vtable 0x005420d0; it also sets brain `+0x2d7`, cleared when the goal ends), Start
    0x002da960 (offset point by angle and distance, 0x003376c0), Process 0x002dacf8, end 0x002daa20 (posts gang
    event 8 when the human left). Exit flags are found by 0x004177d8 (nearest flag of an activity, with a
    line-of-sight test). The removal at an exit flag (activity 8) is 0x00416b18, [World
    flags](../../research/flags.md#activities); the out-of-sight kill is 0x002302a8 (the body of `HuKill`). A
    pedestrian (brain type 4 or 5) seen at the flag may first wait 1.5 s (3 s for one kind) before it gives up the
    flag. A panicking human (brain `+0x2e` above 0) may switch to sprint when more than 15 m away. `HuExitWorld`
    finds the flag itself.
