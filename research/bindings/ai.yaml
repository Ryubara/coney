    - {name: pedType, lua: number, ctype: unsigned, desc: "Pedestrian type, kept as its low 16 bits (0 when a brain is made). 3 makes a civilian stand up to attackers (bouncers, vendors); 5 marks a rich mugging victim; scripts also use 1 (market shoppers) and 2."}
  description: >-
    Sets the pedestrian type of the human's brain (`+0x26c`), which changes how a civilian reacts to trouble. A
    civilian of type 3 fights whoever attacks it instead of taking the usual ped-reaction goal (107, fleeing or
