- name: BrFlush
  wrapper: 0x0035ede0
  calls:
    - {addr: 0x00292530, name: Brain_FlushAll}
  args:
    - {name: human, lua: number, ctype: unsigned, desc: "Handle of the human."}
  description: >-
    Clears everything a human's brain was doing: it pops every goal off the goal stack (ending each one) and then
    empties the action queue. Scripts call it before giving a human a new goal so the new goal starts from a clean
    state.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    Goals: 0x0028d910 pops until the stack index (`+0x2c`) is -1. Actions: 0x0028db20 removes the up to eight queued
    actions (`+0x2e` count, ring at `+0x68`).
  usage: {chunks: 124, calls: 520, boot: true, mission1: true, result_used: false, levels: [80, 87, 95, 34, 2, 3, 5, 81, 86, 93, 31, 14, 9, 51, 52, 54, 55, 84, 82, 92, 83, 20, 11, 64]}
  coney: implemented

- name: BrFlushActions
  wrapper: 0x0035ee18
  calls:
    - {addr: 0x00292590, name: Brain_FlushActions}
  args:
    - {name: human, lua: number, ctype: unsigned, desc: "Handle of the human; a bad handle does nothing."}
  description: >-
    Empties a human's queue of low-level actions (turns, moves, attacks, the `Act*` bindings) through
    `Brain_ClearActions` and leaves its goals in place, so the current goal plans again on its next update. Unlike
    BrFlush it ends no goal and runs no goal callback.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    Clearing stops at an action that refuses to abort (an attack in progress), so that one and those behind it stay
    ([AI: actions](../../research/ai.md)).
  usage: {chunks: 34, calls: 67, boot: false, mission1: false, result_used: false, levels: [20]}
  coney: implemented

