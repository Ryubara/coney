  description: >-
    Sends a human off the scene through an exit flag. Unless its brain is of type 1 (a player) the brain's off flag
    is set first (brain `+9`, as `BrDead` does), then a `MoveToExitFlag` goal (type 2) walks it to the flag (or the
    offset point) at `gait`. If the way to the flag is blocked, or the human reaches it while a player camera can
    see it or within 8 m of one, it picks the nearest other exit flag it can reach and goes on; once it arrives
    unseen it is removed. If, at a check every 8 seconds, it is more than 60 m from every player camera and off
    screen, it is instead killed out of sight (as `HuKill`) and the goal ends.
  evidence: confirmed-code
  depth: thorough
