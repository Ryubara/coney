- name: BrDead
  wrapper: 0x0035eb78
  calls:
    - {addr: 0x00292330, name: Brain_SetDead}
  args:
    - {name: human, lua: number, ctype: unsigned, desc: "Handle of the human (from `HuCreate` or a level's human list)."}
    - {name: dead, lua: boolean, default: true, desc: "true (the default when omitted) switches the brain off; false switches it back on."}
  description: >-
    Switches a human's brain off or on. It first clears the brain's queued actions, then stores the flag (brain
    `+0x09`) and rebuilds the brain's three behaviour handlers: when off, fixed do-nothing handlers; when on, the
    handlers of the brain's type (see `BrSetType`). For a player brain (type 0) switching it off also takes the pad
    away, so the player cannot move the character, and switching it on gives the pad back; scripts use `BrDead(player,
    true)` around scripted moments and `BrDead(player, false)` to hand control back.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    Brain refresh at 0x0028c1a8: off installs the handlers 0x0028fbb0/0x004edd40/0x004edd48 and, for type 0, clears
    the player record's control byte (+0x1b); on reads the handlers from the per-type tables at
    0x00715530/0x00715568/0x007155a0 (seven types) and, for type 0, sets control again.
  usage: {chunks: 120, calls: 894, boot: true, mission1: true, result_used: false, levels: [80, 87, 95, 34, 2, 3, 5, 81, 86, 93, 31, 14, 9, 51, 52, 54, 55, 84, 82, 92, 83, 20, 11, 60, 61, 62, 63, 64]}
  coney: implemented

