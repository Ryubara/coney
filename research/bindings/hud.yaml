- name: HUDSetAnnounceMsg
  wrapper: 0x0036e858
  calls:
    - {addr: 0x001b5b08, name: HUD_SetAnnounceMessage}
  args:
    - {name: kind, lua: number, ctype: unsigned, desc: "Announcement type. 5 shows the custom `text`; any other value shows that type's built-in message (a table of message pointers at 0x00622e20) and ignores `text`."}
    - {name: text, lua: string, desc: "The text to show when `kind` is 5 (scripts pass a string from the level's string table, or GSTRING.CHEAT)."}
    - {name: flag, lua: boolean, desc: "Stored in a HUD global (0x00617fe8) that the announcement display reads; the Armies of the Night levels pass true. Meaning not traced."}
  description: >-
    Shows an announcement: the custom text for kind 5 centred at GUI (0.5, 0.25), or one of the built-in announcement
    messages at the bottom left (0.02, 0.90) for the other kinds. Each call replaces the text at once (no queue).
    global.lua uses it to announce an entered cheat.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    Kind 5 goes to a separate text widget (0x0060e990, HUD +0xe150); the other kinds restart the HUD manager's
    announcement widget (+0xe340) through 0x001b3cb0, which also looks up interface cue 0x14. An announcement lasts as
    its own <DISPLAYTIME> markup says, else until replaced; while the +0xe340 one shows, the objective message, the hint
    box and the action prompts are hidden. Details: [The in-game
    HUD](../../research/hud.md#announcements-and-other-messages).
  usage: {chunks: 17, calls: 50, boot: true, mission1: true, result_used: false}

