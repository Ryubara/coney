- name: HUDSetANBossTexture
  wrapper: 0x0036e8d8
  calls:
    - {addr: 0x001b5b80, name: HUD_SetANBossTexture}
    - {addr: 0x00210dc0, name: ANHud_SetBossTexture}
    - {addr: 0x0020fc98, name: TargetPanel_SetBossTexture}
  args:
    - {name: human, lua: number, ctype: unsigned, desc: "Handle of the boss human in an Armies of the Night level."}
    - {name: texture, lua: number, ctype: unsigned, desc: "Texture id of the portrait to show for that boss (scripts pass ids around 1966080, 0x1e0000 + n)."}
    - {name: "on", lua: boolean, default: true, desc: "true (default) registers the portrait, false removes the human's entry."}
  description: >-
    Registers (or removes) a boss portrait on both players' Armies of the Night HUDs. Each HUD's target panel keeps a
    table of 6 (human, texture) pairs: `on` puts the pair in the first free slot, false clears the slot holding that
    human. While a player fights a registered human, the enemy health panel the HUD shows for its target
    (`TargetPanel_Update` 0x0020e6f8) swaps in that portrait texture; other enemies get the plain panel.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    Only Armies of the Night HUDs (built by `ANHud_Construct` 0x0020fd80 when the level index is 60-69) implement
    the call; on a normal player HUD the method is an empty stub (vtable 0x0053edf8 `+0x74`). A full table (6
    entries) silently ignores further adds, and the same human can be added twice. Free slots hold the null
    handle (0x006ebd30).
  usage: {chunks: 15, calls: 38, boot: false, mission1: false, result_used: false, levels: [60, 61, 62, 63, 64]}

