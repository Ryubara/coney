- name: HUDLaunchANGameOver
  wrapper: 0x0036f1b8
  calls:
    - {addr: 0x001cede8, name: HUD_LaunchANGameOver}
    - {addr: 0x001557f8, name: ANGameOver_Toggle}
  args:
    - {name: "on", lua: boolean, desc: "Read but not used (scripts pass true)."}
  description: >-
    Opens the Armies of the Night game-over screen (game mode 0xd, pushed from 0x005e53a0); the main loop does the
    same itself when a failed Armies of the Night level fades out. The screen (`ANGameOver_Update` 0x001cf468)
    counts down and lets either player press Start to continue: with credits left a credit is spent, the Lua
    function `F1.Time` is called and both HUDs show the join message; with no credits, or when the countdown
    ends, the screen fades out. Calling it while the screen is already up closes it and applies the result:
    continuing players are revived and their HUD restored, otherwise the game either reloads `level60` or calls
    `runNextMission(0)`.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    It is a toggle: a second call while game mode 0xd is current pops the screen instead of opening it again. Which
    menu outcome (game-over menu `+0x7a4`/`+0x7a8`) maps to reloading `level60` and which to `runNextMission` is
    inferred, not traced to the button. Credits are the counter read by `HUDANGetCredit` (0x00619910).
