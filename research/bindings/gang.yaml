    (0x00227d28), 0x40000 recovery (0x00227dd8), 0x80000000 (0x00227e18) and 0x100000000 (0x00227eb0); the last two
    are not named. The bum exception is character class byte +0x11b = 6 (record 0x684620 + type × 0x1ac). The fight
    test is 0x002904a0 (brain attack slots +0x1a4, target +0x124). Empty member slots count as ready, so an empty
    gang answers true.
