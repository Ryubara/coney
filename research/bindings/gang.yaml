    - {name: type, lua: number, ctype: int, desc: "Gang type id (stored at gang +0x2c): selects the gang's configuration from the gang table (the CfgGang data); 0 is the Warriors and 1 the police. Type 1 also makes the new police gang enemies of every gang that is currently wanted."}
