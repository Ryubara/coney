- name: GangCreate
  wrapper: 0x00373148
  calls:
    - {addr: 0x0016a1c8}
  args:
    - {name: type, lua: number, ctype: int, desc: "Gang type id (stored at gang +0x2c): selects the gang's configuration from the gang table (the CfgGang data); 0 is the Warriors and 1 the police. Type 1 also makes the new police gang enemies of every gang that is currently wanted."}
    - {name: name, lua: string, desc: "Unique name of the gang (up to about 28 characters); creation fails if a gang with this name already exists."}
    - {name: flag1, lua: boolean, desc: "Read but not used by the C++ side (0x0016cdf0 takes only the type and the name)."}
    - {name: flag2, lua: boolean, desc: "Read but not used, as flag1."}
  results:
    - {lua: number, desc: "The new gang's id (slot 0-31), or -1 when the name is already in use or all 32 slots are taken."}
  description: >-
    Creates a gang: takes a free slot, gives it a name and a type, clears its members and spawners, and sets up the
    type's default animation and response tables. Members are added afterwards (HuCreate's gang argument,
    GangAddMember, spawners).
  evidence: confirmed-code
  depth: thorough
  notes: >-
    0x0016cdf0. A gang holds at most 10 members, or 16 for police (type 1) and type 0x17 (0x00166308).
  usage: {chunks: 119, calls: 1391, boot: false, mission1: true, result_used: true, levels: [80, 87, 95, 34, 2, 3, 5, 81, 86, 93, 31, 14, 9, 51, 52, 54, 55, 84, 82, 92, 83, 20, 11, 60, 61, 62, 63, 64]}
