- name: GangDelete
  wrapper: 0x00373200
  calls:
    - {addr: 0x0016a1e8}
  args:
    - {name: gang, lua: number, ctype: int, desc: "Gang id (slot 0-31); values of 32 and above (including -1) do nothing."}
  description: >-
    Deletes a gang and every human still in it: every other gang stops treating it as friend or enemy, each member is
    destroyed at once (with its held object, radar blip and, for a player, its pad and HUD panel), the tactic is freed
    and the slot is reset.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    0x0016d068 then 0x00164738: the gang's message handlers are cleared first, then each member is removed (0x001664d8)
    and Human_Destroy(h, 0) (0x0021c7c8) runs inside the call. A player in the gang is destroyed too and taken off the
    player list; no other human becomes the player, so scripts call HuChangePlayerGang first. Characters, destroying a
    human; AI, deleting a gang.
  usage: {chunks: 49, calls: 146, boot: true, mission1: true, result_used: false, levels: [80, 87, 95, 34, 2, 3, 5, 81, 86, 93, 31, 14, 9, 51, 52, 54, 55, 84, 82, 92, 83, 20, 11, 60, 61, 62, 63, 64]}
  coney: implemented

