- name: GangCanFlee
  wrapper: 0x0035f890
  calls:
    - {addr: 0x0016bcf0, name: Gang_SetCanFlee}
    - {addr: 0x00307fe0, name: GangTactic_StartFlee}
    - {addr: 0x00307d40, name: GangTactic_CheckFlee}
  args:
    - {name: gang, lua: number, ctype: int, desc: "Gang id (slot 0-31, read as 16 bits); -1 or an unused slot does nothing."}
    - {name: "on", lua: boolean, desc: "true lets the gang's members run away once the gang is beaten down; false (or nil) keeps them fighting."}
  description: >-
    Sets the gang's can-flee byte (`+0xdf`). With it set, a gang tactic's start (`0x00307fe0`) notes how many
    members the gang has (`+0xe0`) and, when the gang kind has a flee percentage (table `0x0050caa8`, byte `+0x72` of the
    kind's 0x7a-byte record), substitutes `gen_cower_plead.anm` for the members' anim 668. When a member goes down
    (`0x00307d40`) and the members still standing are no more than that percentage of the starting count, each standing
    member of class kind 11 drops his enemies, stops fighting (threat response 0) and is pushed a pedestrian reaction
    goal (type 0x6b, mode 9) away from the nearest enemy: he flees.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    A gang kind with a 0 percentage never flees; only members whose class byte +0x11b is 11 run; a gang of kind 6 with
    +0xd9 set skips all of this; the default at gang creation is set by 0x00164808.
  usage: {chunks: 7, calls: 16, boot: false, mission1: false, result_used: false, levels: [95, 2, 52, 62, 63]}
  coney: implemented

