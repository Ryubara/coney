- name: GangSetMsgHandler
  wrapper: 0x00373370
  calls:
    - {addr: 0x0016ab38}
  args:
    - {name: gang, lua: number, ctype: int, desc: "Gang id (slot 0-31); -1 does nothing."}
    - {name: message, lua: number, ctype: int, desc: "Gang message id: an index into the gang's handler table (gang +0xe4 + 4 × id). The scripts use, for example, 1 for a member being hit, 2 for a member dying, 17 for an arrest and 18 for a death."}
    - {name: handler, lua: string, desc: "Name of the Lua function to call (dotted names such as \"Menu.onHit\" allowed), or nil to clear the handler."}
  description: >-
    Registers the Lua function the gang calls when the given event happens to it or its members. The name is interned
    and looked up when the event fires, so the function can be defined or replaced later.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    0x00164bb8 stores the interned name (script-system slot +0xcc). `Gang_OnEvent` (0x00164c20) calls it with
    (member, other, value): for message 18 the attacker and the members still standing, for 2 the headcount, for 17
    the event's value; other ids pass the event through a generic marshaller and count as handled when the function
    returns true. The message ids' meanings are inferred from the scripts' handler names. Behaviour:
    [AI](../../research/ai.md#gang-events).
  usage: {chunks: 140, calls: 1155, boot: true, mission1: true, result_used: false, levels: [80, 87, 95, 34, 2, 3, 5, 81, 86, 93, 31, 14, 9, 51, 52, 54, 55, 84, 82, 92, 83, 20, 11, 60, 61, 62, 63, 64]}
