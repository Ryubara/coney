- name: AddAmbientSoundEmitter2
  wrapper: 0x00371db0
  calls:
    - {addr: 0x00113920}
  args:
    - {name: name, lua: string, desc: "The emitter's name (such as \"tCrickets01\"), used by SetAmbientEmitterPositions; a name already used refers to the existing emitter."}
    - {name: pos1, lua: table, elem: number, count: 3, written_back: true, desc: "First point {x, y, z} of the emitter (one end of the line or corner of the area the sound comes from); written back."}
    - {name: pos2, lua: table, elem: number, count: 3, written_back: true, desc: "Second point {x, y, z}; the same as pos1 for a point source; written back."}
    - {name: index, lua: number, ctype: int, desc: "First entry of the ambient sound table (AddAmbientSound) to pick from, or -1 to play the sound named by sound."}
    - {name: sound, lua: string, desc: "Sound name used when index is -1; the scripts pass \"\" otherwise."}
    - {name: count, lua: number, ctype: unsigned, desc: "How many consecutive table entries, starting at index, the emitter picks from at random."}
    - {name: range, lua: number, ctype: float, desc: "A float stored with the emitter (the scripts use 25-70, or -1); inferred to be the audible range in metres, -1 for the default."}
    - {name: arg8, lua: number, ctype: int, desc: "A number the scripts pass as -1; meaning not traced."}
    - {name: minDelay, lua: number, ctype: unsigned, desc: "Shortest pause between two plays, in seconds (inferred from the random range the emitter draws from)."}
    - {name: maxDelay, lua: number, ctype: unsigned, desc: "Longest pause between two plays, in seconds (inferred)."}
    - {name: arg11, lua: number, ctype: unsigned, desc: "A small number stored as a byte (the scripts pass 3 or 4); meaning not traced."}
    - {name: mode, lua: number, ctype: int, desc: "A mode byte 0-2 (larger values become 0); the scripts pass 0. Meaning not traced."}
  results:
    - {lua: number, desc: "The emitter's id."}
  description: >-
    Adds a named ambient sound emitter: at random intervals it plays a random sound from part of the ambient table (or
    one named sound) somewhere between two points. The levels place their crickets, dogs, wind and machinery this way.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    0x00113920 → 0x0010cf58. Which argument lands in which emitter field is confirmed (code); the meaning of the
    numbers is inferred from the scripts' values. Names containing certain substrings get a special type (0x0010cf58
    compares against 0x00546ce0, 0x00546ce8, 0x00546cf0).
  usage: {chunks: 58, calls: 2230, boot: false, mission1: true, result_used: true, levels: [80, 87, 95, 34, 2, 3, 5, 81, 86, 93, 31, 14, 9, 51, 52, 54, 55, 84, 82, 92, 83, 20, 11]}

