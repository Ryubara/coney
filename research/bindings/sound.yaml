- name: PreLoadObjectSound
  wrapper: 0x0036dd40
  calls:
    - {addr: 0x003978d0, name: WorldObject_PreloadSound}
  args:
    - {name: object, lua: number, ctype: unsigned, desc: "Handle of a world object (a vehicle, for example); other kinds of object do nothing."}
    - {name: sound, lua: string, desc: "Name of the sound to load for it (a path such as a cutscene sound)."}
  description: >-
    Loads a sound positioned on a world object so that StartObjectSound (WorldObject_StartSound, 0x00397998) can start
    it later: the sound is loaded at the object's position (`+0x10`) and its handle kept at `+0xf8`; a sound the
    object already had is stopped and replaced. The object's record is also pinned (ObjRecord_SetPinned) so it is
    never streamed out while it carries the sound.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    Only objects whose class reports kind bit 8 accept it (0x00395f38; that these are the placed world objects is
    inferred). The pin is not undone.
  usage: {chunks: 3, calls: 5, boot: false, mission1: false, result_used: false, levels: [51, 84]}

