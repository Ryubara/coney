- name: SoundSetSystemMusicState
  wrapper: 0x00371438
  calls:
    - {addr: 0x00113e60, name: Sound_SetSystemMusicState}
    - {addr: 0x00419fc8, name: GameState_SetMusicMood}
  args:
    - {name: state, lua: number, ctype: int, desc: "Mood to hold: 0 idle, 1 fight, 2 hunted (16-bit); 3 hands the mood back to the game; 4 switches the system music off. The scripts use 0, 1 and 3."}
  description: >-
    Sets the system music's mood (game state `+0x40c`), which picks the looping track ([Sound](../../research/sound.md)).
    A state other than 3 also sets the script-hold flag (`+0x3f4`), so the game's own mood choice
    (SystemMusic_UpdateMood: fight when an enemy gang engages the player's, hunted while his gang is hunted, else
    idle) stops overriding it. State 3 clears the hold and the game chooses again on its next update.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    State 4 (0x00419fc8) calls GameState_SetSystemMusic(0), which stops the music and clears the hold, and leaves
    the mood at 3. The moods' names come from the game's choice in SystemMusic_UpdateMood (0x0041a0d0).
  usage: {chunks: 8, calls: 16, boot: false, mission1: false, result_used: false, levels: [2, 3, 86, 14, 55]}

- name: SoundEnableSystemMusic
  wrapper: 0x00371470
  calls:
    - {addr: 0x00113ea8, name: Sound_EnableSystemMusic}
  args:
    - {name: "on", lua: boolean, desc: "true lets the game choose the music by the situation (calm, fight, hunted); false stops it so the script controls the music."}
  description: >-
    Turns the system music, the game's automatic mood music, on or off (game state `+0x3f8`, 0x0041a008). On a
    change it forces a fresh choice of track and at once works out the mood from the player's surroundings
    (0x0041a060): 1 when an enemy gang near the player's gang is fighting it, 2 when an enemy gang's member is
    hunting it (goals `0xc`, `0x75`, `0x76`, 0x001696e0), else 0. Turning it off fades out the music (0x0010d9a0).
  evidence: confirmed-code
  depth: thorough
  notes: >-
    Setting the value it already has only clears game state `+0x3f4` (not traced). `SoundSetMusicTrack` turns it on
    too. Tracks per mood and the fades: [Sound](../../research/sound.md#music-player).
  usage: {chunks: 89, calls: 154, boot: false, mission1: false, result_used: false, levels: [80, 87, 95, 34, 2, 3, 5, 81, 86, 93, 31, 14, 9, 51, 52, 54, 55, 84, 82, 92, 83, 20, 11]}
  coney: implemented

- name: SoundSetMusicTrack
  wrapper: 0x003714a0
  calls:
    - {addr: 0x00113ed0, name: Sound_SetMusicTrack}
  args:
    - {name: slot, lua: number, ctype: int, desc: "The system-music mood the tracks are for: 0 calm, 1 fight, 2 hunted (the moods 0x0041a060 picks); not range-checked."}
    - {name: track1, lua: string, desc: "Name of a music track, or nil or an empty string for none."}
    - {name: track2, lua: string, desc: "A second track for the same mood, or nil."}
    - {name: track3, lua: string, desc: "A third track, or nil."}
  description: >-
    Sets the tracks the system music picks from for one mood and turns the system music on. The non-empty names are
    hashed (CRC-32, table 0x005d91e0) and stored in order, up to three, in the music player's mood table
    (0x0010e9e0); when the mood is the one playing, a new pick is forced. Each time the mood changes the player
    plays a random one of the mood's tracks, looping.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    Empty names are skipped, so the tracks pack to the front; a mood given no tracks stops the music when chosen.
    The names are not checked against the loaded track list. Also sets audio manager `+0xcc` = 1 (not traced). The
    mood names are inferred from 0x0041a060's tests. [Sound](../../research/sound.md#music-player).
  usage: {chunks: 73, calls: 275, boot: false, mission1: false, result_used: false, levels: [80, 87, 95, 34, 2, 3, 5, 81, 93, 31, 14, 9, 51, 52, 54, 55, 82, 92, 83, 20, 11]}
  coney: implemented

- name: SoundSetMusicStateCallback
  wrapper: 0x00371540
  calls:
    - {addr: 0x00113ff0}
    - {addr: 0x0041b4c0, name: GameState_SetMusicStateCallback}
    - {addr: 0x0041b520, name: GameState_CallMusicStateCallback}
  args:
    - {name: callback, lua: string, desc: "Name of the Lua function to call (copied, at most 31 characters, to `W_GameState + 0x384`), or nil to clear it."}
  description: >-
    Registers a Lua function that the system-music update (0x0010e7d0) calls as f(oldMood, newMood) whenever it acts
    on a mood change (game state `+0x40c`: 0, 1 or 2, inferred idle, fight, search) or a forced re-pick; the call
    comes after the new mood's track is started. Only one callback is kept; a new call replaces it.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    Not called while the music update is deferred (`0x00512c7c + 0x82c`); a forced re-pick passes the same mood twice.
    A name that is not a Lua function is skipped silently. Moods: sound.md#system-music.
  usage: {chunks: 1, calls: 2, boot: false, mission1: false, result_used: false, levels: [55]}

