    calls:
      - {addr: 0x001134e0}
    args:
      - {name: trackHash, lua: number, ctype: unsigned, desc: "The track's name hash (a number) instead of its name."}
      - {name: callback, lua: string, desc: "Name of a Lua function to call when the track ends, or nil."}
