- name: SndSetPitchMod
  wrapper: 0x003710c0
  calls:
    - {addr: 0x00113370, name: Audio_SetPitchMod}
  args:
    - {name: pitch, lua: number, ctype: float, desc: "Global pitch factor for the game's sounds, 1.0 normal (one hub script uses 0.65 for a slowed-down effect); not clamped."}
  description: >-
    Sets the audio manager's global pitch factor (+0x3fa5c), which the sound tasks multiply into every playing
    sound's pitch, so lower values slow and deepen all game sound. It stays until changed again or until the next
    level load, which resets it to 1.0.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    Reset to 1.0 by mode 1's Enter (0x001582e0) and Exit (0x00158488). Mode 1's update also lowers it towards 0.7 by
    itself, by 0.7 / (0.9 × the level-end countdown) a frame (0x00158728 at 0x001589c8; inferred: the slow-down as a
    level ends), and saves and restores it around one other state (0x00158bd4, not traced). Its readers are
    SoundTask_Update (0x0011b048), 0x0011daa8 and the device 0x0014caf8.
  usage: {chunks: 1, calls: 2, boot: false, mission1: false, result_used: false, levels: [95]}
  coney: implemented

