- name: PathValid
  wrapper: 0x0036cf88
  calls:
    - {addr: 0x00386010, name: Obj_PathExists}
  args:
    - {name: from, lua: number, ctype: unsigned, desc: "Handle of the first game object (usually a human)."}
    - {name: to, lua: number, ctype: unsigned, desc: "Handle of the second game object."}
  results:
    - {lua: boolean, desc: "True when a walkable route exists between the two objects' positions; nil when not, or when either handle is invalid."}
  description: >-
    Asks the path data whether a human could walk between two objects: true when both positions lie on walkable
    polygons and either the straight segment stays inside them or an A* route exists over the graph (all edge flags
    allowed) that passes no node `0x00251718` rejects; false otherwise or for an invalid handle.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    0x00386010 reads both positions (object vtable +0xa4) and calls 0x0024e078(from, to, 0, 0, 1, 0xffff): polygon
    lookup 0x00250708, straight check 0x0024fbf8, end nodes 0x00251150, search 0x002511c8, then the route is freed.
    What 0x00251718 tests on a node is not traced. Planning: [AI](../../research/ai.md#path-planning).
  usage: {chunks: 16, calls: 17, boot: false, mission1: false, result_used: true, levels: [87, 95, 34, 2, 3, 5, 93, 31, 14, 51, 52, 82, 92, 83, 20, 11]}

