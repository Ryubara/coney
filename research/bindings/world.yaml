- name: TriggerSphereCfg
  wrapper: 0x0036d0e0
  calls:
    - {addr: 0x00414bc0, name: TriggerSphere_Configure}
  args:
    - {name: object, lua: number, ctype: unsigned, desc: "Handle of the object that gets the sphere (a flag, human or prop)."}
    - {name: enable, lua: boolean, desc: "True to arm the sphere at once, false to configure it disarmed."}
    - {name: radius, lua: number, ctype: float, desc: "Radius in metres around the object."}
    - {name: mode, lua: number, ctype: int, desc: "How a human inside the radius is accepted (+0x17c): 0 on distance alone, 1 also needs a clear test from the sphere's centre to the human, 2 the same test from raised points (the test is inferred to be line of sight); the scripts pass 0, 1 (true) or 2."}
    - {name: interval, lua: number, ctype: unsigned, desc: "Stored as the repeat period (ms) of the object's message-handler component (+0x74), the period of message 5 (still inside); the scripts pass 1, 100, 250, 500 or 1000."}
  description: >-
    Creates or reconfigures the trigger sphere of an object (a pool of 100): its radius, whether it is armed, the
    acceptance mode and the repeat period. Each sphere is checked every fifth frame; a human coming inside sends the
    object message 3, staying inside message 5, leaving or dying message 4, so `SetMsgHandler(object, 3, ...)` hears
    it. Scripts use it for objectives, talk-to points and pickups.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    Stores and the update are confirmed (code) at 0x00414bc0 and 0x004146e0 (scripting.md#triggers). The sphere's
    own message-5 period is its +0x164 (1000 by default); that `interval` reaches it is not traced.
  usage: {chunks: 70, calls: 172, boot: true, mission1: true, result_used: false, levels: [80, 87, 95, 34, 2, 3, 5, 81, 86, 93, 31, 14, 9, 51, 52, 54, 55, 84, 82, 92, 83, 20, 11, 60, 61, 63]}
