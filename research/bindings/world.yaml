- name: TriggerSphereEnable
  wrapper: 0x0036d008
  calls:
    - {addr: 0x00414ae0, name: TriggerSphere_Enable}
  args:
    - {name: object, lua: number, ctype: unsigned, desc: "Handle of the object (a flag, human or prop) that carries the trigger sphere."}
    - {name: enable, lua: boolean, desc: "True arms the sphere (creating one with the defaults of 0x00414480 if the object's handler component has none); false disarms it and forgets who is inside, keeping the sphere attached."}
  description: >-
    Switches an object's trigger sphere on or off. A trigger sphere is a radius around an object that reports to the
    scripts when something enters it; `TriggerSphereCfg` sets it up.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    On: armed word `+0x180` = 1. With no sphere yet, one is taken from the pool of 100 (0x004142d0) and set up by
    0x00414480: object `+0x170`, radius `+0x174` = 0, next message-5 time `+0x178` = 0, mode `+0x17c` = 1 (the
    line-of-sight test), message-5 period `+0x164` = 1000 ms, inside list empty. A radius of 0 accepts no human
    (the test is distance squared <= radius squared), so such a sphere fires only after TriggerSphereSetRadius or
    TriggerSphereCfg. Off (0x004144d0): fills the 60-handle inside list (`+0x00`-`+0xef`) with 0xff bytes (no handle)
    and clears `+0x180`; no message 4 is sent, and the sphere, its radius and mode, its pool slot, the object's
    handler component and its SetMsgHandler handlers all stay, so a later `true` re-arms the same sphere and a human
    still inside gets a fresh message 3. The sphere's pool slot is freed only when the handler component is cleared
    (0x00384a50). Does nothing for an object without a handler component. All confirmed (code).
  usage: {chunks: 30, calls: 58, boot: true, mission1: false, result_used: false, levels: [87, 95, 34, 3, 5, 81, 86, 93, 31, 9, 51, 54, 55, 84, 82, 83, 20, 11]}
  coney: implemented

