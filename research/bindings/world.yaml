- name: ObjMarkZone
  wrapper: 0x00377bd0
  calls:
    - {addr: 0x003967e0, name: ObjZone_Mark}
    - {addr: 0x003983b0}
  args:
    - {name: zone, lua: number, ctype: unsigned, desc: "Object zone number (the zone ObjSpawn gave the records, [Object zones](../zones.md))."}
    - {name: kind, lua: number, ctype: int, desc: "Must be 0; any other value makes the call do nothing."}
    - {name: removed, lua: number, ctype: int, desc: "Non-zero marks every record of the zone removed; 0 restores them (the scripts always pass 0)."}
  description: >-
    Marks or unmarks every spawn record of an object zone as removed (record +0x24 bit 0x40000): a removed record is
    never spawned again and its handle resolves to NilHandle. With 0, the zone's records come back, and live objects
    that were stored hidden are stored back into their records (shown again when next spawned). Scripts call
