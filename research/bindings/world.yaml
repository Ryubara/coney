    - {name: pos, lua: table, elem: number, count: 3, written_back: true, desc: "World position `{x, y, z}` in metres. Written back unchanged."}
    - {name: rot, lua: table, elem: number, count: 4, written_back: true, desc: "Orientation as a quaternion `{x, y, z, w}` (the scripts pass `{0, 0, 0, -1}` or rotations about z). Written back unchanged."}
    - {name: unused, lua: number, ctype: int, desc: "Not used by the callee; the scripts always pass -1."}
    - {name: zone, lua: number, ctype: unsigned, desc: "Object zone number the object belongs to (stored in the spawn record's top bits); 0 for none."}
    - {name: flags, lua: number, ctype: unsigned, desc: "Spawn flags: bit 0 (1) makes the record take an id the caller passes (the binding passes none), bit 1 (2) a physics-related bit for most types, bit 6 (64) another record bit; the scripts pass 0, 64 and similar."}
    - {name: extra, lua: number, ctype: unsigned, default: 4294967295, desc: "The object's tint, a colour word `0xRRGGBBAA` (record `+0x14`, then object `+0xc8`); default 4294967295, white, no tint ([Object tints](../tints.md))."}
    - {name: flagName, lua: string, desc: "Optional name of a flag (marker) the object is linked to; nil for none."}
  results:
    - {lua: number, desc: "A handle to the new spawn record (record index << 16, serial 0), or NilHandle when it was suppressed. Resolving it spawns the object if it is not live."}
  description: >-
    Places a game object of a configured type at a position and orientation and returns its handle. It adds a spawn
    record; the object itself is made when the handle is first resolved (any binding taking it, such as
    `SceneAddObject`) or when a camera comes within 70 m, and its model is the Object List record of the type's name.
    Key pickups (`dyn_key...`) and the power cuffs (`dyn_powercuffs`) are suppressed unless the matching unlockable
    is set (0x00424130 on the unlockables manager at 0x006fe998).
  evidence: confirmed-code
  depth: thorough
  notes: >-
    Callee 0x00396858 builds a spawn record through 0x00398940 (`ObjRecord_Add`); 0x00398fe0 spawns a record's
    object on resolve, 0x00399d88 streams records in and out, 0x00399080 makes the object by the type's name and
    0x003a44c8 attaches its model ([Objects: dynamic objects](../../research/objects.md#dynamic-objects)). `extra` goes
    to the record (`+0x14`) and from there to the object's tint (`0x003992a4`, [Object tints](../tints.md)),
    confirmed (code); the flag bits' meaning is inferred from how the record is filled. The power cuffs are
    additionally suppressed when 0x0041d160 on the game state is non-zero.
