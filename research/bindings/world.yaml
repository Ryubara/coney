- name: GetHitpoints
  wrapper: 0x0036c900
  calls:
    - {addr: 0x00385918, name: Object_GetHitpoints}
  args:
    - {name: object, lua: number, ctype: unsigned, desc: "Handle of a world object (a breakable or damageable object, not a human)."}
  results:
    - {lua: number, desc: "The object's remaining hitpoints (+0x128), or 0 when the handle does not resolve or the object is not damageable (its type-flags call lacks bit 8)."}
  description: >-
    Returns a world object's remaining hitpoints, for scripts that wait for something to be broken. The handle is
    resolved, the object is checked to be of the damageable kind (vtable `+0x24` flags & 8, 0x00395f38), and its
    hitpoints word is returned.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    Doors and barriers keep their hitpoints in their data and mirror them at +0x128 after every hit (0x003a6ec8), so
    this reads a door's too ([World objects: breaking a door](../../research/objects.md#door-break)). The value is
    pushed as unsigned (a negative word would read as 2^32 minus it).
  usage: {chunks: 2, calls: 3, boot: false, mission1: false, result_used: true, levels: [55]}
  coney: implemented

