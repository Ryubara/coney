    - {name: enable, lua: boolean, desc: "true gives the object a physics (collision) body; false removes it."}
  description: >-
    Gives a game object a body in the physics system or takes it away (object `+0x118`). On: if it has none, a body
    is made with the shape its object type asks for (type `+0x84`: 1 a box of the type's sizes `+0x78`/`+0x7c`/`+0x80`,
    2 a sphere of half `+0x78`, otherwise a default shape of radius 0.75 unless the model forbids it), the object's
    static flag (0x200 in `+0x54`) is cleared, body flags are set from the type's class and flags, and the body is
    marked moved and made to follow the object; an existing body is re-enabled. Off: the body is freed, so humans and
    objects no longer collide with it.
  evidence: confirmed-code
  depth: thorough
  notes: >-
    The physics system is collision bodies, not free rigid-body motion ([Physics](../../research/physics.md)); "on"
    does not by itself make the object fall. Off does not set the static flag back. Class 0x30 also gets a state
    command 2 (vtable `+0x124`), not traced.
