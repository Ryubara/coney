# Patches for copies of PCSX2 save states (`coney-tools pcsx2 prepare-state`, `pcsx2 record`), applied to the copy's
# eeMemory.bin before PCSX2 starts on it, so the code is patched before the recompiler first compiles it. Each code
# edit names the instruction word the state must hold (checked: a copy is refused on a mismatch) and the word that
# replaces it, as little-endian 32-bit words of NTSC-U SLUS_212.15. Format: python/src/coney_tools/pcsx2_state.py.
# What the patches do and why: docs/guides/research-workflow.md#driving-pcsx2.

[patch.scripted-pad]
description = "The pad read takes the buttons and the left stick from spare bytes after the scePadRead buffer: 0x005de3aa / 0x005de3ab (buttons, active low) and 0x005de3ae / 0x005de3af (left stick x, y)."
research = "docs/guides/research-workflow.md#driving-pcsx2"
edits = [
  # DualShock 2 path: the lbu loads of buffer offsets 2, 3, 6 and 7 take 0x22, 0x23, 0x26 and 0x27.
  { address = 0x00149dd4, original = [0x92220002], replacement = [0x92220022] },
  { address = 0x00149dd8, original = [0x92230003], replacement = [0x92230023] },
  { address = 0x00149de8, original = [0x92230006], replacement = [0x92230026] },
  { address = 0x00149df0, original = [0x92220007], replacement = [0x92220027] },
  # Digital path: the same four loads.
  { address = 0x00149e8c, original = [0x92230002], replacement = [0x92230022] },
  { address = 0x00149e90, original = [0x92220003], replacement = [0x92220023] },
  { address = 0x00149ea8, original = [0x92220006], replacement = [0x92220026] },
  { address = 0x00149eb0, original = [0x92230007], replacement = [0x92230027] },
  # The spare bytes start at rest: no button held (active low), both sticks centred.
  { address = 0x005de3aa, bytes = "ff ff 80 80 80 80" },
]

[patch.right-stick]
description = "The right stick from the spare bytes too: 0x005de3ac / 0x005de3ad (x, y). Use with scripted-pad."
research = "docs/guides/research-workflow.md#driving-pcsx2"
edits = [
  # Buffer offsets 4 and 5 become 0x24 and 0x25, in the DualShock 2 path, then the digital path.
  { address = 0x00149df8, original = [0x92230004], replacement = [0x92230024] },
  { address = 0x00149e00, original = [0x92220005], replacement = [0x92220025] },
  { address = 0x00149eb8, original = [0x92220004], replacement = [0x92220024] },
  { address = 0x00149ec0, original = [0x92230005], replacement = [0x92230025] },
]

[patch.puppet]
description = "A human with no pad keeps the command id written into its per-player record (+0x20): the per-update clear is a nop, so an AI human can be driven as a puppet."
research = "docs/guides/research-workflow.md#driving-pcsx2"
edits = [
  # sw zero,0x20(a0) at 0x00146030 becomes a nop.
  { address = 0x00146030, original = [0xac800020], replacement = [0x00000000] },
]

# Hooks: call logging (python/src/coney_tools/hooks.py, docs/guides/research-workflow.md#hooks). A scenario names
# them in its `patches` like a patch; each displaces the two instruction words `original` at `address` (checked
# against the state) with a jump to a cave that logs the values of `log` and runs them. The hook's address must not be
# a delay slot or a branch target.

[hook.tick-game]
description = "Each call of TaskManager_TickGame (the play phase's task step, once per frame of play): the cycle counter and the characters' tick counter."
research = "docs/research/tasks.md#tick"
address = 0x003a2ea0
# addiu sp,sp,-0xa0; lui v1,0x51
original = [0x27bdff60, 0x3c030051]
log = ["count", { value = "[0x005104f4]", name = "ticks" }, "ra"]

[hook.humans-update]
description = "Each call of Humans_Update (every 60 Hz tick): the cycle counter and the tick counter before it counts this tick."
research = "docs/research/tasks.md#humans-update"
address = 0x00249108
# lui v0,0x51; addiu sp,sp,-0xd0
original = [0x3c020051, 0x27bdff30]
log = ["count", { value = "[0x005104f4]", name = "ticks" }, "ra"]

[hook.wheel-update]
description = "Each object TaskWheel_RunBucket updates (just before its vtable +0x13c call): the object, its vtable, its interval in ticks and its flags."
research = "docs/research/tasks.md#wheel"
address = 0x003a3618
# lw v1,0x0(s0); lh a0,0x138(v1)
original = [0x8e030000, 0x84640138]
log = [
  { value = "[0x005104f4]", name = "ticks" },
  { value = "s0", name = "object" },
  { value = "[s0 + 0x0]", name = "vtable" },
  { value = "[s0 + 0x6e]", name = "interval", type = "u16" },
  { value = "[s0 + 0x54]", name = "flags" },
]

[hook.state-code]
description = "Each call of the record's state-code setter (0x002266a8, record +0x14): the caller, the human and the code."
research = "docs/research/tasks.md#locomotion-gate"
address = 0x002266ac
# jr ra; sw a1,0x14(v0) (after lw v0,0xd4(a0))
original = [0x03e00008, 0xac450014]
log = [{ value = "[0x005104f4]", name = "ticks" }, "ra", { value = "a0", name = "human" }, { value = "a1", name = "code" }]

