# A sprint jump (slot 1, the street): L2 held and the stick at 100 % straight up from the start, triangle tapped
# 50 updates in.
# Unit 364 (the characters research split). The anim state (record +0x18) and the state flags' high word show whether
# the jump starts. Research: docs/research/characters-traversal.md#jump.
description = "level99 street: a sprint (L2, stick 100 %), triangle tapped 50 updates in"
research = "docs/research/characters-traversal.md#jump"
input = "chars_sprint_jump.txt"
updates = 110
fields = ["player"]

[original]
slot = 1
patches = ["scripted-pad", "right-stick"]

[coney]
level = "level99"
# Slot 1's spot and camera (the first row of the original's walk60 trace): Coney's checkpoint start is not the
# slot's (#1696).
args = ["--checkpoint", "3", "--start", "75.155,41.1354,0.2231,91.909,5.3,89.854"]
wait_for_control = true          # checkpoint 3 opens with the scene l99_c3, which holds the pad (#1680)
settle = 40                      # the stick comes after 40 updates of control, as in the slot (#1696)

[[field]]
name = "state_hi"                         # record +0x04, the state flags' high word (0x4 jump, 0x8 air, 0x20 land)
address = "rec(player) + 0x4"
type = "u32"

[[field]]
name = "anim_state"                       # record +0x18
address = "rec(player) + 0x18"
type = "s32"
