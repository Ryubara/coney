# The flash (d-pad right) asked for while a move plays: health held at 600 of 900 and 3 flashes held every update,
# so every tap is a fresh test (level99's states have the command off for pad 0; the setup turns it on). The
# flash-use hook says whether Flash_Use ran at once (called from Player_UseItemCommand, ra 0x00284820) or from clip
# 665's event (Human_HandleMessage, ra 0x002473c4); the clip column says whether 665 started.
# Research: docs/research/combat.md#flash-mid-move.
description = "slot 6: d-pad right every 5 updates while R1 is held (blocking), a puppet 1.5 m ahead"
research = "docs/research/combat.md#flash-mid-move"
input = "flash_block.txt"
updates = 120
fields = ["player", "held"]

[original]
slot = 6
patches = ["scripted-pad", "right-stick", "flash-use", "puppet"]
let = { puppet = 'human("PoizoCiv")' }
setup = [
  { address = "rec(player) + 0x144", type = "s16", value = "600", frame = 0, until = 120 },
  { address = "u32(0x0051489c) + 0x4d0", type = "s32", value = "3", frame = 0, until = 120 },
  # The flash command (pressed table entry 2, d-pad right) is off for pad 0 in this state (mask 0xfe): turn it on.
  { address = "0x005ddde8", type = "u16", value = "0xff", frame = 0, until = 0 },
  { address = "prec(puppet) + 0x1e", type = "u8", value = "0", frame = 0, until = 0 },
  { address = "tf(puppet) + 0x0", type = "f32", value = "f32(tf(player)) - 1.5 * sin(heading(player))", until = 39 },
  { address = "tf(puppet) + 0x4", type = "f32", value = "f32(tf(player) + 4) + 1.5 * cos(heading(player))", until = 39 },
  { address = "tf(puppet) + 0x8", type = "f32", value = "f32(tf(player) + 8)", until = 39 },
  { address = "tf(puppet) + 0x18", type = "f32", value = "sin((heading(player) + pi) / 2)", until = 39 },
  { address = "tf(puppet) + 0x1c", type = "f32", value = "cos((heading(player) + pi) / 2)", until = 39 },
]

[coney]
level = "sandbox:combat"

# The flashes player 1 carries: Inventory_GetCount(*(0x0051489c) + 0x480, 0, 1) reads +0x24 + item 1 * 0x2c.
[[field]]
name = "flashes"
address = "u32(0x0051489c) + 0x4d0"
type = "s32"
