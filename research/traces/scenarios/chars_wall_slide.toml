# Sliding along a wall: Rembrandt (slot 1) put 7 m from the full-height wall of level99's street at y -5.38 (normal -y,
# triangle 948), heading 21.7 degrees, so the stick straight up (the camera behind him) runs, then walks, into it
# about 20 degrees off its normal. Research: docs/research/characters-ground.md#walls (sliding along a wall).
description = "level99 street: running, then walking, into the wall at y -5.38 about 20 degrees off its normal, 2 trials of 180 updates"
research = "docs/research/characters-ground.md#walls"
input = "chars_wall_slide.txt"
updates = 360
fields = ["player", "camera"]

[original]
slot = 1
patches = ["scripted-pad", "right-stick"]
