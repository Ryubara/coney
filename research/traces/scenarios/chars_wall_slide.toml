# Sliding along a wall: Rembrandt (slot 1) put 7 m from the full-height wall of level99's street at y -5.38 (normal -y,
# triangle 948), heading 21.7 degrees, so the stick straight up (the camera behind him) runs into it about 20 degrees
# off its normal. The walk into it is chars_wall_slide_walk: until 2026-11-28 it was this scenario's second trial,
# put back at the start by a setup write Coney has no step for (#1696). Research: docs/research/characters-ground.md#walls
# (sliding along a wall).
description = "level99 street: running into the wall at y -5.38 about 20 degrees off its normal"
research = "docs/research/characters-ground.md#walls"
input = "chars_wall_slide.txt"
updates = 180
fields = ["player", "camera"]

[original]
slot = 1
patches = ["scripted-pad", "right-stick"]
setup = [
  { address = "tf(player) + 0x0", type = "f32", value = "59.5", frame = 0, until = 2 },
  { address = "tf(player) + 0x4", type = "f32", value = "-12.4", frame = 0, until = 2 },
  { address = "tf(player) + 0x8", type = "f32", value = "0.223", frame = 0, until = 2 },
  { address = "tf(player) + 0x10", type = "f32", value = "0.0", frame = 0, until = 2 },
  { address = "tf(player) + 0x14", type = "f32", value = "0.0", frame = 0, until = 2 },
  { address = "tf(player) + 0x18", type = "f32", value = "0.1882", frame = 0, until = 2 },
  { address = "tf(player) + 0x1c", type = "f32", value = "0.9821", frame = 0, until = 2 },
]

[coney]
# On Coney (2026-11-28) the run and its first updates against the wall match the original's (the speed 7.80, 2.65,
# 1.18, 0.68 m/s); then the follow camera turns along the wall faster than the original's and turns him with it, so he
# slides further, and Coney's clip falls to the walk (408) at the slide's 0.43 m/s where the original's stays 410.
level = "level99"
args = ["--checkpoint", "3", "--start", "59.5,-12.4,0.223,21.7,5.3,21.7"]
wait_for_control = true          # checkpoint 3 opens with the scene l99_c3, which holds the pad (#1680)
settle = 40                      # the stick comes after 40 updates of control, as in the slot (#1696)
