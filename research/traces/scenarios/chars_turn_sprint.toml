# The turn per update in a sprint: a sprint (L2) turned 90 degrees right, then let go at the sprint's speed (the run
# stop after a sprint). Research: docs/research/characters-locomotion.md#locomotion (step 4, Turn; step 3, Skid). Slot 1
# (the street); the state-code and skid-test hooks show the skid's code 9 and its caller.
description = "level99 street: a sprint turned 90 degrees, then let go"
research = "docs/research/characters-locomotion.md#locomotion"
input = "chars_turn_sprint.txt"
updates = 140
fields = ["player", "camera"]

[original]
slot = 1
patches = ["scripted-pad", "right-stick", "state-code", "skid-test"]

[coney]
level = "level99"
args = ["--checkpoint", "3", "--start", "75.155,41.1354,0.2231,91.909,5.3,89.854"]
settle = 300

[diff]
start_frame = true
columns = ["x", "y", "heading", "speed", "gait", "clip"]
tolerance = { x = 0.1, y = 0.1, heading = 1.0, speed = 0.05, gait = 0, clip = 0 }
