# Square's struggle gate in Player_UpdateGrabbed (0x0027fd68): the puppet PoizoCiv (power class 2, 200 power) grabs
# the still player 1 m ahead at update 10, as moves_grab_front_strike starts its grab; at 50 the player's power is set
# to `own` and the grabber's to `grabber`, and with `rage` 1 the player's raging flag 0x80000 (human +0xe0, which
# Human_PowerFraction 0x00226510 reads as a full meter) is set from 50 to 70. The player taps square at 56: clip 96
# means he struggled. Defaults own 400, grabber 200, rage 0; `--let` gives the others. Started from the state
# library's pedestrian-grab (slot 6). Research: docs/research/combat-grabs.md#grabbed.
description = "slot 6: held by the puppet, the player's power and the grabber's set, then square tapped"
research = "docs/research/combat-grabs.md#grabbed"
input = "grab_struggle_gate.txt"
updates = 90
fields = ["player", "enemy"]

[original]
slot = 6
patches = ["scripted-pad", "right-stick", "puppet"]
let = { enemy = 'human("PoizoCiv")', own = '400', grabber = '200', rage = '0' }
setup = [
  { address = "rec(player) + 0x144", type = "s16", value = "900", frame = 0, until = 0 },
  { address = "prec(enemy) + 0x1e", type = "u8", value = "0", frame = 0, until = 0 },
  { address = "tf(enemy) + 0x0", type = "f32", value = "f32(tf(player)) - 1.0 * sin(heading(player))", until = 9 },
  { address = "tf(enemy) + 0x4", type = "f32", value = "f32(tf(player) + 4) + 1.0 * cos(heading(player))", until = 9 },
  { address = "tf(enemy) + 0x8", type = "f32", value = "f32(tf(player) + 8)", until = 9 },
  { address = "tf(enemy) + 0x18", type = "f32", value = "sin((heading(player) + pi) / 2)", until = 9 },
  { address = "tf(enemy) + 0x1c", type = "f32", value = "cos((heading(player) + pi) / 2)", until = 9 },
  { address = "enemy + 0xc8", type = "u32", value = "u32(player + 0x90)", frame = 0, until = 12 },
  { address = "brain(enemy) + 0x124", type = "u32", value = "u32(player + 0x90)", frame = 0, until = 12 },
  { address = "prec(enemy) + 0x20", type = "u32", value = "13", frame = 10, until = 10 },
  { address = "prec(enemy) + 0x20", type = "u32", value = "0", frame = 11, until = 11 },
  { address = "rec(player) + 0x148", type = "s16", value = "own", frame = 50, until = 55 },
  { address = "rec(enemy) + 0x148", type = "s16", value = "grabber", frame = 50, until = 55 },
  { address = "player + 0xe0", type = "u32", value = "u32(player + 0xe0) | (rage * 0x80000)", frame = 50, until = 70 },
]

[coney]
level = "sandbox:combat"
