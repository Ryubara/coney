# The objective messages of HUD_SetObjective (0x001dad88), called through the call hook with texts of our own written
# into empty memory (0x000d0000): a new objective (mode 0) and its completion (mode 2) in slot 0, the same in slot 1,
# then a completion while the next objective waits in the scroll-in queue. The fields sample the scroll-in queue
# (HUD 0x00600840 + 0x8dd0) and the announcement widget (+0xe340) every update.
# Research: docs/research/hud.md#objectives-hudsetobjective
description = "slot 1, no input: objectives set and completed by HUD_SetObjective; the scroll-in queue and announcement"
research = "docs/research/hud.md#objectives-hudsetobjective"
input = "objective_messages.txt"
updates = 700
fields = []

# The showing scroll-in message's text (0 when none), its start time, the pool's free entries (5 when the queue is
# empty and nothing shows) and whether the announcement widget shows.
[[field]]
name = "scroll_text"
address = "0x00609678"
type = "u32"

[[field]]
name = "scroll_start"
address = "0x00609b5c"
type = "u32"

[[field]]
name = "scroll_free"
address = "u32(0x00609b58) + 8"
type = "s32"

[[field]]
name = "announce_on"
address = "0x0060eb84"
type = "u32"

[[field]]
name = "game_time"
address = "u32(0x0050b734) + 0x48"
type = "u32"

[original]
slot = 1
patches = ["scripted-pad", "call-brains"]
setup = [
  # 0x000d0000 "Reach the park", 0x000d0040 "Find the bonus", 0x000d0080 "Lose the cops", 0x000d00c0 "Meet Cleon".
