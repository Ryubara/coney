description = "slot 6: cross (X1) at PoizoCiv standing still (its walk stopped: per-player record +0x1e = 0, no stick, its brain off (+0x08 = 0) with its move speed +0x114 at 0) 1.6 m ahead, placed until update 30 and then free; the hands' and the target's bone positions and rotations every update, the steer's goal (+0x310), velocity (+0x2e0), time left (+0x300) and flag (+0x331), and bone-cache entry 0 (the clip's root motion)"
research = "docs/research/combat-moves.md"
input = "moves_reachX1_16_steer.txt"
updates = 70
fields = ["player", "enemy"]

[original]
slot = 6
patches = ["scripted-pad", "right-stick", "puppet", "strike-contact", "strike-shape"]
let = { enemy = 'human("PoizoCiv")' }
setup = [
  { address = "prec(enemy) + 0x1e", type = "u8", value = "0", frame = 0, until = 0 },
  { address = "prec(enemy) + 0x10", type = "f32", value = "0", frame = 0, until = 70 },
  { address = "prec(enemy) + 0x14", type = "f32", value = "0", frame = 0, until = 70 },
  { address = "brain(enemy) + 0x08", type = "u8", value = "0", frame = 0, until = 70 },
  { address = "brain(enemy) + 0x114", type = "f32", value = "0", frame = 0, until = 70 },
  { address = "rec(player) + 0x144", type = "s16", value = "900", frame = 0, until = 0 },
  { address = "rec(player) + 0x148", type = "s16", value = "400", frame = 0, until = 0 },
  { address = "rec(enemy) + 0x144", type = "s16", value = "600", frame = 0, until = 0 },
  { address = "tf(enemy) + 0x0", type = "f32", value = "f32(tf(player)) - 1.6 * sin(heading(player))", until = 30 },
  { address = "tf(enemy) + 0x4", type = "f32", value = "f32(tf(player) + 4) + 1.6 * cos(heading(player))", until = 30 },
  { address = "tf(enemy) + 0x8", type = "f32", value = "f32(tf(player) + 8)", until = 30 },
  { address = "tf(enemy) + 0x18", type = "f32", value = "sin((heading(player) + pi) / 2)", until = 30 },
  { address = "tf(enemy) + 0x1c", type = "f32", value = "cos((heading(player) + pi) / 2)", until = 30 },]

