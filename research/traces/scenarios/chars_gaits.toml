# The gaits by stick magnitude: the stick held straight up from standing at 10, 13, 35, 50, 94, 96 and 100 %, each
# released, then a run reversed. Research: docs/research/characters-locomotion.md#locomotion (Gaits at runtime, Per
# update). Slot 1 (the street); the state-code and skid-test hooks show which releases play the run stop (code 9).
description = "level99 street: walk and run starts by stick magnitude, their releases, and a run reversed"
research = "docs/research/characters-locomotion.md#locomotion"
input = "chars_gaits.txt"
updates = 520
fields = ["player", "camera"]

[original]
slot = 1
patches = ["scripted-pad", "right-stick", "state-code", "skid-test"]

[coney]
level = "level99"
args = ["--checkpoint", "3", "--start", "75.155,41.1354,0.2231,91.909,5.3,89.854"]
wait_for_control = true          # checkpoint 3 opens with the scene l99_c3, which holds the pad (#1680)

[diff]
start_frame = true
columns = ["x", "y", "heading", "speed", "gait", "clip"]
tolerance = { x = 0.05, y = 0.05, heading = 0.5, speed = 0.05, gait = 0, clip = 0 }
