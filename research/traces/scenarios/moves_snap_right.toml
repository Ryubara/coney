description = "slot 6: stick full to the right of the facing and square on the same update, PoizoCiv 1.0 m there: the snap"
research = "docs/research/combat-moves.md"
input = "moves_snap_right.txt"
updates = 60
fields = ["player", "enemy"]

[original]
slot = 6
patches = ["scripted-pad", "right-stick", "puppet", "strike-contact", "strike-shape"]
let = { enemy = 'human("PoizoCiv")' }
setup = [
  { address = "rec(player) + 0x144", type = "s16", value = "900", frame = 0, until = 0 },
  { address = "rec(player) + 0x148", type = "s16", value = "400", frame = 0, until = 0 },
  { address = "rec(enemy) + 0x144", type = "s16", value = "600", frame = 0, until = 0 },
  { address = "tf(enemy) + 0x0", type = "f32", value = "f32(tf(player)) - 1.0 * sin((heading(player) + rad(-90.0)))", until = 20 },
  { address = "tf(enemy) + 0x4", type = "f32", value = "f32(tf(player) + 4) + 1.0 * cos((heading(player) + rad(-90.0)))", until = 20 },
  { address = "tf(enemy) + 0x8", type = "f32", value = "f32(tf(player) + 8)", until = 20 },
  { address = "tf(enemy) + 0x18", type = "f32", value = "sin(((heading(player) + rad(-90.0)) + pi) / 2)", until = 20 },
  { address = "tf(enemy) + 0x1c", type = "f32", value = "cos(((heading(player) + rad(-90.0)) + pi) / 2)", until = 20 },
  { address = "player + 0xc8", type = "u32", value = "0", until = 20 },]

[coney]
level = "sandbox:combat"
args = ["--spawn", "start"]
