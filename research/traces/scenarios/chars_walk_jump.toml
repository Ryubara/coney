# A walk (slot 1, the street): the stick at 80 % straight up from the start, triangle tapped 40 updates in.
# Unit 364 (the characters research split). The anim state (record +0x18) and the state flags' high word show whether
# the jump starts. Research: docs/research/characters-traversal.md#jump.
description = "level99 street: a walk at stick 80 %, triangle tapped 40 updates in"
research = "docs/research/characters-traversal.md#jump"
input = "chars_walk_jump.txt"
updates = 110
fields = ["player"]

[original]
slot = 1
patches = ["scripted-pad", "right-stick"]

[coney]
level = "level99"

[[field]]
name = "state_hi"                         # record +0x04, the state flags' high word (0x4 jump, 0x8 air, 0x20 land)
address = "rec(player) + 0x4"
type = "u32"

[[field]]
name = "anim_state"                       # record +0x18
address = "rec(player) + 0x18"
type = "s32"
