# The power-move camera (Cam_Power, type 6) through a grab power strike: grab PoizoCiv 1.0 m ahead (circle), then cross
# held and square (the power strike, anim id 57); power_camera_ext adds cross taps in its window (the extension, 59) and
# power_camera_rage starts rage first (63, then 65). Read every update: the current camera (0x005d9150), its view, the
# power camera's state (0x005d9188: shot count, current and alternate shot, valid mask, mode, the human's transform at the
# begin and the eight stored shots). Research: docs/research/camera.md#power-camera.
description = "slot 6: grab PoizoCiv 1.0 m ahead, cross held + square, then cross taps: the power camera through the extended power move"
research = "docs/research/camera.md#power-camera"
input = "power_camera_ext.txt"
updates = 330
fields = ["player"]

[original]
slot = 6
patches = ["scripted-pad", "right-stick", "puppet"]
let = { enemy = 'human("PoizoCiv")' }
setup = [
  { address = "rec(player) + 0x148", type = "s16", value = "400", frame = 0, until = 0 },
  { address = "rec(enemy) + 0x144", type = "s16", value = "900", frame = 0, until = 0 },
  { address = "prec(enemy) + 0x1e", type = "u8", value = "0", frame = 0, until = 0 },
  { address = "tf(enemy) + 0x0", type = "f32", value = "f32(tf(player)) - 1.0 * sin(heading(player))", until = 9 },
  { address = "tf(enemy) + 0x4", type = "f32", value = "f32(tf(player) + 4) + 1.0 * cos(heading(player))", until = 9 },
  { address = "tf(enemy) + 0x8", type = "f32", value = "f32(tf(player) + 8)", until = 9 },
  { address = "tf(enemy) + 0x18", type = "f32", value = "sin((heading(player) + pi) / 2)", until = 9 },
  { address = "tf(enemy) + 0x1c", type = "f32", value = "cos((heading(player) + pi) / 2)", until = 9 },
]

[coney]
level = "sandbox:combat"
args = ["--spawn", "start"]

[[field]]
name = "cur_vtable"                       # the current camera's class: 0x535d50 follow, 0x536b10 power
