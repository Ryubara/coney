# A run jump on flat ground (unit 364, the characters research split): slot 1 stands Rembrandt in level99's street; the
# stick at 100 % from the start and triangle tapped 35 updates in. `shift` (default 0; `--let shift=0.05`)
# is added to his feet's height after the sample of frame 42 (the 7th update in the air), moving the arc's phase
# against the ground to find which update lands. The anim state (record +0x18) and the state flags show the jump, the
# fall and the landing.
# Research: docs/research/characters-ground.md#falling, docs/research/characters-traversal.md#jump.
description = "level99 street: a run jump, triangle 35 updates in; `shift` m added to the feet in the air"
research = "docs/research/characters-ground.md#falling"
input = "chars_run_jump.txt"
updates = 110
fields = ["player"]

[original]
slot = 1
patches = ["scripted-pad", "right-stick"]
let = { shift = "0" }
setup = [
  { address = "tf(player) + 0x8", type = "f32", value = "f32(tf(player) + 0x8) + shift", frame = 42, until = 42 },
]

[coney]
level = "level99"
args = ["--checkpoint", "3", "--start", "75.155,41.1354,0.2231,91.909,5.3,89.854"]
wait_for_control = true          # checkpoint 3 opens with the scene l99_c3, which holds the pad (#1680)

[[field]]
name = "state_hi"                         # record +0x04, the state flags' high word (0x4 jump, 0x8 air, 0x20 land)
address = "rec(player) + 0x4"
type = "u32"

[[field]]
name = "anim_state"                       # record +0x18
address = "rec(player) + 0x18"
type = "s32"
