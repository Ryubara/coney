description = "slot 6: the special 653 knocks PoizoCiv down; once down it is put 1.0 m in front of the player, then cross at it"
research = "docs/research/combat-moves.md"
input = "moves_grounded_cross.txt"
updates = 110
fields = ["player", "enemy"]

[original]
slot = 6
patches = ["scripted-pad", "right-stick", "puppet", "strike-contact", "strike-shape"]
let = { enemy = 'human("PoizoCiv")' }
setup = [
  { address = "rec(player) + 0x144", type = "s16", value = "900", frame = 0, until = 0 },
  { address = "rec(player) + 0x148", type = "s16", value = "400", frame = 0, until = 0 },
  { address = "rec(enemy) + 0x144", type = "s16", value = "600", frame = 0, until = 0 },
  { address = "tf(enemy) + 0x0", type = "f32", value = "f32(tf(player)) - 1.2 * sin((heading(player) + rad(0.0)))", until = 9 },
  { address = "tf(enemy) + 0x4", type = "f32", value = "f32(tf(player) + 4) + 1.2 * cos((heading(player) + rad(0.0)))", until = 9 },
  { address = "tf(enemy) + 0x8", type = "f32", value = "f32(tf(player) + 8)", until = 9 },
  { address = "tf(enemy) + 0x18", type = "f32", value = "sin(((heading(player) + rad(0.0)) + pi) / 2)", until = 9 },
  { address = "tf(enemy) + 0x1c", type = "f32", value = "cos(((heading(player) + rad(0.0)) + pi) / 2)", until = 9 },
  { address = "tf(enemy) + 0x0", type = "f32", value = "f32(tf(player)) - 1.0 * sin(heading(player))", frame = 52, until = 60 },
  { address = "tf(enemy) + 0x4", type = "f32", value = "f32(tf(player) + 4) + 1.0 * cos(heading(player))", frame = 52, until = 60 },]

[coney]
level = "sandbox:combat"
args = ["--spawn", "start"]
