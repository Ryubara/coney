# An AI teammate's tandem: the player grabs PoizoCiv from the front, spins him to the rear hold with R1, and Ash (the
# player's ally, its own AI) is placed in front of PoizoCiv and given GoalFight at him. Does Ash's attack action pick
# the tandem (command 0xd through Player_GrabOrTackle into Tandem_Start)? Research: docs/research/combat-moves.md#tandem.
description = "slot 6: PoizoCiv in the player's rear hold, Ash 1.3 m in front of him with GoalFight at him: an AI tandem"
research = "docs/research/combat-moves.md#tandem"
input = "moves_tandem_ai.txt"
updates = 260
fields = ["player", "held"]

[original]
slot = 6
patches = ["scripted-pad", "right-stick", "call-brains", "set-command", "anim-dispatch"]
let = { enemy = 'human("PoizoCiv")', other = 'human("Ash")' }
setup = [
  { address = "rec(player) + 0x144", type = "s16", value = "900", frame = 0, until = 0 },
  { address = "rec(player) + 0x148", type = "s16", value = "400", frame = 0, until = 0 },
  { address = "rec(enemy) + 0x144", type = "s16", value = "600", frame = 0, until = 0 },
  { address = "tf(enemy) + 0x0", type = "f32", value = "f32(tf(player)) - 1.0 * sin(heading(player))", until = 9 },
  { address = "tf(enemy) + 0x4", type = "f32", value = "f32(tf(player) + 4) + 1.0 * cos(heading(player))", until = 9 },
  { address = "tf(enemy) + 0x8", type = "f32", value = "f32(tf(player) + 8)", until = 9 },
  { address = "tf(enemy) + 0x18", type = "f32", value = "sin((heading(player) + pi) / 2)", until = 9 },
  { address = "tf(enemy) + 0x1c", type = "f32", value = "cos((heading(player) + pi) / 2)", until = 9 },
  # Ash's brain (type 3 in this state, which never ran the fight) made a type-2 (gang soldier) brain as civ_approach
  # does: enabled, not suspended, not dead, type 2, the type's three handlers, a threat response of 2.
  { address = "brain(other) + 0x08", type = "u8", value = "1", frame = 74, until = 74 },
  { address = "brain(other) + 0x0a", type = "u8", value = "0", frame = 74, until = 74 },
  { address = "brain(other) + 0x09", type = "u8", value = "0", frame = 74, until = 74 },
  { address = "brain(other) + 0x04", type = "s32", value = "2", frame = 74, until = 74 },
  { address = "brain(other) + 0x14", type = "u32", value = "u32(0x00715540)", frame = 74, until = 74 },
  { address = "brain(other) + 0x18", type = "u32", value = "u32(0x00715544)", frame = 74, until = 74 },
  { address = "brain(other) + 0x1c", type = "u32", value = "u32(0x00715578)", frame = 74, until = 74 },
  { address = "brain(other) + 0x20", type = "u32", value = "u32(0x0071557c)", frame = 74, until = 74 },
  { address = "brain(other) + 0x24", type = "u32", value = "u32(0x007155b0)", frame = 74, until = 74 },
  { address = "brain(other) + 0x28", type = "u32", value = "u32(0x007155b4)", frame = 74, until = 74 },
  { address = "brain(other) + 0x21c", type = "s32", value = "2", frame = 74, until = 74 },
  # Ash 1.3 m beyond PoizoCiv (in front of him once he faces away in the rear hold), facing him and the player.
  { address = "tf(other) + 0x0", type = "f32", value = "f32(tf(enemy)) - 1.3 * sin(heading(player))", frame = 75, until = 77 },
  { address = "tf(other) + 0x4", type = "f32", value = "f32(tf(enemy) + 4) + 1.3 * cos(heading(player))", frame = 75, until = 77 },
  { address = "tf(other) + 0x8", type = "f32", value = "f32(tf(enemy) + 8)", frame = 75, until = 77 },
  { address = "tf(other) + 0x18", type = "f32", value = "sin((heading(player) + pi) / 2)", frame = 75, until = 77 },
  { address = "tf(other) + 0x1c", type = "f32", value = "cos((heading(player) + pi) / 2)", frame = 75, until = 77 },
]
calls = [
  # Brain_ClearGoals(Ash), then GoalFight(Ash, PoizoCiv) (0x002b2b90).
  { function = "0x0028d910", args = ["brain(other)"], frame = 76 },
  # GangMakeEnemies(Ash's gang, PoizoCiv's gang), as civ_approach does.
  { function = "0x0016acf0", args = ["(u32(brain(other) + 0x20c) - 0x005e6e30) // 0xb10", "(u32(brain(enemy) + 0x20c) - 0x005e6e30) // 0xb10"], frame = 77 },
  { function = "0x002b2b90", args = ["u32(other + 0x90)", "u32(enemy + 0x90)"], frame = 78 },
]

[coney]
level = "sandbox:combat"
args = ["--spawn", "start"]

