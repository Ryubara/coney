  { address = "rec(player) + 0x148", type = "s16", value = "400", frame = 0, until = 0 },
  { address = "rec(enemy) + 0x144", type = "s16", value = "600", frame = 0, until = 0 },
  { address = "tf(enemy) + 0x0", type = "f32", value = "f32(tf(player)) - 1.0 * sin(heading(player))", until = 15 },
  { address = "tf(enemy) + 0x4", type = "f32", value = "f32(tf(player) + 4) + 1.0 * cos(heading(player))", until = 15 },
  { address = "tf(enemy) + 0x8", type = "f32", value = "f32(tf(player) + 8)", until = 15 },
  { address = "tf(enemy) + 0x18", type = "f32", value = "sin((heading(player) + pi) / 2)", until = 15 },
  { address = "tf(enemy) + 0x1c", type = "f32", value = "cos((heading(player) + pi) / 2)", until = 15 },
  { address = "0x000c0000", type = "u32", value = "0x5f6e7964", frame = 0, until = 0 },
  { address = "0x000c0004", type = "u32", value = "0x72656562", frame = 0, until = 0 },
  { address = "0x000c0008", type = "u32", value = "0x74746f62", frame = 0, until = 0 },
  { address = "0x000c000c", type = "u32", value = "0x0000656c", frame = 0, until = 0 },
