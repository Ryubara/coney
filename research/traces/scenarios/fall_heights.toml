# Falls from several heights (issue #111): slot 1 stands Rembrandt in level99's street; at frame 5 his feet are put
# `rise` metres up (default 120; `trace original --let rise=20` for another height) and he falls with the stick at rest.
# The trace shows the follow camera every update on the way down and after the landing: its position, look-at point,
# distance and pitch, the aim point the view faces and its lag, and the player's height and vertical speed.
# Research: docs/research/camera.md#long-fall.
description = "level99 street: the player put `rise` m up falls; the follow camera every update"
research = "docs/research/camera.md#long-fall"
input = "fall_high.txt"
updates = 300
fields = ["player", "camera", "fall"]

[original]
slot = 1
patches = ["scripted-pad", "right-stick"]
let = { rise = "120" }
setup = [ { address = "tf(player) + 0x8", type = "f32", value = "f32(tf(player) + 0x8) + rise", frame = 5, until = 5 } ]

[coney]
level = "level99"
args = ["--checkpoint", "3", "--start", "75.155,41.1354,0.2231,91.909,5.3,89.854"]
settle = 300

[diff]
columns = ["z", "vz", "cam_z", "cam_pitch", "view_pitch"]
tolerance = { z = 0.1, vz = 0.05, cam_z = 0.2, cam_pitch = 2.0, view_pitch = 2.0 }
