# slot 6: PoizoCiv placed 1.0 m ahead and grabbed with circle (a front hold), then thrown straight ahead (147 / 148)
# with the stick held ahead at 0.6 after it. The grab locks the player (state 0x45); does the lock-on movement
# (Human_FightStanceMove 0x00241b90) come back after the throw, and when are the stance and the target dropped while
# the body flies 5.5-7 m? Research: docs/research/combat-targets.md#fight-stance.
description = "slot 6: grab PoizoCiv 1.0 m ahead, throw him straight ahead, then the stick ahead: the stance, lock, target and movement through the throw"
research = "docs/research/combat-targets.md#fight-stance"
input = "target_throw_end.txt"
updates = 130
fields = ["player"]

[original]
slot = 6
patches = ["scripted-pad", "right-stick", "puppet"]
let = { enemy = 'human("PoizoCiv")' }
setup = [
  { address = "rec(player) + 0x148", type = "s16", value = "400", frame = 0, until = 0 },
  { address = "rec(enemy) + 0x144", type = "s16", value = "900", frame = 0, until = 0 },
  { address = "prec(enemy) + 0x1e", type = "u8", value = "0", frame = 0, until = 0 },
  { address = "tf(enemy) + 0x0", type = "f32", value = "f32(tf(player)) - 1.0 * sin(heading(player))", until = 9 },
  { address = "tf(enemy) + 0x4", type = "f32", value = "f32(tf(player) + 4) + 1.0 * cos(heading(player))", until = 9 },
  { address = "tf(enemy) + 0x8", type = "f32", value = "f32(tf(player) + 8)", until = 9 },
  { address = "tf(enemy) + 0x18", type = "f32", value = "sin((heading(player) + pi) / 2)", until = 9 },
  { address = "tf(enemy) + 0x1c", type = "f32", value = "cos((heading(player) + pi) / 2)", until = 9 },
]

[coney]
level = "sandbox:combat"
args = ["--spawn", "start"]

[[field]]
name = "state"                            # record +0x00 (0x1 stance, 0x4 lock, 0x8 L1, 0x40 grabbing)
address = "rec(player) + 0x0"
type = "u32"

[[field]]
name = "held"                             # record +0x08, the held flags (the stance update's busy gate 0x5c7fee0)
address = "rec(player) + 0x8"
type = "u32"

[[field]]
name = "target"                           # human +0xc8, the target's handle index (-1 none)
value = "hidx(u32(player + 0xc8))"

[[field]]
name = "move"                             # human +0x1c0, the movement state (0x241b90 lock-on, 0x240e38 free,
address = "player + 0x1c0"                # 0x245310 grabbing)
type = "u32"

[[field]]
name = "enemy_state"                      # PoizoCiv's record +0x00
address = "rec(enemy) + 0x0"
type = "u32"

[[field]]
name = "dist"
value = "hypot(f32(tf(player)) - f32(tf(enemy)), f32(tf(player) + 4) - f32(tf(enemy) + 4))"
