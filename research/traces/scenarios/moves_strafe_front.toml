description = "slot 6: L1 held on PoizoCiv 2.6 m ahead, the stick full towards it for 6 updates, then square: the forward strafe attack"
research = "docs/research/combat-moves.md"
input = "moves_strafe_front.txt"
updates = 80
fields = ["player", "enemy"]

[original]
slot = 6
patches = ["scripted-pad", "right-stick", "puppet", "strike-contact", "strike-shape"]
let = { enemy = 'human("PoizoCiv")' }
setup = [
  { address = "rec(player) + 0x144", type = "s16", value = "900", frame = 0, until = 0 },
  { address = "rec(player) + 0x148", type = "s16", value = "400", frame = 0, until = 0 },
  { address = "rec(enemy) + 0x144", type = "s16", value = "600", frame = 0, until = 0 },
  { address = "tf(enemy) + 0x0", type = "f32", value = "f32(tf(player)) - 2.6 * sin((heading(player) + rad(0.0)))", until = 21 },
  { address = "tf(enemy) + 0x4", type = "f32", value = "f32(tf(player) + 4) + 2.6 * cos((heading(player) + rad(0.0)))", until = 21 },
  { address = "tf(enemy) + 0x8", type = "f32", value = "f32(tf(player) + 8)", until = 21 },
  { address = "tf(enemy) + 0x18", type = "f32", value = "sin(((heading(player) + rad(0.0)) + pi) / 2)", until = 21 },
  { address = "tf(enemy) + 0x1c", type = "f32", value = "cos(((heading(player) + rad(0.0)) + pi) / 2)", until = 21 },
]

[coney]
level = "sandbox:combat"
args = ["--spawn", "start"]
