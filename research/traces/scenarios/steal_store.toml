# level80's pharmacy (the mission 2 store, zone 24, store front storePharmacy01 at (-242, 226.9, 1.2)), from the
# level80 checkpoint 1 "Let's Go" state of the revive pass: after the follow command, Cleon, Vermin and Rembrandt are
# put inside the store and the steal command (5) is given through WarriorCommand_Dispatch (0x0041c4e0, forced). The
# hooks log each claim on a cluster, each GetItem swing at glass, each AI pick-up press and search, each
# Human_PickUpObject, each Item_TakeOwned (message 7) and each Inventory_AddItem; the fields follow the crew, the
# cluster count and player 1's money and loot. Research: docs/research/ai-code.md#t2-warrior-steal,
# docs/research/crimes.md#owned-items, docs/research/ai/index.md#get-item. The state is a file of your own (not a slot).
description = "level80 pharmacy: the crew's steal (command 5) inside the store; claims, takes, messages, money"
research = "docs/research/crimes.md#owned-items"
input = "steal_store.txt"
updates = 1800
fields = ["player"]

[original]
state = "research-revive/l80_letsgo_clean.p2s"
patches = ["scripted-pad", "right-stick", "call-brains", "anim-dispatch", "say-command", "take-owned", "steal-claim",
  "getitem-glass", "pickup-action", "pickup-search", "pick-up", "inventory-add", "glass-break"]
let = { v = 'human("Vermin")', r = 'human("Rembrandt")' }
setup = [
  # Inside the pharmacy, 2-3 m behind the store front, for three updates.
  { address = "tf(player) + 0x0", type = "f32", value = "-242.5", frame = 60, until = 62 },
  { address = "tf(player) + 0x4", type = "f32", value = "224.5", frame = 60, until = 62 },
  { address = "tf(player) + 0x8", type = "f32", value = "1.25", frame = 60, until = 62 },
  { address = "tf(v) + 0x0", type = "f32", value = "-243.5", frame = 60, until = 62 },
  { address = "tf(v) + 0x4", type = "f32", value = "223.5", frame = 60, until = 62 },
  { address = "tf(v) + 0x8", type = "f32", value = "1.25", frame = 60, until = 62 },
  { address = "tf(r) + 0x0", type = "f32", value = "-241.5", frame = 60, until = 62 },
  { address = "tf(r) + 0x4", type = "f32", value = "223.5", frame = 60, until = 62 },
  { address = "tf(r) + 0x8", type = "f32", value = "1.25", frame = 60, until = 62 },
  # Commands unlocked, player 1's menu unlocked, command 5 enabled for player 1 (game state +0x41e + 5).
  { address = "u32(0x0051489c) + 0x411", type = "u8", value = "0", frame = 64 },
  { address = "u32(0x0051489c) + 0x42e", type = "u8", value = "0", frame = 64 },
  { address = "u32(0x0051489c) + 0x423", type = "u8", value = "1", frame = 64 },
]
calls = [
  # WarriorCommand_Dispatch(state, chief, 5, forced, no position, 0).
  { function = "0x0041c4e0", args = ["u32(0x0051489c)", "player", "5", "1", "0", "0"], frame = 66 },
]

[[field]]
name = "money"
address = "u32(0x0051489c) + 0x4fc"
type = "s32"
follow = true

[[field]]
name = "loot"
address = "u32(0x0051489c) + 0x65c"
type = "s32"
follow = true

[[field]]
name = "clusters"
address = "0x00511650"
type = "u32"

[[field]]
name = "v_x"
address = "tf(v) + 0x0"
type = "f32"

[[field]]
name = "v_y"
address = "tf(v) + 0x4"
type = "f32"

[[field]]
name = "v_clip"
address = "rec(v) + 0x20"
type = "s32"

[[field]]
name = "r_x"
address = "tf(r) + 0x0"
type = "f32"

[[field]]
name = "r_y"
address = "tf(r) + 0x4"
type = "f32"

[[field]]
name = "r_clip"
address = "rec(r) + 0x20"
type = "s32"

[coney]
level = "level80"
