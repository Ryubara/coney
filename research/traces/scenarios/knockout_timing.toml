# When a human beaten to 0 health is knocked out: the player's punch takes PoizoCiv (a puppet at 1 health) below 0.
# Does state 0x40000 come with the hit, or when the dying reaction's clip ends (Human_PlayDeathReaction 0x00267a00
# gives the chain's last clip Human_OnHealthOut 0x002674c0 as its end callback)?
# Research: docs/research/combat-reactions.md#knockout-timing.
description = "slot 6: square on PoizoCiv at 1 health: when state 0x40000 is set after the lethal hit"
research = "docs/research/combat-reactions.md#knockout-timing"
input = "knockout_timing.txt"
updates = 150
fields = ["player"]

[original]
slot = 6
patches = ["scripted-pad", "right-stick", "puppet", "anim-dispatch", "strike-contact"]
let = { enemy = 'human("PoizoCiv")' }
setup = [
  { address = "rec(player) + 0x144", type = "s16", value = "900", frame = 0, until = 0 },
  { address = "rec(enemy) + 0x144", type = "s16", value = "1", frame = 0, until = 0 },
  { address = "prec(enemy) + 0x1e", type = "u8", value = "0", frame = 0, until = 0 },
  { address = "tf(enemy) + 0x0", type = "f32", value = "f32(tf(player)) - 1.0 * sin(heading(player))", until = 9 },
  { address = "tf(enemy) + 0x4", type = "f32", value = "f32(tf(player) + 4) + 1.0 * cos(heading(player))", until = 9 },
  { address = "tf(enemy) + 0x8", type = "f32", value = "f32(tf(player) + 8)", until = 9 },
  { address = "tf(enemy) + 0x18", type = "f32", value = "sin((heading(player) + pi) / 2)", until = 9 },
  { address = "tf(enemy) + 0x1c", type = "f32", value = "cos((heading(player) + pi) / 2)", until = 9 },
]

[coney]
level = "sandbox:combat"
args = ["--spawn", "start"]

[[field]]
name = "target_clip"
address = "rec(enemy) + 0x20"
type = "s32"

[[field]]
name = "target_state"
address = "rec(enemy) + 0x0"
type = "u32"

[[field]]
name = "target_state_hi"
address = "rec(enemy) + 0x4"
type = "u32"

[[field]]
name = "target_held"
address = "rec(enemy) + 0x8"
type = "u32"

[[field]]
name = "target_flags"
address = "enemy + 0xe0"
type = "u32"

[[field]]
name = "target_health"
address = "rec(enemy) + 0x144"
type = "s16"
