# The sprint's start, a jump and a sprint from a run (level99 street, slot 1 = library state street-end-run): stamina
# set to 100 once, so the refill shows; L2 and the stick at 100 % up from a standstill (the refill through the run
# start, the "run with L2" block at gait 4, the drain at gait 5), L2 let go for a run that fills stamina, a jump from
# that run (the drain in the air), then L2 pressed in the run (the speed-up from the run's speed).
# Research: docs/research/characters-traversal.md#sprint.
description = "level99 street: sprint from rest below full stamina, a jump from a run, a sprint from a run"
research = "docs/research/characters-traversal.md#sprint"
input = "chars_sprint_start.txt"
updates = 150
fields = ["player", "held"]

[original]
slot = 1
patches = ["scripted-pad", "right-stick"]
setup = [
  # Once, before the input: stamina to 100 of 135.
  { address = "rec(player) + 0x14a", type = "s16", value = "100", frame = 5, until = 5 },
]

[coney]
level = "level99"
args = ["--checkpoint", "3", "--start", "75.155,41.1354,0.2231,91.909,5.3,89.854"]
wait_for_control = true          # checkpoint 3 opens with the scene l99_c3, which holds the pad (#1680)
