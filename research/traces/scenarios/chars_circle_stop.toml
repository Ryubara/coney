# Circling runs released, many times: run_circle's run and circle (the stick held left, so he circles behind the
# camera in place), let go after 60 updates of circling, then the stick held left again from standing and let go, 12
# times in all. With the state-code and skid-test hooks: which circling releases play the run stop (code 9) and the
# speed the skid test compared on each. Research: docs/research/characters-locomotion.md#run-stop. Slot 1 (the street).
description = "level99 street: 12 circling runs released; which play the run stop"
research = "docs/research/characters-locomotion.md#run-stop"
input = "chars_circle_stop.txt"
updates = 1060
fields = ["player", "camera"]

[original]
slot = 1
patches = ["scripted-pad", "right-stick", "state-code", "skid-test"]

[coney]
level = "level99"
args = ["--checkpoint", "3", "--start", "75.155,41.1354,0.2231,91.909,5.3,89.854"]
settle = 300

[diff]
start_frame = true
columns = ["x", "y", "heading", "speed", "gait", "clip"]
tolerance = { x = 0.25, y = 0.25, heading = 2.0, speed = 0.1, gait = 0, clip = 0 }
