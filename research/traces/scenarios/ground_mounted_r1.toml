# The downed player under attack (docs/research/combat-reactions.md#ground-escape): PoizoCiv, a puppet, knocks the player
# down with the special 653, is put beside him, then mounts him on the ground; the player taps R1 every 3 updates from 150, then square.
description = "slot 6: the player knocked down by a puppet's 653; mounts him on the ground; the player taps R1 every 3 updates from 150, then square"
research = "docs/research/combat-reactions.md#ground-escape"
input = "ground_mounted_r1.txt"
updates = 300
fields = ["player", "enemy", "down"]

[original]
slot = 6
patches = ["scripted-pad", "right-stick", "puppet", "anim-dispatch", "strike-contact"]
let = { enemy = 'human("PoizoCiv")' }
setup = [
  { address = "rec(player) + 0x144", type = "s16", value = "900", frame = 0, until = 0 },
  { address = "rec(player) + 0x148", type = "s16", value = "400", frame = 0, until = 0 },
  { address = "rec(enemy) + 0x144", type = "s16", value = "600", frame = 0, until = 0 },
  { address = "rec(enemy) + 0x148", type = "s16", value = "400", frame = 0, until = 0 },
  { address = "tf(enemy) + 0x0", type = "f32", value = "f32(tf(player)) - 1.0 * sin(heading(player))", until = 9 },
  { address = "tf(enemy) + 0x4", type = "f32", value = "f32(tf(player) + 4) + 1.0 * cos(heading(player))", until = 9 },
  { address = "tf(enemy) + 0x8", type = "f32", value = "f32(tf(player) + 8)", until = 9 },
  { address = "tf(enemy) + 0x18", type = "f32", value = "sin((heading(player) + pi) / 2)", until = 9 },
  { address = "tf(enemy) + 0x1c", type = "f32", value = "cos((heading(player) + pi) / 2)", until = 9 },
  { address = "prec(enemy) + 0x1e", type = "u8", value = "0", frame = 0, until = 0 },
  { address = "enemy + 0xc8", type = "u32", value = "u32(player + 0x90)", frame = 0, until = 400 },
  { address = "brain(enemy) + 0x124", type = "u32", value = "u32(player + 0x90)", frame = 0, until = 400 },
  { address = "0x005104b8", type = "u32", value = "0", frame = 0, until = 0 },
  # the special 653 (cross + square, command 0x22) knocks the player down
  { address = "prec(enemy) + 0x20", type = "u32", value = "34", frame = 10, until = 10 },
  { address = "prec(enemy) + 0x20", type = "u32", value = "0", frame = 11, until = 11 },
  # once he lies, the puppet is put 0.8 m from him along his heading, facing him
  { address = "tf(enemy) + 0x0", type = "f32", value = "f32(tf(player)) - 0.8 * sin(heading(player))", frame = 58, until = 62 },
  { address = "tf(enemy) + 0x4", type = "f32", value = "f32(tf(player) + 4) + 0.8 * cos(heading(player))", frame = 58, until = 62 },
  { address = "tf(enemy) + 0x8", type = "f32", value = "f32(tf(player) + 8)", frame = 58, until = 62 },
  { address = "tf(enemy) + 0x18", type = "f32", value = "sin((heading(player) + pi) / 2)", frame = 58, until = 62 },
  { address = "tf(enemy) + 0x1c", type = "f32", value = "cos((heading(player) + pi) / 2)", frame = 58, until = 62 },
  { address = "prec(enemy) + 0x20", type = "u32", value = "14", frame = 84, until = 84 },
  { address = "prec(enemy) + 0x20", type = "u32", value = "0", frame = 85, until = 85 },
]

[coney]
level = "sandbox:combat"
args = ["--spawn", "start"]
