# The flash (d-pad right) asked for while the player is hit: slot 6's PoizoCiv made a type-2 fighter as civ_fight
# does, the player standing still with health held at 600 of 900 every update (so he is never knocked out) and 3
# flashes. The AI is not the same from run to run, so d-pad right is pressed by a setup write only while the player
# reacts, lies down, is stunned or held; the flash-use hook says whether Flash_Use ran at once (ra 0x00284820) or
# from clip 665's event (ra 0x002473c4). Research: docs/research/combat.md#flash-mid-move.
description = "slot 6: PoizoCiv as a type-2 fighter hits a still player, no input in the script; d-pad right pressed by setup only while he reacts, is down, stunned or held"
research = "docs/research/combat.md#flash-mid-move"
input = "flash_hit.txt"
updates = 330
fields = ["player", "held", "enemy"]

[original]
slot = 6
patches = ["scripted-pad", "right-stick", "call-brains", "flash-use"]
let = { enemy = 'human("PoizoCiv")' }
setup = [
  # Wake the brain as a type-2 (gang soldier) brain: not dead, type 2, the type's three handlers (8 bytes each from
  # the tables at 0x00715530, 0x00715568 and 0x007155a0), and a threat response of 2.
  { address = "brain(enemy) + 0x09", type = "u8", value = "0", frame = 0 },
  { address = "brain(enemy) + 0x04", type = "s32", value = "2", frame = 0 },
  { address = "brain(enemy) + 0x14", type = "u32", value = "u32(0x00715540)", frame = 0 },
  { address = "brain(enemy) + 0x18", type = "u32", value = "u32(0x00715544)", frame = 0 },
  { address = "brain(enemy) + 0x1c", type = "u32", value = "u32(0x00715578)", frame = 0 },
  { address = "brain(enemy) + 0x20", type = "u32", value = "u32(0x0071557c)", frame = 0 },
  { address = "brain(enemy) + 0x24", type = "u32", value = "u32(0x007155b0)", frame = 0 },
  { address = "brain(enemy) + 0x28", type = "u32", value = "u32(0x007155b4)", frame = 0 },
  { address = "brain(enemy) + 0x21c", type = "s32", value = "2", frame = 0 },
  # D-pad right (pad byte 0x005de3aa bit 0x20, active low) pressed only while the player reacts, lies down, is
  # stunned or held (state 0x1800f0, record +0x08 0x400), toggled every 100 ms of game time so each press is new.
  { address = "0x005de3aa", type = "u8", value = "0xff - 0x20 * min(1, (u32(rec(player)) & 0x1800f0) + (u32(rec(player) + 8) & 0x400)) * ((game_time // 100) % 2)", frame = 0, until = 330 },
  # The player at 600 of 900 every update (never knocked out, every tap a fresh test), with 3 flashes held.
  { address = "rec(player) + 0x144", type = "s16", value = "600", frame = 0, until = 330 },
  { address = "u32(0x0051489c) + 0x4d0", type = "s32", value = "3", frame = 0, until = 330 },
  # The flash command (pressed table entry 2, d-pad right) is off for pad 0 in this state (mask 0xfe): turn it on.
  { address = "0x005ddde8", type = "u16", value = "0xff", frame = 0, until = 0 },
  # 2 m in front of the player, facing him, until the fight starts.
  { address = "tf(enemy) + 0x0", type = "f32", value = "f32(tf(player)) - 2.0 * sin(heading(player))", until = 3 },
  { address = "tf(enemy) + 0x4", type = "f32", value = "f32(tf(player) + 4) + 2.0 * cos(heading(player))", until = 3 },
  { address = "tf(enemy) + 0x8", type = "f32", value = "f32(tf(player) + 8)", until = 3 },
  { address = "tf(enemy) + 0x18", type = "f32", value = "sin((heading(player) + pi) / 2)", until = 3 },
  { address = "tf(enemy) + 0x1c", type = "f32", value = "cos((heading(player) + pi) / 2)", until = 3 },
]
calls = [
  # BrFlush's goal half (Brain_ClearGoals); GoalFight clears the actions itself.
  { function = "0x0028d910", args = ["brain(enemy)"], frame = 1 },
  # GangMakeEnemies(its gang, the player's gang): gang ids from the gang records at 0x005e6e30 + id * 0xb10.
  { function = "0x0016acf0", args = ["(u32(brain(enemy) + 0x20c) - 0x005e6e30) // 0xb10", "(u32(brain(player) + 0x20c) - 0x005e6e30) // 0xb10"], frame = 2 },
  # GoalFight(enemy, player): Brain_StartFight takes the two handles (human +0x90).
  { function = "0x002b2b90", args = ["u32(enemy + 0x90)", "u32(player + 0x90)"], frame = 3 },
]

[coney]
level = "sandbox:combat"
args = ["--spawn", "start"]

# The flashes player 1 carries: Inventory_GetCount(*(0x0051489c) + 0x480, 0, 1) reads +0x24 + item 1 * 0x2c.
[[field]]
name = "flashes"
address = "u32(0x0051489c) + 0x4d0"
type = "s32"
