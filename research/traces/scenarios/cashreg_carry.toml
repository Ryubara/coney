# The store's cash register (level99, mission 1, checkpoint 2): slot 8 has the dyn_cashreg at (53.23, 57.26, 1.63).
# The setup stands the player 0.8 m south of it facing it (+y); triangle lifts it (TwoHandPickUp, 503 / 504), then he
# stands, walks (stick 60 %, the camera looks south so "down" walks north) and stands again.
# Logged: his clip, gait and move-style stack (record +0x0c depth, +0x10 the styles), anim slots 0 / 4 / 6 / 11, the held
# object's attachment (bone +0x6d, local pose +0x10 / +0x20) and its type record's hold pose (+0x00 / +0x0c).
# Research: docs/research/objects.md#two-handed.
description = "level99 store: triangle lifts the cash register, stand, walk 60 %, stand"
research = "docs/research/objects.md#two-handed"
input = "cashreg_carry.txt"
updates = 260
fields = ["player"]

[original]
slot = 8
patches = ["scripted-pad", "right-stick"]
let = { db = "u32(0x00512c04)" }
setup = [
  { address = "tf(player) + 0x0", type = "f32", value = "53.23", frame = 0, until = 2 },
  { address = "tf(player) + 0x4", type = "f32", value = "56.45", frame = 0, until = 2 },
  { address = "tf(player) + 0x10", type = "f32", value = "0", frame = 0, until = 2 },
  { address = "tf(player) + 0x14", type = "f32", value = "0", frame = 0, until = 2 },
  { address = "tf(player) + 0x18", type = "f32", value = "0", frame = 0, until = 2 },
  { address = "tf(player) + 0x1c", type = "f32", value = "1", frame = 0, until = 2 },
]

