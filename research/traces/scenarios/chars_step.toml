# heights: bottom at the floor (0.213), top 0.213 + h. Each trial of 120 updates puts Rembrandt far away for three
# updates (so the camera snaps behind him), then 1.26 m in front of the face (y 60.258), facing it (+y), and pushes the
# stick straight up. Trials (h, stick %): (0.100, 35), (0.200, 35), (0.240, 35), (0.100, 50), (0.200, 50), (0.240, 50),
# (0.245, 100), (0.255, 100), (0.260, 50), (0.300, 50), (1.000, 50).
# Research: docs/research/characters-ground.md#walls (the step at runtime).
