description = "slot 6: cross + square (653) at PoizoCiv walking in, 1.9 m ahead, placed until update 9 and then free; the hands' and the target's bone positions every update"
research = "docs/research/combat-moves.md"
input = "moves_reach653_19_walk.txt"
updates = 40
fields = ["player", "enemy"]

[original]
slot = 6
patches = ["scripted-pad", "right-stick", "puppet", "strike-contact", "strike-shape"]
let = { enemy = 'human("PoizoCiv")' }
setup = [
  { address = "rec(player) + 0x144", type = "s16", value = "900", frame = 0, until = 0 },
  { address = "rec(player) + 0x148", type = "s16", value = "400", frame = 0, until = 0 },
  { address = "rec(enemy) + 0x144", type = "s16", value = "600", frame = 0, until = 0 },
  { address = "tf(enemy) + 0x0", type = "f32", value = "f32(tf(player)) - 1.9 * sin(heading(player))", until = 9 },
  { address = "tf(enemy) + 0x4", type = "f32", value = "f32(tf(player) + 4) + 1.9 * cos(heading(player))", until = 9 },
  { address = "tf(enemy) + 0x8", type = "f32", value = "f32(tf(player) + 8)", until = 9 },
  { address = "tf(enemy) + 0x18", type = "f32", value = "sin((heading(player) + pi) / 2)", until = 9 },
  { address = "tf(enemy) + 0x1c", type = "f32", value = "cos((heading(player) + pi) / 2)", until = 9 },]

