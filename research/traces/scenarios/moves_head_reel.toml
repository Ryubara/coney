description = "slot 6: a cross combo (four taps) at PoizoCiv standing still 1.0 m ahead (brain off, its walk stopped), placed until update 30 and then free; the target's head transform (+0x500, model frame), its slot point 0 (+0x1e0), its position and heading, and bone-cache entries 0, 3 and 6, through the reels, and the player's head transform (he stands in the fight idle 358 after the combo)"
research = "docs/research/combat-moves.md"
input = "moves_head_reel.txt"
updates = 130
fields = ["player", "enemy"]

[original]
slot = 6
patches = ["scripted-pad", "right-stick", "puppet", "strike-contact", "strike-shape"]
let = { enemy = 'human("PoizoCiv")' }
setup = [
  { address = "prec(enemy) + 0x1e", type = "u8", value = "0", frame = 0, until = 0 },
  { address = "prec(enemy) + 0x10", type = "f32", value = "0", frame = 0, until = 130 },
  { address = "prec(enemy) + 0x14", type = "f32", value = "0", frame = 0, until = 130 },
  { address = "brain(enemy) + 0x08", type = "u8", value = "0", frame = 0, until = 130 },
  { address = "brain(enemy) + 0x114", type = "f32", value = "0", frame = 0, until = 130 },
  { address = "rec(player) + 0x144", type = "s16", value = "900", frame = 0, until = 0 },
  { address = "rec(player) + 0x148", type = "s16", value = "400", frame = 0, until = 0 },
  { address = "rec(enemy) + 0x144", type = "s16", value = "900", frame = 0, until = 0 },
  { address = "tf(enemy) + 0x0", type = "f32", value = "f32(tf(player)) - 1.0 * sin(heading(player))", until = 30 },
  { address = "tf(enemy) + 0x4", type = "f32", value = "f32(tf(player) + 4) + 1.0 * cos(heading(player))", until = 30 },
  { address = "tf(enemy) + 0x8", type = "f32", value = "f32(tf(player) + 8)", until = 30 },
  { address = "tf(enemy) + 0x18", type = "f32", value = "sin((heading(player) + pi) / 2)", until = 30 },
  { address = "tf(enemy) + 0x1c", type = "f32", value = "cos((heading(player) + pi) / 2)", until = 30 },
]

