# grab_circle_taps with the anim-callback hooks: circle tapped every 6 updates at a still puppet 1.0 m ahead (a plain
# grab, then the mount), logging every AnimCallback_Dispatch (who starts which anim id, and from where), every slot it
# matches and the tutorial callback. Research: docs/research/characters-animation.md#anim-callbacks.
description = "slot 6: a plain grab of a puppet 1.0 m ahead; the anim ids each human starts, their callbacks and the tutorial callback"
research = "docs/research/characters-animation.md#anim-callbacks"
input = "grab_circle_taps.txt"
updates = 140
fields = ["player", "enemy"]

[original]
slot = 6
patches = ["scripted-pad", "right-stick", "puppet", "tutorial-callback", "anim-dispatch", "anim-callback-match"]
let = { enemy = 'human("PoizoCiv")' }
setup = [
  { address = "prec(enemy) + 0x1e", type = "u8", value = "0", frame = 0, until = 0 },
  { address = "tf(enemy) + 0x0", type = "f32", value = "f32(tf(player)) - 1.0 * sin(heading(player))", until = 39 },
  { address = "tf(enemy) + 0x4", type = "f32", value = "f32(tf(player) + 4) + 1.0 * cos(heading(player))", until = 39 },
  { address = "tf(enemy) + 0x8", type = "f32", value = "f32(tf(player) + 8)", until = 39 },
  { address = "tf(enemy) + 0x18", type = "f32", value = "sin((heading(player) + pi) / 2)", until = 39 },
  { address = "tf(enemy) + 0x1c", type = "f32", value = "cos((heading(player) + pi) / 2)", until = 39 },
]

[coney]
level = "sandbox:combat"
