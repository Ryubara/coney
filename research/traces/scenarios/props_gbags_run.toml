# The street garbage bags (level99, mission 1): slot 8's dyn_gbags at (57.39, 13.72) carries RUNTARGET. Slot 8's player
# stands 5.6 m south of it and sprints into it (L2 held, the stick at 100 % down: the camera looks south). The hooks log his
