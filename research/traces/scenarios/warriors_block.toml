# level99's sparring fight (the state of warriors_passive.toml), the player attacking: square every 15 updates from
# the fight's start, auto lock-on choosing the target. Each attack warns the Warrior it aims at (brain +0x200), whose
# fight goal may push the block goal (0x1b); the hooks log the warnings, the block tries and starts, and every command
# written, and the fields the warriors' state words and human +0xe0 (the block goal's flag 0x800). Research:
# docs/research/ai.md#level99-fight.
description = "level99 sparring fight: the player presses square every 15 updates; do the type-2 Warriors block and counter?"
research = "docs/research/ai.md#level99-fight"
input = "warriors_block.txt"
updates = 1700
fields = ["player", "enemy"]

[original]
state = "states/l99-warriors-before-fight.p2s"
patches = ["scripted-pad", "right-stick", "call-brains", "set-command", "try-block", "block-start", "attack-warning"]
let = { enemy = 'human("Generic1")', g2 = 'human("Generic2")', g3 = 'human("Generic3")' }

[[field]]
name = "g2_command"
address = "prec(g2) + 0x20"
type = "u32"

[[field]]
name = "g2_clip"
address = "rec(g2) + 0x20"
type = "s32"

[[field]]
name = "g2_next_attack"
address = "brain(g2) + 0x1e8"
type = "u32"

[[field]]
name = "g2_x"
address = "tf(g2) + 0x0"
type = "f32"

[[field]]
name = "g2_y"
address = "tf(g2) + 0x4"
type = "f32"

[[field]]
name = "g3_command"
address = "prec(g3) + 0x20"
type = "u32"

[[field]]
name = "g3_clip"
address = "rec(g3) + 0x20"
type = "s32"

[[field]]
name = "g3_next_attack"
address = "brain(g3) + 0x1e8"
type = "u32"

[[field]]
name = "g3_x"
address = "tf(g3) + 0x0"
type = "f32"

[[field]]
name = "g3_y"
address = "tf(g3) + 0x4"
type = "f32"

[[field]]
name = "p_attackers"                      # the player's brain +0x1a4: the first attack slot's handle
address = "brain(player) + 0x1a4"
type = "u32"

[[field]]
name = "p_slots_max"                      # brain +0x1e4, the attack slots allowed on the player
address = "brain(player) + 0x1e4"
type = "u8"

[[field]]
name = "e_flags"                          # human +0xe0, low word: 0x800 is set by the block goal and attack actions
address = "enemy + 0xe0"
type = "u32"

[[field]]
name = "g2_state"
address = "rec(g2) + 0x0"
type = "u32"

[[field]]
name = "g2_flags"
address = "g2 + 0xe0"
type = "u32"

[[field]]
name = "g2_health"
address = "rec(g2) + 0x144"
type = "s16"

[[field]]
name = "g3_state"
address = "rec(g3) + 0x0"
type = "u32"

[[field]]
name = "g3_flags"
address = "g3 + 0xe0"
type = "u32"

[[field]]
name = "g3_health"
address = "rec(g3) + 0x144"
type = "s16"

[coney]
level = "level99"
