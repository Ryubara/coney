# The landing clip's speed: a run jump on flat ground with the stick held, read every update through the landing 436.
# Research: docs/research/characters-locomotion.md#locomotion (Per update: the root speed is the clip's times the body
# scale, 0.97). Slot 1 (the street).
description = "level99 street: a run jump with the stick held through the landing"
research = "docs/research/characters-locomotion.md#locomotion"
input = "chars_landing.txt"
updates = 140
fields = ["player"]

[original]
slot = 1
patches = ["scripted-pad", "right-stick"]

[coney]
level = "level99"
args = ["--checkpoint", "3", "--start", "75.155,41.1354,0.2231,91.909,5.3,89.854"]
settle = 300

[diff]
start_frame = true
columns = ["x", "y", "z", "speed", "gait", "clip"]
tolerance = { x = 0.1, y = 0.1, z = 0.05, speed = 0.05, gait = 0, clip = 0 }
