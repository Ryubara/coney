# The run with circling: full stick up, then held to the left while the camera's auto-centre turns him round.
# Research: docs/research/feel.md, docs/research/camera.md. Coney runs it on the sandbox's open floor, the original in
# slot 1's clear street.
description = "a run, then the stick held left: the run circling behind the camera's auto-centre, then the run stop"
research = "docs/research/feel.md"
input = "run_circle.txt"
updates = 230
fields = ["player", "camera"]

[original]
slot = 1
patches = ["scripted-pad", "right-stick"]

[coney]
# Slot 1 is level99 at checkpoint 3 (docs/research/ai.md#level99-save): Coney starts Rembrandt and the camera where
# the slot's first trace row has them.
level = "level99"
args = ["--checkpoint", "3", "--start", "75.155,41.1354,0.2231,91.909,5.3,89.854"]

[diff]
start_frame = true
columns = ["x", "y", "heading", "speed", "gait", "clip", "cam_distance", "cam_yaw"]
tolerance = { x = 0.25, y = 0.25, heading = 2.0, speed = 0.1, gait = 0, clip = 0, cam_distance = 0.1, cam_yaw = 2.0 }
