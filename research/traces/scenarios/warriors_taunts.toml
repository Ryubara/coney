# level99's sparring fight, as warriors_passive (the same state, input and fields), with the hooks that show what the
# waiting Warriors do: the speech lines (say-command: a reposition taunt is FidgetAction_Start's cheer2, ra
# 0x002fa090), every taunt action started (taunt-init: the gloat over a downed man is ra 0x00293430), each fight
# goal's re-target test (fight-retarget-due) and every target set (set-target). Research:
# docs/research/ai.md#fight-reposition and docs/research/gang-fights.md#waiting. The state is not a quick-save slot:
# make it as ai.md#level99-save says.
description = "level99 sparring fight against a still player (no input): the waiting Warriors' taunts, gloats, re-targets and distances"
research = "docs/research/ai.md#level99-fight"
input = "warriors_passive.txt"
updates = 1700
fields = ["player", "enemy"]

[original]
state = "states/l99-warriors-before-fight.p2s"
patches = ["scripted-pad", "right-stick", "call-brains", "say-command", "set-target", "fight-retarget-due", "taunt-init"]
let = { enemy = 'human("Generic1")', g2 = 'human("Generic2")', g3 = 'human("Generic3")' }

[[field]]
name = "g2_command"
address = "prec(g2) + 0x20"
type = "u32"

[[field]]
name = "g2_clip"
address = "rec(g2) + 0x20"
type = "s32"

[[field]]
name = "g2_next_attack"
address = "brain(g2) + 0x1e8"
type = "u32"

[[field]]
name = "g2_x"
address = "tf(g2) + 0x0"
type = "f32"

[[field]]
name = "g2_y"
address = "tf(g2) + 0x4"
type = "f32"

[[field]]
name = "g3_command"
address = "prec(g3) + 0x20"
type = "u32"

[[field]]
name = "g3_clip"
address = "rec(g3) + 0x20"
type = "s32"

[[field]]
name = "g3_next_attack"
address = "brain(g3) + 0x1e8"
type = "u32"

[[field]]
name = "g3_x"
address = "tf(g3) + 0x0"
type = "f32"

[[field]]
name = "g3_y"
address = "tf(g3) + 0x4"
type = "f32"

[[field]]
name = "p_attackers"                      # the player's brain +0x1a4: the first attack slot's handle
address = "brain(player) + 0x1a4"
type = "u32"

[[field]]
name = "p_slots_max"                      # brain +0x1e4, the attack slots allowed on the player
address = "brain(player) + 0x1e4"
type = "u8"

[coney]
level = "level99"
