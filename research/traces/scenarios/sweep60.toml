# The walking sweep's sphere: stick 60 % up from standing in level99's street (slot 1), logging each sweep's radius
# factors with the sweep-radius hook. Research: docs/research/characters.md#walls (the player's 0.4705 m sphere).
description = "level99 street: walk 60 % up, logging the walking sweep sphere's radius factors"
research = "docs/research/characters.md#walls"
input = "walk60.txt"
updates = 80
fields = ["player"]

[original]
slot = 1
patches = ["scripted-pad", "right-stick", "sweep-radius"]

[coney]
# The same start as walk60 (slot 1 is level99 at checkpoint 3, Rembrandt at the end of a street); the run only logs the
# original's sweep calls, so Coney's side just has to reach the same place.
level = "level99"
args = ["--checkpoint", "3", "--start", "75.155,41.1354,0.2231,91.909,5.3,89.854"]
settle = 300
