# The standing short-wall climb onto a parked car (level99 checkpoint 2, slot 2 = library state vehicle-side-window):
# the stick at 50 % toward the car's side and triangle (455, 456, 457): how long each clip plays and how high the feet
# rise. Research: docs/research/characters-traversal.md#climb.
description = "level99 street: climb onto a parked car's side (stick 50 %, triangle)"
research = "docs/research/characters-traversal.md#climb"
input = "chars_car_climb.txt"
updates = 90
fields = ["player", "held"]

[original]
slot = 2
patches = ["scripted-pad", "right-stick"]

[coney]
level = "level99"
# Slot 2's spot (the first row of the original's trace, which has no camera columns: the camera is put behind him):
# Coney's checkpoint start is not the slot's (#1696).
args = ["--checkpoint", "3", "--start", "57.5826,39.526,0.2232,172.154,5.3,172.154"]
wait_for_control = true          # checkpoint 3 opens with the scene l99_c3, which holds the pad (#1680)
settle = 40                      # the stick comes after 40 updates of control, as in the slot (#1696)
