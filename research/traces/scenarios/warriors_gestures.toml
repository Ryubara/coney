# level99's sparring fight, as warriors_taunts (the same state, input, fields and hooks), with the gesture slots
# Ambient_MayGesture keeps (0x006cddf8, two handles per reaction kind): kind 2, the sparring Warriors' brain type, and
# kind 3, the Warriors' and the player's. Research: docs/research/sound-events.md#command-ids. The state is not a
# quick-save slot: make it as ai.md#level99-save says.
description = "level99 sparring fight against a still player (no input): the gesture slots of reaction kinds 2 and 3 beside the taunts"
research = "docs/research/sound-events.md#command-ids"
input = "warriors_passive.txt"
updates = 1700
fields = ["player", "enemy"]

[original]
state = "states/l99-warriors-before-fight.p2s"
patches = ["scripted-pad", "right-stick", "call-brains", "say-command", "set-target", "fight-retarget-due", "taunt-init"]
let = { enemy = 'human("Generic1")', g2 = 'human("Generic2")', g3 = 'human("Generic3")' }

[[field]]
name = "g2_command"
address = "prec(g2) + 0x20"
type = "u32"

[[field]]
name = "g2_clip"
address = "rec(g2) + 0x20"
type = "s32"

[[field]]
name = "g2_next_attack"
address = "brain(g2) + 0x1e8"
type = "u32"

[[field]]
name = "g2_x"
address = "tf(g2) + 0x0"
type = "f32"

[[field]]
name = "g2_y"
address = "tf(g2) + 0x4"
type = "f32"

[[field]]
name = "g3_command"
address = "prec(g3) + 0x20"
type = "u32"

[[field]]
name = "g3_clip"
address = "rec(g3) + 0x20"
type = "s32"

[[field]]
name = "g3_next_attack"
address = "brain(g3) + 0x1e8"
type = "u32"

[[field]]
name = "g3_x"
address = "tf(g3) + 0x0"
type = "f32"

[[field]]
name = "g3_y"
address = "tf(g3) + 0x4"
type = "f32"

[[field]]
name = "p_attackers"                      # the player's brain +0x1a4: the first attack slot's handle
address = "brain(player) + 0x1a4"
type = "u32"

[[field]]
name = "p_slots_max"                      # brain +0x1e4, the attack slots allowed on the player
address = "brain(player) + 0x1e4"
type = "u8"

[[field]]
name = "gesture2_0"                     # kind 2's slot 0: the holder's handle, 0 for none
address = "0x006cde08"
type = "u32"

[[field]]
name = "gesture2_1"                     # kind 2's slot 1: the holder's handle, 0 for none
address = "0x006cde0c"
type = "u32"

[[field]]
name = "gesture3_0"                     # kind 3's slot 0: the holder's handle, 0 for none
address = "0x006cde10"
type = "u32"

[[field]]
name = "gesture3_1"                     # kind 3's slot 1: the holder's handle, 0 for none
address = "0x006cde14"
type = "u32"

[coney]
level = "level99"
