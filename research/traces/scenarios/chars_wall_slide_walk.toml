# Walking into a wall: Rembrandt (slot 1) put 7 m from the full-height wall of level99's street at y -5.38 (normal -y,
# triangle 948), heading 21.7 degrees, so the stick straight up (the camera behind him) walks (60 %) into it about
# 20 degrees off its normal. Until 2026-11-28 this was chars_wall_slide's second trial, put back at the start by a
# setup write Coney has no step for (#1696). Research: docs/research/characters-ground.md#walls
# (sliding along a wall).
description = "level99 street: walking into the wall at y -5.38 about 20 degrees off its normal"
research = "docs/research/characters-ground.md#walls"
input = "chars_wall_slide_walk.txt"
updates = 300
fields = ["player", "camera"]

[original]
slot = 1
patches = ["scripted-pad", "right-stick"]
setup = [
  { address = "tf(player) + 0x0", type = "f32", value = "59.5", frame = 0, until = 2 },
  { address = "tf(player) + 0x4", type = "f32", value = "-12.4", frame = 0, until = 2 },
  { address = "tf(player) + 0x8", type = "f32", value = "0.223", frame = 0, until = 2 },
  { address = "tf(player) + 0x10", type = "f32", value = "0.0", frame = 0, until = 2 },
  { address = "tf(player) + 0x14", type = "f32", value = "0.0", frame = 0, until = 2 },
  { address = "tf(player) + 0x18", type = "f32", value = "0.1882", frame = 0, until = 2 },
  { address = "tf(player) + 0x1c", type = "f32", value = "0.9821", frame = 0, until = 2 },
]

[coney]
# On Coney (2026-11-28) the walk starts as the original's, but the follow camera, put close behind him by the setup's
# move, pulls back faster (2.1 m against 1.4 m by update 59) and turns the walk about 11 degrees further before the wall.
level = "level99"
args = ["--checkpoint", "3", "--start", "59.5,-12.4,0.223,21.7,5.3,21.7"]
wait_for_control = true          # checkpoint 3 opens with the scene l99_c3, which holds the pad (#1680)
settle = 40                      # the stick comes after 40 updates of control, as in the slot (#1696)
