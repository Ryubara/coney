# Field sets for traces of the original (`coney-tools pcsx2 record`): what is read every character update, and where.
# A column that Coney's --trace also writes has Coney's name and unit (src/human/player_trace.h): metres, degrees,
# m/s. Addresses are expressions (python/src/coney_tools/game_memory.py); a formula works a value out from the fields
# before it. Format: docs/guides/research-workflow.md#recording-a-trace.

# The player human: docs/research/characters.md (the human object, the record, the per-player record, the transform
# table) and docs/research/combat.md#record-fields.
[[player]]
name = "x"
address = "tf(player) + 0x0"
type = "f32"

[[player]]
name = "y"
address = "tf(player) + 0x4"
type = "f32"

[[player]]
name = "z"
address = "tf(player) + 0x8"
type = "f32"

[[player]]
name = "qz"
address = "tf(player) + 0x18"
type = "f32"
hidden = true

[[player]]
name = "qw"
address = "tf(player) + 0x1c"
type = "f32"
hidden = true

[[player]]
name = "heading"                          # 0 faces +y, anticlockwise, as Coney's
formula = "wrap(deg(2 * atan2(qz, qw)))"
digits = 3

[[player]]
name = "speed"                            # human +0x1ac, the speed across the ground
address = "player + 0x1ac"
type = "f32"

[[player]]
name = "vz"                               # human +0x3a0, the vertical speed
address = "player + 0x3a0"
type = "f32"

[[player]]
name = "gait"                             # human +0x1a8, 0 standing to 5 sprint
address = "player + 0x1a8"
type = "s32"

[[player]]
name = "clip"                             # record +0x20, the anim id playing
address = "rec(player) + 0x20"
type = "s32"

[[player]]
name = "stamina"                          # record +0x14a
address = "rec(player) + 0x14a"
type = "s16"

[[player]]
name = "command"                          # per-player record +0x20, the command id of this update
address = "prec(player) + 0x20"
type = "u32"

[[player]]
name = "health"                           # record +0x144
address = "rec(player) + 0x144"
type = "s16"

[[player]]
name = "power"                            # record +0x148, the power meter
address = "rec(player) + 0x148"
type = "s16"

[[player]]
name = "phase"                            # record +0x08, the combat phase flags (the original's only)
address = "rec(player) + 0x08"
type = "u32"

# The player's follow camera, *(0x005d9158): docs/research/camera.md.
[[camera]]
name = "cam_x"
address = "camera + 0x10"
type = "f32"

[[camera]]
name = "cam_y"
address = "camera + 0x14"
type = "f32"

[[camera]]
name = "cam_z"
address = "camera + 0x18"
type = "f32"

[[camera]]
name = "look_x"
address = "camera + 0x180"
type = "f32"

[[camera]]
name = "look_y"
address = "camera + 0x184"
type = "f32"

[[camera]]
name = "look_z"
address = "camera + 0x188"
type = "f32"

[[camera]]
name = "wanted_x"
address = "camera + 0x250"
type = "f32"

[[camera]]
name = "wanted_y"
address = "camera + 0x254"
type = "f32"

[[camera]]
name = "wanted_z"
address = "camera + 0x258"
type = "f32"

[[camera]]
name = "cam_distance"                     # from the camera to its look-at point
formula = "hypot(cam_x - look_x, cam_y - look_y, cam_z - look_z)"

[[camera]]
name = "cam_pitch"                        # positive above the look-at point
formula = "deg(atan2(cam_z - look_z, hypot(cam_x - look_x, cam_y - look_y)))"
digits = 3

[[camera]]
name = "cam_yaw"                          # the heading the view faces, as the human's are measured
formula = "deg(atan2(cam_x - look_x, look_y - cam_y))"
digits = 3

[[camera]]
name = "band_near"                        # +0x32c, the leash band's near edge
address = "camera + 0x32c"
type = "f32"

[[camera]]
name = "target_pitch_rad"
address = "camera + 0x3b4"
type = "f32"
hidden = true

[[camera]]
name = "target_pitch"                     # +0x3b4, in degrees
formula = "deg(target_pitch_rad)"
digits = 3

# What holds a move: the record's state word (+0x00, two words), its state code (+0x14, setter 0x002266a8) and the
# animation tasks on the character instance's stack (human +0xd8; the stack's pointers at +0x2bc, its count at +0x2ac),
# each task's type (+0x14) and the record +0x08 bits it holds (+0x24, clip tasks of types 1, 3 and 6). Slots at or
# above the count are stale; the tasks' fields are read through the stack at each sample (`follow`). Research: docs/research/tasks.md#held-flags, docs/research/formats/animation.md#task-stack.
[[held]]
name = "state"
address = "rec(player) + 0x0"
type = "u32"

[[held]]
name = "state_hi"
address = "rec(player) + 0x4"
type = "u32"

[[held]]
name = "code"
address = "rec(player) + 0x14"
type = "s32"

[[held]]
name = "tasks"
address = "u32(player + 0xd8) + 0x2ac"
type = "u16"

[[held]]
name = "t0_type"
address = "u32(u32(player + 0xd8) + 0x2bc) + 0x14"
type = "s32"
follow = true

[[held]]
name = "t0_holds"
address = "u32(u32(player + 0xd8) + 0x2bc) + 0x24"
type = "u32"
follow = true

[[held]]
name = "t1_type"
address = "u32(u32(player + 0xd8) + 0x2c0) + 0x14"
type = "s32"
follow = true

[[held]]
name = "t1_holds"
address = "u32(u32(player + 0xd8) + 0x2c0) + 0x24"
type = "u32"
follow = true

[[held]]
name = "t2_type"
address = "u32(u32(player + 0xd8) + 0x2c4) + 0x14"
type = "s32"
follow = true

[[held]]
name = "t2_holds"
address = "u32(u32(player + 0xd8) + 0x2c4) + 0x24"
type = "u32"
follow = true

[[held]]
name = "t3_type"
address = "u32(u32(player + 0xd8) + 0x2c8) + 0x14"
type = "s32"
follow = true

[[held]]
name = "t3_holds"
address = "u32(u32(player + 0xd8) + 0x2c8) + 0x24"
type = "u32"
follow = true

[[held]]
name = "t4_type"
address = "u32(u32(player + 0xd8) + 0x2cc) + 0x14"
type = "s32"
follow = true

[[held]]
name = "t4_holds"
address = "u32(u32(player + 0xd8) + 0x2cc) + 0x24"
type = "u32"
follow = true

# An AI human the scenario names `enemy` (its `let`): its brain (docs/research/ai.md#brain) and what it does. Goal and
# action vtables name their classes (docs/research/ai.md#goals: 0x005402d0 the fight goal, 0x0053feb0 the block
# goal; #attack-action: 0x00542ce0 the attack action, 0x005431e0 move-to-human). The brain's times are in the game's
# milliseconds (`now`).
[[enemy]]
name = "now"
address = "u32(0x0050b734) + 0x48"
type = "u32"
follow = true

[[enemy]]
name = "e_top"                            # brain +0x2c, the goal stack's top index (-1 empty)
address = "brain(enemy) + 0x2c"
type = "s8"

[[enemy]]
name = "e_goal"                           # the top goal's vtable
address = "u32(brain(enemy) + 0x40 + 4 * max(0, s8(brain(enemy) + 0x2c))) + 0xc"
type = "u32"
follow = true

[[enemy]]
name = "e_goal0"                          # the bottom goal's vtable (stale when the stack is empty)
address = "u32(brain(enemy) + 0x40) + 0xc"
type = "u32"
follow = true

[[enemy]]
name = "e_goal1"                          # the second goal's vtable (stale below two goals)
address = "u32(brain(enemy) + 0x44) + 0xc"
type = "u32"
follow = true

[[enemy]]
name = "e_goal_10"                        # the top goal's +0x10 (the block goal: the time it blocks until, ms)
address = "u32(brain(enemy) + 0x40 + 4 * max(0, s8(brain(enemy) + 0x2c))) + 0x10"
type = "u32"
follow = true

[[enemy]]
name = "e_goal_14"                        # the top goal's +0x14 (the block goal: whether this block may counter)
address = "u32(brain(enemy) + 0x40 + 4 * max(0, s8(brain(enemy) + 0x2c))) + 0x14"
type = "u8"
follow = true

[[enemy]]
name = "e_goal_16"                        # the top goal's +0x16 (the block goal's second counter flag)
address = "u32(brain(enemy) + 0x40 + 4 * max(0, s8(brain(enemy) + 0x2c))) + 0x16"
type = "u8"
follow = true

[[enemy]]
name = "e_actions"                        # brain +0x2e, the actions queued
address = "brain(enemy) + 0x2e"
type = "s8"

[[enemy]]
name = "e_action"                         # the front action's vtable (stale when no action is queued)
address = "u32(brain(enemy) + 0x68 + 4 * u8(brain(enemy) + 0x2f)) + 0x8"
type = "u32"
follow = true

[[enemy]]
name = "e_react"                          # brain +0x3c, the reaction goal (0 none)
address = "brain(enemy) + 0x3c"
type = "u32"

[[enemy]]
name = "e_react_vt"                       # the reaction goal's vtable (stale when there is none)
address = "u32(brain(enemy) + 0x3c) + 0xc"
type = "u32"
follow = true

[[enemy]]
name = "e_move_angle"                     # brain +0x110, the heading a move action asks for (radians)
address = "brain(enemy) + 0x110"
type = "f32"

[[enemy]]
name = "e_move_speed"                     # brain +0x114, the speed it asks for (0x0028ab28; the gait's speed)
address = "brain(enemy) + 0x114"
type = "f32"

[[enemy]]
name = "e_speed"                          # human +0x1ac, its speed across the ground
address = "enemy + 0x1ac"
type = "f32"

[[enemy]]
name = "e_gait"                           # human +0x1a8
address = "enemy + 0x1a8"
type = "s32"

[[enemy]]
name = "e_target"                         # brain +0x124, the target's handle
address = "brain(enemy) + 0x124"
type = "u32"

[[enemy]]
name = "e_next_attack"                    # brain +0x1e8, the earliest time it may attack again (ms)
address = "brain(enemy) + 0x1e8"
type = "u32"

[[enemy]]
name = "e_warned"                         # brain +0x200, an attack on it was announced this update
address = "brain(enemy) + 0x200"
type = "u8"

[[enemy]]
name = "e_command"                        # its per-player record +0x20, the command of this update
address = "prec(enemy) + 0x20"
type = "u32"

[[enemy]]
name = "e_clip"
address = "rec(enemy) + 0x20"
type = "s32"

[[enemy]]
name = "e_phase"                          # its record +0x08
address = "rec(enemy) + 0x08"
type = "u32"

[[enemy]]
name = "e_state"                          # its record +0x00, the state word's low half
address = "rec(enemy) + 0x0"
type = "u32"

[[enemy]]
name = "e_health"
address = "rec(enemy) + 0x144"
type = "s16"

[[enemy]]
name = "e_x"
address = "tf(enemy) + 0x0"
type = "f32"
hidden = true

[[enemy]]
name = "e_y"
address = "tf(enemy) + 0x4"
type = "f32"
hidden = true

[[enemy]]
name = "e_stick_angle"                    # its per-player record's stick angle (radians), the current buffer (+0x18)
address = "prec(enemy) + 0x08 + 4 * u8(prec(enemy) + 0x18)"
type = "f32"
follow = true

[[enemy]]
name = "e_stick"                          # the stick's magnitude, clamped to 1
address = "prec(enemy) + 0x10 + 4 * u8(prec(enemy) + 0x18)"
type = "f32"
follow = true

[[enemy]]
name = "e_distance"                       # from the player, metres (the player set's x and y come first)
formula = "hypot(e_x - x, e_y - y)"

# What decides a run stop: the locomotion's skid test (Human_PlayerLocomotion 0x00240e38, at 0x00241300) reads the
# gait (human +0x1a8), the speed against the run speed, and the previous update's stick (the per-player record's other
# buffer); the stick's last angle and magnitude (+0x5d8, +0x5dc) and the turn step and error (+0x5e0, +0x5e4) carry
# over between updates. Research: docs/research/characters.md#locomotion.
[[stop]]
name = "s_gait"
address = "player + 0x1a8"
type = "s32"

[[stop]]
name = "s_buffer"
address = "prec(player) + 0x18"
type = "u8"

[[stop]]
name = "s_stick0"
address = "prec(player) + 0x10"
type = "f32"

[[stop]]
name = "s_stick1"
address = "prec(player) + 0x14"
type = "f32"

[[stop]]
name = "s_last_mag"
address = "player + 0x5dc"
type = "f32"

[[stop]]
name = "s_turn_step"
address = "player + 0x5e0"
type = "f32"

[[stop]]
name = "s_turn_error"
address = "player + 0x5e4"
type = "f32"

# The player's physics body (human +0x1a0) during a jump through a glass pane (docs/research/objects.md#pane-break):
# the counters that make the per-update strike test (0x0033f110) run, the body flags and the object flags.
[[strike]]
name = "b_c0"                             # body +0xc0
address = "u32(player + 0x1a0) + 0xc0"
type = "s32"

[[strike]]
name = "b_d0"                             # body +0xd0
address = "u32(player + 0x1a0) + 0xd0"
type = "s32"

[[strike]]
name = "b_flags"                          # body +0x40
address = "u32(player + 0x1a0) + 0x40"
type = "u32"

[[strike]]
name = "o_flags"                          # human +0x54, 0x4000000 airborne
address = "player + 0x54"
type = "u32"

[[strike]]
name = "shape_flags"                      # the body's main shape (body +0x30), its flags +0x32
address = "u32(u32(player + 0x1a0) + 0x30) + 0x32"
type = "u16"

[[strike]]
name = "body_44"                          # body +0x44
address = "u32(player + 0x1a0) + 0x44"
type = "u32"

