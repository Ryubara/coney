address = 0x00342b08
# addiu sp,sp,-0x160; sq s0,0x150(sp)
original = [0x27bdfea0, 0x7fb00150]
log = [{ value = "[0x005104f4]", name = "ticks" }, { value = "a0", name = "shape" }, { value = "[a0 + 0x30]", name = "flags" }, { value = "[a0 + 0x50]", name = "cur_x", type = "f32" }, { value = "[a0 + 0x54]", name = "cur_y", type = "f32" }, { value = "[a0 + 0x20]", name = "prev_x", type = "f32" }, { value = "[a0 + 0x24]", name = "prev_y", type = "f32" }]

