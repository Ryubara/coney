# The physics runtime pass (issue #348, docs/research/physics-kernels.md#u1-runtime): the edge step's capsule roots, and a
# strike shape's previous and current centre at each pose and each strike test.

[hook.edge-roots]
description = "SphereSweep_Edge (0x0034e3b8) after its capsule step kept a root (0x0034e454): the caller (saved ra: Sweep_SphereTriangle for an edge, SphereSweep_VertexRegion for a corner), the first listed root it reports (f1), the second root, how many roots fell in [0, 1], the radius and the move's x."
research = "docs/research/physics-kernels.md#u1-runtime"
address = 0x0034e454
# mfc1 a2,f1; lq a1,0x0(s0)
original = [0x44060800, 0x7a050000]
log = [{ value = "[0x005104f4]", name = "ticks" }, { value = "[sp + 0x70]", name = "caller" }, { value = "f1", name = "root0", type = "f32" }, { value = "[sp + 0x4]", name = "root1", type = "f32" }, { value = "[s5]", name = "in_range", type = "s32" }, { value = "f20", name = "radius", type = "f32" }, { value = "[s6 + 0x0]", name = "move_x", type = "f32" }]

[hook.sphere-pose]
description = "Each PhysicsSphere_Pose (0x00342b08) on entry: the shape, its flags (+0x32; 0x10 = reset), its centre (+0x50, the last pose's) and its previous centre (+0x20), x and y."
