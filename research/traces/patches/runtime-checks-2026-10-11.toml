# The runtime-checks pass of 2026-10-11 (docs/research/combat.md#teammates, docs/research/scripting.md#level80-arrest-fire).

[hook.hit-by-chief]
description = "Each call of WarriorBrain_OnHitByChief (0x00306190, from a Warrior brain's event 1): the brain and its arguments, with the brain's hit-back window end (+0x2dc) and count (+0x2e4) before the call."
research = "docs/research/combat.md#teammates"
address = 0x00306190
# addiu sp,sp,-0x60; sq s0,0x50(sp)
original = [0x27bdffa0, 0x7fb00050]
log = [{ value = "[0x005104f4]", name = "ticks" }, { value = "a0", name = "brain" }, { value = "a1", name = "a1" }, { value = "a2", name = "a2" }, { value = "[a0 + 0x2dc]", name = "window" }, { value = "[a0 + 0x2e4]", name = "count", type = "u8" }]

