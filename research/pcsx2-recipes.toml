# The PCSX2 recipes: the shared, verified ways to do basic things in the running original (NTSC-U SLUS_212.15), so
# no engineer works an address out again. `coney-tools pcsx2 recipe list | show | run` reads this file and
# `coney-tools pcsx2 recipe render` writes docs/guides/pcsx2-recipes.md from it (CI runs `--check`).
# Schema: python/src/coney_tools/recipes.py. Names, addresses and our own descriptions only: no game data
# (LEGAL.md). A recipe lands only once it has been run in PCSX2 (confirmed_runtime). Found a new technique? Add it
# here, run it, and render the page.

groups = [
  "Finding humans",
  "Moving and editing humans",
  "Spawning",
  "Player state",
  "Input",
  "Calling the game",
  "Levels and missions",
  "Emulation",
]

intro = """
Each recipe below is one thing an engineer often needs to do in the original running in PCSX2: find a human, move
one, change a field, call one of the game's functions or a script binding, load a checkpoint. Every recipe has been
run in PCSX2 and says when, on which copy and from which state; each names the Ghidra address that justifies it and
the research page that explains it. The list is generated from `research/pcsx2-recipes.toml` by
`coney-tools pcsx2 recipe render`; edit that file, never this page.

Run a recipe on a copy you hold a claim on ([Driving PCSX2](research-workflow.md#driving-pcsx2)):
`coney-tools pcsx2 claim --agent ID`, `coney-tools pcsx2 launch --agent ID STATE`, then
`coney-tools pcsx2 recipe run NAME --copy COPY --agent ID --arg name=value`. `recipe list` lists them and
`recipe show NAME` prints one. The runner talks to the copy's PINE port (and its debug server for the emulation
steps), so the `pcsx2` MCP server must be connected in `mode: "debug"`, which leaves PINE free. It checks first that
the copy runs, that you hold its claim, that the emulation is running or paused as the recipe needs, and that the
running state holds every patch the recipe names: a patch goes into a copy of a state with
`coney-tools pcsx2 prepare-state SOURCE OUT --patch NAME ...` before PCSX2 starts on it.

Many recipes call the game through the `call-brains` call hook (`research/traces/patches/hooks-core.toml`): the
runner writes a function address and its arguments into the call block, and the game makes the call on its own
thread at the start of the next brains update. The `lua` recipe and the recipes built on it run a Lua chunk in the
level's script state the same way, so every script binding (`HuCreate`, `GiveMoney`, `MenuLoadLevel`, ...) can be
used as a level script uses it; [the script bindings](../references/bindings/index.md) list them with their
arguments.

**Input: prefer recordings.** For runtime evidence that depends on input, drive the original with a PCSX2 input
recording (`pcsx2 record --recording`, [Input recordings](research-workflow.md#input-recordings)): it replays the
same pad frame by frame. The `scripted-pad` recipes below are for closed-loop drivers that decide each input from
what the game shows, which a recording cannot do.
"""

# --- Finding humans -------------------------------------------------------------------------------------------------

[recipe.humans]
group = "Finding humans"
summary = "List every human in use: table address, handle index, name, player number, position and heading."
how = """
The 60 humans live in one static array at `0x00640c80`, `0x6d0` bytes each, built by `0x00228730`. A human is in
use when its record pointer (`+0xd4`) is set; its name is at `+0x80`, its player number at `+0x1b0` (0 for player
1, -1 for an AI human) and its handle index at `+0x92`, which indexes the transform table at `0x00714b00` (position
at `+0x0`, rotation quaternion at `+0x10`). The heading is `2 * atan2(qz, qw)`, 0 facing +y, anticlockwise.
"""
research = ["docs/research/characters.md#the-human-object"]
ghidra = ["0x00228730 Humans_StaticInit", "0x0021b0b8 Object_SetPosition"]
evidence = "confirmed-code"
confirmed_runtime = { date = "2026-10-21", copy = "pcsx2-d", pcsx2 = "2.9.129 (PCSX2-MCP fork)", state = "level99 street (slot 6)", note = "9 humans listed, the player Rembrandt at index 2" }
steps = [ { humans = true } ]

[recipe.find-player]
group = "Finding humans"
summary = "The player's human (player number 0) and its tables: record, per-player record, brain and transform."
how = """
The player is the human in use whose `+0x1b0` is 0. In later levels it is not human 0, and the per-human tables
are indexed by the handle index `+0x92`, never by the table position: the per-player record at `0x00660f50 + index
* 0x2c`, the brain at `0x006d53f0 + index * 0x2f0` and the transform at `0x00714b00 + index * 0x20`. The record is
the pointer at `+0xd4` (`0x0065a540 + i * 0x180`).
"""
research = ["docs/research/characters.md#the-human-object", "docs/research/characters.md#the-record", "docs/research/ai.md#brain"]
ghidra = ["0x00228730 Humans_StaticInit", "0x00146078 PlayerRecord_Update"]
evidence = "confirmed-code"
confirmed_runtime = { date = "2026-10-21", copy = "pcsx2-d", pcsx2 = "2.9.129 (PCSX2-MCP fork)", state = "level99 street (slot 6)" }
steps = [
  { let = { h = "player" } },
  { show = "h", label = "human" },
  { text = "h + 0x80", label = "name", size = 16 },
  { show = "index(h)", label = "index", format = "int" },
  { show = "rec(h)", label = "record" },
  { show = "prec(h)", label = "per_player" },
  { show = "brain(h)", label = "brain" },
  { show = "tf(h)", label = "transform" },
  { show = "u32(h + 0x90)", label = "handle" },
]

[recipe.find-human]
group = "Finding humans"
summary = "A human by name, with the same tables as find-player."
how = """
Names are the ones level scripts give `HuCreate` (`+0x80`, up to 15 characters); `humans` lists them. Pick a puppet
or a target by name rather than by distance: the nearest human changes as pedestrians walk.
"""
research = ["docs/research/characters.md#the-human-object"]
ghidra = ["0x00235010 Human_FindByName"]
evidence = "confirmed-code"
confirmed_runtime = { date = "2026-10-21", copy = "pcsx2-d", pcsx2 = "2.9.129 (PCSX2-MCP fork)", state = "level99 street (slot 6)", note = "PoizoCiv" }
params = [ { name = "who", kind = "human", default = "", help = "the human's name; empty for the player" } ]
steps = [
  { let = { h = "who" } },
  { show = "h", label = "human" },
  { show = "index(h)", label = "index", format = "int" },
  { show = "s8(h + 0x1b0)", label = "player_number", format = "int" },
  { show = "rec(h)", label = "record" },
  { show = "prec(h)", label = "per_player" },
  { show = "brain(h)", label = "brain" },
  { show = "tf(h)", label = "transform" },
  { show = "u32(h + 0x90)", label = "handle" },
]

# --- Moving and editing humans ----------------------------------------------------------------------------------------

[recipe.position]
group = "Moving and editing humans"
summary = "Read a human's position, heading, speed and gait."
how = """
The transform table (`0x00714b00 + index * 0x20`) is the authoritative position and rotation; the human copies it
into `+0x10` / `+0x20` at the start of each update. Speed across the ground is `+0x1ac` (m/s) and the gait `+0x1a8`
(0 standing to 5 sprint).
"""
research = ["docs/research/characters.md#ground", "docs/research/characters.md#the-human-object"]
ghidra = ["0x0021b0b8 Object_SetPosition"]
evidence = "confirmed-code"
confirmed_runtime = { date = "2026-10-21", copy = "pcsx2-d", pcsx2 = "2.9.129 (PCSX2-MCP fork)", state = "level99 street (slot 6)" }
params = [ { name = "who", kind = "human", default = "", help = "the human's name; empty for the player" } ]
steps = [
  { let = { h = "who" } },
  { show = "f32(tf(h) + 0x0)", label = "x" },
  { show = "f32(tf(h) + 0x4)", label = "y" },
  { show = "f32(tf(h) + 0x8)", label = "z" },
  { show = "wrap(deg(heading(h)))", label = "heading_deg" },
  { show = "f32(h + 0x1ac)", label = "speed" },
  { show = "s32(h + 0x1a8)", label = "gait", format = "int" },
]

[recipe.teleport]
group = "Moving and editing humans"
summary = "Move a human to x, y, z and turn it to a heading (degrees), by writing its transform."
how = """
Write the position (`+0x0`, `+0x4`, `+0x8`) and the rotation as a quaternion about z (`qz = sin(h / 2)` at `+0x18`,
`qw = cos(h / 2)` at `+0x1c`, x and y 0) into the human's transform; the human picks it up at the start of its next
update. Unlike the script's `Teleport` (`0x00385bb8`, which calls `Human_SetTransform` `0x0023d440`) it does not snap
to the ground or break a grab, so give a z on the ground (read one with `position`) and do not move a human that is
holding or held. For the script's own teleport, run `lua` with `Teleport(...)`.
"""
research = ["docs/research/characters.md#ground", "docs/research/characters.md#teleport"]
ghidra = ["0x0021b0b8 Object_SetPosition", "0x0023d440 Human_SetTransform"]
evidence = "confirmed-runtime"
confirmed_runtime = { date = "2026-10-21", copy = "pcsx2-d", pcsx2 = "2.9.129 (PCSX2-MCP fork)", state = "level99 street (slot 6)", note = "player moved 3 m along x and turned to 90 degrees; read back after 30 updates" }
params = [
  { name = "who", kind = "human", default = "", help = "the human's name; empty for the player" },
  { name = "x", help = "metres" },
  { name = "y", help = "metres" },
  { name = "z", help = "metres (the ground's height; read it with position)" },
  { name = "facing", default = "0", help = "the heading in degrees, 0 faces +y, anticlockwise" },
]
steps = [
  { let = { h = "who" } },
  { write = "tf(h) + 0x0", type = "f32", value = "x" },
  { write = "tf(h) + 0x4", type = "f32", value = "y" },
  { write = "tf(h) + 0x8", type = "f32", value = "z" },
  { write = "tf(h) + 0x10", type = "f32", value = "0" },
  { write = "tf(h) + 0x14", type = "f32", value = "0" },
  { write = "tf(h) + 0x18", type = "f32", value = "sin(rad(facing) / 2)" },
  { write = "tf(h) + 0x1c", type = "f32", value = "cos(rad(facing) / 2)" },
  { wait = 2 },
  { show = "f32(tf(h) + 0x0)", label = "x" },
  { show = "f32(tf(h) + 0x4)", label = "y" },
  { show = "wrap(deg(heading(h)))", label = "heading_deg" },
]

[recipe.health]
group = "Moving and editing humans"
summary = "Read a human's health, maximum, power, stamina and rage."
how = """
Health and its maximum are `s16`s in the human's record (`+0x144`, `+0x146`), the power meter is `+0x148` and stamina
`+0x14a`; rage is the human's `s32` at `+0x650` (up to the class maximum, 78 for class 6).
"""
research = ["docs/research/characters.md#the-record", "docs/research/combat-rage.md#rage"]
ghidra = ["0x00237848 Human_SetHealth", "0x00264cf8 Human_AddRage"]
evidence = "confirmed-code"
confirmed_runtime = { date = "2026-10-21", copy = "pcsx2-d", pcsx2 = "2.9.129 (PCSX2-MCP fork)", state = "level99 street (slot 6)" }
params = [ { name = "who", kind = "human", default = "", help = "the human's name; empty for the player" } ]
steps = [
  { let = { h = "who" } },
  { show = "s16(rec(h) + 0x144)", label = "health", format = "int" },
  { show = "s16(rec(h) + 0x146)", label = "health_max", format = "int" },
  { show = "s16(rec(h) + 0x148)", label = "power", format = "int" },
  { show = "s16(rec(h) + 0x14a)", label = "stamina", format = "int" },
  { show = "s32(h + 0x650)", label = "rage", format = "int" },
]

[recipe.set-health]
group = "Moving and editing humans"
summary = "Set a human's health (record +0x144, s16)."
how = """
A plain write sets the value as `HuSetHealth` (`0x00237848`) stores it, without the binding's checks: 0 or less is
stored as given, and the human dies at its next damage update. Keep it at or under the maximum (`+0x146`, `health`
reads it); `HuSetMaxHealth` (`0x00237be0`) changes that. For a death through the game's own path, run `lua` with
`HuKill(handle)`.
"""
research = ["docs/research/characters.md#the-record"]
ghidra = ["0x00237848 Human_SetHealth"]
evidence = "confirmed-runtime"
confirmed_runtime = { date = "2026-10-21", copy = "pcsx2-d", pcsx2 = "2.9.129 (PCSX2-MCP fork)", state = "level99 street (slot 6)" }
params = [
  { name = "who", kind = "human", default = "", help = "the human's name; empty for the player" },
  { name = "health", help = "the new health" },
]
steps = [
  { let = { h = "who" } },
  { write = "rec(h) + 0x144", type = "s16", value = "health" },
  { wait = 2 },
  { show = "s16(rec(h) + 0x144)", label = "health", format = "int" },
]

[recipe.set-rage]
group = "Moving and editing humans"
summary = "Fill (or empty) a human's rage meter (human +0x650, s32)."
how = """
Rage is the `s32` at human `+0x650`, added to by `Human_AddRage` (`0x00264cf8`) up to the class maximum (78 for the
player's class 6). Each gain sets the hold timer `+0x648` to the game time plus 5000 ms, and the meter drains once it
has passed, so the recipe sets the timer too: the meter then holds for 5 s, long enough for L1 + R1 to start rage
(`Rage_Enter` `0x00284340`), as the rage pass did.
"""
research = ["docs/research/combat-rage.md#rage"]
ghidra = ["0x00264cf8 Human_AddRage", "0x00284340 Rage_Enter"]
evidence = "confirmed-runtime"
confirmed_runtime = { date = "2026-10-21", copy = "pcsx2-d", pcsx2 = "2.9.129 (PCSX2-MCP fork)", state = "level99 street (slot 6)" }
params = [
  { name = "who", kind = "human", default = "", help = "the human's name; empty for the player" },
  { name = "rage", default = "78", help = "the new value (78 is full for class 6)" },
]
steps = [
  { let = { h = "who" } },
  { write = "h + 0x650", type = "s32", value = "rage" },
  { write = "h + 0x648", type = "s32", value = "u32(game_time) + 5000" },
  { wait = 2 },
  { show = "s32(h + 0x650)", label = "rage", format = "int" },
]

[recipe.brain]
group = "Moving and editing humans"
summary = "A human's AI: brain type, gang, goal stack (type ids), target and whether it is suspended."
how = """
The brain (`0x006d53f0 + index * 0x2f0`) holds the type at `+0x04` (0 player, 1 cop, 2 gang, 3 Warrior), the dead
and suspended bytes `+0x09` / `+0x0a`, the goal stack top at `+0x2c` (-1 empty) over ten goal pointers at `+0x40`
(their type ids are [goal types](../references/goal-types.md)), the target handle at `+0x124` and the gang pointer
at `+0x20c` (gang records of `0xb10` from `0x005e6e30`, id at `+0x30`). To change the AI, use the script's own
bindings through `lua` (`BrFlushGoals`, `GoalFight`, `BrSetType`, `BrSuspend`, ...), which keep the brain's lists
consistent.
"""
research = ["docs/research/ai.md#brain", "docs/research/ai-gangs.md#gang-record"]
ghidra = ["0x00293b28 Brains_Update", "0x0028f928 Brain_OnEvent"]
evidence = "confirmed-code"
confirmed_runtime = { date = "2026-10-21", copy = "pcsx2-d", pcsx2 = "2.9.129 (PCSX2-MCP fork)", state = "level99 street (slot 6)" }
params = [ { name = "who", kind = "human", default = "", help = "the human's name; empty for the player" } ]
steps = [
  { let = { h = "who", b = "brain(who)" } },
  { show = "s32(b + 0x04)", label = "brain_type", format = "int" },
  { show = "u8(b + 0x09)", label = "dead", format = "int" },
  { show = "u8(b + 0x0a)", label = "suspended", format = "int" },
  { show = "min(u32(b + 0x20c), 1) * (s16(u32(b + 0x20c) + 0x30) + 1) - 1", label = "gang", format = "int" },
  { show = "s8(b + 0x2c)", label = "goal_top", format = "int" },
  { show = "goal_at(b, 0)", label = "goal_0", format = "int" },
  { show = "goal_at(b, 1)", label = "goal_1", format = "int" },
  { show = "goal_at(b, 2)", label = "goal_2", format = "int" },
  { show = "hidx(u32(b + 0x124))", label = "target_index", format = "int" },
]

[recipe.held-object]
group = "Moving and editing humans"
summary = "What a human holds: the handle in its hand (+0x338) and the object being picked up (+0x33c)."
how = """
The object in a human's hand is the handle at `+0x338` (the null handle `0xffffffff` when empty), the one being
picked up `+0x33c`, and a carried prop `+0x348` / `+0x34c`. To give a weapon, put the weapon object in front of the
human and let it pick it up (the weapon pickup scenarios do), or spawn one with `lua` (`ObjSpawn`): `HuGiveWeapon`
(`0x00299470`) is called by no script and what it feeds is not traced.
"""
research = ["docs/research/characters.md#the-human-object", "docs/research/combat-moves.md"]
ghidra = ["0x00299470 Human_SetPendingWeapon"]
evidence = "confirmed-code"
confirmed_runtime = { date = "2026-10-21", copy = "pcsx2-d", pcsx2 = "2.9.129 (PCSX2-MCP fork)", state = "level99 street (slot 6)", note = "empty hands: 0xffffffff" }
params = [ { name = "who", kind = "human", default = "", help = "the human's name; empty for the player" } ]
steps = [
  { let = { h = "who" } },
  { show = "u32(h + 0x338)", label = "in_hand" },
  { show = "hidx(u32(h + 0x338))", label = "in_hand_index", format = "int" },
  { show = "u32(h + 0x33c)", label = "picking_up" },
]

# --- Calling the game --------------------------------------------------------------------------------------------------

[recipe.call]
group = "Calling the game"
summary = "Make the game call one of its own functions with up to six integer or pointer arguments."
how = """
The `call-brains` hook sits at `Brains_Update`'s entry (`0x00293b28`, step 5 of the character step) and checks the
call block at `0x000af000` every update: the function's address at `+0x0` (0 when none waits), six arguments from
`+0x4` (passed in `a0`-`a3`, `t0`, `t1`), the result at `+0x1c` and a count of calls made at `+0x20`. The runner
writes the arguments, then the address; the hook clears the address, makes the call on the game's thread, stores
`v0` and counts it. Only integer and pointer arguments: a function that takes a float in `f12` gets whatever is
there, so call such functions through their script binding with `lua`. The state must have the hook installed
(`pcsx2 prepare-state ... --patch call-brains`) and the game must be running.
"""
research = ["docs/guides/research-workflow.md#hooks"]
ghidra = ["0x00293b28 Brains_Update"]
evidence = "confirmed-runtime"
patches = ["call-brains"]
emulation = "running"
confirmed_runtime = { date = "2026-10-21", copy = "pcsx2-d", pcsx2 = "2.9.129 (PCSX2-MCP fork)", state = "level99 street (slot 6)", note = "GetCheckPoint's worker 0x0041abe8 returned the checkpoint the game state holds" }
params = [
  { name = "function", kind = "expr", help = "the function's address, such as 0x0041abe8" },
  { name = "a0", kind = "expr", default = "0", help = "first argument (an expression: 0x10, player, u32(player + 0x90))" },
  { name = "a1", kind = "expr", default = "0", help = "second argument" },
  { name = "a2", kind = "expr", default = "0", help = "third argument" },
  { name = "a3", kind = "expr", default = "0", help = "fourth argument" },
]
steps = [
  { call = "function", args = ["a0", "a1", "a2", "a3"] },
  { show = "result", label = "result" },
]

[recipe.lua]
group = "Calling the game"
summary = "Run a Lua chunk in the level's script state, as a level script would: any script binding, any global."
how = """
`ScriptSystem *0x00512b04` holds the level's `lua_State` at `+0x04`; its vtable slot `+0x2c` is
`ScriptSystem_DoString` (`0x00356a78`), which runs a string with `lua_dobuffer`. The runner writes the code into
spare memory at `0x000c0000` (zeros in every state checked) and has the call hook call
`ScriptSystem_DoString(system, code, 0)`; the result is 0 when the chunk ran without error. A chunk can call every
binding the level scripts use ([script bindings](../references/bindings/index.md)): `HuCreate`, `HuKill`,
`GiveMoney`, `StatAdd`, `SetCheckPoint`, `MenuLoadLevel`, `GoalFight`, `Teleport`, and the level's own functions
(`P2.SetupLesson1()`). Lua 4 syntax: `local`, `%upvalues`, no `#`. The text is a Python format string: `{name}`
takes a bound value, so write a Lua table constructor's braces doubled, `{{x, y, z}}`.
"""
research = ["docs/research/scripting.md", "docs/guides/research-workflow.md#hooks"]
ghidra = ["0x00356a78 ScriptSystem_DoString", "0x00293b28 Brains_Update"]
evidence = "confirmed-runtime"
patches = ["call-brains"]
emulation = "running"
confirmed_runtime = { date = "2026-10-21", copy = "pcsx2-d", pcsx2 = "2.9.129 (PCSX2-MCP fork)", state = "level99 street (slot 6)", note = "set a global and read it back with lua-globals; GiveMoney(5) took the inventory money from 191 to 196" }
params = [ { name = "code", kind = "text", help = "the Lua chunk, such as 'GiveMoney(100)'" } ]
steps = [ { lua = "{code}" }, { show = "result", label = "lua_dobuffer" } ]

[recipe.lua-globals]
group = "Calling the game"
summary = "List the script's global variables (the mission script's state) whose names hold a pattern."
how = """
The globals table is `ScriptSystem *0x00512b04` -> `lua_State` `+0x04` -> globals `+0x44`. A Lua 4 table (`Hash`)
holds its node array at `+0x0` and its node count as the `u16` at `+0x6` (the `u16` at `+0x4` is its tag, 4); a node
is 40 bytes: the key `TObject` (type at `+0x0`, value at `+0x8`), the value `TObject` at `+0x10` (type `+0x10`, value
`+0x18`) and the chain pointer at `+0x20`. Types: 1 nil, 2 number (a double), 3 string (its text at `+0x10` of the
string), 4 table, 5 function. Level scripts keep their state in globals (`bWarriorsFight`, `vFenceSection`), so this
shows how far a mission has gone. A table value prints as its address; its nodes read the same way.
"""
research = ["docs/research/scripting.md", "docs/guides/research-workflow.md#driving-pcsx2"]
ghidra = ["0x00356a78 ScriptSystem_DoString", "0x00328a30 Lua_CallCClosure"]
evidence = "confirmed-runtime"
confirmed_runtime = { date = "2026-10-21", copy = "pcsx2-d", pcsx2 = "2.9.129 (PCSX2-MCP fork)", state = "level99 street (slot 6)", note = "1505 globals with a non-nil value; the node count u16 at +0x6 read 3500 (0xdac) and the node array held valid nodes up to there" }
params = [ { name = "pattern", kind = "text", default = "", help = "part of the names to show (case ignored); empty for all" } ]
steps = [ { globals = "pattern" } ]

[recipe.human-event]
group = "Calling the game"
summary = "Send a game event (an event record with an id) to a human: its script handler, its gang, then its brain."
how = """
`Human_OnEvent` (`0x0021d480`, human vtable `0x0053f088` slot `+0x44`) delivers an event record to the human's Lua
message handler (`ScriptHandler_Deliver` `0x00384c38`, which reads the id at `+0x20`), then to its gang
(`Gang_OnEvent` `0x00164c20`), then to its brain (`Brain_OnEvent` `0x0028f928`), stopping at the first that consumes
it; the result is 1 when one consumed it. The brain's own handler is the function at brain `+0x28` (with `this`
adjusted by the `s16` at `+0x24`): `WarriorBrain_OnEvent` `0x003063b0` for a Warrior, `PlayerBrain_OnEvent`
`0x00303e90` for the player. The runner builds a record at `0x000c8000` (spare memory): `+0x00` the human who caused
it, as the human's address (confirmed at runtime for event `0xb`, which a Warrior keeps at brain `+0x27c`), `+0x04`
the other party, `+0x20` the event id ([the event record](../research/ai.md#event-record): 0 the prompt, 1 hit (with
`+0x11` set to count as an attack), 2 reset, `0xb` a new enemy, ...). The brain's goals may be refilled in the same
update, so check an effect that stays (a Warrior's noted enemy, its target).
"""
research = ["docs/research/ai.md#event-record", "docs/research/ai.md#events"]
ghidra = ["0x0021d480 Human_OnEvent", "0x0028f928 Brain_OnEvent", "0x00384c38 ScriptHandler_Deliver"]
evidence = "confirmed-runtime"
patches = ["call-brains"]
emulation = "running"
confirmed_runtime = { date = "2026-10-21", copy = "pcsx2-d", pcsx2 = "2.9.129 (PCSX2-MCP fork)", state = "level99 street (slot 6)", note = "event 0xb to Ash (a Warrior) with Civilians2 as causer: consumed, brain +0x27c held Civilians2's address and +0x280 was 1" }
params = [
  { name = "who", kind = "human", default = "", help = "the human's name; empty for the player" },
  { name = "event", help = "the event id (ai.md#event-record)" },
  { name = "causer", kind = "expr", default = "0", help = "record +0x00: the human who caused it (an address), 0 none" },
  { name = "other", kind = "expr", default = "0", help = "record +0x04: the other party, 0 none" },
]
steps = [
  { let = { h = "who", record = "0x000c8000" } },
  { write = "record + 0x00", type = "u32", value = "causer" },
  { write = "record + 0x04", type = "u32", value = "other" },
  { write = "record + 0x08", type = "u32", value = "0" },
  { write = "record + 0x0c", type = "u32", value = "0" },
  { write = "record + 0x10", type = "u32", value = "0" },
  { write = "record + 0x14", type = "u32", value = "0" },
  { write = "record + 0x18", type = "u32", value = "0" },
  { write = "record + 0x1c", type = "u32", value = "0" },
  { write = "record + 0x20", type = "u32", value = "event" },
  { write = "record + 0x24", type = "u32", value = "0" },
  { show = "u32(brain(h) + 0x28)", label = "brain_handler" },
  { call = "0x0021d480", args = ["h", "record"] },
  { show = "result", label = "consumed", format = "int" },
]

# --- Spawning ------------------------------------------------------------------------------------------------------------

[recipe.spawn-human]
group = "Spawning"
summary = "Create a human in front of the player, of the type and gang of a human already there (a pedestrian or a gang member)."
how = """
The runner reads the player's position and heading, works out a point `distance` metres in front, and runs
`HuCreate(name, type, {x, y, z}, heading, nil, 0, gang, nil)` through `lua`, as a level script creates its
characters (`0x00358428` -> `Human_Create` `0x00233d60`: a free slot of the 60, `Human_Init` `0x00218008`, a 2.5 m
ground snap). The type (human `+0xd0`) and the gang id (brain `+0x20c` -> gang record `+0x30`) are copied from the
human named by `like`, so the model is already resident: a `Civilians*` human gives a pedestrian, a gang member
(`Vermin`, a Hurricane) a member of that gang. The new human faces the player. Its handle is left in the global
`coney_spawned` (`lua-globals coney`); `HuCreate` returns the null handle when all 60 slots are taken. Remove it with
`lua` `HuDelete(coney_spawned)`.
"""
research = ["docs/research/characters.md#creation"]
ghidra = ["0x00358428 lua_HuCreate", "0x00233d60 Human_Create"]
evidence = "confirmed-runtime"
patches = ["call-brains"]
emulation = "running"
confirmed_runtime = { date = "2026-10-21", copy = "pcsx2-d", pcsx2 = "2.9.129 (PCSX2-MCP fork)", state = "level99 street (slot 6)", note = "a pedestrian like Civilians0 appeared 1.5 m in front of Rembrandt, facing him" }
params = [
  { name = "name", kind = "text", default = "ConeyPed", help = "the new human's name (15 characters at most)" },
  { name = "like", kind = "human", default = "Civilians0", help = "an existing human whose type and gang the new one takes" },
  { name = "distance", default = "1.5", help = "metres in front of the player" },
]
steps = [
  { let = { p = "player", a = "heading(player)" } },
  { let = { x = "f32(tf(p)) - distance * sin(a)", y = "f32(tf(p) + 0x4) + distance * cos(a)", z = "f32(tf(p) + 0x8) + 0.5" } },
  { let = { type = "s32(like + 0xd0)", gang = "s16(u32(brain(like) + 0x20c) + 0x30)", facing = "deg(a) + 180" } },
  { lua = "coney_spawned = HuCreate(\"{name}\", {type}, {{{x:.3f}, {y:.3f}, {z:.3f}}}, {facing:.1f}, nil, 0, {gang}, nil)" },
  { require = "1 - min(result, 1)", message = "HuCreate's chunk failed" },
  { let = { h = "human(name)" } },
  { show = "h", label = "human" },
  { show = "index(h)", label = "index", format = "int" },
  { show = "f32(tf(h))", label = "x" },
  { show = "f32(tf(h) + 0x4)", label = "y" },
  { show = "wrap(deg(heading(h)))", label = "heading_deg" },
]

# --- Player state --------------------------------------------------------------------------------------------------------

[recipe.inventory]
group = "Player state"
summary = "A player's inventory counts: flash, money, spray paint, handcuffs, cuff keys and loot."
how = """
The game state is `*(0x0051489c)` (`W_GameState`, `0x57c0` bytes). It holds one inventory block of `0x3f4` bytes per
player from `+0x480`; item `i` is the `0x2c`-byte entry at block `+0x04 + i * 0x2c`, its count at `+0x20`. Item 1 is
the flash, 2 money, 3 spray-paint charges, 5 handcuffs, 6 handcuff keys and 10 stolen loot. The money is what the HUD
shows; the cash a human carries for a mugging is another field (human `+0x370`, `HuGetMoney`).
"""
research = ["docs/research/player-state.md#inventory"]
ghidra = ["0x0041e5b0 Inventory_AddItem", "0x0041ee88 Inv_GetMoney"]
evidence = "confirmed-runtime"
confirmed_runtime = { date = "2026-10-21", copy = "pcsx2-d", pcsx2 = "2.9.129 (PCSX2-MCP fork)", state = "level99 street (slot 6)", note = "money read 36, the HUD's $36" }
params = [ { name = "slot", default = "0", help = "the player: 0 for player 1, 1 for player 2" } ]
steps = [
  { let = { inv = "u32(0x0051489c) + 0x480 + slot * 0x3f4 + 0x04" } },
  { show = "s32(inv + 1 * 0x2c + 0x20)", label = "flash", format = "int" },
  { show = "s32(inv + 2 * 0x2c + 0x20)", label = "money", format = "int" },
  { show = "s32(inv + 3 * 0x2c + 0x20)", label = "spray_paint", format = "int" },
  { show = "s32(inv + 5 * 0x2c + 0x20)", label = "handcuffs", format = "int" },
  { show = "s32(inv + 6 * 0x2c + 0x20)", label = "cuff_keys", format = "int" },
  { show = "s32(inv + 10 * 0x2c + 0x20)", label = "loot", format = "int" },
]

[recipe.give-item]
group = "Player state"
summary = "Give player 1 money or any inventory item through the game's own path (callbacks and limits included)."
how = """
Runs `GiveMoney(amount, 1)` (`0x0037b458` -> `GameState_GiveMoney` `0x0041ef00`) for money, or for another item
`InvAddItem`'s worker `Inventory_AddItem(inventory, player, item, amount, notify)` (`0x0041e5b0`) through `call`,
which keeps the count within the item's limits and runs the pickup callbacks as a pickup does. A negative amount
takes. Writing the count straight into the inventory (see `inventory`) skips the limits and the callbacks.
"""
research = ["docs/research/player-state.md#pickup-callback", "docs/research/player-state.md#inventory"]
ghidra = ["0x0041e5b0 Inventory_AddItem", "0x0041ef00 GameState_GiveMoney"]
evidence = "confirmed-runtime"
patches = ["call-brains"]
emulation = "running"
confirmed_runtime = { date = "2026-10-21", copy = "pcsx2-d", pcsx2 = "2.9.129 (PCSX2-MCP fork)", state = "level99 street (slot 6)", note = "item 2, 100: money 36 to 136; item 1, 1: flash 0 to 1 (inventory read back)" }
params = [
  { name = "item", default = "2", help = "the item id: 1 flash, 2 money, 3 spray paint, 5 handcuffs, 6 cuff keys" },
  { name = "amount", default = "100", help = "how many (negative takes)" },
]
steps = [
  { let = { gs = "u32(0x0051489c)" } },
  { call = "0x0041e5b0", args = ["gs + 0x480", "0", "item", "amount", "1"] },
  { show = "s32(gs + 0x480 + 0x04 + item * 0x2c + 0x20)", label = "count", format = "int" },
]

[recipe.stats]
group = "Player state"
summary = "Player 1's statistics: the score and the six category counters' first words."
how = """
The stats object at `0x006fe490` keeps a `0xc0`-byte live record per player (`+0x000` player 1, `+0x0c0` player 2;
checkpoint copies at `+0x180` and `+0x240`, `Stats_Construct` `0x004227d8`). The score is the record's `+0x00` (the
HUD's number); each category keeps its event counters from mission `+0x08`, bonus `+0x14`, style `+0x24`, combat
`+0x58`, crime `+0x78` and harmony `+0xa8`. What each event counts is in [Statistics](../references/statistics.md).
To add to one through the game, run `lua` with `StatAdd(HuGetPlayer(0), group, stat, amount)` (`0x004224d8`).
"""
research = ["docs/research/player-state.md#statistics"]
ghidra = ["0x004227d8 Stats_Construct", "0x004224d8 Script_StatAdd"]
evidence = "confirmed-runtime"
confirmed_runtime = { date = "2026-10-21", copy = "pcsx2-d", pcsx2 = "2.9.129 (PCSX2-MCP fork)", state = "level99 street (slot 6)", note = "score read 1133, the HUD's 0001133" }
steps = [
  { let = { rec = "0x006fe490" } },
  { show = "s32(rec + 0x00)", label = "score", format = "int" },
  { show = "u16(rec + 0x08)", label = "mission_0", format = "int" },
  { show = "u16(rec + 0x14)", label = "bonus_0", format = "int" },
  { show = "u16(rec + 0x24)", label = "style_0", format = "int" },
  { show = "u16(rec + 0x58)", label = "combat_0", format = "int" },
  { show = "u16(rec + 0x78)", label = "crime_0", format = "int" },
  { show = "u16(rec + 0xa8)", label = "harmony_0", format = "int" },
]

# --- Input ----------------------------------------------------------------------------------------------------------------

[recipe.pad]
group = "Input"
summary = "Hold buttons and both sticks on player 1's pad for some updates, then let go (closed-loop drivers)."
how = """
With the `scripted-pad` patch (and `right-stick` for the right stick) the pad read takes player 1's buttons and sticks
from spare bytes after the `scePadRead` buffer: the `lbu` loads at `0x00149dd4`, `0x00149dd8`, `0x00149de8` and
`0x00149df0` (DualShock 2 path; `0x00149e8c`... in the digital path) read offsets `0x22`, `0x23`, `0x26`, `0x27`
instead of 2, 3, 6, 7. So `0x005de3aa` / `0x005de3ab` are the active-low buttons (SELECT ... LEFT, then L2 ... SQUARE)
and `0x005de3ac`-`0x005de3af` the right stick's x, y and the left stick's x, y. The bytes stay until written again.
Sticks are given as an input script's percentages (y up) and turned into bytes exactly as Coney does
(`160 + round(0.95 v)` above 0, `95 - round(0.95 |v|)` below, 128 at rest), so both games see the same stick; use
partial deflections ([Drive it like a gamepad](testing.md#gamepad)). The patch must be in the state before the code is
compiled: `pcsx2 prepare-state SOURCE OUT --patch scripted-pad right-stick`, then launch OUT. Find the player as the
human whose `+0x1b0` is 0 (`find-player`); the per-player record is indexed by its `+0x92`. For input that does not
depend on what the game shows, use an input recording instead ([Input recordings](research-workflow.md#input-recordings)).
"""
research = ["docs/guides/research-workflow.md#driving-pcsx2"]
ghidra = ["0x00149da0 PadPort_ReadPressure"]
evidence = "confirmed-runtime"
patches = ["scripted-pad", "right-stick"]
emulation = "running"
confirmed_runtime = { date = "2026-10-21", copy = "pcsx2-d", pcsx2 = "2.9.129 (PCSX2-MCP fork)", state = "level99 street (slot 6)", note = "left stick 60 % left for 30 updates: the pad record read -0.6, the player walked (gait 2, 1.63 m/s) and stood after the release" }
params = [
  { name = "press", kind = "text", default = "", help = "buttons held, Coney's names joined by + (cross+l2); empty for none" },
  { name = "lx", default = "0", help = "left stick x, percent (-100 to 100)" },
  { name = "ly", default = "0", help = "left stick y, percent, up positive" },
  { name = "rx", default = "0", help = "right stick x, percent" },
  { name = "ry", default = "0", help = "right stick y, percent, up positive" },
  { name = "updates", default = "30", help = "how many character updates to hold it (1/30 s each)" },
]
steps = [
  { let = { held = "0xffff ^ buttons(press)" } },
  { write = "0x005de3aa", type = "u16", value = "(held >> 8) | ((held & 0xff) << 8)" },
  { write = "0x005de3ac", type = "u32", value = "stick(rx) | (stick(0 - ry) << 8) | (stick(lx) << 16) | (stick(0 - ly) << 24)" },
  { wait = 1 },
  { show = "f32(0x005dd810 + 0x08)", label = "stick_x" },
  { show = "f32(0x005dd810 + 0x0c)", label = "stick_y" },
  { wait = "updates" },
  { show = "f32(player + 0x1ac)", label = "speed" },
  { show = "s32(player + 0x1a8)", label = "gait", format = "int" },
  { write = "0x005de3aa", type = "u16", value = "0xffff" },
  { write = "0x005de3ac", type = "u32", value = "0x80808080" },
]

[recipe.stick-magnitude]
group = "Input"
summary = "Make full-deflection stick input read as a chosen magnitude, by rewriting the stick table's ends."
how = """
The game turns each raw stick byte into a float through a 256-entry `float` table at `0x0050b8d0` (entry 0 is -1.0,
entry 255 is +1.0); it is data, so a write takes effect at once. Writing -m to entry 0 and +m to entry 255
(the table's address plus `0x3fc`) makes a fully deflected stick (a keyboard key, a pad at its stop) read as magnitude
m; the pad record (`0x005dd810`, the stick as floats at `0x08` and `0x0c`) shows what the game uses. The camera's right-stick code
(`0x00129050`) reads the raw bytes, so the table does not change it. Run it again with `magnitude=1` to restore the
table. With the `scripted-pad` patch, `pad` gives partial values directly and this is not needed. State the
magnitude with every runtime claim that depends on input.
"""
research = ["docs/guides/research-workflow.md#driving-pcsx2"]
ghidra = ["0x00129050 Cam_Follow_RightStick"]
evidence = "confirmed-runtime"
confirmed_runtime = { date = "2026-10-21", copy = "pcsx2-d", pcsx2 = "2.9.129 (PCSX2-MCP fork)", state = "level99 street (slot 6)", note = "0.5 written and read back, then restored to 1.0" }
params = [ { name = "magnitude", default = "1", help = "the stick value full deflection gives (1 restores the table)" } ]
steps = [
  { write = "0x0050b8d0", type = "f32", value = "0 - magnitude" },
  { write = "0x0050b8d0 + 0x3fc", type = "f32", value = "magnitude" },
  { show = "f32(0x0050b8d0)", label = "entry_0" },
  { show = "f32(0x0050b8d0 + 0x3fc)", label = "entry_255" },
]

[recipe.puppet-command]
group = "Input"
summary = "Make an AI human act on a command id for one update (attack, grab, block), as a puppet."
how = """
`Player_UpdateActions` (`0x00146078`) runs for every human whose per-player `+0x1e` is 0, AI humans included, and acts
on the command id in its per-player record (`0x00660f50 + index * 0x2c`, `+0x20`). For a human with no pad,
`0x00146000` clears `+0x20` every update; the `puppet` patch puts a `nop` over that `sw zero,0x20(a0)` at
`0x00146030`, so a command written there stays. The recipe writes `command` for one update, `then` for the next and 0 after,
which is one tap ([commands](../research/combat.md#commands): a cross tap is `0x12`, then `0x10`, then 0). A grab needs a target: write the player's handle (human `+0x90`) to the puppet's human `+0xc8` and its brain's
`+0x124` (`target=1` does), or command 70 misses. A held button (R1 to block) is read from a pad record instead:
give the puppet pad index 4 (per-player `+0x19`) and write the button into all eight `u16` entries of pad record 4's
history (`0x005dd950 + 0x1c`) every update. Set `CfgAutoLockAndCombat` (`0x005104b8`) to 0 when the player must not
turn to face the attacker. Pick the puppet by name: an ally's hits play reactions without damage.
"""
research = ["docs/guides/research-workflow.md#driving-pcsx2", "docs/research/combat.md#commands"]
ghidra = ["0x00146078 PlayerRecord_Update", "0x00146000 PlayerRecord_ClearCommand"]
evidence = "confirmed-runtime"
patches = ["puppet"]
emulation = "running"
confirmed_runtime = { date = "2026-10-21", copy = "pcsx2-d", pcsx2 = "2.9.129 (PCSX2-MCP fork)", state = "level99 street (slot 6)", note = "PoizoCiv given 0x12 then 0x10, aimed at the player: its anim id went from 0x29f to 11, ANIM_ATTACK_X1" }
params = [
  { name = "who", kind = "human", help = "the puppet's name (humans lists them)" },
  { name = "command", help = "the first update's command id (combat.md#commands), such as 0x12" },
  { name = "then", default = "0", help = "the second update's command id (0x10 after 0x12 for a cross tap); 0 none" },
  { name = "target", default = "0", help = "1 to aim it at the player first (human +0xc8, brain +0x124)" },
]
steps = [
  { let = { h = "who", aim = "target * u32(player + 0x90) + (1 - target) * u32(who + 0xc8)" } },
  { write = "h + 0xc8", type = "u32", value = "aim" },
  { write = "brain(h) + 0x124", type = "u32", value = "target * aim + (1 - target) * u32(brain(who) + 0x124)" },
  { write = "prec(h) + 0x1e", type = "u8", value = "0" },
  { write = "prec(h) + 0x20", type = "u32", value = "command" },
  { wait = 1 },
  { write = "prec(h) + 0x20", type = "u32", value = "then" },
  { wait = 1 },
  { write = "prec(h) + 0x20", type = "u32", value = "0" },
  { wait = 2 },
  { show = "s32(rec(h) + 0x20)", label = "clip" },
]

# --- Levels and missions ----------------------------------------------------------------------------------------------

[recipe.where]
group = "Levels and missions"
summary = "Which level and checkpoint the game is in, and the game state's address."
how = """
The game state `*(0x0051489c)` keeps the level records (`0x84` bytes each from `+0x14d4`, the name at record
`+0x14`), the current record's index (`u16` at `+0x56dc`, `GetCurrentLevelIndex`) and the checkpoint (`u16` at
`+0x33a`, `GetCheckPoint` `0x0041abe8`). Record 1 is `level99`.
"""
research = ["docs/research/frontend.md#the-level-table", "docs/research/level-loading.md"]
ghidra = ["0x0041abe8 Script_GetCheckPoint", "0x0015c7b0 LevelFlow_SelectLevelByName"]
evidence = "confirmed-runtime"
confirmed_runtime = { date = "2026-10-21", copy = "pcsx2-d", pcsx2 = "2.9.129 (PCSX2-MCP fork)", state = "level99 street (slot 6)", note = "level99, checkpoint 2; GetCheckPoint through call gave 2 too" }
steps = [
  { let = { gs = "u32(0x0051489c)" } },
  { show = "gs", label = "game_state" },
  { show = "u16(gs + 0x56dc)", label = "level_index", format = "int" },
  { text = "gs + 0x14d4 + u16(gs + 0x56dc) * 0x84 + 0x14", label = "level", size = 16 },
  { show = "u16(gs + 0x33a)", label = "checkpoint", format = "int" },
]

[recipe.load-checkpoint]
group = "Levels and missions"
summary = "Reload a level at a checkpoint, as the story does after a save or a death: SetCheckPoint, then MenuLoadLevel."
how = """
`SetCheckPoint(n)` (`0x0037b760` -> `0x0041abc0`) stores the checkpoint in the game state (`+0x33a`) and copies the
inventories, the statistics and the object list for it; `MenuLoadLevel(name)` (`0x0036df48` -> `0x00160d78`) finds
the level's record by name (`0x0015c7b0`), sets mode 8's next level (`0x005e5d90 + 0x20`) and the game state's
`+0x14c` to 3, and the front end then loads the level, whose script starts at that checkpoint
([InitLevel](../research/level-loading.md#initlevel)). The recipe runs both in one `lua` chunk. The load takes several
seconds; run `where` afterwards. A save state is the faster way to come back to the same place: make one with the
debug server's save (`pcsx2_save_state` to a file of your own), never a quick-save slot.
"""
research = ["docs/research/level-loading.md#initlevel", "docs/research/ai.md#level99-save"]
ghidra = ["0x0041abc0 Script_SetCheckPoint", "0x00160d78 LevelFlow_LoadLevelByName"]
evidence = "confirmed-runtime"
patches = ["call-brains"]
emulation = "running"
confirmed_runtime = { date = "2026-10-21", copy = "pcsx2-d", pcsx2 = "2.9.129 (PCSX2-MCP fork)", state = "level99 street (slot 6)", note = "level99 checkpoint 3 from checkpoint 2: the level reloaded and where read checkpoint 3" }
params = [
  { name = "level", kind = "text", default = "level99", help = "the level's name (docs/references/levels.md)" },
  { name = "checkpoint", default = "1", help = "the checkpoint, 1-based" },
]
steps = [ { lua = "SetCheckPoint({checkpoint}) MenuLoadLevel(\"{level}\")" } ]

# --- Emulation -------------------------------------------------------------------------------------------------------------

[recipe.pause]
group = "Emulation"
summary = "Pause emulation as a whole (the debug server's pause), to read or write a frozen moment."
how = """
The PCSX2-MCP fork's debug server pauses and resumes emulation as a whole (`emulation` pause or resume), the pause
`advance` steps from; PINE reads and writes still work while paused. This is not the debugger's CPU break
(`pcsx2_pause`), during which frames do not advance. The game's own pause menu is another thing again
(`PauseMenu_Toggle` `0x00154f28`, START). The emulation state is what the recipes' `emulation` precondition checks.
"""
research = ["docs/guides/research-workflow.md#driving-pcsx2"]
ghidra = ["0x00154f28 PauseMenu_Toggle"]
evidence = "confirmed-runtime"
confirmed_runtime = { date = "2026-10-21", copy = "pcsx2-d", pcsx2 = "2.9.129 (PCSX2-MCP fork)", state = "level99 street (slot 6)", note = "the tick count 0x005104f4 stood still while paused" }
steps = [ { emulation = "pause" }, { show = "u32(0x005104f4)", label = "tick", format = "int" } ]

[recipe.resume]
group = "Emulation"
summary = "Resume emulation after pause or advance."
how = """
The debug server's `emulation` resume. A recipe that calls the game (`call`, `lua`) needs emulation running: the call
hook makes the call from inside the game's own update.
"""
research = ["docs/guides/research-workflow.md#driving-pcsx2"]
ghidra = ["0x003a2ea0 TaskManager_TickGame", "0x00249108 Humans_Update"]
evidence = "confirmed-runtime"
confirmed_runtime = { date = "2026-10-21", copy = "pcsx2-d", pcsx2 = "2.9.129 (PCSX2-MCP fork)", state = "level99 street (slot 6)" }
steps = [ { emulation = "resume" }, { wait = 1 }, { show = "u32(0x005104f4)", label = "tick", format = "int" } ]

[recipe.step]
group = "Emulation"
summary = "Run a number of frames from a pause, then pause again, and report how far the game's tick count moved."
how = """
The debug server's `frame_advance` runs N emulator frames (vsyncs) and pauses. The game counts its 60 Hz ticks at
`0x005104f4`, about one per emulator frame (10 frames moved it by 10, 2 by 3: a frame can catch a tick up), and steps the characters on each tick that makes the count even
([Tasks](../research/tasks.md#tick)), so a character update takes two frames: `frames=2` is one update. Emulation must
be paused first (`pause`).
"""
research = ["docs/research/tasks.md#tick", "docs/guides/research-workflow.md#driving-pcsx2"]
ghidra = ["0x003a2ea0 TaskManager_TickGame", "0x00249108 Humans_Update"]
evidence = "confirmed-runtime"
emulation = "paused"
confirmed_runtime = { date = "2026-10-21", copy = "pcsx2-d", pcsx2 = "2.9.129 (PCSX2-MCP fork)", state = "level99 street (slot 6)", note = "frames=10 moved the tick count by 10, frames=2 by 3" }
params = [ { name = "frames", default = "1", help = "how many frames to run (1-600)" } ]
steps = [
  { let = { before = "u32(0x005104f4)" } },
  { advance = "frames" },
  { show = "u32(0x005104f4) - before", label = "ticks", format = "int" },
]
