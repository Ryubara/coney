state = "pedestrian-grab"
confirmed_runtime = { date = "2026-10-21", copy = "pcsx2", pcsx2 = "2.9.129 (PCSX2-MCP fork)", state = "level99 street (slot 6)", note = "Crew1 appeared 3 m in front of Rembrandt as a type 3 brain in gang 1, listed among the members, and with attack in force (automatic switching off) had its goal 52 ten updates later" }
