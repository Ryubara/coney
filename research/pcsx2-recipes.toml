[recipe.human-event]
group = "Calling the game"
summary = "Send a game event (an event record with an id) to a human: its script handler, its gang, then its brain."
how = """
`Human_OnEvent` (`0x0021d480`, human vtable `0x0053f088` slot `+0x44`) delivers an event record to the human's Lua
message handler (`ScriptHandler_Deliver` `0x00384c38`, which reads the id at `+0x20`), then to its gang
(`Gang_OnEvent` `0x00164c20`), then to its brain (`Brain_OnEvent` `0x0028f928`), stopping at the first that consumes
it; the result is 1 when one consumed it. The brain's own handler is the function at brain `+0x28` (with `this`
adjusted by the `s16` at `+0x24`): `WarriorBrain_OnEvent` `0x003063b0` for a Warrior, `PlayerBrain_OnEvent`
`0x00303e90` for the player. The runner builds a record at `0x000c8000` (spare memory): `+0x00` the human who caused
it, as the human's address (confirmed at runtime for event `0xb`, which a Warrior keeps at brain `+0x27c`), `+0x04`
the other party, `+0x20` the event id ([the event record](../research/ai.md#event-record): 0 the prompt, 1 hit (with
`+0x11` set to count as an attack), 2 reset, `0xb` a new enemy, ...). The brain's goals may be refilled in the same
update, so check an effect that stays (a Warrior's noted enemy, its target).
"""
research = ["docs/research/ai.md#event-record", "docs/research/ai.md#events"]
ghidra = ["0x0021d480 Human_OnEvent", "0x0028f928 Brain_OnEvent", "0x00384c38 ScriptHandler_Deliver"]
evidence = "confirmed-runtime"
patches = ["call-brains"]
emulation = "running"
