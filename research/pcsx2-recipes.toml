refuses unless the cuffed human is cuffed and not already held `0x10000`; then the freer says 68, is steered by
`Attack_SteerToTarget` (`0x002761c8`) for clip 325 over 0.1 s, his action becomes `0x15`, `Uncuff_BeginMash`
(`0x0022d3f8`) starts mode 1 and the two play 325 into 329 and 326 into 330, the cuffed human's partner (`+0xc8`)
becoming the freer (as a handle, not the address). The recipe makes the call through the call hook with the freer and the cuffed human, so it skips
the record's own checks (the 0.2 m capsule test, the record's user) and the mash meter; put the freer next to the
cuffed human first (`teleport`). It reads both humans' positions and headings before, two waited updates after the call (the steer's three
updates done, the call's own update counted: the freer at 325's reach from the cuffed human, turned so that he lies along 325's direction) and 30 updates
after (325's root turn done: the freer facing him). The cuffed human does not move or turn. Circle (a quit command)
ends the mash; with no input it never ends, as the decay waits for a first L1 or R1.
"""
