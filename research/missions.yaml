        2: {status: in-progress, note: "Driven by the pad to the arrest scene and \"Free Cowboy and Snow\"; triangle by each shows the uncuff prompt and the L1-R1 mash frees him, and checkpoint 3 follows (`coney_tests \"[uncuff]\"`). Each cuffed Warrior wears the cuffs icon until he is freed. Not yet: the crew's follow after."}
