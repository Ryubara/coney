        2: {status: in-progress, note: "Driven by the pad to the arrest scene and \"Free Cowboy and Snow\"; triangle by each shows the uncuff prompt and the L1-R1 mash frees him, and checkpoint 3 follows (`coney_tests \"[uncuff]\"`). Not yet: the mash meter, the cuffs icon, the crew's follow after."}
        3: {status: in-progress, note: "Reaches Fox's scene; its next step needs the Hold Up order and the crew's tactics."}
        4: {status: in-progress, note: "Reaches Cochise and Swan's scene; the fight needs the Wreck'em All order and the crew's tactics."}
