# Missions: the status list. The pages docs/missions/ are generated from this file by
# `coney-tools missions render`; everything here is hand-kept. An implementer updates it in the same commit as
# mission work (docs/guides/research-workflow.md#missions). Our own words only: no game text or dialogue. A mission's
# title is not kept here: it is the level's `title` in research/references/levels.yaml (read from the disc). `label`
# is the slot's name ("Mission 2"). `summary_source` is research (our findings), disc, web or mixed; a web summary
# lists its URLs under `sources` and is replaced when a reverse-engineered walkthrough exists.
#
# Per mission: level, group (story|hub|flashback|armies), slot, label, summary, summary_source, sources, status,
#   checkpoints
#   {count (= the levels list's Sections), default (status of every checkpoint not in `each`),
#    each: {N: {status, note}}}, research [{title, path under docs/}], optional issues, questions, test, notes.
# Statuses (missions and checkpoints): not-started, in-progress, pending-approval, needs-fixes, approved.
about: |
  Which missions of the story Coney can play, and how far the owner's play-testing has signed each off. A mission
  here is a level: the 18 story missions, the hub between them, the five flashbacks and the five stages of the
  Armies of the Night bonus game. Each page lists the mission's checkpoints, what it needs from the script bindings,
  its known issues and how to run it.
lifecycle: |
  A mission starts Not Started and becomes In Progress when its first checkpoint is being built. The implementer
  moves it to Pending Gameplay Approval once every checkpoint plays to its end in Coney. Only the owner, after
  play-testing it against the original, moves it to Needs Fixes (the play-test found something; the known issues are
  listed on its page) or to Approved. A merged fix moves a Needs Fixes mission back to Pending Gameplay Approval for
  another play-test. Each checkpoint carries the same states, and a mission's state never claims more than its
  checkpoints show: Pending, Needs Fixes and Approved need every checkpoint built, and Approved needs every
  checkpoint approved.
missions:
  - level: 99
    group: story
    slot: story mission 1
    label: "Mission 1"
    summary: "The first mission, a tutorial: a combat course taught lesson by lesson, a section on getting around the streets, and a finale that hands over to the second mission. Coney starts it from a new game at checkpoint 1."
    summary_source: research
    status: pending-approval
    checkpoints:
      count: 3
      default: in-progress
      each:
        1: {status: pending-approval, note: "Plays from the intro through all twelve lessons (bats picked up with triangle, rage, the second wave, the Warriors' 50-second stopwatch) to scene l99_c6, driven by the pad; then player 1 is handed to the new Rembrandt on the street beside Vermin for checkpoint 2 and the course's humans are deleted with their gangs. In the last lesson the three sparring Warriors run in at the player and fight him (Melee, EngageEnemy and FindEnemy as the original pushes them)."}
        2: {status: pending-approval, note: "Plays through to checkpoint 3, driven by the pad: the store's glass and doors are drawn, the door or a window is hit open, the watch cabinet broken and its watches taken with triangle; square at the parked car breaks its window and triangle starts the stereo theft, whose stick turns call P2.CarRadioStolen; the passer-by at the phone (who starts with $5-$20 as the original rolls it) walks off, and grabbing and mugging him pays his money and calls P2.PedMugged; walking back to Vermin sets checkpoint 3 and plays l99_c3."}
        3: {status: pending-approval, note: "Plays to the mission's end, driven by the pad: the fence climbs, Vermin's wall demo and gestures, the rooftop, the jump through the window (the pane breaks), Vermin's jumps across the roof gaps and his drop to the street, the sprint jump to the second roof and the wooden fences; the charge (L2 + cross) breaks a rotting fence, whose removal calls P3.FenceBroken; triangle at the dealer buys a flash for $20, and d-pad right plays the closing cinematic and the mission-complete hand-over. The flash is spent and fills the health (with clip 665)."}
    research:
      - {title: "The first mission's script", path: "research/scripting.md#level99"}
      - {title: "The combat tutorial's lessons", path: "research/scripting.md#level99-lessons"}
      - {title: "The first mission's cast", path: "research/ai.md#level99"}
      - {title: "Combat", path: "research/combat.md"}
    test: "coney_tests \"[disc][story]\""
    notes: "The goal for this mission: STORY from the main menu through the profile screens and loading, to the mission playing from start to end."
