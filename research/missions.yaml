        2: {status: in-progress, note: "Driven by the pad to the arrest scene and \"Free Cowboy and Snow\"; triangle by each shows the uncuff prompt and the L1-R1 mash frees him, and checkpoint 3 follows (`coney_tests \"[uncuff]\"`). Each cuffed Warrior wears the cuffs icon until he is freed. Not yet: the crew's follow after."}
        3: {status: pending-approval, note: "Plays from the player's path past Fox's scene (l80_c6), the Hold Up order (R2, right stick down) and the throw lesson: triangle at the beer pile gives Cleon a bottle, L1 aims it (throwControl), the stick brings the arc onto the marker (HuIsAimingAt) and cross throws; the bottle passes the marker and breaks beyond it in vBottleBox, the cops are distracted and Fox's second scene (l80_c6_b) plays; then the Wreck'em order (R2, right stick down-left) and the front door's lock pick (`coney_tests \"[throw]\"`). The throw lesson leaves no hint behind: the box is empty when the bottle breaks and TT_7 is the next hint, cleared by the order; the same holds started from the story, walked up the stairs to the roof (`coney_tests \"[level80][hints]\"`). Then the crew steals under the wreck order: at the store front (storePharmacy01) the WarriorSteal tactic hands each Warrior an owned object of the store's zone and he fetches it (GetItem); each take is a theft that reaches vStealTrigger as message 7, and the tenth brings MS_C3_4 and the back door, whose lock picked gives checkpoint 4 (`coney_tests \"[steal]\"`). Stand-ins: the wreck with no store, the crew's answering line and the theft's crime score and witnesses."}
        4: {status: in-progress, note: "Driven by the pad from the checkpoint's start: Cochise and Swan's scene skipped, the attack order (R2, right stick up-left), the fight with the twelve Destroyers, MS_C4_1 and MS_C4_2 ticked, l80_c7, then l80_c3, l80_c3_a and l80_c3_b and the mission-complete hand-over (`coney_tests \"[level80-end]\"`). The player's swing grunts no longer cut the last line (`HuSpeakNI(Cleon, line, \"FadeOut\")`), so `FadeOut` runs while he keeps swinging (#239). The test knocks out whoever still stands after 90 s; the crew's fighting tactics are not played through."}
