    group: tables
    params: [list, value]
    description: >-
      Returns the zero-based position of `value` in the table `list`, counting entries in traversal order, or -1 when no
      entry equals it.
    scan: {function: 0, params: 2, scripts: 0, calls: 0}

  - name: tsize
    group: tables
