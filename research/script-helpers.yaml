    scan: {function: 1, params: 1, scripts: 115, calls: 438}

  - name: CfgUnlockables
    group: setup
    params: []
    description: >-
      Run once by `global.lua` as it loads: resets the unlockables manager, registers each row of the `Unlockables`
      table as an unlockable, unlocks the first two entries and, on a profile that has not finished the first mission,
      clears the "new" marks of the five unlockable types. It then deletes itself and the table, so no script can call
      it.
