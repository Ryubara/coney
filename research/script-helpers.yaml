  - name: CfgGlobalMulti
    group: setup
    params: []
    description: >-
      Run once by `global.lua` as it loads: resets the pad commands and binds the default ones, sets the action button's
      jump and pickup behaviour, the analogue stick's creep and run thresholds (the run threshold depends on the
      platform), the action distances and the crew's default follow slots, clears room smoke, fog and rain, and loads
      the difficulty's config script (easy, normal, hard, fury, or the rumble one in the rumble levels; the Armies of
      the Night levels always use normal).
    scan: {function: 3, params: 0, natives: [ResetCommands, CfgJumpIsAction, CfgPickupIsAction, CfgPickupIsGrab, CfgPlayerCombatWalkOnly, CfgDisableMusicForScenes, CfgTagStartCallback, CfgEnableTurfInvasion, SoundSetMusicVolume, SndSetListener, CfgStickDeflection, GetDifficulty, GetProfileDifficulty, GetCurrentLevelIndex, GetLevelId, doFile, CfgBaseChanceToBlock, CfgBurnTime, AddCommand, CfgActionDistance, HUDEnableClubActionText, EndRoomSmoke, End3DFog, EndFog, EndRain, CfgSetDefaultFollowSlotSet], scripts: 0, calls: 0, at_load: true}

