# Objects and weapons: a Coney game reference list. The page docs/references/objects.md is generated
# from this file by `coney-tools refs render`; `coney-tools refs extract` refreshes the fields read from the
# disc and keeps the hand-written ones. Schema and rules: docs/guides/research-workflow.md#reference-lists.
title: "Objects and weapons"
about: |
  Every object type `CfgObj` configures: weapons, hats and masks, pick-ups, doors and props. The name
  is also the model's name and what scripts pass to create the object.
complete: |
  Every object type (1,371) is listed with its class, type, physics shape, size and animations. The
  category is our grouping by class. Arguments 2-5, 11 and 14-17 are not traced.
defaults: {source: "config_preload2.lua and config_preload3.lua, CfgObj", evidence: inferred}
