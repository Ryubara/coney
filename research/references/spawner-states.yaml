    behaviour: "Spawns once `value` seconds have passed since it was given the state."
    settable: true
  - id: 3
    name: "near the player"
    behaviour: "Spawns while player 1 is within `value` metres."
    settable: true
  - id: 4
    name: "police dispatch"
    behaviour: "Waits for a crime to be routed to it, then makes a new gang of type 1 (police) named `Responder<n>` and goes to 6; only while the game's police count is under its limit (game state `+0x324` < `+0x326`). Starts with `value` 75."
