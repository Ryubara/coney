  - id: 9
    name: "gang dispatch"
    behaviour: "Like 4, without the police limit, and the new gang takes the spawner's gang type and relations; goes to 10."
    settable: true
    added: 15
    scripts: [level5, level9, level11, level14, level20, level51]
    evidence: inferred
  - id: 10
    name: "dispatching gang"
    behaviour: "Like 6 for the gang made in 9; back to 9."
    settable: false
    evidence: inferred
  - id: 11
    name: "keep up the numbers"
    behaviour: "Tops the gang up while its living members are fewer than the gang's limit, ignoring the spawner's own alive limit; stops (0) once the gang has spawned its total. Added in this state, the spawner is also made off screen (never spawns while a camera sees its spot); switched to it, it keeps its flag."
    settable: true
