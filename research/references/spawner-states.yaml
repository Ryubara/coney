    name: "far from the player"
    behaviour: "Spawns while player 1 is farther than `value` metres."
    settable: true
    added: 6
    started: 2
    scripts: [level52, level83]
  - id: 6
    name: "dispatching police"
    behaviour: "Spawns the police squad out of the camera's sight around the player, `value` metres off; back to 4 once the squad is complete."
    settable: false
    evidence: inferred
  - id: 7
    name: reinforcements
    behaviour: "Spawns around the player out of the camera's sight and sends each human to the gang's first live member."
    settable: true
