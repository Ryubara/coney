# Levels: a Coney game reference list. The page docs/references/levels.md is generated
# from this file by `coney-tools refs render`; `coney-tools refs extract` refreshes the fields read from the
# disc and keeps the hand-written ones. Schema and rules: docs/guides/research-workflow.md#reference-lists.
title: Levels
about: |
  The 111 level records of `levelNames` (`CfgLevelName`), in the order the game keeps them. A level loads
  from `<name>.lev` and its section packs `<name>_<k>.pak` ([Level loading](../research/level-loading.md)).
complete: |
  Every record is listed with every field. `.lev` and pack counts come from the WAD names list,
  so a level whose files have no recovered name shows none. Kinds are hand-written: the story order
  is `global.lua`'s `runNextMission` and the hub's `fRunMission`, the flashbacks the hub's
  `FBMission` ([Scripts](../research/scripting.md#run-next-mission)); a Rumble arena lists the modes
  whose flag scripts were found. Where each level puts the player: [Level starts](level-starts.md).
defaults: {source: "config_preload3.lua, levelNames", evidence: inferred}
