# Controls: a Coney game reference list. The page docs/references/controls.md is generated
# from this file by `coney-tools refs render`; `coney-tools refs extract` refreshes the fields read from the
# disc and keeps the hand-written ones. Schema and rules: docs/guides/research-workflow.md#reference-lists.
title: Controls
about: |
  The pad as the game reads it: the 16-bit button word, the analog sticks, and the markup tag that
  draws each button in text. Coney drives everything as a gamepad with analog sticks; on a PC pad the face
  buttons are positional (south is cross).
complete: |
  Every button bit and both sticks are listed. What each does on foot is still to be written;
  the front end's accept and back are known ([Front end](../research/frontend.md#input)).
defaults: {source: "pad record and libpad layout (docs/research/frontend.md#input)", evidence: inferred}
