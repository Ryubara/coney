title: "Script events"
about: |
  The messages scripts subscribe to with `SetMsgHandler(object, message, callback)`. The meaning of
  a message is read from the names of the callbacks scripts give it.
complete: |
  Every message number a script uses is listed; meanings are inferred from callback names.
defaults: {source: "every script, SetMsgHandler", evidence: inferred}
