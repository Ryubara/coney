# Sound and music: a Coney game reference list. The page docs/references/sound.md is generated
# from this file by `coney-tools refs render`; `coney-tools refs extract` refreshes the fields read from the
# disc and keeps the hand-written ones. Schema and rules: docs/guides/research-workflow.md#reference-lists.
title: "Sound and music"
about: |
  The music tracks `SndCfgMusicInfo` configures, the interface sounds of `SoundCfgInterfaceSound`,
  the sound matrices scripts load and the sounds of inventory items. Gang music is in [Gangs](gangs.md).
complete: |
  Every configured sound is listed by name; the two numbers of a music track are not traced.
defaults: {source: "config_preload.lua and config_preload2.lua", evidence: inferred}
