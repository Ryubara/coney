# Sound and music: a Coney game reference list. The page docs/references/sound.md is generated
# from this file by `coney-tools refs render`; `coney-tools refs extract` refreshes the fields read from the
# disc and keeps the hand-written ones. Schema and rules: docs/guides/research-workflow.md#reference-lists.
title: "Sound and music"
about: |
  The music tracks `SndCfgMusicInfo` configures, the interface sounds of `SoundCfgInterfaceSound`,
  the sound matrices scripts load, the sounds of inventory items, the ambient sounds (`AddAmbientSound`
  fills the ambient table that emitters pick from), the ambient emitters the levels place
  (`AddAmbientSoundEmitter2`) and the speech lines scripts play by name (`HuSpeak`, `HuSpeakNI`; the
  `global.lua` helper `SetVag("l11_t25_006")` stands for `vags/speeches/l11/l11_t25_006`). Names only,
  never the sounds. Gang music is in [Gangs](gangs.md); the lines humans say by kind are in
  [Speech](speech.md).
complete: |
  Every configured sound, ambient sound, emitter and literal speech line name is listed. A music
  track's two numbers are its bar length in milliseconds and its volume
  ([Sound](../research/sound.md#music)). Speech lines whose names are built at run time are missing;
  names marked as not in the sound list are on no bank either, so they are not on the disc
  ([Sound](../research/sound.md#speech-lines-by-name)).
defaults: {source: "config_preload.lua, config_preload2.lua, global.lua and the level scripts", evidence: inferred}
