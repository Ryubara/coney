# Script enums: a Coney game reference list. The page docs/references/enums.md is generated
# from this file by `coney-tools refs render`; `coney-tools refs extract` refreshes the fields read from the
# disc and keeps the hand-written ones. Schema and rules: docs/guides/research-workflow.md#reference-lists.
title: "Script enums"
about: |
  Constant tables (`MATERIAL.GLASS`) and loose constants (`LT_PLAY`) the preload scripts and
  `global.lua` define, as mods and level scripts pass them to bindings. The 722 `ANIM_*` ids are in
  [Anim ids](anim-ids.md).
complete: |
  Every numeric constant of those scripts is listed. Meanings are hand-written and sparse.
defaults: {source: "the preload scripts and global.lua", evidence: inferred}
