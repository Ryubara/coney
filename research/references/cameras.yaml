# Camera types and switches: a Coney game reference list. The page docs/references/cameras.md is generated
# from this file by `coney-tools refs render`; `coney-tools refs extract` refreshes the fields read from the
# disc and keeps the hand-written ones. Schema and rules: docs/guides/research-workflow.md#reference-lists.
title: "Camera types and switches"
about: |
  The camera classes the game makes, by the type number each class reports, and the switches `CamEnable`
  turns on and off ([Camera](../research/camera.md#types), [camera bindings](bindings/camera.md)). A script
  holds a camera by handle; the type says which class the handle is.
complete: |
  All fourteen classes the code makes are listed: types 10, 14 and 15 belong to no class. The types, tags and
  vtables are read from the executable; sizes and makers are from the factory `0x0011e1b0` and the getters. All
  fourteen switches (0-13) are listed with the flag each sets and its default; switch 8's part in the rail camera's
  choice of targets is not traced further.
defaults: {source: "SLUS_212.15, camera factory 0x0011e1b0 and CamEnable 0x0011de58", evidence: confirmed-code}
