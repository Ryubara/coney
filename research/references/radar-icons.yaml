# Radar icons and blips: a Coney game reference list. The page docs/references/radar-icons.md is generated
# from this file by `coney-tools refs render`; `coney-tools refs extract` refreshes the fields read from the
# disc and keeps the hand-written ones. Schema and rules: docs/guides/research-workflow.md#reference-lists.
title: "Radar icons and blips"
about: |
  The icon ids `HUDSetRadarItemTexture` takes and the code sets, and the radar's blip types
  ([GUI: radar](../research/gui.md#radar-icons)).
complete: |
  Every icon a script or the code uses and every blip type the code adds are listed. The numbers are
  read from the code and the scripts; what each icon marks is inferred from who uses it. Classes are the
  character class byte `CfgChar` sets (`+0x11a`, [AI](../research/ai.md#types)).
defaults: {source: "SLUS_212.15, radar code; the scripts, HUDSetRadarItemTexture", evidence: confirmed-code}
